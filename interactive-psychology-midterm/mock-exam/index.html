ation": "표본 수를 맞춰도 UI와 근무 시간·숙련도의 혼동은 남는다. 배정 구조를 개선해야 한다."}], "source": "2장 교안 p.14 · 2장 교안 p.15 · 2장 교안 p.15 · 연구방법론 전사1 · 2장 교안 p.17 · 2장 교안 p.20", "originId": "MC121", "set": 1, "number": 2, "prompt": "[사례] 병원 새 입력 UI를 평가한다. 야간 신규 간호사에게만 새 UI를, 주간 경력자에게만 기존 UI를 배정했다. 가장 우선할 개선은?", "points": 2, "minutes": 1.25, "answer": "3번", "explanation": ["조건별 교란을 줄여 내적 타당도를 확보하면서 일반화 대상도 확인하는 조치다."], "variant": false, "commonMistakes": ["표본 수를 맞춰도 UI와 근무 시간·숙련도의 혼동은 남는다. 배정 구조를 개선해야 한다.", "대표성 판단과 내적 타당도는 다르다. 두 집단의 UI·시간·숙련도 혼동을 줄여야 한다.", "측정 정밀도·신뢰도는 교란 통제를 대신하지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "ME1-Q03", "chapter": "정보량·중복도", "conceptIds": ["OX058", "OX070", "OX071", "OX072", "OX076"], "type": "single", "options": [{"id": "o1", "text": "시간 표시는 변경 시점의 불확실성을 줄이고, 색 강조는 탐지·주의 배분을 도울 수 있다.", "correct": true, "explanation": "변경 시점의 확정과 시각적 현저성 개선은 다른 기제다. 사건 확률의 정보량과 수행 효과를 구별한다."}, {"id": "o3", "text": "시간 표시로 변경 시점이 확정되면, 의미 해석이나 주의 실패로 생기는 오류도 해소됐다고 본다.", "correct": false, "explanation": "해당 시점의 불확실성이 줄어도 의미·주의·반응의 오류가 모두 없어지는 것은 아니다."}, {"id": "o4", "text": "시간 표시와 색 강조는 같은 정보량 감소이므로, 두 개선의 효과를 합해 하나의 H 감소량으로 계산한다.", "correct": false, "explanation": "확률적 정보량과 탐지 수행의 개선을 같은 H 감소로 합산할 수 없다."}, {"id": "o2", "text": "시간 표시는 탐지에만 작용하고, 색 강조는 사건 확률을 바꾸지 않아도 Shannon H를 줄인다.", "correct": false, "explanation": "시간 단서의 불확실성 감소와 색 강조의 탐지 효과를 뒤바꾸었다."}], "source": "3장 교안 p.7 · 3장 교안 p.13 · 3장 교안 p.14 · 3장 교안 p.10, 14", "originId": "MC124", "set": 1, "number": 3, "prompt": "[사례] 남은 시간이 정확한 카운트다운을 추가한 뒤 화면의 경고 색상도 강조했다. 두 변경의 효과를 구별한 설명은?", "points": 2, "minutes": 1.25, "answer": "1번", "explanation": ["변경 시점의 확정과 시각적 현저성 개선은 다른 기제다. 사건 확률의 정보량과 수행 효과를 구별한다."], "variant": false, "commonMistakes": ["해당 시점의 불확실성이 줄어도 의미·주의·반응의 오류가 모두 없어지는 것은 아니다.", "시간 단서의 불확실성 감소와 색 강조의 탐지 효과를 뒤바꾸었다.", "확률적 정보량과 탐지 수행의 개선을 같은 H 감소로 합산할 수 없다."], "optionRevision": "2026-10-18-v1"}, {"id": "ME1-Q04", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX086", "OX087"], "type": "single", "options": [{ 로 속도 크기를 확정하지 않는다.", "첫 정점은 (나)가 빠르지만 최대 정점은 (나)가 더 늦다. 서로 다른 지표를 혼동했다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>두 VR 선택 과업의 속도 정점 · 정보처리 교안 p.56<\/figcaption><a href=\"../assets/question-data/information-processing-p56.png\" target=\"_blank\" rel=\"noopener\"><img src=\"../assets/question-data/information-processing-p56.png\" alt=\"두 VR 선택 과업의 속도 정점 · 정보처리 교안 p.56\" loading=\"lazy\"><\/a><p class=\"analysis-note\">(가) Stimulus-based: 빨간 버튼 선택. (나) Goal-based: 지시문의 기능에 해당하는 버튼 선택. 가로축은 시간(s), 세로축은 정점 속도(m/s)다. 처음 정점과 최대 정점은 서로 다른 지표이며 후반 정점의 시각·크기를 구분해서 읽는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "ME2-Q11", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX108", "OX109"], "type": "single", "options": [{"id": "o4", "text": "300 ms 증가", "correct": false, "explanation": "선택지가 줄어든 방향을 반대로 적용했다."}, {"id": "o3", "text": "150 ms 단축", "correct": false, "explanation": "8→2는 두 번의 반감이므로 정보량이 2 bits 줄어든다."}, {"id": "o1", "text": "300 ms 단축", "correct": true, "explanation": "H가 3에서 1 bit로 줄어 \\(\\Delta\\mathrm{RT} = 150 \\times \\left(-2\\right) = -300\\) ms다. 메뉴 단순화의 선택 부담 감소를 설명하는 모형 적용이다."}, {"id": "o2", "text": "900 ms 단축", "correct": false, "explanation": "대안 개수 차이 6을 bit 차이로 오인해 150을 곱했다."}], "source": "3장 교안 p.34–36 · 3장 교안 p.39–41 · 정보처리 전사3", "originId": "MC061", "set": 2, "number": 11, "prompt": "Hick 모형 \\(\\mathrm{RT} = a + b\\,H\\) (\\(H = \\log_2 N\\))에서 같은 절편 \\(a\\)와 기울기 \\(b = 150\\) ms/bit일 때, 등확률 메뉴를 8개에서 2개로 줄이면 예측 선택시간(RT) 변화는?", "points": 2, "minutes": 1.25, "answer": "3번", "explanation": ["하나의 정답만 선택한다. 조건이 빠진 일반화나 인접 개념 치환을 구별한다."], "variant": false, "promptPlain": "같은 a, b=150 ms/bit에서 등확률 메뉴를 8개에서 2개로 줄였다. Hick 예측에 따른 선택시간 변화는?", "commonMistakes": []}, {"id": "ME2-Q12", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX128", "OX129", "OX131", "OX132", "OX133", "OX134", "OX135", "OX136"], "type": "single", "options": [{"id": "o1", "text": "배열은 Spatial, 방향은 Movement, 색 의미는 Conceptual이다. 대상 집단의 문화·경험도 확인한다.", "cor umber": 13, "prompt": "정보량 계산에 관해 옳은 것을 모두 고르시오.", "points": 2, "minutes": 2, "answer": "1 · 2 · 4번", "explanation": ["보기별 해설에서 적용 조건과 계산을 확인한다. 복수선택은 정답 집합과 정확히 일치할 때만 2점이며 부분점수는 없다."], "variant": false, "commonMistakes": []}, {"id": "ME2-Q14", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX121", "OX122", "OX123", "OX124", "OX125", "OX126"], "type": "multi", "options": [{"id": "o3", "text": "숙련되면 상대적으로 Open loop 수행 비중이 커질 수 있다.", "correct": true, "explanation": "피드백을 매번 확인하는 의존이 줄어드는 방향으로 설명한다."}, {"id": "o4", "text": "Range effect는 짧은 거리 Overshoot, 긴 거리 Undershoot다.", "correct": true, "explanation": "두 방향을 바꾸는 것이 대표적 오답 함정이다."}, {"id": "o1", "text": "Positioning movement는 피드백을 이용하는 Closed loop다.", "correct": true, "explanation": "목표 근처에서 감각 피드백으로 오차를 교정한다."}, {"id": "o2", "text": "Ballistic movement는 매 순간 시각 피드백으로 정밀 조정한다.", "correct": false, "explanation": "교안의 탄도 운동은 Open loop이며 사전 계획에 따른 빠른 실행이다."}], "source": "3장 교안 p.50 · 3장 교안 p.50 · 정보처리 전사4 · 3장 교안 p.51", "originId": "MC111", "set": 2, "number": 14, "prompt": "개회로(Open loop)·폐회로(Closed loop) 운동제어와 범위 효과(Range effect)에 관한 설명 중 옳은 것을 모두 고르시오.", "points": 2, "minutes": 2, "answer": "1 · 2 · 3번", "explanation": ["보기별 해설에서 적용 조건과 계산을 확인한다. 복수선택은 정답 집합과 정확히 일치할 때만 2점이며 부분점수는 없다."], "variant": false, "commonMistakes": []}, {"id": "ME2-Q15", "chapter": "기초통계·T검정", "conceptIds": ["OX151", "OX152", "OX153", "OX156", "OX160", "OX161", "OX162"], "type": "multi", "options": [{"id": "o4", "text": "평균차 after-before가 음수이면 유의한 감소로 판정한다.", "correct": false, "explanation": "부호는 방향을 뜻한다. 유의성은 표준오차·표본 수·검정 결과도 필요하다."}, {"id": "o1", "text": "t.test(x,mu=150)는 한 집단 평균과 기준값 150을 비교한다.", "correct": true, "explanation": "단일표본 검정이며 mu를 생략하면 기본 기준값 0이다."}, {"id": "o2", "text": "t.test(height ~ group,data=d)는 결과 height를 왼쪽에 둔다.", "correct": true, "explanation": "측정 결과 ~ 집단 변수의 포뮬러다."}, {"id": "o3", "text": "대응표본 검정에서는 짝별 차이의 분포를 점검한다.", "correct": true, "explanation": "전후 각각의 정규성보다 차이의 정규성이 해당 검정 가정이다."}], "source": "t-test 교안 p.10–11 · r": "2번", "explanation": ["교안 p.37의 자극·반응 양식과 기대 요인에 대한 설명이다. 이 순서를 모든 자극 강도·과업의 보편적 순서로 확대하지 않는다."], "variant": false, "commonMistakes": ["양식 순서는 맞지만 완전 불시 사건 예시는 약 750 ms다. 일반적인 단순반응 수준의 시간을 섞었다.", "반응 기관의 빠른 순서는 눈→손→발이다.", "교안의 자극 양식 순서를 반대로 배치했다."], "optionRevision": "2026-10-18-v1"}, {"id": "ME3-Q03", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX079", "OX080", "OX081", "OX082", "OX083", "OX110"], "type": "single", "options": [{"id": "o3", "text": "A: 4 bits / B: 1 bit", "correct": false, "explanation": "대안 개수와 정보량을 혼동했고 고정 출력의 엔트로피도 잘못 계산했다."}, {"id": "o4", "text": "A: 2 bits / B: 2 bits", "correct": false, "explanation": "입력 엔트로피가 같아도 출력이 입력을 구분하지 못하면 전달량은 줄어든다."}, {"id": "o2", "text": "A: 0 bit / B: 2 bits", "correct": false, "explanation": "입력 구분 가능성의 방향을 반대로 해석했다."}, {"id": "o1", "text": "A: 2 bits / B: 0 bit", "correct": true, "explanation": "A에서는 Y로 X를 복원하여 \\(I = H\\left(X\\right) = 2\\), B에서는 \\(H\\left(Y\\right) = 0\\)이라 \\(I = 0\\)이다. A의 반응 라벨이 의미상 맞는지는 별도 평가해야 한다."}], "source": "3장 교안 p.15–16 · 3장 교안 p.16 · 3장 교안 p.17–18 · 3장 교안 p.18 · 3장 교안 p.16–18", "originId": "MC125", "set": 3, "number": 3, "prompt": "[사례] 4개 등확률 자극을 장치 A는 4개 반응으로 일대일 전달하고, 장치 B는 모두 같은 반응으로 보낸다. 장치별 전달량은?", "points": 2, "minutes": 1.25, "answer": "4번", "explanation": ["하나의 정답만 선택한다. 조건이 빠진 일반화나 인접 개념 치환을 구별한다."], "variant": false, "commonMistakes": []}, {"id": "ME3-Q04", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX137"], "type": "single", "options": [{"id": "o1", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, 유의성 별표는 자신감 비교에 있다.", "correct": true, "explanation": "도표의 평균 방향은 AE와 RT 증가, 자신감 감소다. 별표는 자신감 비교에 표시돼 있다."}, {"id": "o3", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, AE 증가는 정확성 향상을 나타낸다.", "correct": false, "explanation": "AE는 절대오차이므로 증가가 정확성 향상을 뜻하지 않는다."}, {"id": "o2", "text": "Compatible에서 AE↑·RT↓·자신감↑이며, 유의성 별표는 자신감 비교에 있다.", "correct": false, "explanation": "별표 위치는 같아도 RT와 자신감의 평균 방향을 뒤바꾸었다."}, {"id": "o4", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, SE 막대의 겹침은 평균 차이의 부재를 입증한다.", "correct": false, "explanation": "SE 막대의 겹침만으로 평균이 같거나 유의차가 없다고 입증할 수 없다."}], "source": "3장 교안 p.65–66 · p.66 Fig.7 원그림과 지표 정의 대조", "originId": "MC075", "set": 3, "number": 4, "prompt": "아래 VR 틸트 연구의 지각 과업(perception task) 그래프를 읽으시오. Incompatible에서 Compatible로 바뀔 때의 평균값 방향과 유의성 표시를 올바르게 설명한 것은? Accuracy(AE)는 절대 각도오차다.", "points": 2, "minutes": 1.25, "answer": "1번", "explanation": ["도표의 평균 방향은 AE와 RT 증가, 자신감 감소다. 별표는 자신감 비교에 표시돼 있다."], "variant": false, "commonMistakes": ["별표 위치는 같아도 RT와 자신감의 평균 방향을 뒤바꾸었다.", "SE 막대의 겹침만으로 평균이 같거나 유의차가 없다고 입증할 수 없다.", "AE는 절대오차이므로 증가가 정확성 향상을 뜻하지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>VR 틸트 연구의 지각 과업(perception task) 결과 · 교안 p.66<\/figcaption><a href=\"../assets/question-data/information-processing-p66.png\" target=\"_blank\" rel=\"noopener\"><img src=\"../assets/question-data/information-processing-p66.png\" alt=\"VR 틸트 연구의 지각 과업(perception task) 결과 · 교안 p.66\" loading=\"lazy\"><\/a><p class=\"analysis-note\">Compatible/ Incompatible은 몸과 보이는 패널의 기울임 방향의 일치/불일치다. Accuracy(AE)는 절대 각도오차이므로 작은 값이 더 정확하다. 오차막대는 SE, 별표는 해당 비교에서 p&lt;.05다. 이 도표를 레버 수동 조작 과업의 결과로 바꾸어 읽지 않는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "ME3-Q05", "chapter": "회귀·실험실습", "conceptIds": ["OX164", "OX165", "OX168"], "type": "single", "options": [{"id": "o2", "text": "상관은 x로 y를 예측하는 방향을 정하고, 회귀는 두 변수의 순서를 바꾸어도 같은 모형으로 본다.", "correct": false, "explanation": "상관과 회귀의 방향성을 뒤바꾸었다. y~x와 x~y 회귀는 같은 모형이 아니다."}, {"id": "o4", "text": "상관이 충분히 크면 직선 적합이 확인된 것이므로, 회귀 전 산점도의 곡선·극단값 점검은 생략한다.", "correct": false, "explanation": "큰 상관만으로 형태·이상치·조건이 확인되지 않는다. 산점도를 먼저 살펴야 한다."}, {"id": "o3", "text": "상관은 단위에 따른 공변화를 직접 나타내고, 회귀 기울기는 두 변수의 단위를 없앤 표준 지표다.", "correct": false, "explanation": "단위에 따른 공분산과 무차원 상관을 혼동했고, 일반적인 회귀 기울기에는 y/x 단위가 있다."}, {"id": "o1", "text": "상관은 대칭적 선형 연관, 회귀는 x로 y의 조건부 관계를 설명·예측하며 먼저 산점도를 살핀다.", "correct": true, "explanation": "예측 방향이 있는 회귀와 대칭적인 상관을 구분하고 자료의 형태를 확인한다."}], "source": "회귀 교안 p.2, 7–8 · 회귀 교안 p.7 · 회귀 교안 p.9, 22", "originId": "MC087", "set": 3, "number": 5, "prompt": "적성점수 x로 업무만족도 y를 예측하려 한다. 상관·회귀의 구분과 시작 절차로 적절한 것은?", "points": 2, "minutes": 1.25, "answer": "4번", "explanation": ["예측 방향이 있는 회귀와 대칭적인 상관을 구분하고 자료의 형태를 확인한다."], "variant": false, "commonMistakes": ["단위에 따른 공분산과 무차원 상관을 혼동했고, 일반적인 회귀 기울기에는 y/x 단위가 있다.", "상관과 회귀의 방향성을 뒤바꾸었다. y~x와 x~y 회귀는 같은 모형이 아니다.", "큰 상관만으로 형태·이상치·조건이 확인되지 않는다. 산점도를 먼저 살펴야 한다."], "optionRevision": "2026-10-18-v1"}, {"id": "ME3-Q06", "chapter": "개론·역사", "conceptIds": ["OX011"], "type": "single", "options": [{"id": "o1", "text": "유럽: Ergonomics / 미국: Human Factors / 미군: Human Engineering / 심리학계: Engineering Psychology", "correct": true, "explanation": "교안의 Synonyms 표에 제시된 명칭 구분이다. Applied Psychology도 관련 동의어로 제시된다."}, {"id": "o3", "text": "유럽: Engineering Psychology / 미국: Human Engineering / 미군: Ergonomics / 심리학계: Human Factors", "correct": false, "explanation": "심리학계의 Engineering Psychology를 유럽의 주 명칭으로 잘못 옮겼다."}, {"id": "o4", "text": "유럽: Ergonomics / 미국: Engineering Psychology / 미군: Human Factors / 심리학계: Human Engineering", "correct": false, "explanation": "유럽을 제외한 세 집단의 대표 명칭이 잘못 연결되었다."}, {"id": "o2", "text": "유럽: Human Engineering / 미국: Ergonomics / 미군: Engineering Psychology / 심리학계: Human Factors", "correct": false, "explanation": "지역과 집단에 연결된 명칭이 교안의 표와 다르다."}], "source": "1-2 교안 p.7", "originId": "MC007", "set": 3, "number": 6, "prompt": "인간공학(Ergonomics)을 부르는 지역·집단별 대표 영문 명칭(유럽, 미국, 미군, 미국 심리학계)을 올바르게 연결한 것은?", "points": 2, "minutes": 1.25, "answer": "1번", "explanation": ["하나의 정답만 선택한다. 조건이 빠진 일반화나 인접 개념 치환을 구별한다."], "variant": false, "commonMistakes": []}, {"id": "ME3-Q07", "chapter": "개론·역사", "conceptIds": ["OX012", "OX025"], "type": "single", "options": [{"id": "o3", "text": "해부학·생체역학은 물리 설계에 적용하고, 지각·기억의 문제는 인간공학 밖에서 다룬다.", "correct": false, "explanation": "인지 인간공학도 HFE에 속한다. 지각·기억·추론은 인간공학의 대상이다."}, {"id": "o2", "text": "신체·정신·사회 특성을 설계에 적용하여 시스템 성능을 최대화하고 안녕은 별도로 평가한다.", "correct": false, "explanation": "인간의 안녕을 설계 목     function highlightRLine(line,q){
      // 표시만 담당한다. 원문 공백·기호를 보존하며 답안을 실행하지 않는다.

      let html='',cursor=0;
      for(const match of line.matchAll(tokens)){
        html+=esc(line.slice(cursor,match.index));const token=match[0];cursor=match.index+token.length;
        if(token.startsWith('{{')&&q){
          const id=token.slice(2,-2),value=state.codeAnswers[q.id]?.[id]||'';
          html+=`<input class="wr-code-input" type="text" data-code-blank="${id}" aria-label="${q.id} 빈칸 ${id}" title="빈칸 ${id} · R 코드 입력" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="(${id})" style="width:${blankWidth(value)}ch" value="${esc(value)}">`;
          continue;

        html+=`<span class="r-${kind}">${esc(token)}</span>`;
      }
      return html+esc(line.slice(cursor));
    }

function move(d){const q=bank()[cursor],i=visible.findIndex(x=>x.id===q?.id),next=visible[i+d];if(next){cursor=bank().findIndex(x=>x.id===next.id);render()}}
document.getElementById('mockPrev').onclick=()=>move(-1);document.getElementById('mockNext').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;try{const next=JSON.parse(e.newValue);if(next){for(const k of Object.keys(store))delete store[k];Object.assign(store,next);current();render()}}catch(err){}});
window.MOCK_AUDIT={setCount:5,questions:DATA.length,concepts:new Set(DATA.flatMap(q=>q.conceptIds)).size,durationSeconds:META.durationSeconds,sets:Array.from({length:5},(_,i)=>{const qs=DATA.filter(q=>q.set===i+1);return {set:i+1,questions:qs.length,points:qs.reduce((n,q)=>n+q.points,0),minutes:qs.reduce((n,q)=>n+q.minutes,0)+10,chapters:new Set(qs.map(q=>q.chapter).filter(ch=>META.chapterNames.includes(ch))).size}})};
function startWrongRetry(ids,allowCurrent=false){
 if(current().status==='running')return;
 retry.finish();publish();const wrongIds=DATA.filter(q=>store.answers[q.id]).map(q=>q.id);
 const selected=allowCurrent?ids:ids?wrongIds.filter(id=>ids.includes(id)):wrongIds;
 store.mode='practice';retry.start(selected);filter='wrong';reviewIds=null;cursor=0;
 const u=new URL(location.href);for(const k of ['retry','retryWrong','review','question'])u.searchParams.delete(k);u.searchParams.set('mode','practice');history.replaceState(null,'',u);
 save();render();
}
retry.mount({before:document.getElementById('resultPanel'),onStart:()=>startWrongRetry(),onExit:()=>{filter='all';reviewIds=null;cursor=0;save();render()},isCorrect:id=>{const q=DATA.find(q=>q.id===id),a=store.practice[q.set];return isObjective(q)?objectiveScore(q,a)===q.points:a.graded[id]&&writtenScore(q,a)===q.points},visible:()=>filter==='wrong',tab:document.querySelector('[data-filter=wrong]')});
if(running&&retry.active)retry.finish();
if(retry.active){const u=new URL(location.href);for(const k of ['retry','retryWrong','review'])u.searchParams.delete(k);history.replaceState(null,'',u);store.mode='practice';cursor=Math.max(0,bank().findIndex(q=>q.id===retry.cursor));filter='wrong'}
current();
if(!running&&!retry.active&&(retryIds.length||params.get('retryWrong')==='1'))startWrongRetry(retryIds.length?retryIds:undefined);
if(!running&&!retry.active&&params.get('review')==='wrong'){
 const ids=Object.keys(store.answers||{});store.mode='practice';
 for(const id of ids){const q=DATA.find(q=>q.id===id);if(!q)continue;store.practice[q.set]=store.practice[q.set]||fresh();store.practice[q.set].review[id]=true}
 current();
}
if(state.status==='running'&&timeLeft()===0){finish(true)}else{render();save()}setInterval(tick,1000);
</script></body></html>
