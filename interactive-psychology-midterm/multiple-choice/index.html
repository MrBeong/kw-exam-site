><table><thead><tr><th>부위<\/th><th>forearm<\/th><th>wrist<\/th><th>finger<\/th><\/tr><\/thead><tbody><tr><td>b (ms/bit)<\/td><td>105<\/td><td>43<\/td><td>26<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "explanation": "b·ID의 추가 시간은 기울기에 비례한다. 같은 a와 양의 ID에서 26<43<105 순이다.", "commonMistakes": ["시간/bit 기울기를 처리속도로 읽어 방향을 뒤바꾸었다.", "작은 b는 1 bit당 더 짧은 추가 시간을 뜻한다. 역수 처리율과 혼동했다.", "b가 서로 다르므로 b·ID도 다르다. 제시 조건은 절편도 같다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC068", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX121", "OX122", "OX123"], "type": "single", "stem": "작은 아이콘을 향해 빠르게 이동한 뒤 목표 주변에서 눈으로 확인하며 미세 조정한다. 두 구간의 제어를 순서대로 고르면?", "options": [{"id": "o3", "text": "Ballistic·Closed loop → Positioning·Open loop", "correct": false, "explanation": "운동 명칭과 피드백 유무의 연결이 반대다."}, {"id": "o2", "text": "Positioning·Closed loop → Ballistic·Open loop", "correct": false, "explanation": "목표 근처의 미세 조정은 폐회로이며 초기 빠른 이동과 순서가 바뀌었다."}, {"id": "o1", "text": "Ballistic·Open loop → Positioning·Closed loop", "correct": true, "explanation": "초기 primary travel은 미리 계획한 빠른 이동, secondary travel은 감각 피드백을 이용한 오차 교정으로 설명한다."}, {"id": "o4", "text": "Positioning·Open loop → Ballistic·Closed loop", "correct": false, "explanation": "두 명칭 모두 해당 제어 방식과 잘못 연결되었다."}], "source": "3장 교안 p.50 · 3장 교안 p.50 · 정보처리 전사4", "explanation": [], "commonMistakes": []}, {"id": "MC069", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX124"], "type": "single", "stem": "반복 연습(Practice)을 통해 동작이 숙련된 후 시각 피드백을 매 순간 덜 확인하면서도 빠르게 동작을 수행하게 되는 운동제어 변화(개회로 Open loop vs. 폐회로 Closed loop)를 가장 적절하게 설명한 것은?", "options": [{"id": "o2", "text": "반복 학습으로 피드백 이용이 늘어, 같은 과업에서 폐회로 수행의 비중이 커진다.", "correct": false, "explanation": "제시한 덜 확인하면서 빨라지는 변화의 방향을 반대로 설명했다."}, {"id": "o4", "text": "반복 학습으로 피드백 사용은 줄지만, 개회로 실행 중의 오차를 폐회로처럼 계속 교정한다.", "correct": false, "explanation": "개회로와 폐회로의 정의를 혼합했다. 실행 중 피드백 교정은 폐회로의 특징이다."}, {"id": "o3", "text": "반복 학습으로 피드백 검토 시간이 길어지며, 정확성 향상을 위해 움직임이 느려진다.", "correct": false, "explanation": "제시된 수행 속도와 피드백 이용 변화에 맞지 않는다. 속도–정확성 교환을 숙련 효과로 바꾸어 해석했다."}, {"id": "o1", "text": "반복 학습으로 피드백 의존이 줄어, 같은 과업에서 개회로 수행의 비중이 커진다.", "correct": true, "explanation": "숙련으로 계획된 빠른 수행이 늘 수 있으나 미세 조정에서 피드백의 역할이 없어지는 것은 아니다."}], "source": "3장 교안 p.51", "explanation": "숙련으로 계획된 빠른 수행이 늘 수 있으나 미세 조정에서 피드백의 역할이 없어지는 것은 아니다.", "commonMistakes": ["제시한 덜 확인하면서 빨라지는 변화의 방향을 반대로 설명했다.", "개회로와 폐회로의 정의를 혼합했다. 실행 중 피드백 교정은 폐회로의 특징이다.", "제시된 수행 속도와 피드백 이용 변화에 맞지 않는다. 속도–정확성 교환을 숙련 효과로 바꾸어 해석했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC070", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX125", "OX126"], "type": "single", "stem": "운동 제어의 범위 효과(Range effect)에서 표적까지의 이동거리가 짧은 경우(short distance)와 긴 경우(long distance)에 나타나는 대표적 도달 오차 경향을 순서대로 고르면?", "options": [{"id": "o1", "text": "Overshoot / Undershoot", "correct": true, "explanation": "짧은 거리는 목표를 지나치고, 긴 거리는 목표에 못 미치는 경향으로 설명된다. 거리의 양 극단을 중앙 쪽으로 회귀시키는 오차다."}, {"id": "o2", "text": "Undershoot / Overshoot", "correct": false, "explanation": "짧은 거리와 긴 거리에서의 경향이 반대다."}, {"id": "o3", "text": "Overshoot / Overshoot", "correct": false, "explanation": "긴 거리의 대표적 경향은 Undershoot다."}, {"id": "o4", "text": "Undershoot / Undershoot", "correct": false, "explanation": "짧은 거리의 대표적 경향은 Overshoot다."}], "source": "3장 교안 p.51", "explanation": [], "commonMistakes": []}, {"id": "MC071", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX127"], "type": "single", "stem": "가상현실(VR) 손가락 선택 실험에서 (가) 시각적으로 두드러진 빨간 버튼을 곧바로 누르는 과업(Stimulus-based)과 (나) 지시문을 읽고 해당 기능 버튼을 찾아 누르는 과업(Goal-based)의 제시한 첫 속도 정점·최대 속도 정점의 시각을 비교한 해석으로 옳은 것은?", "options": [{"id": "o2", "text": "(가)의 최대 정점이 더 늦고, 첫 정점부터 최대 정점까지의 시각 차이도 더 크다.", "correct": false, "explanation": "두 과업을 뒤바꾸었다. 최대 정점과 두 정점의 차이는 (나)가 더 크다."}, {"id": "o4", "text": "(나)의 최대 정점이 늦으므로, 그 정점에서의 속도 크기도 (가)보다 더 크다고 판정한다.", "correct": false, "explanation": "정점이 나타나는 시각과 정점의 속도 크기는 다르다. 시각 비교로 속도 크기를 확정하지 않는다."}, {"id": "o1", "text": "(나)의 최대 정점이 더 늦고, 첫 정점부터 최대 정점까지의 시각 차이도 더 크다.", "correct": true, "explanation": "(나)는 0.16→1.26 s로 차이가 1.10 s이며, (가)는 0.20→0.33 s로 차이가 0.13 s다."}, {"id": "o3", "text": "(나)의 첫 정점이 더 빠르므로, 최대 정점의 도달 시각도 (가)보다 더 빠르다.", "correct": false, "explanation": "첫 정점은 (나)가 빠르지만 최대 정점은 (나)가 더 늦다. 서로 다른 지표를 혼동했다."}], "source": "3장 교안 p.53–56", "explanation": "(나)는 0.16→1.26 s로 차이가 1.10 s이며, (가)는 0.20→0.33 s로 차이가 0.13 s다.", "commonMistakes": ["두 과업을 뒤바꾸었다. 최대 정점과 두 정점의 차이는 (나)가 더 크다.", "정점이 나타나는 시각과 정점의 속도 크기는 다르다. 시각 비교로 속도 크기를 확정하지 않는다.", "첫 정점은 (나)가 빠르지만 최대 정점은 (나)가 더 늦다. 서로 다른 지표를 혼동했다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>두 VR 선택 과업의 속도 정점 · 정보처리 교안 p.56<\/figcaption><a href=\"../assets/question-data/information-processing-p56.png\" target=\"_blank\" rel=\"noopener\"><img src=\"../assets/question-data/information-processing-p56.png\" alt=\"두 VR 선택 과업의 속도 정점 · 정보처리 교안 p.56\" loading=\"lazy\"><\/a><p class=\"analysis-note\">(가) Stimulus-based: 빨간 버튼 선택. (나) Goal-based: 지시문의 기능에 해당하는 버튼 선택. 가로축은 시간(s), 세로축은 정점 속도(m/s)다. 처음 정점과 최대 정점은 서로 다른 지표이며 후반 정점의 시각·크기를 구분해서 읽는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC072", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX128", "OX129", "OX130"], "type": "single", "stem": "처음 보는 장치의 손잡이가 당기기를 유도하고, 조작 결과도 사용자의 공통 기대와 맞는다. 관련 개념을 올바르게 설명한 것은?", "options": [{"id": "o1", "text": "손잡이 형태의 당김 유도는 Affordance, 조작–표시의 집단 공통 기대는 Population stereotype이다.", "correct": true, "explanation": "물리적 성질이 유도하는 행동과 집단이 학습한 공통 기대를 구분한다."}, {"id": "o3", "text": "두 사례 모두 Affordance이며, 조작 결과에 대한 기대는 집단 경험보다 장치의 형태에서 정해진다.", "correct": false, "explanation": "기대는 집단 경험의 영향을 받는다. 형태가 주는 행동 유도와 같은 개념으로 묶을 수 없다."}, {"id": "o2", "text": "손잡이 형태의 당김 유도는 Population stereotype, 조작–표시의 집단 공통 기대는 Affordance다.", "correct": false, "explanation": "두 개념의 정의를 바꾸었다. 공통 기대는 집단 고정관념이다."}, {"id": "o4", "text": "두 사례 모두 Population stereotype이며, 처음 보는 형태의 유도 효과도 집단 기대와 같은 성질이다.", "correct": false, "explanation": "형태의 행동 유도와 학습된 공통 기대를 구별해야 한다. 두 현상에 같은 이름을 붙이지 않는다."}], "source": "3장 교안 p.57", "explanation": "물리적 성질이 유도하는 행동과 집단이 학습한 공통 기대를 구분한다.", "commonMistakes": ["기대는 집단 경험의 영향을 받는다. 형태가 주는 행동 유도와 같은 개념으로 묶을 수 없다.", "두 개념의 정의를 바꾸었다. 공통 기대는 집단 고정관념이다.", "형태의 행동 유도와 학습된 공통 기대를 구별해야 한다. 두 현상에 같은 이름을 붙이지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC073", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX131", "OX132", "OX133", "OX134"], "type": "single", "stem": "(가) 화구와 노브 배열 일치 (나) 다이얼·바늘 이동 방향 일치 (다) 온수에 빨강 (라) 음성 지시에 같은 음성으로 응답. 양립성 유형을 순서대로 고르면?", "options": [{"id": "o1", "text": "Spatial / Movement / Conceptual / Modality", "correct": true, "explanation": "배열, 이동, 의미 연상, 자극–반응 양식의 구분이다. 교안의 음성 “왼손” 사례에서는 말하기를 손 들기보다 양식 일치로 설명한다."}, {"id": "o2", "text": "Conceptual / Spatial / Movement / Modality", "correct": false, "explanation": "앞의 세 사례는 각각 물리 배치·방향·의미 코드이므로 연결이 다르다."}, {"id": "o4", "text": "Movement / Spatial / Conceptual / Modality", "correct": false, "explanation": "배열 일치는 Spatial, 움직임 방향 일치는 Movement다."}, {"id": "o3", "text": "Spatial / Conceptual / Modality / Movement", "correct": false, "explanation": "(나)는 방향, (다)는 색의 의미, (라)는 양식의 대응을 묻는다."}], "source": "3장 교안 p.58 · 3장 교안 p.59 · 3장 교안 p.60 · 3장 교안 p.61", "explanation": [], "commonMistakes": []}, {"id": "MC074", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX135", "OX136"], "type": "single", "stem": "한국에서는 이름·간판에 빨간색을 기피하지만 중국에서는 행운의 색으로 선호하고, 한국에서도 일반인은 빨간색을 위험으로 보지만 주식 투자자는 주가 상승의 색으로 선호한다. 이 사례들이 개념 양립성(Conceptual compatibility) 설계에 주는 시사점으로 가장 적절한 것은?", "options": [{"id": "o2", "text": "국가별 의미를 확인하면 같은 국가의 사용자는 경험과 관계없이 같은 색 해석을 한다고 본다.", "correct": false, "explanation": "국내 일반인과 투자자의 차이는 국가 구분만으로 경험 차이를 설명할 수 없음을 보인다."}, {"id": "o3", "text": "투자 경험별 의미를 확인하면 국가별 문화 차이는 같은 학습 효과로 간주해 따로 조사하지 않는다.", "correct": false, "explanation": "사례에는 문화 차이와 경험 차이가 함께 있다. 하나를 조사했다고 다른 차원이 해소되지 않는다."}, {"id": "o4", "text": "색의 의미가 집단마다 다르므로 의미 연상보다 화구·노브처럼 공간 배열을 맞추는 문제로 다룬다.", "correct": false, "explanation": "색의 의미 연상은 개념 양립성이다. 공간 양립성으로 범주를 바꾸는 것으로 해결되지 않는다."}, {"id": "o1", "text": "집단별 문화·학습 경험이 색의 의미 연상에 영향을 주므로 대상 집단에서 의미를 확인한다.", "correct": true, "explanation": "개념 양립성의 의미 연상은 문화와 경험에 의존할 수 있다. 특정 집단 사례를 모든 개인에게 단정하지 않는다."}], "source": "3장 교안 p.62", "explanation": "개념 양립성의 의미 연상은 문화와 경험에 의존할 수 있다. 특정 집단 사례를 모든 개인에게 단정하지 않는다.", "commonMistakes": ["국내 일반인과 투자자의 차이는 국가 구분만으로 경험 차이를 설명할 수 없음을 보인다.", "사례에는 문화 차이와 경험 차이가 함께 있다. 하나를 조사했다고 다른 차원이 해소되지 않는다.", "색의 의미 연상은 개념 양립성이다. 공간 양립성으로 범주를 바꾸는 것으로 해결되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC075", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX137"], "type": "single", "stem": "아래 VR 틸트 연구의 지각 과업(perception task) 그래프를 읽으시오. Incompatible에서 Compatible로 바뀔 때의 평균값 방향과 유의성 표시를 올바르게 설명한 것은? Accuracy(AE)는 절대 각도오차다.", "options": [{"id": "o2", "text": "Compatible에서 AE↑·RT↓·자신감↑이며, 유의성 별표는 자신감 비교에 있다.", "correct": false, "explanation": "별표 위치는 같아도 RT와 자신감의 평균 방향을 뒤바꾸었다."}, {"id": "o1", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, 유의성 별표는 자신감 비교에 있다.", "correct": true, "explanation": "도표의 평균 방향은 AE와 RT 증가, 자신감 감소다. 별표는 자신감 비교에 표시돼 있다."}, {"id": "o4", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, SE 막대의 겹침은 평균 차이의 부재를 입증한다.", "correct": false, "explanation": "SE 막대의 겹침만으로 평균이 같거나 유의차가 없다고 입증할 수 없다."}, {"id": "o3", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, AE 증가는 정확성 향상을 나타낸다.", "correct": false, "explanation": "AE는 절대오차이므로 증가가 정확성 향상을 뜻하지 않는다."}], "source": "3장 교안 p.65–66 · p.66 Fig.7 원그림과 지표 정의 대조", "explanation": "도표의 평균 방향은 AE와 RT 증가, 자신감 감소다. 별표는 자신감 비교에 표시돼 있다.", "commonMistakes": ["별표 위치는 같아도 RT와 자신감의 평균 방향을 뒤바꾸었다.", "SE 막대의 겹침만으로 평균이 같거나 유의차가 없다고 입증할 수 없다.", "AE는 절대오차이므로 증가가 정확성 향상을 뜻하지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>VR 틸트 연구의 지각 과업(perception task) 결과 · 교안 p.66<\/figcaption><a href=\"../assets/question-data/information-processing-p66.png\" target=\"_blank\" rel=\"noopener\"><img src=\"../assets/question-data/information-processing-p66.png\" alt=\"VR 틸트 연구의 지각 과업(perception task) 결과 · 교안 p.66\" loading=\"lazy\"><\/a><p class=\"analysis-note\">Compatible/ Incompatible은 몸과 보이는 패널의 기울임 방향의 일치/불일치다. Accuracy(AE)는 절대 각도오차이므로 작은 값이 더 정확하다. 오차막대는 SE, 별표는 해당 비교에서 p&lt;.05다. 이 도표를 레버 수동 조작 과업의 결과로 바꾸어 읽지 않는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC076", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX138"], "type": "single", "stem": "3D VR Fitts 보충논문에서 참가자 23명, 확장 모형 \\(R^{2} = 0.645\\)였다. 이 결과의 적절한 해석은?", "options": [{"id": "o3", "text": "MT와 개별 설명변수의 상관계수가 0.645라는 값이며, 각 변수의 관계 강도를 동일하게 해석한다.", "correct": false, "explanation": "모형 전체의 R²와 각 설명변수의 상관계수는 다르다. 확장 모형의 개별 상관을 이 값에서 얻을 수 없다."}, {"id": "o1", "text": "연구 표본에서 MT 변동의 64.5%를 설명한 값이며, 다른 표본의 예측 성능은 별도로 확인한다.", "correct": true, "explanation": "결정계수는 해당 자료의 설명력이다. 23명 연구 결과를 외부 표본의 성능 보장으로 바꾸지 않는다."}, {"id": "o4", "text": "MT의 단위를 ms에서 s로 바꾸면 R²도 1,000으로 나뉘어, 같은 자료의 설명력이 0.0645%가 된다.", "correct": false, "explanation": "R²는 제곱합의 비율이다. 결과변수를 같은 비율로 바꾸면 분자·분모가 함께 변해 설명력은 유지된다."}, {"id": "o2", "text": "연구 표본에서 MT 예측의 정답률이 64.5%라는 값이며, 다른 표본에도 같은 정답률을 적용한다.", "correct": false, "explanation": "결정계수를 분류 정답률로 읽었고 외부 표본으로 성능을 그대로 일반화했다."}], "source": "4주차 논문 · 피츠 전사", "stemPlain": "3D VR Fitts 보충논문에서 참가자 23명, 확장 모형 \\(R^{2} = 0.645\\)였다. 이 결과의 적절한 해석은?", "explanation": "결정계수는 해당 자료의 설명력이다. 23명 연구 결과를 외부 표본의 성능 보장으로 바꾸지 않는다.", "commonMistakes": ["모형 전체의 R²와 각 설명변수의 상관계수는 다르다. 확장 모형의 개별 상관을 이 값에서 얻을 수 없다.", "R²는 제곱합의 비율이다. 결과변수를 같은 비율로 바꾸면 분자·분모가 함께 변해 설명력은 유지된다.", "결정계수를 분류 정답률로 읽었고 외부 표본으로 성능을 그대로 일반화했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC077", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX140"], "type": "single", "stem": "자주 쓰는 메뉴를 화면 모서리에 두는 Fitts 설계의 근거는? 포인터가 화면 밖으로 넘어가지 않는 환경을 가정한다.", "options": [{"id": "o4", "text": "경계의 이점은 이동거리를 줄이는 데 있으므로, 표적 너비와 포인터 제약은 예측에서 제외한다.", "correct": false, "explanation": "Fitts 예측은 거리와 너비에 관계되며 이 사례의 이점은 경계 제약과 유효 너비다."}, {"id": "o1", "text": "경계가 포인터의 지나침을 제한하므로, 접근 방향에서 유효 표적 너비가 커질 수 있다.", "correct": true, "explanation": "포인터가 경계를 넘지 못하는 조건에서 모서리는 포착 가능한 유효 너비를 키울 수 있다."}, {"id": "o2", "text": "메뉴 위치가 바뀌어 선택 대안 수가 줄어드므로, Hick의 선택 정보량이 작아진다.", "correct": false, "explanation": "위치 "correct": false, "explanation": "표본 수나 비기각만으로 이상치·분포 문제를 무시할 수 없다."}], "source": "t-test 교안 p.13, 18, 23 · t-test 교안 p.13, 17", "stemPlain": "\\(n = 20\\)인 표본의 Shapiro–Wilk 검정에서 \\(p = 0.08\\)이었다. \\(\\alpha = 0.05\\)에서 가장 정확한 해석은?", "explanation": "p=.08>.05이므로 비기각이다. 비기각과 가정의 증명은 다르며 표본 크기만으로 분포가 정해지지 않는다.", "commonMistakes": ["p값은 가설의 사후확률이 아니다. 1-p를 정규성의 참일 확률로 읽을 수 없다.", "판정 방향과 p값의 의미를 모두 바꾸었다. 유의수준 .05에서는 비기각이다.", "표본 수나 비기각만으로 이상치·분포 문제를 무시할 수 없다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>정규성 검정 결과<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">대상<\/th><th scope=\"col\">검정<\/th><th scope=\"col\">n<\/th><th scope=\"col\">p-value<\/th><th scope=\"col\">α<\/th><\/tr><\/thead><tbody><tr><td>수치형 측정값<\/td><td>Shapiro–Wilk<\/td><td>20<\/td><td>0.08<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC084", "chapter": "기초통계·T검정", "conceptIds": ["OX156"], "type": "single", "stem": "데이터 datat에서 group이 \"Deagu\"인 행의 height 평균이 150인지 검정하고 \\(p = 0.001169\\)를 얻었다. 올바른 코드·해석은?", "options": [{"id": "o4", "text": "t.test(datat$height, mu=150); Deagu 집단 평균 150의 H₀를 기각", "correct": false, "explanation": "코드가 모든 집단의 키를 합친 벡터를 사용한다. Deagu만의 검정 결과라고 해석할 수 없다."}, {"id": "o1", "text": "t.test(datat$height[datat$group==\"Deagu\"], mu=150); 평균 150의 H₀를 기각", "correct": true, "explanation": "요구 집단의 수치 벡터를 추출해 기준값 150과 비교했다. 제시 p값은 .05보다 작다."}, {"id": "o3", "text": "t.test(datat$height[datat$group==\"Deagu\"], mu=150); 평균 150의 H₀를 비기각", "correct": false, "explanation": "코드는 맞지만 제시된 p=.001169에서의 판정을 반대로 했다."}, {"id": "o2", "text": "t.test(datat$height[datat$group==\"Deagu\"], mu=0); 평균 150의 H₀를 기각", "correct": false, "explanation": "선택 집단은 맞지만 코드의 귀무 기준은 0이다. 문제의 150과 다르다."}], "source": "t-test 교안 p.14", "stemPlain": "데이터 datat에서 group이 \"Deagu\"인 행의 height 평균이 150인지 검정하고 \\(p = 0.001169\\)를 얻었다. 올바른 코드·해석은?", "explanation": "요구 집단의 수치 벡터를 추출해 기준값 150과 비교했다. 제시 p값은 .05보다 작다.", "commonMistakes": ["코드가 모든 집단의 키를 합친 벡터를 사용한다. Deagu만의 검정 결과라고 해석할 수 없다.", "코드는 맞지만 제시된 p=.001169에서의 판정을 반대로 했다.", "선택 집단은 맞지만 코드의 귀무 기준은 0이다. 문제의 150과 다르다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>단일표본 양측 t-검정 · 수업 제시 출력<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">값<\/th><\/tr><\/thead><tbody><tr><td>자료 구조<\/td><td>datat: group(집단), height(키·cm)<\/td><\/tr><tr><td>분석 대상<\/td><td>group == &quot;Deagu&quot;인 20명<\/td><\/tr><tr><td>기준 모평균 μ₀<\/td><td>150 cm<\/td><\/tr><tr><td>표본평균<\/td><td>156.1165 cm<\/td><\/tr><tr><td>t / df<\/td><td>3.8148 / 19<\/td><\/tr><tr><td>p-value / α<\/td><td>0.001169 / 0.05<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC085", "chapter": "기초통계·T검정", "conceptIds": ["OX157", "OX158", "OX159", "OX160"], "type": "single", "stem": "데이터프레임 datat의 두 독립 집단(group) 간 키(height) 평균을 비교하기 위해 집단별 정규성을 확인한 뒤 Levene 등분산 검정을 수행한 결과 \\(p = 0.1742\\)였다. 유의수준 \\(\\alpha = 0.05\\)에서 등분산 가정형(pooled) 독립표본 t-검정을 진행하는 올바른 다음 단계는?", "options": [{"id": "o2", "text": "Levene H₀ 기각; t.test(height ~ group, data=datat, var.equal=TRUE)", "correct": false, "explanation": "t 코드가 pooled여도 Levene의 판정을 반대로 했다. 유의수준 .05에서는 비기각이다."}, {"id": "o3", "text": "Levene H₀ 비기각; t.test(height ~ group, data=datat, var.equal=FALSE)", "correct": false, "explanation": "Welch는 가능한 별도 방법이지만 문제에서 요청한 등분산 가정형은 아니다. pooled는 var.equal=TRUE다."}, {"id": "o1", "text": "Levene H₀ 비기각; t.test(height ~ group, data=datat, var.equal=TRUE)", "correct": true, "explanation": "p=.1742>.05에서 등분산을 기각하지 않으며 요구한 pooled 방식의 인자는 TRUE다. 분산의 동일성을 증명한 것은 아니다."}, {"id": "o4", "text": "Levene H₀ 비기각; t.test(height ~ group, data=datat, var.equal=TRUE, mu=150)", "correct": false, "explanation": "독립 두 집단 차이의 기본 귀무 기준 0 대신 차이 150을 넣었다. 한 집단의 기준 평균과 두 집단 평균차를 혼동했다."}], "source": "t-test 교안 p.15, 17–19 · t-test 교안 p.19 · t-test 교안 p.19–20 · t-test 교안 p.20", "stemPlain": "데이터프레임 datat의 두 독립 집단(group) 간 키(height) 평균을 비교하기 위해 집단별 정규성을 확인한 뒤 Levene 등분산 검정을 수행한 결과 \\(p = 0.1742\\)였다. 유의수준 \\(\\alpha = 0.05\\)에서 등분산 가정형(pooled) 독립표본 t-검정을 진행하는 올바른 다음 단계는?", "explanation": "p=.1742>.05에서 등분산을 기각하지 않으며 요구한 pooled 방식의 인자는 TRUE다. 분산의 동일성을 증명한 것은 아니다.", "commonMistakes": ["t 코드가 pooled여도 Levene의 판정을 반대로 했다. 유의수준 .05에서는 비기각이다.", "Welch는 가능한 별도 방법이지만 문제에서 요청한 등분산 가정형은 아니다. pooled는 var.equal=TRUE다.", "독립 두 집단 차이의 기본 귀무 기준 0 대신 차이 150을 넣었다. 한 집단의 기준 평균과 두 집단 평균차를 혼동했다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>독립 두 집단 · 분석 조건과 사전 검정<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">조건·출력<\/th><\/tr><\/thead><tbody><tr><td>자료 구조<\/td><td>datat: height(키·cm), group(Deagu/Seoul)<\/td><\/tr><tr><td>표본 구조<\/td><td>서로 독립인 두 집단, 결측값 없음<\/td><\/tr><tr><td>정규성 점검<\/td><td>각 집단에서 Shapiro–Wilk 검정 비기각<\/td><\/tr><tr><td>평균 중심 Levene p-value<\/td><td>0.1742<\/td><\/tr><tr><td>α<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div><p class=\"analysis-note\">문항은 교안의 등분산 가정형 절차를 요청한다. 원자료 값 자체의 계산이 아닌 다음 분석 코드와 판정을 묻는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC086", "chapter": "기초통계·T검정", "conceptIds": ["OX161", "OX162"], "type": "single", "stem": "d=after-before를 만들어 shapiro.test(d)를 점검한 뒤 t.test(d)의 결과가 평균 -33.65, \\(t = -7.6951\\), \\(p = 2.97 \\times 10^{-7}\\)이었다. 해석은?", "options": [{"id": "o4", "text": "전후 자료가 별도 시점이므로 독립표본 검정을 적용하고, 음수 차이를 두 집단의 평균차로 해석한다.", "correct": false, "explanation": "같은 사람의 전후 자료는 짝을 유지한다. 시점이 달라도 독립된 두 표본으로 바뀌지 않는다."}, {"id": "o1", "text": "평균차 0을 기각하며, after-before가 음수이므로 이 표본의 사후 수행시간이 더 짧다.", "correct": true, "explanation": "제시 자료의 단위는 ms다. 음수 차이는 after가 더 작음을 뜻하며 작은 p값에서 평균차 0을 기각한다."}, {"id": "o3", "text": "평균차 0을 기각하지 못하며, 음수 평균차는 짝별 차이가 서로 상쇄된 결과로 해석한다.", "correct": false, "explanation": "제시된 매우 작은 p값과 맞지 않는다. 평균차 0을 기각해야 한다."}, {"id": "o2", "text": "평균차 0을 기각하며, after-before가 음수이므로 이 표본의 사후 수행시간이 더 길다.", "correct": false, "explanation": "평균차의 정의와 방향을 반대로 해석했다. 음수이면 after의 수행시간이 더 짧다."}], "source": "t-test 교안 p.21, 23 · t-test 교안 p.24", "stemPlain": "d=after-before를 만들어 shapiro.test(d)를 점검한 뒤 t.test(d)의 결과가 평균 -33.65, \\(t = -7.6951\\), \\(p = 2.97 \\times 10^{-7}\\)이었다. 해석은?", "explanation": "제시 자료의 단위는 ms다. 음수 차이는 after가 더 작음을 뜻하며 작은 p값에서 평균차 0을 기각한다.", "commonMistakes": ["같은 사람의 전후 자료는 짝을 유지한다. 시점이 달라도 독립된 두 표본으로 바뀌지 않는다.", "제시된 매우 작은 p값과 맞지 않는다. 평균차 0을 기각해야 한다.", "평균차의 정의와 방향을 반대로 해석했다. 음수이면 after의 수행시간이 더 짧다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>대응 차이의 단일표본 양측 t-검정 · 수업 제시 출력<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">값<\/th><\/tr><\/thead><tbody><tr><td>자료 구조<\/td><td>같은 사람의 before·after가 같은 행, 20쌍<\/td><\/tr><tr><td>분석 벡터 d<\/td><td>after - before (ms)<\/td><\/tr><tr><td>차이 정규성<\/td><td>차이 벡터에 Shapiro–Wilk 적용<\/td><\/tr><tr><td>귀무 기준 μd<\/td><td>0 ms<\/td><\/tr><tr><td>표본 평균차<\/td><td>-33.65 ms<\/td><\/tr><tr><td>t / df<\/td><td>-7.6951 / 19<\/td><\/tr><tr><td>p-value / α<\/td><td>2.97 × 10⁻⁷ / 0.05<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC087", "chapter": "회귀·실험실습", "conceptIds": ["OX164", "OX165", "OX168"], "type": "single", "stem": "적성점수 x로 업무만족도 y를 예측하려 한다. 상관·회귀의 구분과 시작 절차로 적절한 것은?", "options": [{"id": "o3", "text": "상관은 단위에 따른 공변화를 직접 나타내고, 회귀 기울기는 두 변수의 단위를 없앤 표준 지표다.", "correct": false, "explanation": "단위에 따른 공분산과 무차원 상관을 혼동했고, 일반적인 회귀 기울기에는 y/x 단위가 있다."}, {"id": "o1", "text": "상관은 대칭적 선형 연관, 회귀는 x로 y의 조건부 관계를 설명·예측하며 먼저 산점도를 살핀다.", "correct": true, "explanation": "예측 방향이 있는 회귀와 대칭적인 상관을 구분하고 자료의 형태를 확인한다."}, {"id": "o2", "text": "상관은 x로 y를 예측하는 방향을 정하고, 회귀는 두 변수의 순서를 바꾸어도 같은 모형으로 본다.", "correct": false, "explanation": "상관과 회귀의 방향성을 뒤바꾸었다. y~x와 x~y 회귀는 같은 모형이 아니다."}, {"id": "o4", "text": "상관이 충분히 크면 직선 적합이 확인된 것이므로, 회귀 전 산점도의 곡선·극단값 점검은 생략한다.", "correct": false, "explanation": "큰 상관만으로 형태·이상치·조건이 확인되지 않는다. 산점도를 먼저 살펴야 한다."}], "sourc explanation": "~ 왼쪽은 y, 오른쪽은 두 설명변수다. +는 두 주효과를 모형에 포함하는 포뮬러 기호다."}, {"id": "o2", "text": "lm(x1 + x2 ~ y)", "correct": false, "explanation": "반응변수와 설명변수의 위치를 뒤집었다."}, {"id": "o3", "text": "lm(y ~ x1 / x2)", "correct": false, "explanation": "포뮬러의 /는 단순히 두 주효과를 더하는 표기와 다르며 요구한 모형이 아니다."}], "source": "회귀 전사 말미", "explanation": [], "commonMistakes": []}, {"id": "MC095", "chapter": "회귀·실험실습", "conceptIds": ["OX181", "OX182"], "type": "single", "stem": "SRT·CRT의 대안 수 \\(N = 1\\),2,4를 bit로 변환해 회귀했다. \\(\\hat{y} = 424 + 78\\,H\\), \\(p = 0.16\\), \\(R^{2} \\approx 0.03\\)이면?", "options": [{"id": "o2", "text": "H는 1·2·4 bit이며, α=.05에서 모형은 비유의하고 표본 Time 변동의 약 3%를 설명한다.", "correct": false, "explanation": "나머지 해석은 맞지만 대안 수를 정보량으로 그대로 사용했다."}, {"id": "o4", "text": "H는 0·1·2 bit이며, 기울기가 양수이므로 α=.05에서 모형은 유의하고 설명력은 약 3%다.", "correct": false, "explanation": "추정 기울기의 부호는 유의성을 대신하지 않는다. 제시 p값에서 비유의다."}, {"id": "o1", "text": "H는 0·1·2 bit이며, α=.05에서 모형은 비유의하고 표본 Time 변동의 약 3%를 설명한다.", "correct": true, "explanation": "정보량은 log₂N이다. p=.16>.05와 R²=.03을 구별해 해석한다."}, {"id": "o3", "text": "H는 0·1·2 bit이며, α=.05에서 모형은 비유의하고 표본 Time 변동의 약 16%를 설명한다.", "correct": false, "explanation": "p값 .16을 설명 비율로 바꾸었다. 표본 설명력은 R²=.03이다."}], "source": "SRT/CRT 교안 p.1–3 · 실습 전사 · SRT/CRT 실습 전사", "stemPlain": "SRT·CRT의 대안 수 \\(N = 1\\),2,4를 bit로 변환해 회귀했다. \\(\\hat{y} = 424 + 78\\,H\\), \\(p = 0.16\\), \\(R^{2} \\approx 0.03\\)이면?", "explanation": "정보량은 log₂N이다. p=.16>.05와 R²=.03을 구별해 해석한다.", "commonMistakes": ["나머지 해석은 맞지만 대안 수를 정보량으로 그대로 사용했다.", "추정 기울기의 부호는 유의성을 대신하지 않는다. 제시 p값에서 비유의다.", "p값 .16을 설명 비율로 바꾸었다. 표본 설명력은 R²=.03이다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>SRT·CRT 수업 실습 예시 · 등확률 대안과 회귀 요약<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">제시자료<\/th><\/tr><\/thead><tbody><tr><td>등확률 대안 수 N<\/td><td>1, 2, 4<\/td><\/tr><tr><td>반응변수<\/td><td>Time (ms)<\/td><\/tr><tr><td>설명변수<\/td><td>H (bit)<\/td><\/tr><tr><td>추정식<\/td><td>\\(\\widehat{\\mathrm{Time}}=424+78H\\)<\/td><\/tr><tr><td>모형 p-value<\/td><td>0.16<\/td><\/tr><tr><td>Multiple R-squared<\/td><td>0.03<\/td><\/tr><tr><td>판정 유의수준 α<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div><p class=\"analysis-note\">실습 전사에 주어진 요약값이다. 아래 Sternberg 로그와는 별개의 분석이며, 원자료가 없는 이 회귀를 로그 4행에서 산출한 것으로 간주하지 않는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC096", "chapter": "회귀·실험실습", "conceptIds": ["OX183"], "type": "single", "stem": "SRT·CRT·Sternberg 로그의 TimeOut 시행에 Time=5000 ms가 기록되었다. 가장 적절한 처리·해석은?", "options": [{"id": "o4", "text": "User Input의 -1을 실제 검사 숫자의 값으로 해석해, 포함 여부에 따라 정상 YES·NO RT로 분류한다.", "correct": false, "explanation": "프로그램의 실패·미입력 표식을 실제 자극 값으로 해석하지 않는다. 자극 열과 반응 상태를 분리한다."}, {"id": "o1", "text": "제한시간 내 응답 실패로 구분해 정상 정답 RT의 요약에서 분리하고, 제외 규칙과 수를 기록한다.", "correct": true, "explanation": "TimeOut의 5000은 제한시간 기록이다. 정상 반응과 구별하되 처리 기준과 손실 시행도 관리한다."}, {"id": "o3", "text": "5000을 5초로 바꾼 뒤 T/F를 True로 재코딩하여, 단위가 같은 정상 정답 RT에 포함한다.", "correct": false, "explanation": "단위 변환은 실패한 시행을 정답으로 바꾸지 않는다. 응답 상태를 보존한다."}, {"id": "o2", "text": "기록된 5000을 관측 RT로 사용해, T/F가 False여도 정상 정답 RT의 평균 계산에 포함한다.", "correct": false, "explanation": "제한시간까지 응답하지 않은 기록을 실제 정답 반응시간으로 합치지 않는다."}], "source": "Sternberg README · 로그", "explanation": "TimeOut의 5000은 제한시간 기록이다. 정상 반응과 구별하되 처리 기준과 손실 시행도 관리한다.", "commonMistakes": ["프로그램의 실패·미입력 표식을 실제 자극 값으로 해석하지 않는다. 자극 열과 반응 상태를 분리한다.", "단위 변환은 실패한 시행을 정답으로 바꾸지 않는다. 응답 상태를 보존한다.", "제한시간까지 응답하지 않은 기록을 실제 정답 반응시간으로 합치지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>해석 대상 TimeOut 행 · 실제 로그<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Number Set<\/th><th scope=\"col\">Probe<\/th><th scope=\"col\">User Input<\/th><th scope=\"col\">T/F<\/th><th scope=\"col\">Time (ms)<\/th><\/tr><\/thead><tbody><tr><td>{2, 7, 5}<\/td><td>2<\/td><td>TimeOut<\/td><td>False<\/td><td>5000<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC097", "chapter": "회귀·실험실습", "conceptIds": ["OX184", "OX185"], "type": "single", "stem": "제시된 Sternberg 로그 한 시행을 분석한다. 실제 자극 조건과 반응 정오를 함께 분류한 것으로 옳은 것은?", "options": [{"id": "o2", "text": "YES 조건의 정답으로 분류하며, T/F가 True인 시행을 모아 YES의 PSS–RT를 분석한다.", "correct": false, "explanation": "T/F는 정오다. 이 행은 T/F=True여도 실제 포함 조건이 NO다."}, {"id": "o3", "text": "NO 조건의 오답으로 분류하며, User Input=False인 시행을 모아 오류 반응으로 처리한다.", "correct": false, "explanation": "False는 포함되지 않았다는 응답이다. 이 행에서는 정확한 NO 응답이므로 오답이 아니다."}, {"id": "o1", "text": "NO 조건의 정답으로 분류하며, 실제 포함 여부로 조건을 나눈 뒤 PSS–RT를 분석한다.", "correct": true, "explanation": "집합에 없는 Probe에 False로 정확히 답했다. 실제 포함 조건과 정오 열을 구분한다."}, {"id": "o4", "text": "NO 조건의 정답으로 분류하며, 정답 행의 T/F를 설명변수로 하여 PSS의 효과를 추정한다.", "correct": false, "explanation": "T/F를 사용해도 집합크기 PSS의 효과를 추정하는 회귀가 되지 않는다. PSS를 설명변수로 사용해야 한다."}], "source": "Sternberg 로그 · 원문과 검증 · SRT/CRT/Sternberg 실습 전사", "explanation": "집합에 없는 Probe에 False로 정확히 답했다. 실제 포함 조건과 정오 열을 구분한다.", "commonMistakes": ["T/F는 정오다. 이 행은 T/F=True여도 실제 포함 조건이 NO다.", "False는 포함되지 않았다는 응답이다. 이 행에서는 정확한 NO 응답이므로 오답이 아니다.", "T/F를 사용해도 집합크기 PSS의 효과를 추정하는 회귀가 되지 않는다. PSS를 설명변수로 사용해야 한다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>해석 대상 시행 · 실제 로그<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Number Set<\/th><th scope=\"col\">Probe<\/th><th scope=\"col\">User Input<\/th><th scope=\"col\">T/F<\/th><th scope=\"col\">Time (ms)<\/th><\/tr><\/thead><tbody><tr><td>{1, 3, 4}<\/td><td>2<\/td><td>False<\/td><td>True<\/td><td>1201<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC098", "chapter": "개론·역사", "conceptIds": ["OX001", "OX002", "OX003", "OX005", "OX006"], "type": "multi", "stem": "UX와 UX 심리학에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "Brand Ethics는 제품·서비스 경험에 속한다.", "correct": false, "explanation": "Brand Ethics는 브랜드 경험의 요소다. 제품·서비스의 세 요소는 Affect·Usability·User Value다."}, {"id": "o1", "text": "UX는 사용 전·사용 중·사용 후의 경험을 포괄한다.", "correct": true, "explanation": "교안의 Previous·Present·Future experience라는 시간 범위다."}, {"id": "o3", "text": "UX 심리학은 심리학 지식과 방법을 사용자 경험에 적용한다.", "correct": true, "explanation": "교안의 정의이며 DESIGN AND SCIENCE의 결합을 강조한다."}, {"id": "o4", "text": "UX 연구 기반에는 인간공학·공학·심리학·사회학이 포함된다.", "correct": true, "explanation": "교안의 네 학문 교집합 도식과 일치한다."}], "source": "1-1 교안 p.2–3 · 1-1 교안 p.2 · 1-1 교안 p.4–5 · 1-1 교안 p.8", "explanation": "교안의 Previous·Present·Future experience라는 시간 범위다. 교안의 정의이며 DESIGN AND SCIENCE의 결합을 강조한다. 교안의 네 학문 교집합 도식과 일치한다.", "commonMistakes": ["Brand Ethics는 브랜드 경험의 요소다. 제품·서비스의 세 요소는 Affect·Usability·User Value다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC099", "chapter": "개론·역사", "conceptIds": ["OX008", "OX009", "OX015", "OX017", "OX020"], "type": "multi", "stem": "UX의 발전 단계(Dark Ages·Proto UX·UX Gold Rush)와 인간공학의 시대별 역사(Old Age·Middle/Modern Age·Information Age)에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "Information Age의 초기 HCI 연구는 UI와 Usability를 다루었다.", "correct": true, "explanation": "교안은 이후 스마트폰 UX와 인간–AI 연구로의 확대를 제시한다."}, {"id": "o2", "text": "therbligs는 인간공학 전문 학문 탄생기에 조종장치 설계용 인지 처리 단위로 개발됐다.", "correct": false, "explanation": "therbligs는 더 이른 시간·동작 연구의 수작업 미세동작 단위다. 전문화 시기·인지 단계와 혼동했다."}, {"id": "o3", "text": "Old Age는 사람을 직무·장비에 맞추는 관점이 중심이었다.", "correct": true, "explanation": "현대 인간 중심 설계의 완성기로 잘못 일반화하지 않아야 한다."}, {"id": "o1", "text": "Proto UX는 1990년대 인지인간공학·정보설계·인터페이스 디자인과 연결된다.", "correct": true, "explanation": "UX Gold Rush보다 앞선 교안의 중간 단계다."}], "source": "1-2 교안 p.2–4 · 1-2 교안 p.3 · 1-2 교안 p.12 · 1-2 교안 p.14", "explanation": "교안은 이후 스마트폰 UX와 인간–AI 연구로의 확대를 제시한다. 현대 인간 중심 설계의 완성기로 잘못 일반화하지 않아야 한다. UX Gold Rush보다 앞선 교안의 중간 단계다.", "commonMistakes": ["therbligs는 더 이른 시간·동작 연구의 수작업 미세동작 단위다. 전문화 시기·인지 단계와 혼동했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC100", "chapter": "개론·역사", "conceptIds": ["OX012", "OX013", "OX014", "OX021", "OX022"], "type": "multi", "stem": "인간공학의 정의·영역·설계 철학에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "인간공학에서 시스템 성능은 설계 목표이며, 인간의 안녕은 그 결과와 분리한 사후 점검 항목이다.", "correct": false, "explanation": "인간의 안녕과 시스템 성능은 공동 설계 목표다. 안녕을 사후 항목으로만 분리하지 않는다."}, {"id": "o1", "text": "근력·인체측정·생체역학은 Physical Ergonomics와 관련된다.", "correct": true, "explanation": "신체적 특성과 상호작용을 다루는 영역이다."}, {"id": "o2", "text": "인지 인간공학은 지각·기억·추론 같은 정신 과정을 다룬다.", "correct": true, "explanation": "신체 치수 연구와 구분되는 인지 영역이다."}, {"id": "o3", "text": "기존 장치에 맞는 작업자를 선발하는 것은 시스템을 인간에게 맞추는 접근이다.", "correct": false, "explanation": "선발·훈련은 Fitting the Human to the System의 전통적 접근이다."}], "source": "1-2 교안 p.7 · 1-2 교안 p.8–9 · 1-2 교안 p.8–11 · 1-2 교안 p.15", "explanation": "신체적 특성과 상호작용을 다루는 영역이다. 신체 치수 연구와 구분되는 인지 영역이다.", "commonMistakes": ["인간의 안녕과 시스템 성능은 공동 설계 목표다. 안녕을 사후 항목으로만 분리하지 않는다.", "선발·훈련은 Fitting the Human to the System의 전통적 접근이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC101", "chapter": "HFE 연구방법론", "conceptIds": ["OX027", "OX030", "OX031", "OX033", "OX037"], "type": "multi", "stem": "HFE 연구 유형과 변수에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "스마트글래스 무게 위치를 조작하고 코 하중을 비교하면 위치가 DV다.", "correct": false, "explanation": "조작한 무게 위치는 IV, 측정 결과 코 하중은 DV다."}, {"id": "o4", "text": "변수 조작의 수행도 효과를 검증하는 것은 Experimental research다.", "correct": true, "explanation": "기술 연구 및 제품 평가 목적과 구분하는 기준이다."}, {"id": "o3", "text": "완성된 제품들의 사용성·효과성을 평가하는 것은 Evaluation research다.", "correct": true, "explanation": "교안의 진공청소기 비교 사례가 대표적이다."}, {"id": "o1", "text": "인간의 손 치수 분포를 측정·기술하는 연구는 Descriptive research다.", "correct": true, "explanation": "인체 치수와 근력 같은 인간 속성을 조작 없이 측정하고 분포를 기술하는 것은 Descriptive research다."}], "source": "2장 교안 p.4–7 · 2장 교안 p.4, 8–9 · 2장 교안 p.10 · 2장 교안 p.4, 11–13 · 2장 교안 p.15", "explanation": [], "commonMistakes": []}, {"id": "MC102", "chapter": "HFE 연구방법론", "conceptIds": ["OX042", "OX043", "OX044", "OX052"], "type": "multi", "stem": "\\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)와 \\(\\mathrm{SE} = \\frac{s}{\\sqrt{n}}\\)에 관해 옳은 것을 모두 고르시오. 명시하지 않은 값은 고정한다.", "options": [{"id": "o4", "text": "n의 계산값이 15.37이면 최소 필요 인원을 15명으로 내린다.", "correct": false, "explanation": "목표 정밀도를 확보하려면 총 16명으로 올림한다."}, {"id": "o2", "text": "k를 절반으로 하면 필요한 n은 절반이다.", "correct": false, "explanation": "k가 분모에서 제곱되므로 n은 네 배가 된다."}, {"id": "o3", "text": "n을 네 배로 하면 같은 s에서 평균의 SE는 절반이다.", "correct": true, "explanation": "\\(\\sqrt{\\left(4\\,n\\right)} = 2\\,\\sqrt{n}\\)이므로 SE가 절반이다."}, {"id": "o1", "text": "s를 두 배로 하면 필요한 n은 네 배다.", "correct": true, "explanation": "다른 조건을 고정하면 n은 s²에 비례한다. 따라서 s를 2배로 하면 괄호의 제곱으로 n은 4배다."}], "source": "2장 교안 p.18 · 2장 교안 p.19 · 2장 교안 p.10 · 원문과 검증", "stemPlain": "\\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)와 \\(\\mathrm{SE} = \\frac{s}{\\sqrt{n}}\\)에 관해 옳은 것을 모두 고르시오. 명시하지 않은 값은 고정한다.", "explanation": [], "commonMistakes": []}, {"id": "MC103", "chapter": "HFE 연구방법론", "conceptIds": ["OX046", "OX047", "OX048", "OX050", "OX051"], "type": "multi", "stem": "측정 품질에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "결과를 다른 사용환경으로 일반화하는 정도는 External validity다.", "correct": true, "explanation": "Internal validity는 연구 내부의 교란 없는 인과 귀속과 관련된다."}, {"id": "o3", "text": "구성개념의 일부가 측정에서 빠지는 것은 Contamination이다.", "correct": false, "explanation": "빠지는 부분은 Deficiency, 무관한 부분이 섞이는 것은 Contamination이다."}, {"id": "o1", "text": "반복값이 촘촘하더라도 참값에서 벗어나면 정확도는 낮을 수 있다.", "correct": true, "explanation": "높은 신뢰도가 정확도·타당도를 자동으로 보장하지 않는다."}, {"id": "o4", "text": "숙련도가 조건별로 달라지면 UI 효과 추정의 내적 타당도를 해칠 수 있다.", "correct": true, "explanation": "숙련도와 UI 조건의 confounding 때문이다."}], "source": "2장 교안 p.20 · 2장 교안 p.21 · 2장 교안 p.22", "explanation": [], "commonMistakes": []}, {"id": "MC104", "chapter": "정보량·중복도", "conceptIds": ["OX059", "OX060", "OX061", "OX062", "OX075"], "type": "multi", "stem": "정보량 계산에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o1", "text": "등확률 16개 대안의 정보량은 4 bits다.", "correct": true, "explanation": "등확률에서 \\(H = \\log_2 N\\)이다. \\(2^{4} = 16\\)이므로 16개 대안의 선택 정보량은 4 bits다."}, {"id": "o3", "text": "Shannon 식은 개별 자기정보량 \\(\\log_2 \\left(\\frac{1}{p_i}\\right)\\)의 확률 가중평균이다.", "correct": true, "explanation": "\\(H=\\sum_i p_i\\log_2\\left(\\frac{1}{p_i}\\right)=-\\sum_i p_i\\log_2 p_i\\)다."}, {"id": "o2", "text": "비등확률 대안에서도 평균 정보량은 대안 수의 log₂만으로 결정된다.", "correct": false, "explanation": "확률이 다르면 Shannon의 확률 가중식을 적용해야 한다."}, {"id": "o4", "text": "확률 0인 사건의 엔트로피 기여는 극한으로 0이다.", "correct": true, "explanation": "가중항 전체를 p→0+ 극한으로 처리한다."}], "source": "3장 교안 p.8 · 3장 교안 p.9 · 3장 교안 p.18", "explanation": [], "commonMistakes": []}, {"id": "MC105", "chapter": "정보량·중복도", "conceptIds": ["OX064", "OX066", "OX068", "OX069", "OX071"], "type": "multi", "stem": "중복도 \\(R = \\left(1 - \\frac{H}{H_{\\max}}\\right) \\times 100\\)에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "H가 Hmax와 같으면 중복도는 100%다.", "correct": false, "explanation": "\\(H = H_{\\max}\\)이면 \\(R = \\left(1 - \\frac{H}{H_{\\max}}\\right) \\times 100 = \\left(1 - 1\\right) \\times 100 = 0\\)%다. 최대 정보량일 때 중복도는 최소다."}, {"id": "o1", "text": "8개 대안의 Hmax는 3 bits다.", "correct": true, "explanation": "고정된 8개 대안이 등확률일 때 \\(\\log_2 8 = 3\\)이다."}, {"id": "o4", "text": "같은 대안 수에서 확률이 치우칠수록 일반적으로 중복도는 증가한다.", "correct": true, "explanation": "등확률에서 엔트로피가 최대이므로 치우치면 H가 줄고 중복도가 커진다."}, {"id": "o3", "text": "변경 시점이 완전히 확정되면 해당 불확실성의 H는 0이다.", "correct": true, "explanation": "확정 사건의 자기정보량은 0이며 \\(H_{\\max} > 0\\)이면 중복도는 100%다."}], "source": "3장 교안 p.10 · 3장 교안 p.11 · 3장 교안 p.12 · 3장 교안 p.13 · 3장 교안 p.14", "stemPlain": "중복도 \\(R = \\left(1 - \\frac{H}{H_{\\max}}\\right) \\times 100\\)에 관해 옳은 것을 모두 고르시오.", "explanation": [], "commonMistakes": []}, {"id": "MC106", "chapter": "정보량·중복도", "conceptIds": ["OX054", "OX055", "OX056", "OX057", "OX077"], "type": "multi", "stem": "인간 정보처리 모형에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "시연 없는 작업기억 지속시간은 대략 20~30초다.", "correct": true, "explanation": "모형의 대표 수치이며 모든 상황의 고정 상수로 해석하지 않는다."}, {"id": "o1", "text": "주의 자원은 지각뿐 아니라 작업기억·결정·실행에도 관여한다.", "correct": true, "explanation": "교안은 여러 단계에 공급되는 제한된 자원으로 표시한다."}, {"id": "o2", "text": "장기기억은 반응 선택에 관여하지만 지각과는 연결되지 않는다.", "correct": false, "explanation": "장기기억은 지각·결정 등에도 영향을 준다. 실행 절차에만 한정되지 않는다."}, {"id": "o3", "text": "반응의 결과는 피드백으로 다시 감각 입력에 영향을 준다.", "correct": true, "explanation": "정보처리가 환경과 연결되는 Feedback 루프다."}], "source": "3장 교안 p.6", "explanation": "모형의 대표 수치이며 모든 상황의 고정 상수로 해석하지 않는다. 교안은 여러 단계에 공급되는 제한된 자원으로 표시한다. 정보처리가 환경과 연결되는 Feedback 루프다.", "commonMistakes": ["장기기억은 지각·결정 등에도 영향을 준다. 실행 절차에만 한정되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC107", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX079", "OX080", "OX081", "OX084", "OX110", "OX111"], "type": "multi", "stem": "정보전달량과 조건부 엔트로피에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "\\(H\\left(X\\mid Y\\right)\\)는 Noise이고 \\(H\\left(Y\\mid X\\right)\\)는 Equivocation이다.", "correct": false, "explanation": "입력 기준 손실 \\(H\\left(X\\mid Y\\right)\\)가 Equivocation, 출력 조건부 불확실성 \\(H\\left(Y\\mid X\\right)\\)가 Noise다."}, {"id": "o4", "text": "반응 라벨을 일대일로 뒤집어도 전달정보량은 최대일 수 있다.", "correct": true, "explanation": "의미상 정답률 0%와 최대 통계적 전달량이 함께 나타날 수 있는 Trap이다."}, {"id": "o1", "text": "\\(I\\left(X; Y\\right) = H\\left(X\\right) + H\\left(Y\\right) - H\\left(X, Y\\right)\\)다.", "correct": true, "explanation": "교안의 \\(H\\left(X \\cap Y\\right)\\)는 이 상호정보량을 뜻한다."}, {"id": "o3", "text": "출력이 한 값으로 고정되면 \\(I\\left(X; Y\\right) = 0\\)이다.", "correct": true, "explanation": "\\(H\\left(Y\\right) = 0\\)이고 입력을 구별할 정보가 남지 않는다."}], "source": "3장 교안 p.15–16 · 3장 교안 p.16 · 3장 교안 p.19 · 3장 교안 p.16–18", "explanation": [], "commonMistakes": []}, {"id": "MC108", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX089", "OX090", "OX091", "OX092", "OX093"], "type": "multi", "stem": "기억·판단 전략에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o3", "text": "Self-terminating은 목표를 찾아도 마지막 항목까지 비교한다.", "correct": false, "explanation": "목표를 찾는 즉시 멈추는 방식이다. 끝까지 비교하는 것은 exhaustive다."}, {"id": "o4", "text": "Location+Color는 자극 차원을 증가시키는 전략이다.", "correct": true, "explanation": "한 차원 위치 부호에서 다차원 부호로 바꾼 사례다."}, {"id": "o2", "text": "Chunking은 기존 지식과 연결해 의미 있는 단위를 구성한다.", "correct": true, "explanation": "묶음화와 장기기억 지식의 연결이 핵심이다."}, {"id": "o1", "text": "Relative judgment는 두 자극을 직접 비교하게 하는 전략이다.", "correct": true, "explanation": "기억 속 기준과의 절대 판단보다 판별 부담을 낮추는 교안 전략이다."}], "source": "3장 교안 p.26–28 · 3장 교안 p.26 · 3장 교안 p.29 · 3장 교안 p.30–31 · 3장 교안 p.31", "explanation": "한 차원 위치 부호에서 다차원 부호로 바꾼 사례다. 묶음화와 장기기억 지식의 연결이 핵심이다. 기억 속 기준과의 절대 판단보다 판별 부담을 낮추는 교안 전략이다.", "commonMistakes": ["목표를 찾는 즉시 멈추는 방식이다. 끝까지 비교하는 것은 exhaustive다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC109", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX095", "OX096", "OX097", "OX098", "OX106", "OX107"], "type": "multi", "stem": "Donders와 Hick 모형에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "Donders C는 자극 식별과 여러 반응 사이의 선택을 모두 포함한다.", "correct": false, "explanation": "C는 여러 자극 중 한 자극에만 반응하며 반응 선택은 B에서 추가된다."}, {"id": "o3", "text": "양립성·학습·연령을 Hick 기울기 요인으로 제시한다.", "correct": true, "explanation": "절편의 자극·반응 양식과 구별되는 세 요인이다."}, {"id": "o1", "text": "Donders 차감법에서 \\(C - A\\)는 자극 식별, \\(B - C\\)는 반응 선택 시간이다.", "correct": true, "explanation": "\\(C = A\\)+식별, \\(B = C\\)+선택이라는 단계 가정 아래의 해석이다."}, {"id": "o2", "text": "Hick의 b 단위는 ms/bit이며 작을수록 추가 선택 부담이 작다.", "correct": true, "explanation": "정보 1 bit 증가에 따른 RT의 추가 시간이다."}], "source": "3장 교안 p.32 · 3장 교안 p.34–35 · 3장 교안 p.37 · 3장 교안 p.37 · 정보처리 전사3", "explanation": [], "commonMistakes": []}, {"id": "MC110", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX114", "OX115", "OX118", "OX139"], "type": "multi", "stem": "Fitts ID 계산에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o1", "text": "원형 공식은 \\(\\log_2 \\left(\\frac{2\\,A}{W}\\right)\\)다.", "correct": true, "explanation": "이동 진폭 A와 표적 너비 W를 사용하는 원형이다."}, {"id": "o3", "text": "D가 cm이고 W가 mm여도 숫자만 바로 나누면 비율이 같다.", "correct": false, "explanation": "길이 단위를 통일한 뒤 비율을 구해야 한다."}, {"id": "o2", "text": "ISO 표준형(Shannon형) 공식은 \\(\\log_2 \\left(\\frac{D}{W} + 1\\right)\\)이다.", "correct": true, "explanation": "\\(\\log_2 \\left(\\frac{W}{D} + 1\\right)\\)로 분자·분모를 바꾸면 안 된다."}, {"id": "o4", "text": "같은 모형에서 D와 W를 모두 두 배로 하면 ID는 같다.", "correct": true, "explanation": "\\(\\frac{2\\,D}{\\left(2\\,W\\right)} = \\frac{D}{W}\\)로 비율이 유지된다. 같은 a,b를 쓰는 모형에서 ID와 예측 MT가 모두 같다."}], "source": "3장 교안 p.43 · 3장 교안 p.46–47", "explanation": [], "commonMistakes": []}, {"id": "MC111", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX121", "OX122", "OX123", "OX124", "OX125", "OX126"], "type": "multi", "stem": "개회로(Open loop)·폐회로(Closed loop) 운동제어와 범위 효과(Range effect)에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "Ballistic movement는 매 순간 시각 피드백으로 정밀 조정한다.", "correct": false, "explanation": "교안의 탄도 운동은 Open loop이며 사전 계획에 따른 빠른 실행이다."}, {"id": "o1", "text": "Positioning movement는 피드백을 이용하는 Closed loop다.", "correct": true, "explanation": "목표 근처에서 감각 피드백으로 오차를 교정한다."}, {"id": "o4", "text": "Range effect는 짧은 거리 Overshoot, 긴 거리 Undershoot다.", "correct": true, "explanation": "두 방향을 바꾸는 것이 대표적 오답 함정이다."}, {"id": "o3", "text": "숙련되면 상대적으로 Open loop 수행 비중이 커질 수 있다.", "correct": true, "explanation": "피드백을 매번 확인하는 의존이 줄어드는 방향으로 설명한다."}], "source": "3장 교안 p.50 · 3장 교안 p.50 · 정보처리 전사4 · 3장 교안 p.51", "explanation": [], "commonMistakes": []}, {"id": "MC112", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX128", "OX129", "OX131", "OX132", "OX133", "OX134", "OX135"], "type": "multi", "stem": "양립성에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "다이얼 이동과 바늘 이동 방향의 대응은 Movement compatibility다.", "correct": true, "explanation": "조작과 표시의 움직임 방향을 다룬다."}, {"id": "o1", "text": "화구와 노브의 배열 대응은 Spatial compatibility다.", "correct": true, "explanation": "화구와 노브의 물리적 위치·배열을 맞추는 문제이므로 Spatial이다. 색·기호의 의미 대응인 Conceptual과 구별한다."}, {"id": "o3", "text": "빨간색과 온수의 의미 연상은 Modality compatibility다.", "correct": false, "explanation": "색과 의미의 대응은 Conceptual compatibility다."}, {"id": "o4", "text": "음성 지시–음성 응답은 Modality compatibility의 예다.", "correct": true, "explanation": "자극·반응 양식의 대응이며 개념적 의미 일치와 구별한다."}], "source": "3장 교안 p.57 · 3장 교안 p.58 · 3장 교안 p.59 · 3장 교안 p.60 · 3장 교안 p.61 · 3장 교안 p.62", "explanation": [], "commonMistakes": []}, {"id": "MC113", "chapter": "기초통계·T검정", "conceptIds": ["OX144", "OX146", "OX148", "OX149", "OX150"], "type": "multi", "stem": "R 기초통계 코드에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "var(a)는 표본분산이며 분모는 \\(n - 1\\)이다.", "correct": true, "explanation": "R var는 편차제곱합을 \\(n - 1\\)로 나눈 표본분산이다. 모집단 전체의 분모 n을 사용한 값과 구별해야 한다."}, {"id": "o3", "text": "quantile(a)의 50% 값은 항상 mean(a)다.", "correct": false, "explanation": "50% 분위수는 median(a)이며 평균과 다를 수 있다."}, {"id": "o4", "text": "boxplot(a)의 수염 끝은 자료의 최솟값·최댓값이며, 별도 점으로 표시된 관측은 분석에서 제외된 값이다.", "correct": false, "explanation": "R 기본 상자그림은 IQR 기준 수염 밖 관측을 별도 점으로 표시할 수 있다. 그 점도 원자료의 관측이며 자동 제외된 것이 아니다."}, {"id": "o1", "text": "sort(a,decreasing=TRUE)[1]은 결측값 없는 비어 있지 않은 수치 벡터의 최댓값이다.", "correct": true, "explanation": "내림차순의 첫 원소다. 조건을 명시하여 결측값·빈 벡터 문제를 피했다."}], "source": "t-test 교안 p.3–4 · t-test 교안 p.3–6 · t-test 교안 p.7 · t-test 교안 p.8 · t-test 교안 p.8–9", "explanation": "R var는 편차제곱합을 \\(n - 1\\)로 나눈 표본분산이다. 모집단 전체의 분모 n을 사용한 값과 구별해야 한다. 내림차순의 첫 원소다. 조건을 명시하여 결측값·빈 벡터 문제를 피했다.", "commonMistakes": ["50% 분위수는 median(a)이며 평균과 다를 수 있다.", "R 기본 상자그림은 IQR 기준 수염 밖 관측을 별도 점으로 표시할 수 있다. 그 점도 원자료의 관측이며 자동 제외된 것이 아니다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC114", "chapter": "기초통계·T검정", "conceptIds": ["OX154", "OX155", "OX157", "OX159"], "type": "multi", "stem": "가설검정과 가정 점검에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o3", "text": "등분산 가정은 pooled t-검정과 관련되고 Welch는 등분산을 요구하지 않는다.", "correct": true, "explanation": "var.equal=TRUE인 방식과 R 기본 var.equal=FALSE를 구별한다."}, {"id": "o2", "text": "n≥20이라는 교안의 경험칙을 적용하면, 대응검정에서도 전후 차이 대신 각 시점의 정규성만 점검한다.", "correct": false, "explanation": "대응검정에서 관심 대상은 짝별 차이다. 표본 수 경험칙으로 검정 대상을 바꾸지 않는다."}, {"id": "o4", "text": "Levene p>.05이면 분산의 동일성이 검증된 것이므로, 두 집단의 표본분산도 같은 값으로 간주한다.", "correct": false, "explanation": "비기각은 동일성의 증명이 아니며 표본분산 값이 같다는 뜻도 아니다."}, {"id": "o1", "text": "Shapiro 검정 \\(p > 0.05\\) rect": true, "explanation": "물리적 단서는 도움을 주지만 경험 없이 기기의 용도·절차 이해가 보장되지는 않는다."}, {"id": "o2", "text": "Nokia 멀티탭 입력은 스마트폰 키보드에서 학습한 조작 기대와 달라, 초기 입력 지연·오류를 일으킬 수 있다.", "correct": true, "explanation": "이전 인터페이스 경험과 현재 조작 방식의 차이가 적응에 영향을 줄 수 있다."}, {"id": "o3", "text": "플로피의 삽입 방향을 화살표로 파악했다면, 같은 단서로 매체 용도와 데이터 저장 절차도 이해한 것으로 본다.", "correct": false, "explanation": "방향 단서의 해석과 매체의 정체·전체 절차 이해는 별개다. 한 조작의 성공으로 전체 심성모형을 확정하지 않는다."}, {"id": "o4", "text": "기기를 처음 접할 때의 기대와 과업 성공은, 현재 인터페이스와 이전에 축적된 기술 경험의 영향을 함께 받는다.", "correct": true, "explanation": "UX는 현재 화면만이 아니라 이전 경험과 맥락의 영향도 받는다."}], "source": "1-1 교안 p.2 · 1-2 교안 p.6 · 3장 교안 p.58–60 · 보충영상 PSY-L002", "explanation": "물리적 단서는 도움을 주지만 경험 없이 기기의 용도·절차 이해가 보장되지는 않는다. 이전 인터페이스 경험과 현재 조작 방식의 차이가 적응에 영향을 줄 수 있다. UX는 현재 화면만이 아니라 이전 경험과 맥락의 영향도 받는다.", "commonMistakes": ["방향 단서의 해석과 매체의 정체·전체 절차 이해는 별개다. 한 조작의 성공으로 전체 심성모형을 확정하지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>보충영상 2 · 자막에서 확인한 사례<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>구간<\/th><th>영상에서 확인한 사례<\/th><\/tr><\/thead><tbody><tr><td>00:20–03:20<\/td><td>VHS의 용도와 물리 매체 사용·보관을 낯설어한다.<\/td><\/tr><tr><td>03:37–05:42<\/td><td>Nokia 화면 터치와 음성 호출을 시도하고 숫자 키패드 문자 입력을 어려워한다.<\/td><\/tr><tr><td>06:04–07:24<\/td><td>플로피의 화살표로 삽입 용도는 추측하지만 매체의 정체는 바로 알지 못한다.<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC135", "chapter": "개론·역사", "conceptIds": ["OX013", "OX014", "OX020", "OX188"], "type": "case", "stem": "아래는 I Used 2000s Technology For a Week에서 확인한 사례다. 참가자는 iMac G4·초기 iPhone·폴더폰·PS2·iPod Nano 등을 사용했다. 이 경험을 현대 스마트폰 UX와 비교할 때 가장 타당한 분석은?", "options": [{"id": "o2", "text": "기기 부팅과 검색 결과 표시를 대표 과업의 성공으로 삼아, 연결 호환성과 영상 편집의 성공도 추정한다.", "correct": false, "explanation": "일부 과업의 성공은 다른 과업의 완료 가능성을 입증하지 않는다. 과업별로 확인해야 한다."}, {"id": "o1", "text": "연결·입력·저장 절차와 과업 완료를 평가하며, 특정 기기의 고장과 공통 설계 제약을 구분한다.", "correct": true, "explanation": "기능 보유 여부만으로 사용성이 결정되지 않는다. 실제 절차와 성공 여부, 실패 원인을 구분한다."}, {"id": "o3", "text": "촬영 기기의 고장으로 생긴 실패를 구형 인터페이스의 제약으로 분류하여, 같은 세대 기기에 일반화한다.", "correct": false, "explanation": "특정 기기의 고장과 설계 제약을 구별해야 한다. 표본 사례를 같은 세대 전부로 확장하지 않는다."}, {"id": "o4", "text": "게임 실행에 성공했으므로 저장 준비의 단계는 부수 조건으로 보고, 사용성 평가의 핵심 과업에서 제외한다.", "correct": false, "explanation": "저장 준비·메모리카드 같은 절차도 실제 과업 완료에 필요한 조건이므로 평가에 포함한다."}], "source": "1-2 교안 p.5–6, 8–11, 14 · 보충영상 PSY-L003", "explanation": "기능 보유 여부만으로 사용성이 결정되지 않는다. 실제 절차와 성공 여부, 실패 원인을 구분한다.", "commonMistakes": ["일부 과업의 성공은 다른 과업의 완료 가능성을 입증하지 않는다. 과업별로 확인해야 한다.", "특정 기기의 고장과 설계 제약을 구별해야 한다. 표본 사례를 같은 세대 전부로 확장하지 않는다.", "저장 준비·메모리카드 같은 절차도 실제 과업 완료에 필요한 조건이므로 평가에 포함한다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>보충영상 3 · 자막에서 확인한 사례<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>구간<\/th><th>영상에서 확인한 사례<\/th><\/tr><\/thead><tbody><tr><td>02:57–05:20<\/td><td>구형 iMac·초기 iPhone에서 검색은 되지만 연결·웹페이지 열기에 어려움을 겪는다.<\/td><\/tr><tr><td>05:23–07:27<\/td><td>PS2 게임 저장에 별도 메모리카드가 필요하며, 준비 후 게임을 즐긴다.<\/td><\/tr><tr><td>07:31–09:05<\/td><td>폴더폰의 문자 입력과 전화·폴더 열기 응답을 시험한다.<\/td><\/tr><tr><td>09:11–10:03<\/td><td>구형 iMac에서 영상 가져오기·편집이 느리지만 문서 작성은 사용한다.<\/td><\/tr><tr><td>10:05–11:32<\/td><td>폴더폰 충전 문제를 겪고 iPod Nano·PSP 등을 사용한다.<\/td><\/tr><tr><td>13:31–13:56<\/td><td>단계별 동영상 대신 최종 사진이 있는 요리책을 따라 조리한다.<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}]</script>

": "OX181", "chapter": "회귀·실험실습", "kind": "SRT/CRT bit 변환 · 기출", "source": "SRT/CRT 교안 p.1–3 · 실습 전사"}, {"id": "OX182", "chapter": "회귀·실험실습", "kind": "비유의 회귀 출력 해석", "source": "SRT/CRT 실습 전사"}, {"id": "OX183", "chapter": "회귀·실험실습", "kind": "실습 로그 규칙", "source": "Sternberg README · 로그"}, {"id": "OX184", "chapter": "회귀·실험실습", "kind": "Sternberg 로그 해석", "source": "Sternberg 로그 · 원문과 검증"}, {"id": "OX185", "chapter": "회귀·실험실습", "kind": "Sternberg 회귀 분리", "source": "SRT/CRT/Sternberg 실습 전사"}, {"id": "OX186", "chapter": "개론·역사", "kind": "Old computer · CLI vs GUI", "source": "1-2 교안 p.5 · 보충영상 PSY-L001"}, {"id": "OX187", "chapter": "개론·역사", "kind": "Gen Z Vs Old Tech · 세대 고정관념", "source": "1-2 교안 p.6 · 보충영상 PSY-L002"}, {"id": "OX188", "chapter": "개론·역사", "kind": "2000년대 기기 · 물리·인지 마찰", "source": "1-2 교안 p.5–6 · 보충영상 PSY-L003"}]</script>
<script>
'use strict';
const questions=JSON.parse(document.getElementById('questionData').textContent);
const concepts=JSON.parse(document.getElementById('conceptData').textContent);
const KEY='psych-midterm-multiple-v1', $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const validIds=new Set(questions.map(q=>q.id));
let retryIds=[];
let saved={answers:{},bookmarks:{},autoAdvance:false};
try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(v&&typeof v==='object')saved={...saved,...v}}catch(e){}
StudyRevisions.apply(KEY,saved,'multiple-choice');
for(const k of ['answers','bookmarks']){if(!saved[k]||typeof saved[k]!=='object'||Array.isArray(saved[k]))saved[k]={};for(const id of Object.keys(saved[k]))if(!validIds.has(id))delete saved[k][id]}
let mode='mixed',stateFilter='all',chapterFilter='all',cursor=0,filtered=[],selected=new Set(),advanceTimer=null,currentQuestionId=null;
const save=()=>{try{StudyRevisions.write(KEY,saved)}catch(e){$('#stats').textContent='저장 공간에 접근할 수 없어 이번 탭에서만 풀이가 유지됩니다.'}};
const retry=StudyRetry.create(saved,{keys:['answers'],persist:save});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seededShuffle(values,seed){const a=[...values];let x=seed>>>0;for(let i=a.length-1;i>0;i--){x^=x<<13;x^=x>>>17;x^=x<<5;const j=(x>>>0)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const mixed=seededShuffle(questions,20261017),chapters=[...new Set(concepts.map(c=>c.chapter))];
const covered=new Set(questions.flatMap(q=>q.conceptIds));
const coverageMissing=concepts.filter(c=>!covered.has(c.id)).map(c=>c.id);
window.MC_AUDIT={questionCount:questions.length,conceptCount:concepts.length,coveredConcepts:concepts.length-coverageMissing.length,coverageMissingAfterSupplement:coverageMissing.length,missingIds:coverageMissing,source:'embedded',chapterCounts:Object.fromEntries(chapters.map(c=>[c,questions.filter(q=>q.chapter===c).length]))};
function clearReviewUrl(){try{const url=new URL(location.href);for(const k of ['retry','retryWrong','review','question'])url.searchParams.delete(k);history.replaceState(null,'',url)}catch(e){}}
function updateStats(){const all=Object.values(retry.effective('answers')),correct=all.filter(a=>a.correct).length;$('#stats').textContent=`${questions.length}문항 · ${concepts.length-coverageMissing.length}/${concepts.length}개념 · 완료 ${all.length} · 정답 ${correct}`;$('#exitReviewBtn').hidden=!retryIds.length}
function closeChapters(){$('#chapterPopover').classList.remove('open');$('#chapterToggle').setAttribute('aria-expanded','false')}
function applyFilters(keepId){clearTimeout(advanceTimer);const source=mode==='mixed'?mixed:questions;
filtered=source.filter(q=>(!retryIds.length||retryIds.includes(q.id))&&(mode!=='multi'||q.type==='multi')&&(mode!=='single'||q.type==='single')&&(chapterFilter==='all'||q.chapter===chapterFilter)&&(retry.active||stateFilter==='all'||stateFilter==='unanswered'&&!saved.answers[q.id]||stateFilter==='wrong'&&saved.answers[q.id]&&!saved.answers[q.id].correct||stateFilter==='bookmarked'&&saved.bookmarks[q.id]));
const at=filtered.findIndex(q=>q.id===keepId);cursor=at>=0?at:0;
$$('.mode-tab').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});$$('.state-tab').forEach(b=>b.classList.toggle('active',b.dataset.state===stateFilter));$$('.chapter-chip').forEach(b=>b.classList.toggle('active',b.dataset.chapter===chapterFilter));$('#chapterToggle').textContent=(chapterFilter==='all'?'전체 단원':chapterFilter)+' ▾';render(true)}
function typeset(){window.StudyMath?.typeset($('#content'))}
function render(resetScroll=false){clearTimeout(advanceTimer);retry.refresh?.();retry.visit(filtered[cursor]?.id);updateStats();const q=filtered[cursor];$('#quizCard').hidden=!q;$('#quizCard').style.display=q?'flex':'none';$('#empty').classList.toggle('show',!q);if(!q)return;
const a=saved.answers[q.id];if(a)selected=new Set(a.selected);else if(currentQuestionId!==q.id)selected=new Set();currentQuestionId=q.id;$('#chapterBadge').textContent=q.chapter;$('#kindBadge').textContent=(q.type==='multi'?'복수선택':q.type==='case'?'사례형 · 단일선택':'단일선택')+(q.visual?' · 그림·표':'');$('#prompt').textContent=q.stem;$('#hint').textContent=q.type==='multi'?'옳은 보기를 모두 선택하고 선택 완료를 누르세요. · 1~4 / Enter':'가장 적절한 보기 하나를 고르세요. · 1~4 / ← →';$('#visual').innerHTML=q.visual||'';$('#bookmarkBtn').textContent=saved.bookmarks[q.id]?'★':'☆';$('#bookmarkBtn').classList.toggle('on',!!saved.bookmarks[q.id]);$('#bookmarkBtn').setAttribute('aria-pressed',String(!!saved.bookmarks[q.id]));
$('#options').innerHTML=q.options.map((o,i)=>`<button type="button" class="option ${a?(o.correct?(selected.has(o.id)?'correct':'missed'):(selected.has(o.id)?'wrong-selected':'')):''} ${selected.has(o.id)?'selected':''}" data-option="${o.id}" aria-pressed="${selected.has(o.id)}" ${a?'disabled':''}><span class="letter">${i+1}</span><span class="option-text">${esc(o.text)}</span>${a?`<span class="option-explain"><span class="truth ${o.correct?'o':'x'}">${o.correct?'✓ 정답 근거':'× 오답 이유'}</span> ${esc(o.explanation)}</span>`:''}</button>`).join('');
$('#source').innerHTML=a?`<strong>근거</strong> · ${esc(q.source)}<details><summary>개념 대응 · ${q.conceptIds.length}개</summary>${q.conceptIds.map(id=>{const c=concepts.find(c=>c.id===id);return esc(id+' · '+c.kind)}).join('<br>')}</details>`:'';
$('#resultBar').className='result-bar'+(a?' show '+(a.correct?'good':'bad'):'');$('#resultBar').textContent=a?(a.correct?'정답 · 모든 보기의 근거를 확인하세요.':'오답 · 정답: '+q.options.map((o,i)=>o.correct?i+1:null).filter(Boolean).join(', ')+'번. 각 보기의 해설을 확인하세요.'):' ';$('#retryBtn').hidden=!a&&!selected.size;if($('#retryCurrentTopBtn'))$('#retryCurrentTopBtn').disabled=!a&&!selected.size;$('#submitBtn').hidden=!!a;$('#submitBtn').disabled=!selected.size;$('#submitBtn').textContent='선택 완료';$('#prevBtn').disabled=cursor===0;$('#nextBtn').disabled=cursor>=filtered.length-1;$('#position').textContent=`${cursor+1} / ${filtered.length} · ${q.id}`;if(resetScroll)$('#content').scrollTop=0;typeset()}
function choose(id){const q=filtered[cursor];if(!q||saved.answers[q.id])return;if(q.type==='multi'){selected.has(id)?selected.delete(id):selected.add(id);$$('.option').forEach(b=>{b.classList.toggle('selected',selected.has(b.dataset.option));b.setAttribute('aria-pressed',String(selected.has(b.dataset.option)))});$('#submitBtn').disabled=!selected.size}else{selected=new Set([id]);submit()}}
function submit(){const q=filtered[cursor];if(!q||saved.answers[q.id]||!selected.size)return;const right=q.options.filter(o=>o.correct).map(o=>o.id);const correct=right.length===selected.size&&right.every(id=>selected.has(id));saved.answers[q.id]={selected:[...selected],correct};retry.mark(q.id);save();render();if(correct&&saved.autoAdvance&&cursor<filtered.length-1){const id=q.id;advanceTimer=setTimeout(()=>{if(filtered[cursor]?.id===id){cursor++;render(true)}},1800)}}
function move(delta){clearTimeout(advanceTimer);const i=cursor+delta;if(i>=0&&i<filtered.length){cursor=i;render(true)}}
function resetQuestions(){if(!confirm('모든 다지선다 답안과 정오 기록을 초기화할까요? 북마크와 O/X 기록은 유지됩니다.'))return;clearTimeout(advanceTimer);retry.discard();saved.answers={};selected.clear();retryIds=[];clearReviewUrl();save();stateFilter='all';applyFilters()}
$('#options').addEventListener('click',e=>{const b=e.target.closest('[data-option]');if(b)choose(b.dataset.option)});$('#submitBtn').addEventListener('click',submit);$('#resetBtn').addEventListener('click',resetQuestions);$('#retryBtn').addEventListener('click',()=>{clearTimeout(advanceTimer);const q=filtered[cursor];if(!q)return;delete saved.answers[q.id];retry.unmark(q.id);selected.clear();save();render()});$('#bookmarkBtn').addEventListener('click',()=>{const q=filtered[cursor];if(!q)return;saved.bookmarks[q.id]=!saved.bookmarks[q.id];save();render()});$('#prevBtn').addEventListener('click',()=>move(-1));$('#nextBtn').addEventListener('click',()=>move(1));$('#autoAdvance').checked=!!saved.autoAdvance;$('#autoAdvance').addEventListener('change',e=>{clearTimeout(advanceTimer);saved.autoAdvance=e.target.checked;save()});
$('#exitReviewBtn').addEventListener('click',()=>{retry.finish();retryIds=[];stateFilter='all';clearReviewUrl();save();applyFilters()});
$('#modeTabs').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;applyFilters()}});$('#stateTabs').addEventListener('click',e=>{const b=e.target.closest('[data-state]');if(b){if(b.dataset.state!=='wrong'){retry.finish();retryIds=[]}stateFilter=b.dataset.state;applyFilters()}});
$('#chapterGrid').innerHTML=['all',...chapters].map(c=>`<button type="button" class="chapter-chip" data-chapter="${c}">${c==='all'?'전체 단원':c}</button>`).join('');$('#chapterGrid').addEventListener('click',e=>{const b=e.target.closest('[data-chapter]');if(b){chapterFilter=b.dataset.chapter;closeChapters();applyFilters()}});$('#chapterToggle').addEventListener('click',()=>{const open=$('#chapterPopover').classList.toggle('open');$('#chapterToggle').setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('#chapterPopover,#chapterToggle'))closeChapters()});$('#showAllBtn').addEventListener('click',()=>{retry.finish();mode='mixed';stateFilter='all';chapterFilter='all';retryIds=[];clearReviewUrl();save();applyFilters()});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='Escape'){closeChapters();return}if($('#chapterPopover').classList.contains('open'))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(/^[1-4]$/.test(e.key)){const o=filtered[cursor]?.options[Number(e.key)-1];if(o){e.preventDefault();choose(o.id)}}if(e.key==='Enter'&&(document.activeElement?.tagName!=='BUTTON'||document.activeElement?.classList.contains('option'))){e.preventDefault();submit()}});
function compareSource(){try{const source=$('#coverageSource').contentWindow.OX_ITEMS;if(!Array.isArray(source))return;const liveIds=new Set(source.map(c=>c.id));const missing=source.filter(c=>!covered.has(c.id)).map(c=>c.id);window.MC_AUDIT.source='ox/index.html';window.MC_AUDIT.sourceConceptCount=source.length;window.MC_AUDIT.coverageMissingAfterSupplement=missing.length;window.MC_AUDIT.missingIds=missing;window.MC_AUDIT.snapshotMismatch=source.length!==concepts.length||concepts.some(c=>!liveIds.has(c.id));if(missing.length||window.MC_AUDIT.snapshotMismatch)$('#stats').textContent='개념 목록이 변경되었습니다. 개념 대응표를 다시 검증해 주세요.'}catch(e){/* file://에서는 검증된 내장 목록으로 동작 */}}
$('#coverageSource').addEventListener('load',compareSource);compareSource();
function startWrongRetry(ids){
 retry.finish();const wrongIds=questions.filter(q=>saved.answers[q.id]&&!saved.answers[q.id].correct).map(q=>q.id);
 retry.start(ids?wrongIds.filter(id=>ids.includes(id)):wrongIds);retryIds=retry.ids;mode='mixed';stateFilter='wrong';chapterFilter='all';selected.clear();currentQuestionId=null;clearReviewUrl();applyFilters();
}
retry.mount({before:$('#quizCard'),onStart:()=>startWrongRetry(),onExit:()=>{retryIds=[];mode='mixed';stateFilter='all';chapterFilter='all';clearReviewUrl();save();applyFilters()},isCorrect:id=>saved.answers[id]?.correct,visible:()=>stateFilter==='wrong',tab:$('#stateTabs [data-state=wrong]')});
const params=new URLSearchParams(location.search);
if(params.get('review')==='wrong')stateFilter='wrong';
const requested=(params.get('retry')||'').split(',').filter(id=>validIds.has(id));
if(!retry.active&&(requested.length||params.get('retryWrong')==='1'))startWrongRetry(requested.length?requested:undefined);
retryIds=retry.ids;if(retry.active){stateFilter='wrong';clearReviewUrl()}
const initialId=retry.cursor||params.get('question');if(initialId&&!retry.active){mode='single';const q=questions.find(q=>q.id===initialId);if(q?.type!=='single')mode=q?.type==='multi'?'multi':'mixed'}applyFilters(initialId);
window.addEventListener('pageshow',()=>{compareSource()});
</script></body></html>
