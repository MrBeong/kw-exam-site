><table><thead><tr><th>부위<\/th><th>forearm<\/th><th>wrist<\/th><th>finger<\/th><\/tr><\/thead><tbody><tr><td>b (ms/bit)<\/td><td>105<\/td><td>43<\/td><td>26<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "explanation": "b·ID의 추가 시간은 기울기에 비례한다. 같은 a와 양의 ID에서 26<43<105 순이다.", "commonMistakes": ["시간/bit 기울기를 처리속도로 읽어 방향을 뒤바꾸었다.", "작은 b는 1 bit당 더 짧은 추가 시간을 뜻한다. 역수 처리율과 혼동했다.", "b가 서로 다르므로 b·ID도 다르다. 제시 조건은 절편도 같다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC068", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX121", "OX122", "OX123"], "type": "single", "stem": "작은 아이콘을 향해 빠르게 이동한 뒤 목표 주변에서 눈으로 확인하며 미세 조정한다. 두 구간의 제어를 순서대로 고르면?", "options": [{"id": "o3", "text": "Ballistic·Closed loop → Positioning·Open loop", "correct": false, "explanation": "운동 명칭과 피드백 유무의 연결이 반대다."}, {"id": "o2", "text": "Positioning·Closed loop → Ballistic·Open loop", "correct": false, "explanation": "목표 근처의 미세 조정은 폐회로이며 초기 빠른 이동과 순서가 바뀌었다."}, {"id": "o1", "text": "Ballistic·Open loop → Positioning·Closed loop", "correct": true, "explanation": "초기 primary travel은 미리 계획한 빠른 이동, secondary travel은 감각 피드백을 이용한 오차 교정으로 설명한다."}, {"id": "o4", "text": "Positioning·Open loop → Ballistic·Closed loop", "correct": false, "explanation": "두 명칭 모두 해당 제어 방식과 잘못 연결되었다."}], "source": "3장 교안 p.50 · 3장 교안 p.50 · 정보처리 전사4", "explanation": [], "commonMistakes": []}, {"id": "MC069", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX124"], "type": "single", "stem": "반복 연습(Practice)을 통해 동작이 숙련된 후 시각 피드백을 매 순간 덜 확인하면서도 빠르게 동작을 수행하게 되는 운동제어 변화(개회로 Open loop vs. 폐회로 Closed loop)를 가장 적절하게 설명한 것은?", "options": [{"id": "o2", "text": "반복 학습으로 피드백 이용이 늘어, 같은 과업에서 폐회로 수행의 비중이 커진다.", "correct": false, "explanation": "제시한 덜 확인하면서 빨라지는 변화의 방향을 반대로 설명했다."}, {"id": "o4", "text": "반복 학습으로 피드백 사용은 줄지만, 개회로 실행 중의 오차를 폐회로처럼 계속 교정한다.", "correct": false, "explanation": "개회로와 폐회로의 정의를 혼합했다. 실행 중 피드백 교정은 폐회로의 특징이다."}, {"id": "o3", "text": "반복 학습으로 피드백 검토 시간이 길어지며, 정확성 향상을 위해 움직임이 느려진다.", "correct": false, "explanation": "제시된 수행 속도와 피드백 이용 변화에 맞지 않는다. 속도–정확성 교환을 숙련 효과로 바꾸어 해석했다."}, {"id": "o1", "text": "반복 학습으로 피드백 의존이 줄어, 같은 과업에서 개회로 수행의 비중이 커진다.", "correct": true, "explanation": "숙련으로 계획된 빠른 수행이 늘 수 있으나 미세 조정에서 피드백의 역할이 없어지는 것은 아니다."}], "source": "3장 교안 p.51", "explanation": "숙련으로 계획된 빠른 수행이 늘 수 있으나 미세 조정에서 피드백의 역할이 없어지는 것은 아니다.", "commonMistakes": ["제시한 덜 확인하면서 빨라지는 변화의 방향을 반대로 설명했다.", "개회로와 폐회로의 정의를 혼합했다. 실행 중 피드백 교정은 폐회로의 특징이다.", "제시된 수행 속도와 피드백 이용 변화에 맞지 않는다. 속도–정확성 교환을 숙련 효과로 바꾸어 해석했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC070", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX125", "OX126"], "type": "single", "stem": "운동 제어의 범위 효과(Range effect)에서 표적까지의 이동거리가 짧은 경우(short distance)와 긴 경우(long distance)에 나타나는 대표적 도달 오차 경향을 순서대로 고르면?", "options": [{"id": "o1", "text": "Overshoot / Undershoot", "correct": true, "explanation": "짧은 거리는 목표를 지나치고, 긴 거리는 목표에 못 미치는 경향으로 설명된다. 거리의 양 극단을 중앙 쪽으로 회귀시키는 오차다."}, {"id": "o2", "text": "Undershoot / Overshoot", "correct": false, "explanation": "짧은 거리와 긴 거리에서의 경향이 반대다."}, {"id": "o3", "text": "Overshoot / Overshoot", "correct": false, "explanation": "긴 거리의 대표적 경향은 Undershoot다."}, {"id": "o4", "text": "Undershoot / Undershoot", "correct": false, "explanation": "짧은 거리의 대표적 경향은 Overshoot다."}], "source": "3장 교안 p.51", "explanation": [], "commonMistakes": []}, {"id": "MC071", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX127"], "type": "single", "stem": "가상현실(VR) 손가락 선택 실험에서 (가) 시각적으로 두드러진 빨간 버튼을 곧바로 누르는 과업(Stimulus-based)과 (나) 지시문을 읽고 해당 기능 버튼을 찾아 누르는 과업(Goal-based)의 제시한 첫 속도 정점·최대 속도 정점의 시각을 비교한 해석으로 옳은 것은?", "options": [{"id": "o2", "text": "(가)의 최대 정점이 더 늦고, 첫 정점부터 최대 정점까지의 시각 차이도 더 크다.", "correct": false, "explanation": "두 과업을 뒤바꾸었다. 최대 정점과 두 정점의 차이는 (나)가 더 크다."}, {"id": "o4", "text": "(나)의 최대 정점이 늦으므로, 그 정점에서의 속도 크기도 (가)보다 더 크다고 판정한다.", "correct": false, "explanation": "정점이 나타나는 시각과 정점의 속도 크기는 다르다. 시각 비교로 속도 크기를 확정하지 않는다."}, {"id": "o1", "text": "(나)의 최대 정점이 더 늦고, 첫 정점부터 최대 정점까지의 시각 차이도 더 크다.", "correct": true, "explanation": "(나)는 0.16→1.26 s로 차이가 1.10 s이며, (가)는 0.20→0.33 s로 차이가 0.13 s다."}, {"id": "o3", "text": "(나)의 첫 정점이 더 빠르므로, 최대 정점의 도달 시각도 (가)보다 더 빠르다.", "correct": false, "explanation": "첫 정점은 (나)가 빠르지만 최대 정점은 (나)가 더 늦다. 서로 다른 지표를 혼동했다."}], "source": "3장 교안 p.53–56", "explanation": "(나)는 0.16→1.26 s로 차이가 1.10 s이며, (가)는 0.20→0.33 s로 차이가 0.13 s다.", "commonMistakes": ["두 과업을 뒤바꾸었다. 최대 정점과 두 정점의 차이는 (나)가 더 크다.", "정점이 나타나는 시각과 정점의 속도 크기는 다르다. 시각 비교로 속도 크기를 확정하지 않는다.", "첫 정점은 (나)가 빠르지만 최대 정점은 (나)가 더 늦다. 서로 다른 지표를 혼동했다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>두 VR 선택 과업의 속도 정점 · 정보처리 교안 p.56<\/figcaption><a href=\"../assets/question-data/information-processing-p56.png\" target=\"_blank\" rel=\"noopener\"><img src=\"../assets/question-data/information-processing-p56.png\" alt=\"두 VR 선택 과업의 속도 정점 · 정보처리 교안 p.56\" loading=\"lazy\"><\/a><p class=\"analysis-note\">(가) Stimulus-based: 빨간 버튼 선택. (나) Goal-based: 지시문의 기능에 해당하는 버튼 선택. 가로축은 시간(s), 세로축은 정점 속도(m/s)다. 처음 정점과 최대 정점은 서로 다른 지표이며 후반 정점의 시각·크기를 구분해서 읽는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC072", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX128", "OX129", "OX130"], "type": "single", "stem": "처음 보는 장치의 손잡이가 당기기를 유도하고, 조작 결과도 사용자의 공통 기대와 맞는다. 관련 개념을 올바르게 설명한 것은?", "options": [{"id": "o1", "text": "손잡이 형태의 당김 유도는 Affordance, 조작–표시의 집단 공통 기대는 Population stereotype이다.", "correct": true, "explanation": "물리적 성질이 유도하는 행동과 집단이 학습한 공통 기대를 구분한다."}, {"id": "o3", "text": "두 사례 모두 Affordance이며, 조작 결과에 대한 기대는 집단 경험보다 장치의 형태에서 정해진다.", "correct": false, "explanation": "기대는 집단 경험의 영향을 받는다. 형태가 주는 행동 유도와 같은 개념으로 묶을 수 없다."}, {"id": "o2", "text": "손잡이 형태의 당김 유도는 Population stereotype, 조작–표시의 집단 공통 기대는 Affordance다.", "correct": false, "explanation": "두 개념의 정의를 바꾸었다. 공통 기대는 집단 고정관념이다."}, {"id": "o4", "text": "두 사례 모두 Population stereotype이며, 처음 보는 형태의 유도 효과도 집단 기대와 같은 성질이다.", "correct": false, "explanation": "형태의 행동 유도와 학습된 공통 기대를 구별해야 한다. 두 현상에 같은 이름을 붙이지 않는다."}], "source": "3장 교안 p.57", "explanation": "물리적 성질이 유도하는 행동과 집단이 학습한 공통 기대를 구분한다.", "commonMistakes": ["기대는 집단 경험의 영향을 받는다. 형태가 주는 행동 유도와 같은 개념으로 묶을 수 없다.", "두 개념의 정의를 바꾸었다. 공통 기대는 집단 고정관념이다.", "형태의 행동 유도와 학습된 공통 기대를 구별해야 한다. 두 현상에 같은 이름을 붙이지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC073", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX131", "OX132", "OX133", "OX134"], "type": "single", "stem": "(가) 화구와 노브 배열 일치 (나) 다이얼·바늘 이동 방향 일치 (다) 온수에 빨강 (라) 음성 지시에 같은 음성으로 응답. 양립성 유형을 순서대로 고르면?", "options": [{"id": "o1", "text": "Spatial / Movement / Conceptual / Modality", "correct": true, "explanation": "배열, 이동, 의미 연상, 자극–반응 양식의 구분이다. 교안의 음성 “왼손” 사례에서는 말하기를 손 들기보다 양식 일치로 설명한다."}, {"id": "o2", "text": "Conceptual / Spatial / Movement / Modality", "correct": false, "explanation": "앞의 세 사례는 각각 물리 배치·방향·의미 코드이므로 연결이 다르다."}, {"id": "o4", "text": "Movement / Spatial / Conceptual / Modality", "correct": false, "explanation": "배열 일치는 Spatial, 움직임 방향 일치는 Movement다."}, {"id": "o3", "text": "Spatial / Conceptual / Modality / Movement", "correct": false, "explanation": "(나)는 방향, (다)는 색의 의미, (라)는 양식의 대응을 묻는다."}], "source": "3장 교안 p.58 · 3장 교안 p.59 · 3장 교안 p.60 · 3장 교안 p.61", "explanation": [], "commonMistakes": []}, {"id": "MC074", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX135", "OX136"], "type": "single", "stem": "한국에서는 이름·간판에 빨간색을 기피하지만 중국에서는 행운의 색으로 선호하고, 한국에서도 일반인은 빨간색을 위험으로 보지만 주식 투자자는 주가 상승의 색으로 선호한다. 이 사례들이 개념 양립성(Conceptual compatibility) 설계에 주는 시사점으로 가장 적절한 것은?", "options": [{"id": "o2", "text": "국가별 의미를 확인하면 같은 국가의 사용자는 경험과 관계없이 같은 색 해석을 한다고 본다.", "correct": false, "explanation": "국내 일반인과 투자자의 차이는 국가 구분만으로 경험 차이를 설명할 수 없음을 보인다."}, {"id": "o3", "text": "투자 경험별 의미를 확인하면 국가별 문화 차이는 같은 학습 효과로 간주해 따로 조사하지 않는다.", "correct": false, "explanation": "사례에는 문화 차이와 경험 차이가 함께 있다. 하나를 조사했다고 다른 차원이 해소되지 않는다."}, {"id": "o4", "text": "색의 의미가 집단마다 다르므로 의미 연상보다 화구·노브처럼 공간 배열을 맞추는 문제로 다룬다.", "correct": false, "explanation": "색의 의미 연상은 개념 양립성이다. 공간 양립성으로 범주를 바꾸는 것으로 해결되지 않는다."}, {"id": "o1", "text": "집단별 문화·학습 경험이 색의 의미 연상에 영향을 주므로 대상 집단에서 의미를 확인한다.", "correct": true, "explanation": "개념 양립성의 의미 연상은 문화와 경험에 의존할 수 있다. 특정 집단 사례를 모든 개인에게 단정하지 않는다."}], "source": "3장 교안 p.62", "explanation": "개념 양립성의 의미 연상은 문화와 경험에 의존할 수 있다. 특정 집단 사례를 모든 개인에게 단정하지 않는다.", "commonMistakes": ["국내 일반인과 투자자의 차이는 국가 구분만으로 경험 차이를 설명할 수 없음을 보인다.", "사례에는 문화 차이와 경험 차이가 함께 있다. 하나를 조사했다고 다른 차원이 해소되지 않는다.", "색의 의미 연상은 개념 양립성이다. 공간 양립성으로 범주를 바꾸는 것으로 해결되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC075", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX137"], "type": "single", "stem": "아래 VR 틸트 연구의 지각 과업(perception task) 그래프를 읽으시오. Incompatible에서 Compatible로 바뀔 때의 평균값 방향과 유의성 표시를 올바르게 설명한 것은? Accuracy(AE)는 절대 각도오차다.", "options": [{"id": "o2", "text": "Compatible에서 AE↑·RT↓·자신감↑이며, 유의성 별표는 자신감 비교에 있다.", "correct": false, "explanation": "별표 위치는 같아도 RT와 자신감의 평균 방향을 뒤바꾸었다."}, {"id": "o1", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, 유의성 별표는 자신감 비교에 있다.", "correct": true, "explanation": "도표의 평균 방향은 AE와 RT 증가, 자신감 감소다. 별표는 자신감 비교에 표시돼 있다."}, {"id": "o4", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, SE 막대의 겹침은 평균 차이의 부재를 입증한다.", "correct": false, "explanation": "SE 막대의 겹침만으로 평균이 같거나 유의차가 없다고 입증할 수 없다."}, {"id": "o3", "text": "Compatible에서 AE↑·RT↑·자신감↓이며, AE 증가는 정확성 향상을 나타낸다.", "correct": false, "explanation": "AE는 절대오차이므로 증가가 정확성 향상을 뜻하지 않는다."}], "source": "3장 교안 p.65–66 · p.66 Fig.7 원그림과 지표 정의 대조", "explanation": "도표의 평균 방향은 AE와 RT 증가, 자신감 감소다. 별표는 자신감 비교에 표시돼 있다.", "commonMistakes": ["별표 위치는 같아도 RT와 자신감의 평균 방향을 뒤바꾸었다.", "SE 막대의 겹침만으로 평균이 같거나 유의차가 없다고 입증할 수 없다.", "AE는 절대오차이므로 증가가 정확성 향상을 뜻하지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>VR 틸트 연구의 지각 과업(perception task) 결과 · 교안 p.66<\/figcaption><a href=\"../assets/question-data/information-processing-p66.png\" target=\"_blank\" rel=\"noopener\"><img src=\"../assets/question-data/information-processing-p66.png\" alt=\"VR 틸트 연구의 지각 과업(perception task) 결과 · 교안 p.66\" loading=\"lazy\"><\/a><p class=\"analysis-note\">Compatible/ Incompatible은 몸과 보이는 패널의 기울임 방향의 일치/불일치다. Accuracy(AE)는 절대 각도오차이므로 작은 값이 더 정확하다. 오차막대는 SE, 별표는 해당 비교에서 p&lt;.05다. 이 도표를 레버 수동 조작 과업의 결과로 바꾸어 읽지 않는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC076", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX138"], "type": "single", "stem": "3D VR Fitts 보충논문에서 참가자 23명, 확장 모형 \\(R^{2} = 0.645\\)였다. 이 결과의 적절한 해석은?", "options": [{"id": "o3", "text": "MT와 개별 설명변수의 상관계수가 0.645라는 값이며, 각 변수의 관계 강도를 동일하게 해석한다.", "correct": false, "explanation": "모형 전체의 R²와 각 설명변수의 상관계수는 다르다. 확장 모형의 개별 상관을 이 값에서 얻을 수 없다."}, {"id": "o1", "text": "연구 표본에서 MT 변동의 64.5%를 설명한 값이며, 다른 표본의 예측 성능은 별도로 확인한다.", "correct": true, "explanation": "결정계수는 해당 자료의 설명력이다. 23명 연구 결과를 외부 표본의 성능 보장으로 바꾸지 않는다."}, {"id": "o4", "text": "MT의 단위를 ms에서 s로 바꾸면 R²도 1,000으로 나뉘어, 같은 자료의 설명력이 0.0645%가 된다.", "correct": false, "explanation": "R²는 제곱합의 비율이다. 결과변수를 같은 비율로 바꾸면 분자·분모가 함께 변해 설명력은 유지된다."}, {"id": "o2", "text": "연구 표본에서 MT 예측의 정답률이 64.5%라는 값이며, 다른 표본에도 같은 정답률을 적용한다.", "correct": false, "explanation": "결정계수를 분류 정답률로 읽었고 외부 표본으로 성능을 그대로 일반화했다."}], "source": "4주차 논문 · 피츠 전사", "stemPlain": "3D VR Fitts 보충논문에서 참가자 23명, 확장 모형 \\(R^{2} = 0.645\\)였다. 이 결과의 적절한 해석은?", "explanation": "결정계수는 해당 자료의 설명력이다. 23명 연구 결과를 외부 표본의 성능 보장으로 바꾸지 않는다.", "commonMistakes": ["모형 전체의 R²와 각 설명변수의 상관계수는 다르다. 확장 모형의 개별 상관을 이 값에서 얻을 수 없다.", "R²는 제곱합의 비율이다. 결과변수를 같은 비율로 바꾸면 분자·분모가 함께 변해 설명력은 유지된다.", "결정계수를 분류 정답률로 읽었고 외부 표본으로 성능을 그대로 일반화했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC077", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX140"], "type": "single", "stem": "자주 쓰는 메뉴를 화면 모서리에 두는 Fitts 설계의 근거는? 포인터가 화면 밖으로 넘어가지 않는 환경을 가정한다.", "options": [{"id": "o4", "text": "경계의 이점은 이동거리를 줄이는 데 있으므로, 표적 너비와 포인터 제약은 예측에서 제외한다.", "correct": false, "explanation": "Fitts 예측은 거리와 너비에 관계되며 이 사례의 이점은 경계 제약과 유효 너비다."}, {"id": "o1", "text": "경계가 포인터의 지나침을 제한하므로, 접근 방향에서 유효 표적 너비가 커질 수 있다.", "correct": true, "explanation": "포인터가 경계를 넘지 못하는 조건에서 모서리는 포착 가능한 유효 너비를 키울 수 있다."}, {"id": "o2", "text": "메뉴 위치가 바뀌어 선택 대안 수가 줄어드므로, Hick의 선택 정보량이 작아진다.", "correct": false, "explanation": "위치 "correct": false, "explanation": "표본 수나 비기각만으로 이상치·분포 문제를 무시할 수 없다."}], "source": "t-test 교안 p.13, 18, 23 · t-test 교안 p.13, 17", "stemPlain": "\\(n = 20\\)인 표본의 Shapiro–Wilk 검정에서 \\(p = 0.08\\)이었다. \\(\\alpha = 0.05\\)에서 가장 정확한 해석은?", "explanation": "p=.08>.05이므로 비기각이다. 비기각과 가정의 증명은 다르며 표본 크기만으로 분포가 정해지지 않는다.", "commonMistakes": ["p값은 가설의 사후확률이 아니다. 1-p를 정규성의 참일 확률로 읽을 수 없다.", "판정 방향과 p값의 의미를 모두 바꾸었다. 유의수준 .05에서는 비기각이다.", "표본 수나 비기각만으로 이상치·분포 문제를 무시할 수 없다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>정규성 검정 결과<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">대상<\/th><th scope=\"col\">검정<\/th><th scope=\"col\">n<\/th><th scope=\"col\">p-value<\/th><th scope=\"col\">α<\/th><\/tr><\/thead><tbody><tr><td>수치형 측정값<\/td><td>Shapiro–Wilk<\/td><td>20<\/td><td>0.08<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC084", "chapter": "기초통계·T검정", "conceptIds": ["OX156"], "type": "single", "stem": "데이터 datat에서 group이 \"Deagu\"인 행의 height 평균이 150인지 검정하고 \\(p = 0.001169\\)를 얻었다. 올바른 코드·해석은?", "options": [{"id": "o4", "text": "t.test(datat$height, mu=150); Deagu 집단 평균 150의 H₀를 기각", "correct": false, "explanation": "코드가 모든 집단의 키를 합친 벡터를 사용한다. Deagu만의 검정 결과라고 해석할 수 없다."}, {"id": "o1", "text": "t.test(datat$height[datat$group==\"Deagu\"], mu=150); 평균 150의 H₀를 기각", "correct": true, "explanation": "요구 집단의 수치 벡터를 추출해 기준값 150과 비교했다. 제시 p값은 .05보다 작다."}, {"id": "o3", "text": "t.test(datat$height[datat$group==\"Deagu\"], mu=150); 평균 150의 H₀를 비기각", "correct": false, "explanation": "코드는 맞지만 제시된 p=.001169에서의 판정을 반대로 했다."}, {"id": "o2", "text": "t.test(datat$height[datat$group==\"Deagu\"], mu=0); 평균 150의 H₀를 기각", "correct": false, "explanation": "선택 집단은 맞지만 코드의 귀무 기준은 0이다. 문제의 150과 다르다."}], "source": "t-test 교안 p.14", "stemPlain": "데이터 datat에서 group이 \"Deagu\"인 행의 height 평균이 150인지 검정하고 \\(p = 0.001169\\)를 얻었다. 올바른 코드·해석은?", "explanation": "요구 집단의 수치 벡터를 추출해 기준값 150과 비교했다. 제시 p값은 .05보다 작다.", "commonMistakes": ["코드가 모든 집단의 키를 합친 벡터를 사용한다. Deagu만의 검정 결과라고 해석할 수 없다.", "코드는 맞지만 제시된 p=.001169에서의 판정을 반대로 했다.", "선택 집단은 맞지만 코드의 귀무 기준은 0이다. 문제의 150과 다르다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>단일표본 양측 t-검정 · 수업 제시 출력<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">값<\/th><\/tr><\/thead><tbody><tr><td>자료 구조<\/td><td>datat: group(집단), height(키·cm)<\/td><\/tr><tr><td>분석 대상<\/td><td>group == &quot;Deagu&quot;인 20명<\/td><\/tr><tr><td>기준 모평균 μ₀<\/td><td>150 cm<\/td><\/tr><tr><td>표본평균<\/td><td>156.1165 cm<\/td><\/tr><tr><td>t / df<\/td><td>3.8148 / 19<\/td><\/tr><tr><td>p-value / α<\/td><td>0.001169 / 0.05<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC085", "chapter": "기초통계·T검정", "conceptIds": ["OX157", "OX158", "OX159", "OX160"], "type": "single", "stem": "데이터프레임 datat의 두 독립 집단(group) 간 키(height) 평균을 비교하기 위해 집단별 정규성을 확인한 뒤 Levene 등분산 검정을 수행한 결과 \\(p = 0.1742\\)였다. 유의수준 \\(\\alpha = 0.05\\)에서 등분산 가정형(pooled) 독립표본 t-검정을 진행하는 올바른 다음 단계는?", "options": [{"id": "o2", "text": "Levene H₀ 기각; t.test(height ~ group, data=datat, var.equal=TRUE)", "correct": false, "explanation": "t 코드가 pooled여도 Levene의 판정을 반대로 했다. 유의수준 .05에서는 비기각이다."}, {"id": "o3", "text": "Levene H₀ 비기각; t.test(height ~ group, data=datat, var.equal=FALSE)", "correct": false, "explanation": "Welch는 가능한 별도 방법이지만 문제에서 요청한 등분산 가정형은 아니다. pooled는 var.equal=TRUE다."}, {"id": "o1", "text": "Levene H₀ 비기각; t.test(height ~ group, data=datat, var.equal=TRUE)", "correct": true, "explanation": "p=.1742>.05에서 등분산을 기각하지 않으며 요구한 pooled 방식의 인자는 TRUE다. 분산의 동일성을 증명한 것은 아니다."}, {"id": "o4", "text": "Levene H₀ 비기각; t.test(height ~ group, data=datat, var.equal=TRUE, mu=150)", "correct": false, "explanation": "독립 두 집단 차이의 기본 귀무 기준 0 대신 차이 150을 넣었다. 한 집단의 기준 평균과 두 집단 평균차를 혼동했다."}], "source": "t-test 교안 p.15, 17–19 · t-test 교안 p.19 · t-test 교안 p.19–20 · t-test 교안 p.20", "stemPlain": "데이터프레임 datat의 두 독립 집단(group) 간 키(height) 평균을 비교하기 위해 집단별 정규성을 확인한 뒤 Levene 등분산 검정을 수행한 결과 \\(p = 0.1742\\)였다. 유의수준 \\(\\alpha = 0.05\\)에서 등분산 가정형(pooled) 독립표본 t-검정을 진행하는 올바른 다음 단계는?", "explanation": "p=.1742>.05에서 등분산을 기각하지 않으며 요구한 pooled 방식의 인자는 TRUE다. 분산의 동일성을 증명한 것은 아니다.", "commonMistakes": ["t 코드가 pooled여도 Levene의 판정을 반대로 했다. 유의수준 .05에서는 비기각이다.", "Welch는 가능한 별도 방법이지만 문제에서 요청한 등분산 가정형은 아니다. pooled는 var.equal=TRUE다.", "독립 두 집단 차이의 기본 귀무 기준 0 대신 차이 150을 넣었다. 한 집단의 기준 평균과 두 집단 평균차를 혼동했다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>독립 두 집단 · 분석 조건과 사전 검정<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">조건·출력<\/th><\/tr><\/thead><tbody><tr><td>자료 구조<\/td><td>datat: height(키·cm), group(Deagu/Seoul)<\/td><\/tr><tr><td>표본 구조<\/td><td>서로 독립인 두 집단, 결측값 없음<\/td><\/tr><tr><td>정규성 점검<\/td><td>각 집단에서 Shapiro–Wilk 검정 비기각<\/td><\/tr><tr><td>평균 중심 Levene p-value<\/td><td>0.1742<\/td><\/tr><tr><td>α<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div><p class=\"analysis-note\">문항은 교안의 등분산 가정형 절차를 요청한다. 원자료 값 자체의 계산이 아닌 다음 분석 코드와 판정을 묻는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC086", "chapter": "기초통계·T검정", "conceptIds": ["OX161", "OX162"], "type": "single", "stem": "d=after-before를 만들어 shapiro.test(d)를 점검한 뒤 t.test(d)의 결과가 평균 -33.65, \\(t = -7.6951\\), \\(p = 2.97 \\times 10^{-7}\\)이었다. 해석은?", "options": [{"id": "o4", "text": "전후 자료가 별도 시점이므로 독립표본 검정을 적용하고, 음수 차이를 두 집단의 평균차로 해석한다.", "correct": false, "explanation": "같은 사람의 전후 자료는 짝을 유지한다. 시점이 달라도 독립된 두 표본으로 바뀌지 않는다."}, {"id": "o1", "text": "평균차 0을 기각하며, after-before가 음수이므로 이 표본의 사후 수행시간이 더 짧다.", "correct": true, "explanation": "제시 자료의 단위는 ms다. 음수 차이는 after가 더 작음을 뜻하며 작은 p값에서 평균차 0을 기각한다."}, {"id": "o3", "text": "평균차 0을 기각하지 못하며, 음수 평균차는 짝별 차이가 서로 상쇄된 결과로 해석한다.", "correct": false, "explanation": "제시된 매우 작은 p값과 맞지 않는다. 평균차 0을 기각해야 한다."}, {"id": "o2", "text": "평균차 0을 기각하며, after-before가 음수이므로 이 표본의 사후 수행시간이 더 길다.", "correct": false, "explanation": "평균차의 정의와 방향을 반대로 해석했다. 음수이면 after의 수행시간이 더 짧다."}], "source": "t-test 교안 p.21, 23 · t-test 교안 p.24", "stemPlain": "d=after-before를 만들어 shapiro.test(d)를 점검한 뒤 t.test(d)의 결과가 평균 -33.65, \\(t = -7.6951\\), \\(p = 2.97 \\times 10^{-7}\\)이었다. 해석은?", "explanation": "제시 자료의 단위는 ms다. 음수 차이는 after가 더 작음을 뜻하며 작은 p값에서 평균차 0을 기각한다.", "commonMistakes": ["같은 사람의 전후 자료는 짝을 유지한다. 시점이 달라도 독립된 두 표본으로 바뀌지 않는다.", "제시된 매우 작은 p값과 맞지 않는다. 평균차 0을 기각해야 한다.", "평균차의 정의와 방향을 반대로 해석했다. 음수이면 after의 수행시간이 더 짧다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>대응 차이의 단일표본 양측 t-검정 · 수업 제시 출력<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">값<\/th><\/tr><\/thead><tbody><tr><td>자료 구조<\/td><td>같은 사람의 before·after가 같은 행, 20쌍<\/td><\/tr><tr><td>분석 벡터 d<\/td><td>after - before (ms)<\/td><\/tr><tr><td>차이 정규성<\/td><td>차이 벡터에 Shapiro–Wilk 적용<\/td><\/tr><tr><td>귀무 기준 μd<\/td><td>0 ms<\/td><\/tr><tr><td>표본 평균차<\/td><td>-33.65 ms<\/td><\/tr><tr><td>t / df<\/td><td>-7.6951 / 19<\/td><\/tr><tr><td>p-value / α<\/td><td>2.97 × 10⁻⁷ / 0.05<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC087", "chapter": "회귀·실험실습", "conceptIds": ["OX164", "OX165", "OX168"], "type": "single", "stem": "적성점수 x로 업무만족도 y를 예측하려 한다. 상관·회귀의 구분과 시작 절차로 적절한 것은?", "options": [{"id": "o3", "text": "상관은 단위에 따른 공변화를 직접 나타내고, 회귀 기울기는 두 변수의 단위를 없앤 표준 지표다.", "correct": false, "explanation": "단위에 따른 공분산과 무차원 상관을 혼동했고, 일반적인 회귀 기울기에는 y/x 단위가 있다."}, {"id": "o1", "text": "상관은 대칭적 선형 연관, 회귀는 x로 y의 조건부 관계를 설명·예측하며 먼저 산점도를 살핀다.", "correct": true, "explanation": "예측 방향이 있는 회귀와 대칭적인 상관을 구분하고 자료의 형태를 확인한다."}, {"id": "o2", "text": "상관은 x로 y를 예측하는 방향을 정하고, 회귀는 두 변수의 순서를 바꾸어도 같은 모형으로 본다.", "correct": false, "explanation": "상관과 회귀의 방향성을 뒤바꾸었다. y~x와 x~y 회귀는 같은 모형이 아니다."}, {"id": "o4", "text": "상관이 충분히 크면 직선 적합이 확인된 것이므로, 회귀 전 산점도의 곡선·극단값 점검은 생략한다.", "correct": false, "explanation": "큰 상관만으로 형태·이상치·조건이 확인되지 않는다. 산점도를 먼저 살펴야 한다."}], "sourc explanation": "~ 왼쪽은 y, 오른쪽은 두 설명변수다. +는 두 주효과를 모형에 포함하는 포뮬러 기호다."}, {"id": "o2", "text": "lm(x1 + x2 ~ y)", "correct": false, "explanation": "반응변수와 설명변수의 위치를 뒤집었다."}, {"id": "o3", "text": "lm(y ~ x1 / x2)", "correct": false, "explanation": "포뮬러의 /는 단순히 두 주효과를 더하는 표기와 다르며 요구한 모형이 아니다."}], "source": "회귀 전사 말미", "explanation": [], "commonMistakes": []}, {"id": "MC095", "chapter": "회귀·실험실습", "conceptIds": ["OX181", "OX182"], "type": "single", "stem": "SRT·CRT의 대안 수 \\(N = 1\\),2,4를 bit로 변환해 회귀했다. \\(\\hat{y} = 424 + 78\\,H\\), \\(p = 0.16\\), \\(R^{2} \\approx 0.03\\)이면?", "options": [{"id": "o2", "text": "H는 1·2·4 bit이며, α=.05에서 모형은 비유의하고 표본 Time 변동의 약 3%를 설명한다.", "correct": false, "explanation": "나머지 해석은 맞지만 대안 수를 정보량으로 그대로 사용했다."}, {"id": "o4", "text": "H는 0·1·2 bit이며, 기울기가 양수이므로 α=.05에서 모형은 유의하고 설명력은 약 3%다.", "correct": false, "explanation": "추정 기울기의 부호는 유의성을 대신하지 않는다. 제시 p값에서 비유의다."}, {"id": "o1", "text": "H는 0·1·2 bit이며, α=.05에서 모형은 비유의하고 표본 Time 변동의 약 3%를 설명한다.", "correct": true, "explanation": "정보량은 log₂N이다. p=.16>.05와 R²=.03을 구별해 해석한다."}, {"id": "o3", "text": "H는 0·1·2 bit이며, α=.05에서 모형은 비유의하고 표본 Time 변동의 약 16%를 설명한다.", "correct": false, "explanation": "p값 .16을 설명 비율로 바꾸었다. 표본 설명력은 R²=.03이다."}], "source": "SRT/CRT 교안 p.1–3 · 실습 전사 · SRT/CRT 실습 전사", "stemPlain": "SRT·CRT의 대안 수 \\(N = 1\\),2,4를 bit로 변환해 회귀했다. \\(\\hat{y} = 424 + 78\\,H\\), \\(p = 0.16\\), \\(R^{2} \\approx 0.03\\)이면?", "explanation": "정보량은 log₂N이다. p=.16>.05와 R²=.03을 구별해 해석한다.", "commonMistakes": ["나머지 해석은 맞지만 대안 수를 정보량으로 그대로 사용했다.", "추정 기울기의 부호는 유의성을 대신하지 않는다. 제시 p값에서 비유의다.", "p값 .16을 설명 비율로 바꾸었다. 표본 설명력은 R²=.03이다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>SRT·CRT 수업 실습 예시 · 등확률 대안과 회귀 요약<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">항목<\/th><th scope=\"col\">제시자료<\/th><\/tr><\/thead><tbody><tr><td>등확률 대안 수 N<\/td><td>1, 2, 4<\/td><\/tr><tr><td>반응변수<\/td><td>Time (ms)<\/td><\/tr><tr><td>설명변수<\/td><td>H (bit)<\/td><\/tr><tr><td>추정식<\/td><td>\\(\\widehat{\\mathrm{Time}}=424+78H\\)<\/td><\/tr><tr><td>모형 p-value<\/td><td>0.16<\/td><\/tr><tr><td>Multiple R-squared<\/td><td>0.03<\/td><\/tr><tr><td>판정 유의수준 α<\/td><td>0.05<\/td><\/tr><\/tbody><\/table><\/div><p class=\"analysis-note\">실습 전사에 주어진 요약값이다. 아래 Sternberg 로그와는 별개의 분석이며, 원자료가 없는 이 회귀를 로그 4행에서 산출한 것으로 간주하지 않는다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC096", "chapter": "회귀·실험실습", "conceptIds": ["OX183"], "type": "single", "stem": "SRT·CRT·Sternberg 로그의 TimeOut 시행에 Time=5000 ms가 기록되었다. 가장 적절한 처리·해석은?", "options": [{"id": "o4", "text": "User Input의 -1을 실제 검사 숫자의 값으로 해석해, 포함 여부에 따라 정상 YES·NO RT로 분류한다.", "correct": false, "explanation": "프로그램의 실패·미입력 표식을 실제 자극 값으로 해석하지 않는다. 자극 열과 반응 상태를 분리한다."}, {"id": "o1", "text": "제한시간 내 응답 실패로 구분해 정상 정답 RT의 요약에서 분리하고, 제외 규칙과 수를 기록한다.", "correct": true, "explanation": "TimeOut의 5000은 제한시간 기록이다. 정상 반응과 구별하되 처리 기준과 손실 시행도 관리한다."}, {"id": "o3", "text": "5000을 5초로 바꾼 뒤 T/F를 True로 재코딩하여, 단위가 같은 정상 정답 RT에 포함한다.", "correct": false, "explanation": "단위 변환은 실패한 시행을 정답으로 바꾸지 않는다. 응답 상태를 보존한다."}, {"id": "o2", "text": "기록된 5000을 관측 RT로 사용해, T/F가 False여도 정상 정답 RT의 평균 계산에 포함한다.", "correct": false, "explanation": "제한시간까지 응답하지 않은 기록을 실제 정답 반응시간으로 합치지 않는다."}], "source": "Sternberg README · 로그", "explanation": "TimeOut의 5000은 제한시간 기록이다. 정상 반응과 구별하되 처리 기준과 손실 시행도 관리한다.", "commonMistakes": ["프로그램의 실패·미입력 표식을 실제 자극 값으로 해석하지 않는다. 자극 열과 반응 상태를 분리한다.", "단위 변환은 실패한 시행을 정답으로 바꾸지 않는다. 응답 상태를 보존한다.", "제한시간까지 응답하지 않은 기록을 실제 정답 반응시간으로 합치지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>해석 대상 TimeOut 행 · 실제 로그<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Number Set<\/th><th scope=\"col\">Probe<\/th><th scope=\"col\">User Input<\/th><th scope=\"col\">T/F<\/th><th scope=\"col\">Time (ms)<\/th><\/tr><\/thead><tbody><tr><td>{2, 7, 5}<\/td><td>2<\/td><td>TimeOut<\/td><td>False<\/td><td>5000<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC097", "chapter": "회귀·실험실습", "conceptIds": ["OX184", "OX185"], "type": "single", "stem": "제시된 Sternberg 로그 한 시행을 분석한다. 실제 자극 조건과 반응 정오를 함께 분류한 것으로 옳은 것은?", "options": [{"id": "o2", "text": "YES 조건의 정답으로 분류하며, T/F가 True인 시행을 모아 YES의 PSS–RT를 분석한다.", "correct": false, "explanation": "T/F는 정오다. 이 행은 T/F=True여도 실제 포함 조건이 NO다."}, {"id": "o3", "text": "NO 조건의 오답으로 분류하며, User Input=False인 시행을 모아 오류 반응으로 처리한다.", "correct": false, "explanation": "False는 포함되지 않았다는 응답이다. 이 행에서는 정확한 NO 응답이므로 오답이 아니다."}, {"id": "o1", "text": "NO 조건의 정답으로 분류하며, 실제 포함 여부로 조건을 나눈 뒤 PSS–RT를 분석한다.", "correct": true, "explanation": "집합에 없는 Probe에 False로 정확히 답했다. 실제 포함 조건과 정오 열을 구분한다."}, {"id": "o4", "text": "NO 조건의 정답으로 분류하며, 정답 행의 T/F를 설명변수로 하여 PSS의 효과를 추정한다.", "correct": false, "explanation": "T/F를 사용해도 집합크기 PSS의 효과를 추정하는 회귀가 되지 않는다. PSS를 설명변수로 사용해야 한다."}], "source": "Sternberg 로그 · 원문과 검증 · SRT/CRT/Sternberg 실습 전사", "explanation": "집합에 없는 Probe에 False로 정확히 답했다. 실제 포함 조건과 정오 열을 구분한다.", "commonMistakes": ["T/F는 정오다. 이 행은 T/F=True여도 실제 포함 조건이 NO다.", "False는 포함되지 않았다는 응답이다. 이 행에서는 정확한 NO 응답이므로 오답이 아니다.", "T/F를 사용해도 집합크기 PSS의 효과를 추정하는 회귀가 되지 않는다. PSS를 설명변수로 사용해야 한다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>해석 대상 시행 · 실제 로그<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th scope=\"col\">Number Set<\/th><th scope=\"col\">Probe<\/th><th scope=\"col\">User Input<\/th><th scope=\"col\">T/F<\/th><th scope=\"col\">Time (ms)<\/th><\/tr><\/thead><tbody><tr><td>{1, 3, 4}<\/td><td>2<\/td><td>False<\/td><td>True<\/td><td>1201<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC098", "chapter": "개론·역사", "conceptIds": ["OX001", "OX002", "OX003", "OX005", "OX006"], "type": "multi", "stem": "UX와 UX 심리학에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "Brand Ethics는 제품·서비스 경험에 속한다.", "correct": false, "explanation": "Brand Ethics는 브랜드 경험의 요소다. 제품·서비스의 세 요소는 Affect·Usability·User Value다."}, {"id": "o1", "text": "UX는 사용 전·사용 중·사용 후의 경험을 포괄한다.", "correct": true, "explanation": "교안의 Previous·Present·Future experience라는 시간 범위다."}, {"id": "o3", "text": "UX 심리학은 심리학 지식과 방법을 사용자 경험에 적용한다.", "correct": true, "explanation": "교안의 정의이며 DESIGN AND SCIENCE의 결합을 강조한다."}, {"id": "o4", "text": "UX 연구 기반에는 인간공학·공학·심리학·사회학이 포함된다.", "correct": true, "explanation": "교안의 네 학문 교집합 도식과 일치한다."}], "source": "1-1 교안 p.2–3 · 1-1 교안 p.2 · 1-1 교안 p.4–5 · 1-1 교안 p.8", "explanation": "교안의 Previous·Present·Future experience라는 시간 범위다. 교안의 정의이며 DESIGN AND SCIENCE의 결합을 강조한다. 교안의 네 학문 교집합 도식과 일치한다.", "commonMistakes": ["Brand Ethics는 브랜드 경험의 요소다. 제품·서비스의 세 요소는 Affect·Usability·User Value다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC099", "chapter": "개론·역사", "conceptIds": ["OX008", "OX009", "OX015", "OX017", "OX020"], "type": "multi", "stem": "UX의 발전 단계(Dark Ages·Proto UX·UX Gold Rush)와 인간공학의 시대별 역사(Old Age·Middle/Modern Age·Information Age)에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "Information Age의 초기 HCI 연구는 UI와 Usability를 다루었다.", "correct": true, "explanation": "교안은 이후 스마트폰 UX와 인간–AI 연구로의 확대를 제시한다."}, {"id": "o2", "text": "therbligs는 인간공학 전문 학문 탄생기에 조종장치 설계용 인지 처리 단위로 개발됐다.", "correct": false, "explanation": "therbligs는 더 이른 시간·동작 연구의 수작업 미세동작 단위다. 전문화 시기·인지 단계와 혼동했다."}, {"id": "o3", "text": "Old Age는 사람을 직무·장비에 맞추는 관점이 중심이었다.", "correct": true, "explanation": "현대 인간 중심 설계의 완성기로 잘못 일반화하지 않아야 한다."}, {"id": "o1", "text": "Proto UX는 1990년대 인지인간공학·정보설계·인터페이스 디자인과 연결된다.", "correct": true, "explanation": "UX Gold Rush보다 앞선 교안의 중간 단계다."}], "source": "1-2 교안 p.2–4 · 1-2 교안 p.3 · 1-2 교안 p.12 · 1-2 교안 p.14", "explanation": "교안은 이후 스마트폰 UX와 인간–AI 연구로의 확대를 제시한다. 현대 인간 중심 설계의 완성기로 잘못 일반화하지 않아야 한다. UX Gold Rush보다 앞선 교안의 중간 단계다.", "commonMistakes": ["therbligs는 더 이른 시간·동작 연구의 수작업 미세동작 단위다. 전문화 시기·인지 단계와 혼동했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC100", "chapter": "개론·역사", "conceptIds": ["OX012", "OX013", "OX014", "OX021", "OX022"], "type": "multi", "stem": "인간공학의 정의·영역·설계 철학에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "인간공학에서 시스템 성능은 설계 목표이며, 인간의 안녕은 그 결과와 분리한 사후 점검 항목이다.", "correct": false, "explanation": "인간의 안녕과 시스템 성능은 공동 설계 목표다. 안녕을 사후 항목으로만 분리하지 않는다."}, {"id": "o1", "text": "근력·인체측정·생체역학은 Physical Ergonomics와 관련된다.", "correct": true, "explanation": "신체적 특성과 상호작용을 다루는 영역이다."}, {"id": "o2", "text": "인지 인간공학은 지각·기억·추론 같은 정신 과정을 다룬다.", "correct": true, "explanation": "신체 치수 연구와 구분되는 인지 영역이다."}, {"id": "o3", "text": "기존 장치에 맞는 작업자를 선발하는 것은 시스템을 인간에게 맞추는 접근이다.", "correct": false, "explanation": "선발·훈련은 Fitting the Human to the System의 전통적 접근이다."}], "source": "1-2 교안 p.7 · 1-2 교안 p.8–9 · 1-2 교안 p.8–11 · 1-2 교안 p.15", "explanation": "신체적 특성과 상호작용을 다루는 영역이다. 신체 치수 연구와 구분되는 인지 영역이다.", "commonMistakes": ["인간의 안녕과 시스템 성능은 공동 설계 목표다. 안녕을 사후 항목으로만 분리하지 않는다.", "선발·훈련은 Fitting the Human to the System의 전통적 접근이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC101", "chapter": "HFE 연구방법론", "conceptIds": ["OX027", "OX030", "OX031", "OX033", "OX037"], "type": "multi", "stem": "HFE 연구 유형과 변수에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "스마트글래스 무게 위치를 조작하고 코 하중을 비교하면 위치가 DV다.", "correct": false, "explanation": "조작한 무게 위치는 IV, 측정 결과 코 하중은 DV다."}, {"id": "o4", "text": "변수 조작의 수행도 효과를 검증하는 것은 Experimental research다.", "correct": true, "explanation": "기술 연구 및 제품 평가 목적과 구분하는 기준이다."}, {"id": "o3", "text": "완성된 제품들의 사용성·효과성을 평가하는 것은 Evaluation research다.", "correct": true, "explanation": "교안의 진공청소기 비교 사례가 대표적이다."}, {"id": "o1", "text": "인간의 손 치수 분포를 측정·기술하는 연구는 Descriptive research다.", "correct": true, "explanation": "인체 치수와 근력 같은 인간 속성을 조작 없이 측정하고 분포를 기술하는 것은 Descriptive research다."}], "source": "2장 교안 p.4–7 · 2장 교안 p.4, 8–9 · 2장 교안 p.10 · 2장 교안 p.4, 11–13 · 2장 교안 p.15", "explanation": [], "commonMistakes": []}, {"id": "MC102", "chapter": "HFE 연구방법론", "conceptIds": ["OX042", "OX043", "OX044", "OX052"], "type": "multi", "stem": "\\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)와 \\(\\mathrm{SE} = \\frac{s}{\\sqrt{n}}\\)에 관해 옳은 것을 모두 고르시오. 명시하지 않은 값은 고정한다.", "options": [{"id": "o4", "text": "n의 계산값이 15.37이면 최소 필요 인원을 15명으로 내린다.", "correct": false, "explanation": "목표 정밀도를 확보하려면 총 16명으로 올림한다."}, {"id": "o2", "text": "k를 절반으로 하면 필요한 n은 절반이다.", "correct": false, "explanation": "k가 분모에서 제곱되므로 n은 네 배가 된다."}, {"id": "o3", "text": "n을 네 배로 하면 같은 s에서 평균의 SE는 절반이다.", "correct": true, "explanation": "\\(\\sqrt{\\left(4\\,n\\right)} = 2\\,\\sqrt{n}\\)이므로 SE가 절반이다."}, {"id": "o1", "text": "s를 두 배로 하면 필요한 n은 네 배다.", "correct": true, "explanation": "다른 조건을 고정하면 n은 s²에 비례한다. 따라서 s를 2배로 하면 괄호의 제곱으로 n은 4배다."}], "source": "2장 교안 p.18 · 2장 교안 p.19 · 2장 교안 p.10 · 원문과 검증", "stemPlain": "\\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)와 \\(\\mathrm{SE} = \\frac{s}{\\sqrt{n}}\\)에 관해 옳은 것을 모두 고르시오. 명시하지 않은 값은 고정한다.", "explanation": [], "commonMistakes": []}, {"id": "MC103", "chapter": "HFE 연구방법론", "conceptIds": ["OX046", "OX047", "OX048", "OX050", "OX051"], "type": "multi", "stem": "측정 품질에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "결과를 다른 사용환경으로 일반화하는 정도는 External validity다.", "correct": true, "explanation": "Internal validity는 연구 내부의 교란 없는 인과 귀속과 관련된다."}, {"id": "o3", "text": "구성개념의 일부가 측정에서 빠지는 것은 Contamination이다.", "correct": false, "explanation": "빠지는 부분은 Deficiency, 무관한 부분이 섞이는 것은 Contamination이다."}, {"id": "o1", "text": "반복값이 촘촘하더라도 참값에서 벗어나면 정확도는 낮을 수 있다.", "correct": true, "explanation": "높은 신뢰도가 정확도·타당도를 자동으로 보장하지 않는다."}, {"id": "o4", "text": "숙련도가 조건별로 달라지면 UI 효과 추정의 내적 타당도를 해칠 수 있다.", "correct": true, "explanation": "숙련도와 UI 조건의 confounding 때문이다."}], "source": "2장 교안 p.20 · 2장 교안 p.21 · 2장 교안 p.22", "explanation": [], "commonMistakes": []}, {"id": "MC104", "chapter": "정보량·중복도", "conceptIds": ["OX059", "OX060", "OX061", "OX062", "OX075"], "type": "multi", "stem": "정보량 계산에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o1", "text": "등확률 16개 대안의 정보량은 4 bits다.", "correct": true, "explanation": "등확률에서 \\(H = \\log_2 N\\)이다. \\(2^{4} = 16\\)이므로 16개 대안의 선택 정보량은 4 bits다."}, {"id": "o3", "text": "Shannon 식은 개별 자기정보량 \\(\\log_2 \\left(\\frac{1}{p_i}\\right)\\)의 확률 가중평균이다.", "correct": true, "explanation": "\\(H=\\sum_i p_i\\log_2\\left(\\frac{1}{p_i}\\right)=-\\sum_i p_i\\log_2 p_i\\)다."}, {"id": "o2", "text": "비등확률 대안에서도 평균 정보량은 대안 수의 log₂만으로 결정된다.", "correct": false, "explanation": "확률이 다르면 Shannon의 확률 가중식을 적용해야 한다."}, {"id": "o4", "text": "확률 0인 사건의 엔트로피 기여는 극한으로 0이다.", "correct": true, "explanation": "가중항 전체를 p→0+ 극한으로 처리한다."}], "source": "3장 교안 p.8 · 3장 교안 p.9 · 3장 교안 p.18", "explanation": [], "commonMistakes": []}, {"id": "MC105", "chapter": "정보량·중복도", "conceptIds": ["OX064", "OX066", "OX068", "OX069", "OX071"], "type": "multi", "stem": "중복도 \\(R = \\left(1 - \\frac{H}{H_{\\max}}\\right) \\times 100\\)에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "H가 Hmax와 같으면 중복도는 100%다.", "correct": false, "explanation": "\\(H = H_{\\max}\\)이면 \\(R = \\left(1 - \\frac{H}{H_{\\max}}\\right) \\times 100 = \\left(1 - 1\\right) \\times 100 = 0\\)%다. 최대 정보량일 때 중복도는 최소다."}, {"id": "o1", "text": "8개 대안의 Hmax는 3 bits다.", "correct": true, "explanation": "고정된 8개 대안이 등확률일 때 \\(\\log_2 8 = 3\\)이다."}, {"id": "o4", "text": "같은 대안 수에서 확률이 치우칠수록 일반적으로 중복도는 증가한다.", "correct": true, "explanation": "등확률에서 엔트로피가 최대이므로 치우치면 H가 줄고 중복도가 커진다."}, {"id": "o3", "text": "변경 시점이 완전히 확정되면 해당 불확실성의 H는 0이다.", "correct": true, "explanation": "확정 사건의 자기정보량은 0이며 \\(H_{\\max} > 0\\)이면 중복도는 100%다."}], "source": "3장 교안 p.10 · 3장 교안 p.11 · 3장 교안 p.12 · 3장 교안 p.13 · 3장 교안 p.14", "stemPlain": "중복도 \\(R = \\left(1 - \\frac{H}{H_{\\max}}\\right) \\times 100\\)에 관해 옳은 것을 모두 고르시오.", "explanation": [], "commonMistakes": []}, {"id": "MC106", "chapter": "정보량·중복도", "conceptIds": ["OX054", "OX055", "OX056", "OX057", "OX077"], "type": "multi", "stem": "인간 정보처리 모형에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "시연 없는 작업기억 지속시간은 대략 20~30초다.", "correct": true, "explanation": "모형의 대표 수치이며 모든 상황의 고정 상수로 해석하지 않는다."}, {"id": "o1", "text": "주의 자원은 지각뿐 아니라 작업기억·결정·실행에도 관여한다.", "correct": true, "explanation": "교안은 여러 단계에 공급되는 제한된 자원으로 표시한다."}, {"id": "o2", "text": "장기기억은 반응 선택에 관여하지만 지각과는 연결되지 않는다.", "correct": false, "explanation": "장기기억은 지각·결정 등에도 영향을 준다. 실행 절차에만 한정되지 않는다."}, {"id": "o3", "text": "반응의 결과는 피드백으로 다시 감각 입력에 영향을 준다.", "correct": true, "explanation": "정보처리가 환경과 연결되는 Feedback 루프다."}], "source": "3장 교안 p.6", "explanation": "모형의 대표 수치이며 모든 상황의 고정 상수로 해석하지 않는다. 교안은 여러 단계에 공급되는 제한된 자원으로 표시한다. 정보처리가 환경과 연결되는 Feedback 루프다.", "commonMistakes": ["장기기억은 지각·결정 등에도 영향을 준다. 실행 절차에만 한정되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC107", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX079", "OX080", "OX081", "OX084", "OX110", "OX111"], "type": "multi", "stem": "정보전달량과 조건부 엔트로피에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "\\(H\\left(X\\mid Y\\right)\\)는 Noise이고 \\(H\\left(Y\\mid X\\right)\\)는 Equivocation이다.", "correct": false, "explanation": "입력 기준 손실 \\(H\\left(X\\mid Y\\right)\\)가 Equivocation, 출력 조건부 불확실성 \\(H\\left(Y\\mid X\\right)\\)가 Noise다."}, {"id": "o4", "text": "반응 라벨을 일대일로 뒤집어도 전달정보량은 최대일 수 있다.", "correct": true, "explanation": "의미상 정답률 0%와 최대 통계적 전달량이 함께 나타날 수 있는 Trap이다."}, {"id": "o1", "text": "\\(I\\left(X; Y\\right) = H\\left(X\\right) + H\\left(Y\\right) - H\\left(X, Y\\right)\\)다.", "correct": true, "explanation": "교안의 \\(H\\left(X \\cap Y\\right)\\)는 이 상호정보량을 뜻한다."}, {"id": "o3", "text": "출력이 한 값으로 고정되면 \\(I\\left(X; Y\\right) = 0\\)이다.", "correct": true, "explanation": "\\(H\\left(Y\\right) = 0\\)이고 입력을 구별할 정보가 남지 않는다."}], "source": "3장 교안 p.15–16 · 3장 교안 p.16 · 3장 교안 p.19 · 3장 교안 p.16–18", "explanation": [], "commonMistakes": []}, {"id": "MC108", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX089", "OX090", "OX091", "OX092", "OX093"], "type": "multi", "stem": "기억·판단 전략에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o3", "text": "Self-terminating은 목표를 찾아도 마지막 항목까지 비교한다.", "correct": false, "explanation": "목표를 찾는 즉시 멈추는 방식이다. 끝까지 비교하는 것은 exhaustive다."}, {"id": "o4", "text": "Location+Color는 자극 차원을 증가시키는 전략이다.", "correct": true, "explanation": "한 차원 위치 부호에서 다차원 부호로 바꾼 사례다."}, {"id": "o2", "text": "Chunking은 기존 지식과 연결해 의미 있는 단위를 구성한다.", "correct": true, "explanation": "묶음화와 장기기억 지식의 연결이 핵심이다."}, {"id": "o1", "text": "Relative judgment는 두 자극을 직접 비교하게 하는 전략이다.", "correct": true, "explanation": "기억 속 기준과의 절대 판단보다 판별 부담을 낮추는 교안 전략이다."}], "source": "3장 교안 p.26–28 · 3장 교안 p.26 · 3장 교안 p.29 · 3장 교안 p.30–31 · 3장 교안 p.31", "explanation": "한 차원 위치 부호에서 다차원 부호로 바꾼 사례다. 묶음화와 장기기억 지식의 연결이 핵심이다. 기억 속 기준과의 절대 판단보다 판별 부담을 낮추는 교안 전략이다.", "commonMistakes": ["목표를 찾는 즉시 멈추는 방식이다. 끝까지 비교하는 것은 exhaustive다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC109", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX095", "OX096", "OX097", "OX098", "OX106", "OX107"], "type": "multi", "stem": "Donders와 Hick 모형에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o4", "text": "Donders C는 자극 식별과 여러 반응 사이의 선택을 모두 포함한다.", "correct": false, "explanation": "C는 여러 자극 중 한 자극에만 반응하며 반응 선택은 B에서 추가된다."}, {"id": "o3", "text": "양립성·학습·연령을 Hick 기울기 요인으로 제시한다.", "correct": true, "explanation": "절편의 자극·반응 양식과 구별되는 세 요인이다."}, {"id": "o1", "text": "Donders 차감법에서 \\(C - A\\)는 자극 식별, \\(B - C\\)는 반응 선택 시간이다.", "correct": true, "explanation": "\\(C = A\\)+식별, \\(B = C\\)+선택이라는 단계 가정 아래의 해석이다."}, {"id": "o2", "text": "Hick의 b 단위는 ms/bit이며 작을수록 추가 선택 부담이 작다.", "correct": true, "explanation": "정보 1 bit 증가에 따른 RT의 추가 시간이다."}], "source": "3장 교안 p.32 · 3장 교안 p.34–35 · 3장 교안 p.37 · 3장 교안 p.37 · 정보처리 전사3", "explanation": [], "commonMistakes": []}, {"id": "MC110", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX114", "OX115", "OX118", "OX139"], "type": "multi", "stem": "Fitts ID 계산에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o1", "text": "원형 공식은 \\(\\log_2 \\left(\\frac{2\\,A}{W}\\right)\\)다.", "correct": true, "explanation": "이동 진폭 A와 표적 너비 W를 사용하는 원형이다."}, {"id": "o3", "text": "D가 cm이고 W가 mm여도 숫자만 바로 나누면 비율이 같다.", "correct": false, "explanation": "길이 단위를 통일한 뒤 비율을 구해야 한다."}, {"id": "o2", "text": "ISO 표준형(Shannon형) 공식은 \\(\\log_2 \\left(\\frac{D}{W} + 1\\right)\\)이다.", "correct": true, "explanation": "\\(\\log_2 \\left(\\frac{W}{D} + 1\\right)\\)로 분자·분모를 바꾸면 안 된다."}, {"id": "o4", "text": "같은 모형에서 D와 W를 모두 두 배로 하면 ID는 같다.", "correct": true, "explanation": "\\(\\frac{2\\,D}{\\left(2\\,W\\right)} = \\frac{D}{W}\\)로 비율이 유지된다. 같은 a,b를 쓰는 모형에서 ID와 예측 MT가 모두 같다."}], "source": "3장 교안 p.43 · 3장 교안 p.46–47", "explanation": [], "commonMistakes": []}, {"id": "MC111", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX121", "OX122", "OX123", "OX124", "OX125", "OX126"], "type": "multi", "stem": "개회로(Open loop)·폐회로(Closed loop) 운동제어와 범위 효과(Range effect)에 관한 설명 중 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "Ballistic movement는 매 순간 시각 피드백으로 정밀 조정한다.", "correct": false, "explanation": "교안의 탄도 운동은 Open loop이며 사전 계획에 따른 빠른 실행이다."}, {"id": "o1", "text": "Positioning movement는 피드백을 이용하는 Closed loop다.", "correct": true, "explanation": "목표 근처에서 감각 피드백으로 오차를 교정한다."}, {"id": "o4", "text": "Range effect는 짧은 거리 Overshoot, 긴 거리 Undershoot다.", "correct": true, "explanation": "두 방향을 바꾸는 것이 대표적 오답 함정이다."}, {"id": "o3", "text": "숙련되면 상대적으로 Open loop 수행 비중이 커질 수 있다.", "correct": true, "explanation": "피드백을 매번 확인하는 의존이 줄어드는 방향으로 설명한다."}], "source": "3장 교안 p.50 · 3장 교안 p.50 · 정보처리 전사4 · 3장 교안 p.51", "explanation": [], "commonMistakes": []}, {"id": "MC112", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX128", "OX129", "OX131", "OX132", "OX133", "OX134", "OX135"], "type": "multi", "stem": "양립성에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "다이얼 이동과 바늘 이동 방향의 대응은 Movement compatibility다.", "correct": true, "explanation": "조작과 표시의 움직임 방향을 다룬다."}, {"id": "o1", "text": "화구와 노브의 배열 대응은 Spatial compatibility다.", "correct": true, "explanation": "화구와 노브의 물리적 위치·배열을 맞추는 문제이므로 Spatial이다. 색·기호의 의미 대응인 Conceptual과 구별한다."}, {"id": "o3", "text": "빨간색과 온수의 의미 연상은 Modality compatibility다.", "correct": false, "explanation": "색과 의미의 대응은 Conceptual compatibility다."}, {"id": "o4", "text": "음성 지시–음성 응답은 Modality compatibility의 예다.", "correct": true, "explanation": "자극·반응 양식의 대응이며 개념적 의미 일치와 구별한다."}], "source": "3장 교안 p.57 · 3장 교안 p.58 · 3장 교안 p.59 · 3장 교안 p.60 · 3장 교안 p.61 · 3장 교안 p.62", "explanation": [], "commonMistakes": []}, {"id": "MC113", "chapter": "기초통계·T검정", "conceptIds": ["OX144", "OX146", "OX148", "OX149", "OX150"], "type": "multi", "stem": "R 기초통계 코드에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o2", "text": "var(a)는 표본분산이며 분모는 \\(n - 1\\)이다.", "correct": true, "explanation": "R var는 편차제곱합을 \\(n - 1\\)로 나눈 표본분산이다. 모집단 전체의 분모 n을 사용한 값과 구별해야 한다."}, {"id": "o3", "text": "quantile(a)의 50% 값은 항상 mean(a)다.", "correct": false, "explanation": "50% 분위수는 median(a)이며 평균과 다를 수 있다."}, {"id": "o4", "text": "boxplot(a)의 수염 끝은 자료의 최솟값·최댓값이며, 별도 점으로 표시된 관측은 분석에서 제외된 값이다.", "correct": false, "explanation": "R 기본 상자그림은 IQR 기준 수염 밖 관측을 별도 점으로 표시할 수 있다. 그 점도 원자료의 관측이며 자동 제외된 것이 아니다."}, {"id": "o1", "text": "sort(a,decreasing=TRUE)[1]은 결측값 없는 비어 있지 않은 수치 벡터의 최댓값이다.", "correct": true, "explanation": "내림차순의 첫 원소다. 조건을 명시하여 결측값·빈 벡터 문제를 피했다."}], "source": "t-test 교안 p.3–4 · t-test 교안 p.3–6 · t-test 교안 p.7 · t-test 교안 p.8 · t-test 교안 p.8–9", "explanation": "R var는 편차제곱합을 \\(n - 1\\)로 나눈 표본분산이다. 모집단 전체의 분모 n을 사용한 값과 구별해야 한다. 내림차순의 첫 원소다. 조건을 명시하여 결측값·빈 벡터 문제를 피했다.", "commonMistakes": ["50% 분위수는 median(a)이며 평균과 다를 수 있다.", "R 기본 상자그림은 IQR 기준 수염 밖 관측을 별도 점으로 표시할 수 있다. 그 점도 원자료의 관측이며 자동 제외된 것이 아니다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC114", "chapter": "기초통계·T검정", "conceptIds": ["OX154", "OX155", "OX157", "OX159"], "type": "multi", "stem": "가설검정과 가정 점검에 관해 옳은 것을 모두 고르시오.", "options": [{"id": "o3", "text": "등분산 가정은 pooled t-검정과 관련되고 Welch는 등분산을 요구하지 않는다.", "correct": true, "explanation": "var.equal=TRUE인 방식과 R 기본 var.equal=FALSE를 구별한다."}, {"id": "o2", "text": "n≥20이라는 교안의 경험칙을 적용하면, 대응검정에서도 전후 차이 대신 각 시점의 정규성만 점검한다.", "correct": false, "explanation": "대응검정에서 관심 대상은 짝별 차이다. 표본 수 경험칙으로 검정 대상을 바꾸지 않는다."}, {"id": "o4", "text": "Levene p>.05이면 분산의 동일성이 검증된 것이므로, 두 집단의 표본분산도 같은 값으로 간주한다.", "correct": false, "explanation": "비기각은 동일성의 증명이 아니며 표본분산 값이 같다는 뜻도 아니다."}, {"id": "o1", "text": "Shapiro 검정 \\(p > 0.05\\) } = 2\\), \\(S_{xy} = 5\\)다. 회귀식과 \\(x = 2\\)에서의 잔차는?", "explanation": [], "commonMistakes": []}, {"id": "MC132", "chapter": "회귀·실험실습", "conceptIds": ["OX181", "OX182", "OX183", "OX184", "OX185"], "type": "case", "stem": "[사례] 기억집합 {2,5,8}, Probe=4, User Input=False, T/F=True, Time=620 ms다. 별도 행에 TimeOut·5000 ms가 있다. 타당한 분석은?", "options": [{"id": "o1", "text": "620 ms는 정답 NO, PSS는 3이다. TimeOut은 분리하고 조건·집합크기별 자료를 확인한다.", "correct": true, "explanation": "Probe 4는 세 항목 집합에 없고 False로 정확히 응답했다. 타임아웃과 PSS 변동 자료를 구분한다."}, {"id": "o3", "text": "620 ms는 오답 NO, PSS는 3이다. False 입력이므로 해당 행을 오답 자료로 분류한다.", "correct": false, "explanation": "False는 미포함 응답이다. 이 행에서는 실제 미포함이므로 정답이다."}, {"id": "o4", "text": "620 ms는 정답 NO, PSS는 3이다. TimeOut도 제한시간의 정상 RT로 같은 평균에 포함한다.", "correct": false, "explanation": "실패한 시행의 제한시간 표식을 실제 정답 RT와 합치지 않는다."}, {"id": "o2", "text": "620 ms는 정답 YES, PSS는 4다. TimeOut은 분리하고 조건·집합크기별 자료를 확인한다.", "correct": false, "explanation": "T/F=True를 실제 포함과 혼동했고 Probe 값 4를 집합크기로 읽었다. 실제 PSS는 3이다."}], "source": "SRT/CRT 교안 p.1–3 · 실습 전사 · SRT/CRT 실습 전사 · Sternberg README · 로그 · Sternberg 로그 · 원문과 검증 · SRT/CRT/Sternberg 실습 전사", "visual": "<figure class=\"visual-box\"><figcaption>Sternberg 로그 두 시행 — Time 단위 ms<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>집합<\/th><th>Probe<\/th><th>User Input<\/th><th>T/F<\/th><th>Time<\/th><\/tr><\/thead><tbody><tr><td>2,5,8<\/td><td>4<\/td><td>False<\/td><td>True<\/td><td>620<\/td><\/tr><tr><td>2,5,8<\/td><td>7<\/td><td>TimeOut<\/td><td>False<\/td><td>5000<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "explanation": "Probe 4는 세 항목 집합에 없고 False로 정확히 응답했다. 타임아웃과 PSS 변동 자료를 구분한다.", "commonMistakes": ["False는 미포함 응답이다. 이 행에서는 실제 미포함이므로 정답이다.", "실패한 시행의 제한시간 표식을 실제 정답 RT와 합치지 않는다.", "T/F=True를 실제 포함과 혼동했고 Probe 값 4를 집합크기로 읽었다. 실제 PSS는 3이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC133", "chapter": "개론·역사", "conceptIds": ["OX008", "OX186"], "type": "single", "stem": "보충영상 TEENS REACT TO WINDOWS 95에서 진행자는 Start 버튼·아이콘 탐색과 이전 DOS의 명령어 입력 방식을 대비해 설명한다. 아래 사례를 기억 인출과 UX 관점에서 해석한 것으로 가장 적절한 것은?", "options": [{"id": "o1", "text": "CLI는 명령어 회상에, GUI는 화면 단서의 재인에 더 의존하므로 메뉴 선택이 기억 인출 부담을 줄일 수 있다.", "correct": true, "explanation": "명령어를 스스로 떠올리는 회상과 시각 단서를 보고 고르는 재인을 구분한다. 절차 전체의 성공을 보장한다는 뜻은 아니다."}, {"id": "o2", "text": "CLI는 명령어의 재인에, GUI는 화면 위치의 회상에 더 의존하므로 메뉴 선택이 기억 인출 부담을 늘릴 수 있다.", "correct": false, "explanation": "두 인터페이스의 대표 기억 요구를 뒤바꾸었다. 화면 단서가 있는 선택은 재인 지원이다."}, {"id": "o3", "text": "GUI의 이점은 화면 표식이 입력 명령의 발생확률을 바꾸어, 같은 과업의 Shannon H를 낮춘 데 있다고 본다.", "correct": false, "explanation": "시각 단서가 인출을 돕는 효과와 사건 확률의 엔트로피를 혼동했다."}, {"id": "o4", "text": "GUI의 이점은 절차 지식이 필요 없어지는 데 있으므로, 연결·전원 조작의 어려움은 UX와 따로 평가한다.", "correct": false, "explanation": "재인 지원이 모든 절차 지식을 없애는 것은 아니다. 영상의 연결·전원 절차도 과업 경험의 일부다."}], "source": "1-2 교안 p.2–5 · 보충영상 PSY-L001", "explanation": "명령어를 스스로 떠올리는 회상과 시각 단서를 보고 고르는 재인을 구분한다. 절차 전체의 성공을 보장한다는 뜻은 아니다.", "commonMistakes": ["두 인터페이스의 대표 기억 요구를 뒤바꾸었다. 화면 단서가 있는 선택은 재인 지원이다.", "시각 단서가 인출을 돕는 효과와 사건 확률의 엔트로피를 혼동했다.", "재인 지원이 모든 절차 지식을 없애는 것은 아니다. 영상의 연결·전원 절차도 과업 경험의 일부다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>보충영상 1 · 자막에서 확인한 사례<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>구간<\/th><th>영상에서 확인한 사례<\/th><\/tr><\/thead><tbody><tr><td>00:49–01:18<\/td><td>본체와 모니터 전원을 혼동하며 PC를 켠다.<\/td><\/tr><tr><td>03:19–04:39<\/td><td>브라우저 실행 후 연결에 실패하고 전화선 모뎀·AOL 절차를 설명받는다.<\/td><\/tr><tr><td>04:41–05:42<\/td><td>진행자가 Start 버튼과 이전 DOS의 명령어 입력 방식을 대비해 설명한다.<\/td><\/tr><tr><td>07:25–08:00<\/td><td>종료 안내 후 수동으로 전원을 끈다.<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC134", "chapter": "개론·역사", "conceptIds": ["OX001", "OX128", "OX129", "OX187"], "type": "multi", "stem": "1주차 보충영상(Gen Z Vs Old Technology)의 VHS 비디오테이프, Nokia 벽돌폰(Multi-tap 문자 입력), 3.5인치 플로피 디스크 체험 사례에 관한 인간공학적 해석으로 옳은 것을 모두 고르시오.", "options": [{"id": "o1", "text": "플로피에 삽입 화살표가 있어도, 매체 사용 경험이 적으면 용도와 조작을 바로 파악하지 못할 수 있다.", "correct": true, "explanation": "물리적 단서는 도움을 주지만 경험 없이 기기의 용도·절차 이해가 보장되지는 않는다."}, {"id": "o2", "text": "Nokia 멀티탭 입력은 스마트폰 키보드에서 학습한 조작 기대와 달라, 초기 입력 지연·오류를 일으킬 수 있다.", "correct": true, "explanation": "이전 인터페이스 경험과 현재 조작 방식의 차이가 적응에 영향을 줄 수 있다."}, {"id": "o3", "text": "플로피의 삽입 방향을 화살표로 파악했다면, 같은 단서로 매체 용도와 데이터 저장 절차도 이해한 것으로 본다.", "correct": false, "explanation": "방향 단서의 해석과 매체의 정체·전체 절차 이해는 별개다. 한 조작의 성공으로 전체 심성모형을 확정하지 않는다."}, {"id": "o4", "text": "기기를 처음 접할 때의 기대와 과업 성공은, 현재 인터페이스와 이전에 축적된 기술 경험의 영향을 함께 받는다.", "correct": true, "explanation": "UX는 현재 화면만이 아니라 이전 경험과 맥락의 영향도 받는다."}], "source": "1-1 교안 p.2 · 1-2 교안 p.6 · 3장 교안 p.58–60 · 보충영상 PSY-L002", "explanation": "물리적 단서는 도움을 주지만 경험 없이 기기의 용도·절차 이해가 보장되지는 않는다. 이전 인터페이스 경험과 현재 조작 방식의 차이가 적응에 영향을 줄 수 있다. UX는 현재 화면만이 아니라 이전 경험과 맥락의 영향도 받는다.", "commonMistakes": ["방향 단서의 해석과 매체의 정체·전체 절차 이해는 별개다. 한 조작의 성공으로 전체 심성모형을 확정하지 않는다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>보충영상 2 · 자막에서 확인한 사례<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>구간<\/th><th>영상에서 확인한 사례<\/th><\/tr><\/thead><tbody><tr><td>00:20–03:20<\/td><td>VHS의 용도와 물리 매체 사용·보관을 낯설어한다.<\/td><\/tr><tr><td>03:37–05:42<\/td><td>Nokia 화면 터치와 음성 호출을 시도하고 숫자 키패드 문자 입력을 어려워한다.<\/td><\/tr><tr><td>06:04–07:24<\/td><td>플로피의 화살표로 삽입 용도는 추측하지만 매체의 정체는 바로 알지 못한다.<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC135", "chapter": "개론·역사", "conceptIds": ["OX013", "OX014", "OX020", "OX188"], "type": "case", "stem": "아래는 I Used 2000s Technology For a Week에서 확인한 사례다. 참가자는 iMac G4·초기 iPhone·폴더폰·PS2·iPod Nano 등을 사용했다. 이 경험을 현대 스마트폰 UX와 비교할 때 가장 타당한 분석은?", "options": [{"id": "o2", "text": "기기 부팅과 검색 결과 표시를 대표 과업의 성공으로 삼아, 연결 호환성과 영상 편집의 성공도 추정한다.", "correct": false, "explanation": "일부 과업의 성공은 다른 과업의 완료 가능성을 입증하지 않는다. 과업별로 확인해야 한다."}, {"id": "o1", "text": "연결·입력·저장 절차와 과업 완료를 평가하며, 특정 기기의 고장과 공통 설계 제약을 구분한다.", "correct": true, "explanation": "기능 보유 여부만으로 사용성이 결정되지 않는다. 실제 절차와 성공 여부, 실패 원인을 구분한다."}, {"id": "o3", "text": "촬영 기기의 고장으로 생긴 실패를 구형 인터페이스의 제약으로 분류하여, 같은 세대 기기에 일반화한다.", "correct": false, "explanation": "특정 기기의 고장과 설계 제약을 구별해야 한다. 표본 사례를 같은 세대 전부로 확장하지 않는다."}, {"id": "o4", "text": "게임 실행에 성공했으므로 저장 준비의 단계는 부수 조건으로 보고, 사용성 평가의 핵심 과업에서 제외한다.", "correct": false, "explanation": "저장 준비·메모리카드 같은 절차도 실제 과업 완료에 필요한 조건이므로 평가에 포함한다."}], "source": "1-2 교안 p.5–6, 8–11, 14 · 보충영상 PSY-L003", "explanation": "기능 보유 여부만으로 사용성이 결정되지 않는다. 실제 절차와 성공 여부, 실패 원인을 구분한다.", "commonMistakes": ["일부 과업의 성공은 다른 과업의 완료 가능성을 입증하지 않는다. 과업별로 확인해야 한다.", "특정 기기의 고장과 설계 제약을 구별해야 한다. 표본 사례를 같은 세대 전부로 확장하지 않는다.", "저장 준비·메모리카드 같은 절차도 실제 과업 완료에 필요한 조건이므로 평가에 포함한다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>보충영상 3 · 자막에서 확인한 사례<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>구간<\/th><th>영상에서 확인한 사례<\/th><\/tr><\/thead><tbody><tr><td>02:57–05:20<\/td><td>구형 iMac·초기 iPhone에서 검색은 되지만 연결·웹페이지 열기에 어려움을 겪는다.<\/td><\/tr><tr><td>05:23–07:27<\/td><td>PS2 게임 저장에 별도 메모리카드가 필요하며, 준비 후 게임을 즐긴다.<\/td><\/tr><tr><td>07:31–09:05<\/td><td>폴더폰의 문자 입력과 전화·폴더 열기 응답을 시험한다.<\/td><\/tr><tr><td>09:11–10:03<\/td><td>구형 iMac에서 영상 가져오기·편집이 느리지만 문서 작성은 사용한다.<\/td><\/tr><tr><td>10:05–11:32<\/td><td>폴더폰 충전 문제를 겪고 iPod Nano·PSP 등을 사용한다.<\/td><\/tr><tr><td>13:31–13:56<\/td><td>단계별 동영상 대신 최종 사진이 있는 요리책을 따라 조리한다.<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC136", "chapter": "개론·역사", "conceptIds": ["OX015", "OX017", "OX018", "OX019", "OX020", "OX024"], "type": "single", "stem": "인간공학(Ergonomics / HFE)의 역사적 발전 단계를 과거부터 현재 순으로 (1) → (2) → (3) → (4) → (5)로 배열할 때, 아래 <보기>의 시기 번호를 순서대로 바르게 나열한 것은?", "visual": "<figure class=\"visual-box\"><figcaption><보기> 인간공학 발전사의 5대 시기<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>번호<\/th><th>시기 및 핵심 특징<\/th><\/tr><\/thead><tbody><tr><td>①<\/td><td>Rapid Growth (1960~1980): 군사·항공에서 자동차·소비재로 확대 및 인지인간공학(Cognitive Ergonomics) 발전<\/td><\/tr><tr><td>②<\/td><td>Old Age (1900~1945): Gilbreth 부부의 시간·동작 연구(Time & Motion study)와 18가지 기본 손동작(therbligs)<\/td><\/tr><tr><td>③<\/td><td>Information Age 초기 (1990~2010): 인간-컴퓨터 상호작용(HCI), 사용자 인터페이스(UI) 및 사용성(Usability) 중심<\/td><\/tr><tr><td>④<\/td><td>Birth of Profession (1945~1960): 제2차 세계대전 직후 공학심리학 연구소(1945), HFS(1957), IEA(1959) 설립<\/td><\/tr><tr><td>⑤<\/td><td>Information Age 후기 (2010~2020~): 스마트폰 시대의 UX 디자인 및 최근 AI 시스템 상호작용 연구<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "options": [{"id": "o1", "text": "(1) ② → (2) ④ → (3) ① → (4) ③ → (5) ⑤", "correct": true, "explanation": "Old Age(②, 1900~1945) → Birth of Profession(④, 1945~1960) → Rapid Growth(①, 1960~1980) → Information Age 초기 HCI(③, 1990~2010) → Information Age 후기 스마트폰 UX·AI(⑤, 2010~) 순이다."}, {"id": "o2", "text": "(1) ② → (2) ① → (3) ④ → (4) ③ → (5) ⑤", "correct": false, "explanation": "전문 학문 탄생기(④, 1945~1960)가 급성장기(①, 1960~1980)보다 먼저다."}, {"id": "o3", "text": "(1) ④ → (2) ② → (3) ① → (4) ⑤ → (5) ③", "correct": false, "explanation": "Gilbreth 부부의 Old Age(②, 1900~1945)가 가장 먼저이며, HCI(③, 1990~2010) 다음에 스마트폰 UX(⑤, 2010~)가 이어진다."}, {"id": "o4", "text": "(1) ② → (2) ④ → (3) ③ → (4) ① → (5) ⑤", "correct": false, "explanation": "1960~1980년 급성장기(①)가 1990~2010년 정보화 시대 초기 HCI(③)보다 앞선다."}], "source": "1-2 교안 p.12–14"}, {"id": "MC137", "chapter": "개론·역사", "conceptIds": ["OX018"], "type": "single", "stem": "인간공학이 독립된 전문 학문으로 탄생한 시기(Birth of Profession, 1945~1960)의 주요 사건을 발생 연도 순으로 (1) → (2) → (3) → (4)로 배열할 때, <보기>의 번호를 바르게 나열한 것은?", "visual": "<figure class=\"visual-box\"><figcaption><보기> 전문 학문 탄생기(1945~1960)의 주요 사건<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>번호<\/th><th>기관·학회 설립 사건<\/th><\/tr><\/thead><tbody><tr><td>①<\/td><td>국제인간공학회 IEA (International Ergonomics Association) 설립<\/td><\/tr><tr><td>②<\/td><td>영국 Ergonomics Society 창립<\/td><\/tr><tr><td>③<\/td><td>미국 공군 Engineering Psychology Laboratory 설립<\/td><\/tr><tr><td>④<\/td><td>학술지 Journal Ergonomics 창간 및 미국 Human Factors Society 설립<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "options": [{"id": "o1", "text": "(1) ② → (2) ③ → (3) ④ → (4) ①", "correct": false, "explanation": "1945년 미국 Engineering Psychology Lab(③)이 1950년 영국 Ergonomics Society(②)보다 먼저 설립되었다."}, {"id": "o2", "text": "(1) ③ → (2) ② → (3) ④ → (4) ①", "correct": true, "explanation": "1945년 Engineering Psychology Lab(③) → 1950년 영국 Ergonomics Society(②) → 1957년 Journal Ergonomics & 미국 HFS(④) → 1959년 IEA(①) 순이다."}, {"id": "o3", "text": "(1) ③ → (2) ④ → (3) ② → (4) ①", "correct": false, "explanation": "영국 Ergonomics Society(1950년, ②)가 미국 Human Factors Society(1957년, ④)보다 먼저 창립되었다."}, {"id": "o4", "text": "(1) ③ → (2) ② → (3) ① → (4) ④", "correct": false, "explanation": "미국 Human Factors Society(1957년, ④) 설립 이후인 1959년에 국제인간공학회 IEA(①)가 설립되었다."}], "source": "1-2 교안 p.13"}, {"id": "MC138", "chapter": "개론·역사", "conceptIds": ["OX008", "OX009"], "type": "single", "stem": "교안 1-2의 UX 역사(History of UX) 발전 단계 (1) [1960s~1980s] → (2) [1990s] → (3) [2010s~]에 들어갈 <보기>의 번호를 순서대로 바르게 짝지은 것은?", "visual": "<figure class=\"visual-box\"><figcaption><보기> UX 역사(History of UX)의 3단계<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>번호<\/th><th>시기 명칭 및 핵심 영역<\/th><\/tr><\/thead><tbody><tr><td>①<\/td><td>The UX Gold Rush — 스마트폰 보급과 함께 UX/UI Design 및 사용자 조사(User Research)가 정착한 시기<\/td><\/tr><tr><td>②<\/td><td>The Dark Ages — 개발자(DEVELOPER) 단독 중심으로 사용자가 복잡한 기계에 자신을 맞춰야 했던 시기<\/td><\/tr><tr><td>③<\/td><td>Proto UX — 인지인간공학(Cognitive Ergonomics), 정보 설계자(Information Architects), 인터페이스 디자인이 등장한 시기<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "options": [{"id": "o1", "text": "(1) ③ → (2) ② → (3) ①", "correct": false, "explanation": "1960~1980년대는 개발자 중심의 The Dark Ages(②)이며, 1990년대가 Proto UX(③)다."}, {"id": "o2", "text": "(1) ② → (2) ① → (3) ③", "correct": false, "explanation": "1990년대 Proto UX(③)를 거친 뒤 2010년대 The UX Gold Rush(①)로 이어진다."}, {"id": "o3", "text": "(1) ② → (2) ③ → (3) ①", "correct": true, "explanation": "(1) 1960s~1980s The Dark Ages(②) → (2) 1990s Proto UX(③) → (3) 2010s~ The UX Gold Rush(①) 순이다."}, {"id": "o4", "text": "(1) ① → (2) ③ → (3) ②", "correct": false, "explanation": "시간 순서를 최신(2010s~)에서 과거(1960s~1980s)로 거꾸로 배열했다."}], "source": "1-2 교안 p.2–4"}]</script>
<script id="conceptData" type="application/json">[{"id": "OX001", "chapter": "개론·역사", "statement": "사용자 경험(UX, User Experience)의 시간적 범위(UX Scope)는 제품을 현재 사용하는 도중(Present Experience)에만 국한되며, 사용 전(Previous Experience)이나 사용 후(Future Experience)의 경험은 포함하지 않는다.", "answer": false, "explanation": "교안 1-1 p.2에서 UX의 범위(UX Scope)는 사용 전(Previous Experience), 사용 중(Present Experience), 사용 후(Future Experience)의 세 시점을 모두 포괄하며 고객 생애주기(Customer Life Cycle) 전반에 걸쳐 형성된다.", "source": "1-1 교안 p.2–3", "kind": "UX 범위"}, {"id": "OX002", "chapter": "개론·역사", "statement": "교안의 UX 구성 요소(UX Elements) 다이어그램에서 브랜드 인지도(Brand Awareness), 브랜드 태도(Attitude to brand), 브랜드 윤리(Brand Ethics), 브랜드 충성도(Brand Loyalty)는 브랜드 경험(Brand Experience)의 하위 요소에 해당한다.", "answer": true, "explanation": "브랜드 경험(Brand Experience)은 주로 이전 경험(Previous Experience)과 연결되며 인지도·태도·윤리·충성도의 4가지 하위 요소를 포함한다.", "source": "1-1 교안 p.2", "kind": "UX 요소"}, {"id": "OX003", "chapter": "개론·역사", "statement": "교안의 UX 구성 요소에서 감성(Affect), 사용성(Usability), 사용자 가치(User Value)는 제품/서비스 경험(Product/Service Experience)을 구성하는 핵심 요소이다.", "answer": true, "explanation": "현재 제품을 사용할 때의 경험(Present Experience)은 제품/서비스 경험과 직결되며 Affect, Usability, User Value로 구성된다.", "source": "1-1 교안 p.2", "kind": "UX 요소"}, {"id": "OX004", "chapter": "개론·역사", "statement": "종교(Religion), 대인관계(Interpersonal relations), 운동(Exercise) 등 개인적·사회적 맥락은 사용자의 미래 경험 및 전반적인 UX 형성과 무관하므로 UX 요소에서 배제된다.", "answer": false, "explanation": "교안 1-1 p.2 다이어그램 우측 하단에는 Religion, Interpersonal relations, Exercise 등이 UX에 영향을 미치는 요소로 명시되어 있다.", "source": "1-1 교안 p.2", "kind": "UX 요소"}, {"id": "OX005", "chapter": "개론·역사", "statement": "UX 심리학(UX Psychology)은 “심리학 지식과 방법론을 사용자 경험(UX)에 적용하는 학문(The application of Psychology knowledge and methods to User Experience)”으로 정의되며, 디자인과 과학(DESIGN AND SCIENCE)의 결합을 핵심으로 한다.", "answer": true, "explanation": "교안 1-1 p.4–5에서 UX 심리학은 예술적 감각만이 아니라 과학적 심리학 방법론과 디자인을 결합(Design & Science)하는 학문임을 강조한다.", "source": "1-1 교안 p.4–5", "kind": "정의"}, {"id": "OX006", "chapter": "개론·역사", "statement": "UX 디자인(UX Design)의 학문적 연구 영역(Research area of UX)은 인간공학(Ergonomics), 공학(Engineering), 심리학(Psychology), 사회학(Sociology) 4개 분야의 교집합 위에 놓여 있다.", "answer": true, "explanation": "교안 1-1 p.8 벤 다이어그램은 Ergonomics, Engineering, Psychology, Sociology 4개 학문이 만나는 중심에 UX Design을 배치한다.", "source": "1-1 교안 p.8", "kind": "학문 영역"}, {"id": "OX007", "chapter": "개론·역사", "statement": "선택적 주의 실험(Selective Attention Test, The Monkey Business Illusion)은 인간이 특정 과업(흰 옷 팀의 패스 횟수 세기)에 주의 자원을 집중하더라도 시야 중앙을 지나가는 예상치 못한 자극(고릴라)은 항상 100% 인지할 수 있음을 보여준다.", "answer": false, "explanation": "특정 과업에 주의를 집중하면 눈앞을 지나가는 고릴라, 커튼 색상 변화, 선수 퇴장을 보지 못하는 무주의 맹시(Inattentional Blindness)가 발생하며, 이는 인간의 주의 자원이 제한되어 있음을 보여준다.", "source": "1-1 교안 p.9–10", "kind": "선택적 주의"}, {"id": "OX008", "chapter": "개론·역사", "statement": "UX의 역사적 진화 과정에서 1960~1980년대는 개발자(DEVELOPER) 중심의 ‘암흑기(The Dark Ages)’로 불리며, 이후 1990년대 ‘Proto UX’를 거쳐 2010년대 ‘The UX Gold Rush’로 발전하였다.", "answer": true, "explanation": "교안 1-2 p.2–4의 시대 구분: The Dark Ages(1960–1980s, Developer) → Proto UX(1990s) → The UX Gold Rush(2010s, UX/UI Design & User Research).", "source": "1-2 교안 p.2–4", "kind": "UX 역사"}, {"id": "OX009", "chapter": "개론·역사", "statement": "1990년대 ‘Proto UX’ 시기에는 인지인간공학(Cognitive Ergonomics), 정보 설계자(Information Architects), 인터페이스 디자인(Interface Design)이 주요 영역으로 등장하였다.", "answer": true, "explanation": "교안 1-2 p.3에서 Proto UX(1990s)의 3대 축으로 Cognitive Ergonomics, Information Architects, Interface Design을 제시한다.", "source": "1-2 교안 p.3", "kind": "UX 역사"}, {"id": "OX010", "chapter": "개론·역사", "statement": "인간공학(Ergonomics)이라는 용어는 그리스어로 ‘기계’를 뜻하는 Ergon과 ‘효율’을 뜻하는 Nomos의 합성어이다.", "answer": false, "explanation": "Ergonomics는 그리스어로 ‘일·노동(work)’을 뜻하는 Ergon과 ‘법칙(laws)’을 뜻하는 Nomos의 합성어(= 작업의 법칙)이다.", "source": "1-2 교안 p.7", "kind": "어원·정의"}, {"id": "OX011", "chapter": "개론·역사", "statement": "인간공학(Ergonomics)은 유럽에서 주로 쓰이는 명칭이며, 미국에서는 Human Factors(또는 HF Engineering), 미군(US military)에서는 Human Engineering, 미국 심리학계에서는 Engineering Psychology(공학심리학) 또는 Applied Psychology라는 동의어로 불린다.", "answer": true, "explanation": "교안 1-2 p.7 Synonyms에 명시된 지역·집단별 정확히 일치하는 동의어들이다.", "source": "1-2 교안 p.7", "kind": "동의어"}, {"id": "OX012", "chapter": "개론·역사", "statement": "인간공학의 정의에서 최종 목표는 인간의 신체적·정신적·사회적 특성을 이해하여 설계에 적용함으로써 오직 ‘기계 시스템의 출력 속도 극대화’만을 달성하는 것이다.", "answer": false, "explanation": "교안 1-2 p.7에서 인간공학의 목표는 ‘인간의 안녕(human well-being)’과 ‘시스템 성능(system performance)’ 두 가지를 함께 최적화(optimize/improve)하는 것이다.", "source": "1-2 교안 p.7", "kind": "정의"}, {"id": "OX013", "chapter": "개론·역사", "statement": "설계 패러다임의 전환(Paradigm shift in Design)에서 전통적 설계 철학(Traditional design philosophy)은 선발(selection)과 훈련(training)을 통해 ‘사람을 시스템에 맞추는 것(Fitting the Human to the System)’이었다.", "answer": true, "explanation": "전통적 설계는 기계·시스템을 먼저 만들고 그에 맞는 사람을 선발·훈련해 시스템에 적응시키는 방식이었다.", "source": "1-2 교안 p.8–9", "kind": "설계 패러다임"}, {"id": "OX014", "chapter": "개론·역사", "statement": "인간공학적 설계 철학(HFE design philosophy)은 인간공학적 설계(ergonomic design)를 통해 ‘시스템을 사람에게 맞추는 것(Fitting the System to the Human)’이다.", "answer": true, "explanation": "사람을 기계에 맞추던 전통적 관점에서 벗어나 인간의 신체·인지 특성에 맞게 제품과 시스템을 설계하는 패러다임 전환이다.", "source": "1-2 교안 p.8–11", "kind": "설계 패러다임"}, {"id": "OX015", "chapter": "개론·역사", "statement": "인간공학 역사 중 Old Age(1900~1945) 시기에 Frank & Lillian Gilbreth 부부는 시간 및 동작 연구(Time & Motion study, Methods Engineering)와 미세동작분석(Micro-motion analysis)을 통해 ‘therbligs(서블리그)’라는 기본 동작 단위를 고안하였다.", "answer": true, "explanation": "Gilbreth 부부는 작업자의 수작업을 미세동작 단위인 therbligs(Gilbreth 철자를 거꾸로 표기)로 분류하여 시간·동작 연구를 수행했다(교안 1-2 p.12, 기출 핵심!).", "source": "1-2 교안 p.12", "kind": "therbligs · 기출"}, {"id": "OX016", "chapter": "개론·역사", "statement": "therblig(서블리그)는 1990년대 정보화 시대(Information Age)에 스마트폰 터치스크린의 화면 픽셀 해상도를 측정하기 위해 만들어진 디스플레이 단위이다.", "answer": false, "explanation": "therbligs는 1900~1945년 Old Age 시기에 Frank & Lillian Gilbreth 부부가 고안한 미세동작분석(Micro-motion analysis)의 18가지 기본 손동작 단위이다.", "source": "1-2 교안 p.12", "kind": "therbligs · 기출"}, {"id": "OX017", "chapter": "개론·역사", "statement": "1900년부터 제2차 세계대전(1945)까지의 Old Age 시기는 이미 ‘시스템을 인간에게 맞추는’ 현대적 인지인간공학이 완성된 시기였다.", "answer": false, "explanation": "교안 1-2 p.12에 명시된 대로 1900~1945년(World War II 포함) Old Age 시기는 여전히 ‘사람을 직무와 장비에 맞추는(Fitting the human to the job/equipment)’ 관점이 중심이었다.", "source": "1-2 교안 p.12", "kind": "역사"}, {"id": "OX018", "chapter": "개론·역사", "statement": "인간공학이 독립된 전문 학문으로 탄생한 시기(Birth of Profession)는 제2차 세계대전 직후인 1945~1960년으로, 이 시기에 Engineering Psychology Lab(1945), Ergonomics Society(1950), Human Factors Society(1957), 국제인간공학회(IEA, 1959) 등이 설립되었다.", "answer": true, "explanation": "교안 1-2 p.13의 Middle/Modern Age(1945~1980) 중 Birth of Profession(1945~1960) 연표와 정확히 일치한다.", "source": "1-2 교안 p.13", "kind": "역사"}, {"id": "OX019", "chapter": "개론·역사", "statement": "1960~1980년의 급성장기(Rapid Growth)에는 1960년대 군사 및 항공(Military & Aviation) 응용에서 출발하여 1970~1980년대 자동차·소비재로 확대되었고, 정보처리이론과 인지작업부하를 다루는 인지인간공학(Cognitive ergonomics)이 등장하였다.", "answer": true, "explanation": "교안 1-2 p.13 Rapid Growth(1960~1980)의 핵심 발전 흐름이다.", "source": "1-2 교안 p.13", "kind": "역사"}, {"id": "OX020", "chapter": "개론·역사", "statement": "1990~2010년 정보화 시대(Information Age) 초기에는 인간-컴퓨터 상호작용(HCI: Human Computer Interaction)을 중심으로 사용자 인터페이스(User Interface)와 사용성(Usability)의 설계·평가·구현이 핵심 주제가 되었다.", "answer": true, "explanation": "교안 1-2 p.14에서 1990~2010년은 HCI(User Interface/Usability), 2010~2020년은 스마트폰 시대의 UX(User Experience)로 구분한다.", "source": "1-2 교안 p.14", "kind": "역사"}, {"id": "OX021", "chapter": "개론·역사", "statement": "HFE의 3대 영역 중 신체 인간공학(Physical Ergonomics)은 지각(perception), 기억(memory), 추론(reasoning), 운동 반응(motor response)과 같은 인간의 정신 과정(mental process)을 전담하는 분야이다.", "answer": false, "explanation": "지각·기억·추론·운동 반응 등 정신 과정(Mental process)을 다루는 분야는 인지 인간공학(Cognitive Ergonomics)이며, 신체 인간공학(Physical Ergonomics)은 인체측정학(Anthropometric)·생리학(Physiological)·생체역학(Biomechanical) 특성을 다룬다.", "source": "1-2 교안 p.15", "kind": "HFE 영역 구분"}, {"id": "OX022", "chapter": "개론·역사", "statement": "인지 인간공학(Cognitive Ergonomics)은 지각, 기억, 추론, 운동 반응 등의 정신 과정을 다루며, UX는 제품을 사용하는 사용자의 전반적인 만족도(User’s overall satisfaction using a product)를 다룬다.", "answer": true, "explanation": "교안 1-2 p.15의 Physical Ergonomics, Cognitive Ergonomics, UX 3대 영역 정의와 일치한다.", "source": "1-2 교안 p.15", "kind": "HFE 영역 구분"}, {"id": "OX023", "chapter": "개론·역사", "statement": "교안에서 제시한 전기 플러그(Electric Plug) 사례에서, 플러그에 손가락 그립 홈과 당김 손잡이를 만들어 쉽게 뽑을 수 있게 한 것은 ‘사람을 시스템에 맞추는 전통적 설계’의 예시이다.", "answer": false, "explanation": "사용자의 신체적·인지적 특성에 맞춰 플러그 형태를 개선한 것은 ‘시스템을 사람에게 맞추는 인간공학적 설계(HFE design)’의 대표 사례이다.", "source": "1-2 교안 p.10", "kind": "설계 사례"}, {"id": "OX024", "chapter": "개론·역사", "statement": "최근 인간공학 및 인터랙티브심리학의 새로운 연구 주제(New research topic)로는 인공지능 시스템(AI system) 및 AI 기술과 인간의 상호작용이 대두되고 있다.", "answer": true, "explanation": "교안 1-2 p.14, 16–17에서 다가오는 핵심 연구 주제로 AI system / AI technology를 제시한다.", "source": "1-2 교안 p.14–17", "kind": "최신 동향"}, {"id": "OX025", "chapter": "개론·역사", "statement": "인간공학의 학문적 기반에는 해부학(anatomy), 인체측정학(anthropometry), 생체역학(biomechanics), 생리학(physiology)만 포함되며 정신물리학(psychophysics)이나 사회학(sociology)은 포함되지 않는다.", "answer": false, "explanation": "교안 1-2 p.7 정의에서 anatomy, anthropometry, biomechanics, physiology뿐 아니라 psychophysics(정신물리학), psychology(심리학), sociology(사회학)를 모두 명시하고 있다.", "source": "1-2 교안 p.7", "kind": "정의"}, {"id": "OX026", "chapter": "HFE 연구방법론", "statement": "사용자 친화적 제품 설계 프로세스(Design Process for User-friendly Products)에서 인간 특성에 대한 지식(Human Characteristics)은 요구 분석 단계에만 쓰일 뿐, 실험 방법론이나 최종 설계 적용 단계와는 무관하다.", "answer": false, "explanation": "인간 특성 파악(Descriptive) → 방법론·실험 검증(Experimental) → 제품 설계 적용 및 사용성 평가(Evaluation)가 전 과정에 걸쳐 순환적으로 연결된다.", "source": "2장 교안 p.3–4 · 연구방법론 전사1", "kind": "설계 프로세스"}, {"id": "OX027", "chapter": "HFE 연구방법론", "statement": "HFE 연구의 3대 분류 중 기술 연구(Descriptive Research)는 인간의 신체 치수(body size)나 근력(force), BMI 등 인간의 속성(human attributes)을 측정하고 분포를 기술하는 연구이다.", "answer": true, "explanation": "교안 2 p.4: Descriptive Research = characterize human attributes (e.g., measuring body size and force).", "source": "2장 교안 p.4–7", "kind": "연구 유형"}, {"id": "OX028", "chapter": "HFE 연구방법론", "statement": "체질량지수(BMI, Body Mass Index)를 구하는 공식은 체중(kg)을 키(cm)로 단순 나눈 값(\\(\\text{weight(kg)} / \\text{stature(cm)}\\))이다.", "answer": false, "explanation": "교안 2 p.5에서 \\(\\mathrm{BMI} = \\text{weight (kg)} / \\text{stature}^2\\text{ (m}^2\\text{)}\\)로, 체중(kg)을 키(m 단위)의 제곱으로 나누어야 한다.", "source": "2장 교안 p.5", "kind": "BMI 공식"}, {"id": "OX029", "chapter": "HFE 연구방법론", "statement": "인체측정 자료의 백분위수(Percentile) 분포에서 상위 25%에 해당하는 경계값은 25백분위수(25th percentile)가 아니라 75백분위수(75th percentile)이다.", "answer": true, "explanation": "백분위수는 가장 작은 값(0%)부터 누적한 위치이므로 상위 25% 경계는 하위 75% 지점인 75th percentile이다.", "source": "2장 교안 p.6 · 연구방법론 전사1", "kind": "백분위수"}, {"id": "OX030", "chapter": "HFE 연구방법론", "statement": "실험 연구(Experimental Research)는 어떤 변수(독립변수)를 조작하여 인간의 행동 및 수행도(종속변수)에 미치는 효과를 검증하는 연구로, 전자책의 글꼴 종류나 화면 방향(Landscape vs Portrait)에 따른 가독성 분석이 이에 해당한다.", "answer": true, "explanation": "교안 2 p.4, 8–9에 제시된 Experimental Research의 정의 및 대표 사례이다.", "source": "2장 교안 p.4, 8–9", "kind": "연구 유형"}, {"id": "OX031", "chapter": "HFE 연구방법론", "statement": "스마트글래스의 무게 중심 위치(Weight Location: Front, Middle, Ear, Rear)에 따른 코 압력(Pressure on the nose, N) 비교 연구는 완성된 상용 제품의 브랜드 충성도를 조사하는 기술 연구(Descriptive Research)이다.", "answer": false, "explanation": "무게 위치(독립변수)를 4가지 설계 대안으로 조작하여 코 압력(종속변수)에 미치는 효과를 검증한 실험 연구(Experimental Research)이다.", "source": "2장 교안 p.10", "kind": "연구 유형"}, {"id": "OX032", "chapter": "HFE 연구방법론", "statement": "교안의 스마트글래스 무게 위치 실험 결과에서 코에 가해지는 압력(N)은 앞쪽(Front, 0.34 N)에 무게 중심이 있을 때 가장 크고, 뒤쪽(Rear, 0.16 N)으로 갈수록 낮아졌다.", "answer": true, "explanation": "Front(0.34 N) > Middle(0.22 N) > Ear(0.20 N) > Rear(0.16 N) 순으로 측정되었으며, 막대그래프의 오차막대는 표준오차(SE)를 나타낸다.", "source": "2장 교안 p.10", "kind": "실험 결과"}, {"id": "OX033", "chapter": "HFE 연구방법론", "statement": "평가 연구(Evaluation Research)는 제품이나 시스템의 효과성, 즉 사용성(usability)을 평가하는 연구로, 새로운 진공청소기 모델들의 브러시 장착 사용성을 비교 평가하는 사례가 이에 해당한다.", "answer": true, "explanation": "교안 2 p.4, 11: Evaluation Research = assess the effectiveness (called usability) of product or system.", "source": "2장 교안 p.4, 11–13", "kind": "연구 유형"}, {"id": "OX034", "chapter": "HFE 연구방법론", "statement": "교안의 진공청소기 3종(모델 A, B, C) 브러시 장착 평가 연구에서 가장 높은 평가 점수를 받은 모델 A의 우수 특성은 연장관이 290g으로 가볍고, 브러시 체결 방향을 화살표(시각 정보)로 제시하며, 체결 완료 시 소리(청각 피드백, sound feedback)를 제공한 점이다.", "answer": true, "explanation": "교안 2 p.11 표에 정리된 모델 A(삼성 국내용)의 3가지 우수 특성(가벼운 무게 290g, 시각 화살표, 체결 완료 sound feedback)이다.", "source": "2장 교안 p.11", "kind": "평가 사례"}, {"id": "OX035", "chapter": "HFE 연구방법론", "statement": "연구 환경(Research Settings) 중 실험실 연구(Laboratory study)는 현장 연구(Field study)에 비해 현실 충실도(fidelity)가 높고 연구 결과를 실생활로 일반화(generalize)하기가 훨씬 쉽다는 장점이 있다.", "answer": false, "explanation": "높은 충실도(High fidelity)와 일반화 용이성(Easy to generalize)은 현장 연구(Field study)의 장점이다. 실험실 연구(Laboratory study)는 불필요한 외생변수 통제, 반복 용이성, 정확한 데이터 획득이 장점인 반면 낮은 충실도(Low fidelity)와 일반화의 어려움이 단점이다.", "source": "2장 교안 p.14", "kind": "연구 환경 비교"}, {"id": "OX036", "chapter": "HFE 연구방법론", "statement": "현장 연구(Field study)는 높은 현실 충실도와 일반화 가능성을 가지지만, 비용이 많이 들고(High cost) 원치 않는 외생변수를 통제하기 어려우며 참가자의 안전 문제(Safety issue of participants)가 발생할 수 있다는 단점이 있다.", "answer": true, "explanation": "교안 2 p.14 Field study의 장단점 표와 정확히 일치한다.", "source": "2장 교안 p.14", "kind": "연구 환경 비교"}, {"id": "OX037", "chapter": "HFE 연구방법론", "statement": "실험에서 연구자가 관심을 가지고 의도적으로 조작·변경하는 요인(예: 마우스 종류)을 종속변수(Dependent variable)라 하고, 그에 따라 측정되는 결과값(예: 클릭 시간, 만족도 점수)을 독립변수(Independent variable)라 한다.", "answer": false, "explanation": "조작하는 요인(manipulated factor)이 독립변수(Independent variable, IV)이고, 측정되는 결과값(measured value)이 종속변수(Dependent variable, DV)이다.", "source": "2장 교안 p.15", "kind": "실험 변수"}, {"id": "OX038", "chapter": "HFE 연구방법론", "statement": "독립변수와 종속변수 외의 기타 변수(Other variable)를 다루는 방법 중 ‘통제(Control)’는 변수의 조건을 하나로 고정하는 것이고, ‘층화(Stratification)’는 모집단의 계층(성별·연령 등) 비율에 맞춰 표본을 나누어 배정하는 것이다.", "answer": true, "explanation": "교안 2 p.15 및 전사에서 설명한 Control vs. Stratification의 핵심 차이이다.", "source": "2장 교안 p.15 · 연구방법론 전사1", "kind": "실험 변수"}, {"id": "OX039", "chapter": "HFE 연구방법론", "statement": "종속변수(측정 지표, Metrics)를 선정할 때는 공정한 평가를 위해 1) 목표 수준의 적합성(level of target)과 2) 지표의 포괄성(metric comprehensiveness) 두 가지를 반드시 고려해야 한다.", "answer": true, "explanation": "교안 2 p.16: Dependent variables must be selected by considering 1) level of target and 2) metric comprehensiveness to fairly evaluate.", "source": "2장 교안 p.16", "kind": "종속변수 선정"}, {"id": "OX040", "chapter": "HFE 연구방법론", "statement": "인간공학 실험에서 측정하는 종속변수는 크게 수행도 측면(Performance: 시간·오류율 등), 신체·생리적 측면(Physical/Biomechanical: 근전도·생체신호 등), 주관적 측면(Subjective: 리커트 설문 척도 등)의 세 가지로 나눌 수 있다.", "answer": true, "explanation": "연구방법론 전사 2 말미에서 교수님이 정리한 인간 측정치의 3대 영역이다.", "source": "연구방법론 전사2", "kind": "종속변수 분류"}, {"id": "OX041", "chapter": "HFE 연구방법론", "statement": "피험자 선정에서 대표성(Representativity)이란 표본이 목표 모집단(target population)을 편향(Bias) 없이 대표해야 한다는 원칙으로, 이를 위해 무작위 표집(Random sampling) 등을 활용한다.", "answer": true, "explanation": "예컨대 왼손잡이가 10%, 오른손잡이가 90%인 모집단에서 오른손잡이만 뽑으면 편향(Bias)이 발생하므로 대표성을 확보해야 한다.", "source": "2장 교안 p.17", "kind": "피험자 대표성"}, {"id": "OX042", "chapter": "HFE 연구방법론", "statement": "적정 표본 수 산정 공식 \\(n = \\left(\\dfrac{z_{\\alpha/2} \\times s}{k \\times \\bar{x}}\\right)^2\\)에서 유의수준 \\(\\alpha\\)를 \\(0.05\\)에서 \\(0.01\\)로 낮추면(더 엄격하게 설정하면), \\(z_{\\alpha/2}\\) 값이 작아져서 필요한 표본 수 \\(n\\)이 줄어든다.", "answer": false, "explanation": "\\(\\alpha = 0.05\\)일 때 \\(z_{\\alpha/2} = 1.96\\)이고 \\(\\alpha = 0.01\\)일 때 \\(z_{\\alpha/2} = 2.576\\)이다. 즉 \\(\\alpha\\)가 낮아질수록 \\(z\\) 값이 커지므로 필요한 표본 수 \\(n\\)은 증가한다(Lower \\(\\alpha \\to\\) higher \\(z \\to\\) larger \\(n\\)).", "source": "2장 교안 p.18", "kind": "표본 수 공식 · 함정"}, {"id": "OX043", "chapter": "HFE 연구방법론", "statement": "적정 표본 수 산정 공식에서 파일럿 연구 데이터의 표준편차(\\(s\\), 변동성)가 클수록, 그리고 허용 오차 비율인 정밀도 수치(\\(k\\), precision)를 더 작게(더 정밀하게) 설정할수록 필요한 표본 수 \\(n\\)은 커진다.", "answer": true, "explanation": "\\(s\\)는 분자에 있으므로 클수록 \\(n\\)이 커지고, \\(k\\)는 분모에 있으므로 작을수록(더 촘촘한 정밀도를 요구할수록) \\(n\\)이 커진다.", "source": "2장 교안 p.18", "kind": "표본 수 공식"}, {"id": "OX044", "chapter": "HFE 연구방법론", "statement": "파일럿 연구(표본 크기 5명) 결과 평균 \\(\\bar{x}=100\\), 표준편차 \\(s=10\\)일 때, 유의수준 \\(\\alpha=0.05\\)(\\(z=1.96\\))와 정밀도 \\(k=0.05\\)를 만족하기 위한 총 적정 표본 수는 16명이며, 이미 진행한 5명을 제외하면 11명의 추가 표본이 필요하다.", "answer": true, "explanation": "\\(n = (1.96 \\times 10 / (0.05 \\times 100))^2 = (3.92)^2 = 15.366 \\approx 16\\)명이며, 파일럿 5명을 빼면 11명을 더 모집하면 된다(교안 2 p.19).", "source": "2장 교안 p.19", "kind": "표본 수 계산"}, {"id": "OX045", "chapter": "HFE 연구방법론", "statement": "연구 측정 기준의 실무적 요건(Practical requirement) 중 ‘Unobtrusive’란 측정 도구나 절차가 피험자의 자연스러운 과업 수행을 방해하지 않아야 함을 뜻한다.", "answer": true, "explanation": "교안 2 p.20의 6대 실무 요건: Objective, Quantitative, Unobtrusive(방해하지 않음), Easy to collect, No special instrumentation, Cost as little as possible.", "source": "2장 교안 p.20", "kind": "실무 요건"}, {"id": "OX046", "chapter": "HFE 연구방법론", "statement": "신뢰도(Reliability)는 시간이 지나거나 대표 표본들에 걸쳐 반복 측정했을 때 측정값이 일관되고 안정적으로 나오는 정도(consistency or stability)를 의미한다.", "answer": true, "explanation": "교안 2 p.20: Reliability = consistency or stability of the measures over time or across representative samples.", "source": "2장 교안 p.20", "kind": "신뢰도"}, {"id": "OX047", "chapter": "HFE 연구방법론", "statement": "교안의 과녁(다트판) 비교에서 탄착군이 과녁의 정중앙에서 벗어난 한쪽 구석에 아주 촘촘하게 모여 있는 경우(오른쪽 과녁 R)는 ‘정확도(Accuracy)는 높지만 신뢰도(Reliability)는 낮은’ 상태이다.", "answer": false, "explanation": "한곳에 촘촘히 모여 있으므로 일관성인 신뢰도(Reliability)는 높지만, 과녁 중심(참값)에서 벗어나 있으므로 정확도(Accuracy/타당도)가 낮은 상태이다.", "source": "2장 교안 p.21", "kind": "신뢰도 vs 정확도"}, {"id": "OX048", "chapter": "HFE 연구방법론", "statement": "내적 타당도(Internal Validity)는 연구 결과를 다른 집단이나 실제 환경으로 일반화(Generalizability)할 수 있는 정도를 뜻하고, 외적 타당도(External Validity)는 실험 내 혼동변수(Confounding)가 없는 정도를 뜻한다.", "answer": false, "explanation": "두 개념이 반대로 설명되었다. 혼동변수가 없는 정도(No confounding)가 내적 타당도(Internal validity)이고, 결과를 외부로 일반화할 수 있는 정도(Generalizability)가 외적 타당도(External validity)이다.", "source": "2장 교안 p.20", "kind": "내적 vs 외적 타당도"}, {"id": "OX049", "chapter": "HFE 연구방법론", "statement": "웹 검색(Web search) 인터페이스 실험에서 피험자들의 사전 웹 검색 숙련도(experience)를 고려하지 않아 결과가 왜곡되었다면 이는 내적 타당도(Internal validity)가 저하된 사례이다.", "answer": true, "explanation": "교안 2 p.20 Internal validity 예시에 명시된 혼동변수(confounding) 미통제 사례이다.", "source": "2장 교안 p.20", "kind": "내적 타당도"}, {"id": "OX050", "chapter": "HFE 연구방법론", "statement": "구성타당도(Construct Validity) 다이어그램에서 이론적 구성개념(Construct)에는 속하지만 실제 측정치(Measure)가 평가하지 못하고 빠뜨린 부분을 ‘오염(Contamination)’이라 한다.", "answer": false, "explanation": "구성개념에 속하는데 측정에서 빠뜨린 부분은 ‘결핍(Deficiency)’이다. 반대로 구성개념과 무관한 요소가 측정치에 섞여 들어간 것이 ‘오염(Contamination)’이다.", "source": "2장 교안 p.22", "kind": "Deficiency vs Contamination"}, {"id": "OX051", "chapter": "HFE 연구방법론", "statement": "구성타당도(Construct Validity)에서 실제 측정 도구(Measure)가 평가하고 있으나 원래 측정하려던 구성개념(Construct)의 일부가 아닌 무관한 부분이 포함된 것을 ‘Contamination(오염)’이라 한다.", "answer": true, "explanation": "교안 2 p.22: Contamination = things assessed by the measure that are not part of the construct.", "source": "2장 교안 p.22", "kind": "Deficiency vs Contamination"}, {"id": "OX052", "chapter": "HFE 연구방법론", "statement": "스마트글래스 코 압력 그래프에 표시된 오차막대 ‘SE(Standard Error)’는 개별 관측값들의 퍼짐인 표준편차(SD)와 수학적으로 언제나 동일한 값이다.", "answer": false, "explanation": "SE(평균의 표준오차, \\(s/\\sqrt{n}\\))는 표본평균 추정의 불확실성을 나타내며, 개별 데이터의 산포인 표준편차(SD)와는 다른 개념이다.", "source": "2장 교안 p.10 · 원문과 검증", "kind": "SE vs SD"}, {"id": "OX053", "chapter": "HFE 연구방법론", "statement": "보충 논문인 손잡이 설계 연구에서 제시한 4단계 설계 절차는 ‘손 쥐기 특성 파악 → 설계변수와 인체변수 선택 → 설계식 수립 → 시제품 평가’ 순서이다.", "answer": true, "explanation": "2주차 손잡이 인체측정 설계 보충 논문 및 교안 p.13에 제시된 인간공학적 제품 설계 4단계 흐름이다.", "source": "2장 교안 p.13 · 2주차 논문", "kind": "설계 절차"}, {"id": "OX054", "chapter": "정보량·중복도", "statement": "인간 정보처리 모형(Information Processing Model)에서 외부 자극(Stimuli)이 들어와 최종 반응(Responses)으로 나가기까지의 주 경로는 ‘단기감각기억(Short-term sensory store) → 지각(Perception) → 의사결정 및 반응 선택(Decision & response selection) → 반응 실행(Response execution)’ 순서이다.", "answer": true, "explanation": "교안 3 p.6 다이어그램의 중심 수평 정보처리 단계 순서와 정확히 일치한다.", "source": "3장 교안 p.6", "kind": "정보처리 모형"}, {"id": "OX055", "chapter": "정보량·중복도", "statement": "교안의 인간 정보처리 모형에서 작업기억(Working memory / Short-term memory)의 기본 유지 시간(Memory duration)은 별도의 시연이 없을 때 약 20~30초(20~30 sec)로 제시된다.", "answer": true, "explanation": "교안 3 p.6 다이어그램 우측 하단에 Working memory (Short-term memory)의 Memory duration: 20~30 sec가 명시되어 있다.", "source": "3장 교안 p.6", "kind": "작업기억 지속시간"}, {"id": "OX056", "chapter": "정보량·중복도", "statement": "인간 정보처리 모형에서 주의 자원(Attention resources)은 오직 초기 감각 수용(Short-term sensory store)에만 관여하며, 지각이나 의사결정, 반응 실행 단계에는 관여하지 않는다.", "answer": false, "explanation": "교안 3 p.6 다이어그램에서 Attention resources는 Perception, Working memory, Decision & response selection, Response execution 단계들에 자원을 공급한다.", "source": "3장 교안 p.6", "kind": "주의 자원"}, {"id": "OX057", "chapter": "정보량·중복도", "statement": "인간 정보처리 모형에서 반응 실행(Response execution)을 통해 나타난 결과(Responses)는 피드백(Feedback) 루프를 통해 다시 초기 감각 입력 쪽으로 되돌아간다.", "answer": true, "explanation": "교안 3 p.6 하단의 Feedback 화살표는 출력된 반응이 다시 환경 자극으로 피드백됨을 보여준다.", "source": "3장 교안 p.6", "kind": "피드백 루프"}, {"id": "OX058", "chapter": "정보량·중복도", "statement": "정보이론(Information Theory)에서 사건의 불확실성(Uncertainty)이 낮아질수록 과업 완수에 필요한 정보량(Information amount)은 오히려 증가한다.", "answer": false, "explanation": "불확실성과 필요 정보량은 비례한다(Uncertainty ↓ ⇒ Requiring information ↓, Uncertainty ↑ ⇒ Requiring information ↑).", "source": "3장 교안 p.7", "kind": "불확실성과 정보량"}, {"id": "OX059", "chapter": "정보량·중복도", "statement": "정보의 기본 단위인 1 bit(binary digit)는 발생 확률이 동일한 2개의 대안(\\(2^1\\)) 중 하나를 결정하는 과업을 처리할 때 필요한 정보량이다.", "answer": true, "explanation": "교안 3 p.8: 1 bit = amount of information required for processing a task with two equally likely alternatives.", "source": "3장 교안 p.8", "kind": "bit 정의"}, {"id": "OX060", "chapter": "정보량·중복도", "statement": "발생 확률이 모두 같은 등확률 대안들을 처리할 때 필요한 정보량이 4 bits라면, 가능한 대안의 개수(\\(N\\))는 \\(4 \\times 2 = 8\\)개이다.", "answer": false, "explanation": "\\(k\\text{ bits}\\)는 \\(2^k\\)개의 등확률 대안에 대응하므로, \\(4\\text{ bits}\\)일 때 대안의 개수는 \\(2^4 = 16\\)개이다(교안 3 p.8 빈칸).", "source": "3장 교안 p.8", "kind": "등확률 정보량"}, {"id": "OX061", "chapter": "정보량·중복도", "statement": "대안들이 동일한 확률(\\(P = 1/N\\))을 가질 때의 정보량 공식(Ralph Hartley)은 \\(H = \\log_2 N = \\log_2(1/P)\\)이다.", "answer": true, "explanation": "교안 3 p.9 Equation 1(Hartley 식)과 일치한다.", "source": "3장 교안 p.9", "kind": "Hartley 공식"}, {"id": "OX062", "chapter": "정보량·중복도", "statement": "대안들의 발생 확률(\\(p_i\\))이 서로 다를 때의 정보량 공식(Claude Shannon)은 각 대안 정보량의 가중평균인 \\(H = \\sum_{i=1}^N p_i \\log_2(1/p_i) = -\\sum_{i=1}^N p_i \\log_2 p_i\\)이다.", "answer": true, "explanation": "교안 3 p.9 Equation 2(Shannon 엔트로피 식)와 일치한다.", "source": "3장 교안 p.9", "kind": "Shannon 공식"}, {"id": "OX063", "chapter": "정보량·중복도", "statement": "두 대안의 발생 확률이 각각 \\(P_1 = 0.2, P_2 = 0.8\\)일 때, Shannon 공식으로 계산한 평균 정보량(\\(H_{\\text{avg}}\\))은 정확히 \\(1.0\\text{ bit}\\)이다.", "answer": false, "explanation": "\\(H_1 = \\log_2(1/0.2) \\approx 2.322\\), \\(H_2 = \\log_2(1/0.8) \\approx 0.322\\)이므로 \\(H_{\\text{avg}} = 0.2(2.322) + 0.8(0.322) = 0.722\\text{ bits}\\)이다(등확률 0.5, 0.5일 때만 1.0 bit).", "source": "3장 교안 p.9", "kind": "정보량 계산"}, {"id": "OX064", "chapter": "정보량·중복도", "statement": "동전 던지기에서 앞면과 뒷면의 확률이 각각 0.5로 같을 때(Fair coin) 정보량 \\(H\\)는 1 bit로 최대가 되며, 확률이 \\(P(\\text{head})=0.9, P(\\text{tail})=0.1\\)처럼 한쪽으로 치우친 휜 동전(Bent coin)에서는 정보량이 약 \\(0.468\\text{ bit}\\)로 줄어든다.", "answer": true, "explanation": "교안 3 p.10: 대안들의 확률이 균등할수록 불확실성과 정보량이 크고, 한쪽으로 치우칠수록 결과를 예측하기 쉬워져 정보량이 줄어든다.", "source": "3장 교안 p.10", "kind": "확률과 정보량"}, {"id": "OX065", "chapter": "정보량·중복도", "statement": "동전의 앞면이 나올 확률 \\(P\\)를 가로축(0~1), 정보량 \\(H(\\text{bit})\\)를 세로축으로 그래프를 그리면, \\(P=0.5\\)에서 최솟값 0을 갖고 양 끝(\\(P=0, 1\\))에서 최댓값 1을 갖는 아래로 볼록한 U자 곡선이 된다.", "answer": false, "explanation": "\\(P=0\\)이나 \\(P=1\\)이면 결과가 100% 확실하므로 정보량 \\(H=0\\text{ bit}\\)이고, \\(P=0.5\\)에서 \\(H=1\\text{ bit}\\)로 최대가 되는 위로 볼록한 ‘역 U자 곡선’ 형태다.", "source": "3장 교안 p.10 · 정보처리 전사1", "kind": "정보량 곡선"}, {"id": "OX066", "chapter
