<script id="questionData" type="application/json">[{"id": "MC001", "chapter": "개론·역사", "conceptIds": ["OX001", "OX004"], "type": "single", "stem": "쇼핑 앱의 UX 조사 범위를 정한다. 구매를 결정하기까지의 광고 경험, 실제 결제 과정, 사용 후 다른 사람과 경험을 나누는 상황을 고려할 때 가장 적절한 조사 설계는?", "options": [{"id": "o2", "text": "구매 전 기대는 마케팅 자료로 분리하고, UX 조사에는 결제 과정과 사용 후 공유를 반영한다.", "correct": false, "explanation": "구매 전 기대도 UX 범위에 속한다. 마케팅에서 자료를 얻더라도 UX 분석에서 제외할 근거는 아니다."}, {"id": "o3", "text": "실제 결제 과정은 성능 평가로 분리하고, UX 조사에는 기대와 사용 후 공유를 반영한다.", "correct": false, "explanation": "실제 사용 중의 경험도 UX다. 수행시간 같은 성능 지표와 경험 분석을 분리해 범위를 없애면 안 된다."}, {"id": "o4", "text": "사회적 공유는 사용 후 효과로 분리하고, UX 조사에는 구매 전 기대와 결제 과정을 반영한다.", "correct": false, "explanation": "사용 후 공유와 사회적 맥락도 경험 형성에 관여하므로 조사 범위에 포함한다."}, {"id": "o1", "text": "구매 전 기대·사용 과정·사용 후 공유를 조사해 개인·사회 맥락을 함께 반영한다.", "correct": true, "explanation": "UX는 사용 전·중·후를 포괄하며 사용자의 개인적·사회적 맥락도 포함한다."}], "source": "1-1 교안 p.2–3 · 1-1 교안 p.2", "explanation": "UX는 사용 전·중·후를 포괄하며 사용자의 개인적·사회적 맥락도 포함한다.", "commonMistakes": ["구매 전 기대도 UX 범위에 속한다. 마케팅에서 자료를 얻더라도 UX 분석에서 제외할 근거는 아니다.", "실제 사용 중의 경험도 UX다. 수행시간 같은 성능 지표와 경험 분석을 분리해 범위를 없애면 안 된다.", "사용 후 공유와 사회적 맥락도 경험 형성에 관여하므로 조사 범위에 포함한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC002", "chapter": "개론·역사", "conceptIds": ["OX002", "OX003"], "type": "single", "stem": "다음 중 사용자 경험(UX)을 이루는 브랜드 경험(Brand Experience)의 4요소와 제품·서비스 경험(Product/Service Experience)의 3요소를 올바르게 묶은 것은?", "options": [{"id": "o3", "text": "Brand: Awareness·Usability·Ethics·Loyalty / Product·Service: Affect·Attitude·User Value", "correct": false, "explanation": "Usability는 제품·서비스, Attitude to brand는 브랜드 경험에 속한다."}, {"id": "o2", "text": "Brand: Affect·Usability·User Value / Product·Service: Awareness·Attitude·Ethics·Loyalty", "correct": false, "explanation": "두 하위 요소 묶음이 서로 바뀌었다."}, {"id": "o4", "text": "Brand: Awareness·Attitude·Affect·Loyalty / Product·Service: Ethics·Usability·User Value", "correct": false, "explanation": "Affect는 제품·서비스, Brand Ethics는 브랜드 경험의 요소다."}, {"id": "o1", "text": "Brand: Awareness·Attitude·Ethics·Loyalty / Product·Service: Affect·Usability·User Value", "correct": true, "explanation": "브랜드 경험의 네 요소와 제품·서비스 경험의 세 요소를 구분해야 한다."}], "source": "1-1 교안 p.2", "explanation": [], "commonMistakes": []}, {"id": "MC003", "chapter": "개론·역사", "conceptIds": ["OX005", "OX006"], "type": "single", "stem": "UX 심리학의 정의와 학문적 기반을 함께 설명한 것으로 가장 적절한 것은?", "options": [{"id": "o1", "text": "심리학의 지식·방법을 UX에 적용하며 인간공학·공학·심리학·사회학을 연결한다.", "correct": true, "explanation": "UX 심리학은 과학적 심리학의 지식과 방법을 경험의 이해·설계에 적용하는 교차 분야다."}, {"id": "o3", "text": "시각적 선호를 UX의 대표 측정치로 삼아, 과업 관찰보다 디자이너의 감각 평가를 우선한다.", "correct": false, "explanation": "경험에는 지각·수행·기억·사회적 맥락이 관여한다. 감각 평가를 경험 전체의 대표로 대체할 수 없다."}, {"id": "o4", "text": "인체측정과 근력 자료를 UX의 대표 자료로 삼아, 사용자의 경험 차이는 신체 치수로 설명한다.", "correct": false, "explanation": "신체 특성은 한 부분이다. 심리·사회적 특성과 사용 맥락도 분석해야 한다."}, {"id": "o2", "text": "심리학의 지식·방법을 UX에 적용하되, 결과를 디자인에 적용하는 활동은 별도 분야로 구분한다.", "correct": false, "explanation": "UX 심리학의 정의에는 심리학을 경험과 디자인에 적용하는 활동도 들어간다."}], "source": "1-1 교안 p.4–5 · 1-1 교안 p.8", "explanation": "UX 심리학은 과학적 심리학의 지식과 방법을 경험의 이해·설계에 적용하는 교차 분야다.", "commonMistakes": ["경험에는 지각·수행·기억·사회적 맥락이 관여한다. 감각 평가를 경험 전체의 대표로 대체할 수 없다.", "신체 특성은 한 부분이다. 심리·사회적 특성과 사용 맥락도 분석해야 한다.", "UX 심리학의 정의에는 심리학을 경험과 디자인에 적용하는 활동도 들어간다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC004", "chapter": "개론·역사", "conceptIds": ["OX007"], "type": "single", "stem": "패스 횟수 세기에 집중한 참가자가 화면 중앙의 고릴라를 놓쳤다. 이 결과의 핵심 함의는?", "options": [{"id": "o3", "text": "패스 세기 수행이 유지됐으므로, 추가 경보가 요구하는 주의 자원도 충분히 남았다고 본다.", "correct": false, "explanation": "한 과업을 수행했다는 사실이 예상 밖 자극에도 충분한 주의가 배분됐음을 뜻하지 않는다."}, {"id": "o4", "text": "고릴라의 인식 실패를 줄이려면, 패스 세기에 더 집중하도록 지시하는 방법이 우선이다.", "correct": false, "explanation": "같은 과업에 집중을 더 요구하면 다른 자극의 탐지를 보장하지 못한다. 과업 요구와 경보 설계를 함께 검토한다."}, {"id": "o2", "text": "중앙 자극을 놓쳤으므로, 이 결과는 선택적 주의보다 시각 수용기의 감도 저하를 지지한다.", "correct": false, "explanation": "이 결과만으로 감각기관의 손상을 추론할 수 없다. 주의와 의식적 인식의 한계를 구분해야 한다."}, {"id": "o1", "text": "과업에 주의를 배분하면 다른 자극이 시야에 있어도 의식적으로 놓칠 수 있다.", "correct": true, "explanation": "제한된 주의를 패스 세기에 투입한 동안 예상하지 못한 자극의 인식이 실패한 사례다."}], "source": "1-1 교안 p.9–10", "explanation": "제한된 주의를 패스 세기에 투입한 동안 예상하지 못한 자극의 인식이 실패한 사례다.", "commonMistakes": ["한 과업을 수행했다는 사실이 예상 밖 자극에도 충분한 주의가 배분됐음을 뜻하지 않는다.", "같은 과업에 집중을 더 요구하면 다른 자극의 탐지를 보장하지 못한다. 과업 요구와 경보 설계를 함께 검토한다.", "이 결과만으로 감각기관의 손상을 추론할 수 없다. 주의와 의식적 인식의 한계를 구분해야 한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC005", "chapter": "개론·역사", "conceptIds": ["OX008", "OX009"], "type": "single", "stem": "교안의 UX 발전 단계를 오래된 시기부터 배열하고, 각 시기의 주된 관심사를 올바르게 연결한 것은?", "options": [{"id": "o1", "text": "Dark Ages: 개발자 중심 → Proto UX: 인지인간공학·정보설계 → UX Gold Rush: UX/UI·사용자 연구", "correct": true, "explanation": "교안은 개발자 중심 시기, 인지·인터페이스 설계 시기, UX와 사용자 연구 확산의 순서로 정리한다."}, {"id": "o3", "text": "Proto UX: 개발자 중심 → Dark Ages: 인지인간공학·정보설계 → UX Gold Rush: UX/UI·사용자 연구", "correct": false, "explanation": "초기 두 단계의 이름과 순서를 뒤바꾸었다. Dark Ages가 Proto UX에 앞선다."}, {"id": "o4", "text": "Dark Ages: 개발자 중심 → UX Gold Rush: 인지인간공학·정보설계 → Proto UX: UX/UI·사용자 연구", "correct": false, "explanation": "Proto UX와 UX Gold Rush의 순서·주제 대응을 뒤바꾸었다."}, {"id": "o2", "text": "Dark Ages: 사용자 연구 → Proto UX: 인지인간공학·정보설계 → UX Gold Rush: 개발자 중심", "correct": false, "explanation": "시대 순서는 같아도 첫 시기와 마지막 시기의 주제를 뒤바꾸었다."}], "source": "1-2 교안 p.2–4 · 1-2 교안 p.3", "explanation": "교안은 개발자 중심 시기, 인지·인터페이스 설계 시기, UX와 사용자 연구 확산의 순서로 정리한다.", "commonMistakes": ["초기 두 단계의 이름과 순서를 뒤바꾸었다. Dark Ages가 Proto UX에 앞선다.", "Proto UX와 UX Gold Rush의 순서·주제 대응을 뒤바꾸었다.", "시대 순서는 같아도 첫 시기와 마지막 시기의 주제를 뒤바꾸었다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC006", "chapter": "개론·역사", "conceptIds": ["OX010"], "type": "single", "stem": "Ergonomics의 그리스어 어원 Ergon과 Nomos의 뜻을 순서대로 고른 것은?", "options": [{"id": "o2", "text": "기계 / 효율", "correct": false, "explanation": "기계와 효율은 교안의 어원 설명에 해당하지 않는다."}, {"id": "o3", "text": "법칙 / 일·노동", "correct": false, "explanation": "Ergon은 일·노동(work), Nomos는 법칙(laws)이므로 두 단어의 뜻을 반대로 연결했다."}, {"id": "o4", "text": "인간 / 감각", "correct": false, "explanation": "인간과 감각은 Ergon·Nomos의 어원이 아니다."}, {"id": "o1", "text": "일·노동 / 법칙", "correct": true, "explanation": "Ergon은 work, Nomos는 laws를 뜻하여 작업의 법칙이라는 의미를 이룬다."}], "source": "1-2 교안 p.7", "explanation": [], "commonMistakes": []}, {"id": "MC007", "chapter": "개론·역사", "conceptIds": ["OX011"], "type": "single", "stem": "인간공학(Ergonomics)을 부르는 지역·집단별 대표 영문 명칭(유럽, 미국, 미군, 미국 심리학계)을 올바르게 연결한 것은?", "options": [{"id": "o2", "text": "유럽: Human Engineering / 미국: Ergonomics / 미군: Engineering Psychology / 심리학계: Human Factors", "correct": false, "explanation": "지역과 집단에 연결된 명칭이 교안의 표와 다르다."}, {"id": "o4", "text": "유럽: Ergonomics / 미국: Engineering Psychology / 미군: Human Factors / 심리학계: Human Engineering", "correct": false, "explanation": "유럽을 제외한 세 집단의 대표 명칭이 잘못 연결되었다."}, {"id": "o1", "text": "유럽: Ergonomics / 미국: Human Factors / 미군: Human Engineering / 심리학계: Engineering Psychology", "correct": true, "explanation": "교안의 Synonyms 표에 제시된 명칭 구분이다. Applied Psychology도 관련 동의어로 제시된다."}, {"id": "o3", "text": "유럽: Engineering Psychology / 미국: Human Engineering / 미군: Ergonomics / 심리학계: Human Factors", "correct": false, "explanation": "심리학계의 Engineering Psychology를 유럽의 주 명칭으로 잘못 옮겼다."}], "source": "1-2 교안 p.7", "explanation": [], "commonMistakes": []}, {"id": "MC008", "chapter": "개론·역사", "conceptIds": ["OX012", "OX025"], "type": "single", "stem": "인간공학의 목표와 지식 기반을 가장 정확하게 설명한 것은?", "options": [{"id": "o4", "text": "인간의 안녕과 시스템 성능을 개선하기 위해 장비보다 작업자 선발·훈련을 우선 기준으로 삼는다.", "correct": false, "explanation": "HFE의 중심 철학은 인간 특성에 맞춰 시스템을 설계하는 것이다. 장비를 고정한 선발·훈련과 구별한다."}, {"id": "o1", "text": "신체·정신·사회 특성을 설계에 적용하여 인간의 안녕과 시스템 성능을 함께 개선한다.", "correct": true, "explanation": "인간의 안녕과 전체 시스템 성능의 공동 개선이 목표이며 다양한 인간 특성 지식을 활용한다."}, {"id": "o3", "text": "해부학·생체역학은 물리 설계에 적용하고, 지각·기억의 문제는 인간공학 밖에서 다룬다.", "correct": false, "explanation": "인지 인간공학도 HFE에 속한다. 지각·기억·추론은 인간공학의 대상이다."}, {"id": "o2", "text": "신체·정신·사회 특성을 설계에 적용하여 시스템 성능을 최대화하고 안녕은 별도로 평가한다.", "correct": false, "explanation": "인간의 안녕을 설계 목표에서 분리하지 않는다. 두 목표를 함께 고려한다."}], "source": "1-2 교안 p.7", "explanation": "인간의 안녕과 전체 시스템 성능의 공동 개선이 목표이며 다양한 인간 특성 지식을 활용한다.", "commonMistakes": ["HFE의 중심 철학은 인간 특성에 맞춰 시스템을 설계하는 것이다. 장비를 고정한 선발·훈련과 구별한다.", "인지 인간공학도 HFE에 속한다. 지각·기억·추론은 인간공학의 대상이다.", "인간의 안녕을 설계 목표에서 분리하지 않는다. 두 목표를 함께 고려한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC009", "chapter": "개론·역사", "conceptIds": ["OX013", "OX014", "OX023"], "type": "single", "stem": "플러그를 뽑기 어려운 사용자를 위해 그립 홈과 당김 손잡이를 추가했다. 이 접근의 설계 철학은?", "options": [{"id": "o2", "text": "인간을 시스템에 맞추는 접근이며, 장치를 다룰 수 있는 악력 범위의 사용자를 선발한다.", "correct": false, "explanation": "선발은 반대 방향의 접근이다. 사례에서는 사용자 선발 대신 장치의 형태를 개선했다."}, {"id": "o4", "text": "시스템을 인간에게 맞추는 접근이며, 기존 장치의 형태를 유지하고 사용 순서 교육을 바꾼다.", "correct": false, "explanation": "앞의 명칭과 뒤의 조치가 맞지 않는다. 형태를 유지한 사용 교육은 사람의 적응을 요구한다."}, {"id": "o3", "text": "인간을 시스템에 맞추는 접근이며, 기존 장치를 잘 다루도록 사용자에게 당김 동작을 훈련한다.", "correct": false, "explanation": "훈련은 사람을 기존 장치에 맞추는 조치다. 사례의 핵심은 장치 재설계다."}, {"id": "o1", "text": "시스템을 인간에게 맞추는 접근이며, 장치의 형태를 사용자의 치수·힘·동작에 맞게 바꾼다.", "correct": true, "explanation": "그립 홈과 손잡이는 사용자가 장치에 적응하게 하기보다 장치 자체를 바꾸는 설계다."}], "source": "1-2 교안 p.8–9 · 1-2 교안 p.8–11 · 1-2 교안 p.10", "explanation": "그립 홈과 손잡이는 사용자가 장치에 적응하게 하기보다 장치 자체를 바꾸는 설계다.", "commonMistakes": ["선발은 반대 방향의 접근이다. 사례에서는 사용자 선발 대신 장치의 형태를 개선했다.", "앞의 명칭과 뒤의 조치가 맞지 않는다. 형태를 유지한 사용 교육은 사람의 적응을 요구한다.", "훈련은 사람을 기존 장치에 맞추는 조치다. 사례의 핵심은 장치 재설계다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC010", "chapter": "개론·역사", "conceptIds": ["OX015", "OX016"], "type": "single", "stem": "Frank & Lillian Gilbreth가 고안한 therbligs를 올바르게 설명한 것은?", "options": [{"id": "o4", "text": "반응시간을 자극 식별과 반응 선택으로 분해해 인지 시간을 추정하는 처리 단위다.", "correct": false, "explanation": "인지 단계의 시간 차감과 수작업의 미세동작 분해를 혼동했다."}, {"id": "o2", "text": "한 작업 주기의 총 소요시간을 표준화해 작업 속도를 비교하는 시간 단위다.", "correct": false, "explanation": "작업 전체의 표준시간과 기본 미세동작을 혼동했다. therbligs는 동작을 분해하는 단위다."}, {"id": "o3", "text": "작업자의 손 치수와 근력을 등급화해 적합한 직무에 배치하는 인체측정 단위다.", "correct": false, "explanation": "인체측정과 작업자 선발은 관련 연구 주제지만 therbligs의 정의는 수작업 기본 동작이다."}, {"id": "o1", "text": "수작업을 기본 미세동작으로 나누어 분석하는 시간·동작 연구의 동작 단위다.", "correct": true, "explanation": "therbligs는 Gilbreth 부부의 수작업 미세동작 분석에서 쓰는 18가지 기본 동작이다."}], "source": "1-2 교안 p.12", "explanation": "therbligs는 Gilbreth 부부의 수작업 미세동작 분석에서 쓰는 18가지 기본 동작이다.", "commonMistakes": ["인지 단계의 시간 차감과 수작업의 미세동작 분해를 혼동했다.", "작업 전체의 표준시간과 기본 미세동작을 혼동했다. therbligs는 동작을 분해하는 단위다.", "인체측정과 작업자 선발은 관련 연구 주제지만 therbligs의 정의는 수작업 기본 동작이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC011", "chapter": "개론·역사", "conceptIds": ["OX017"], "type": "single", "stem": "인간공학의 역사 중 초기 시대인 Old Age(1900~1945, 제2차 세계대전 이전)의 특징을 가장 적절하게 설명한 것은?", "options": [{"id": "o2", "text": "지각·반응 특성에 맞춘 조종장치 설계와 전문 연구실의 제도화가 시대 구분의 중심이었다.", "correct": false, "explanation": "전문 학문의 형성과 인간 특성에 맞춘 시스템 설계는 교안의 전후 전문화 시기와 연결된다."}, {"id": "o4", "text": "인터페이스의 정보설계와 사용성 평가가 확산되며 HCI가 대표 연구 영역으로 자리 잡았다.", "correct": false, "explanation": "교안에서는 정보화 시대의 대표 흐름으로 구분한다. 초기 시간·동작 연구 시기와 다르다."}, {"id": "o1", "text": "수작업의 시간·동작을 분석하고, 기존 직무·장비에 맞는 작업자를 선발·훈련하는 관점이 중심이었다.", "correct": true, "explanation": "교안의 Old Age는 시간·동작 연구와 사람을 직무에 맞추는 관점으로 정리된다."}, {"id": "o3", "text": "군사·항공 응용을 자동차·소비재로 확장하고 인지인간공학이 분화하는 흐름이 중심이었다.", "correct": false, "explanation": "이 흐름은 교안의 1960~1980년 급성장기 설명에 해당한다."}], "source": "1-2 교안 p.12", "explanation": "교안의 Old Age는 시간·동작 연구와 사람을 직무에 맞추는 관점으로 정리된다.", "commonMistakes": ["전문 학문의 형성과 인간 특성에 맞춘 시스템 설계는 교안의 전후 전문화 시기와 연결된다.", "교안에서는 정보화 시대의 대표 흐름으로 구분한다. 초기 시간·동작 연구 시기와 다르다.", "이 흐름은 교안의 1960~1980년 급성장기 설명에 해당한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC012", "chapter": "개론·역사", "conceptIds": ["OX018"], "type": "single", "stem": "인간공학이 독립된 전문 학문으로 탄생한 시기(Birth of Profession, 1945~1960)에 일어난 주요 사건 묶음으로 옳은 것은?", "options": [{"id": "o1", "text": "Engineering Psychology Lab(1945), Human Factors Society(1957), IEA(1959)", "correct": true, "explanation": "세 기관·학회의 명칭과 설립 연대가 교안의 전문 학문 탄생기 기록과 일치한다."}, {"id": "o2", "text": "Engineering Psychology Lab(1957), Human Factors Society(1945), IEA(1959)", "correct": false, "explanation": "연구실의 1945년과 Human Factors Society의 1957년을 서로 바꾸었다."}, {"id": "o4", "text": "Engineering Psychology Lab(1959), Human Factors Society(1957), IEA(1945)", "correct": false, "explanation": "연구실은 1945년, IEA는 1959년이다. 두 기관의 설립 연도를 바꾸었다."}, {"id": "o3", "text": "Engineering Psychology Lab(1945), Human Factors Society(1959), IEA(1957)", "correct": false, "explanation": "Human Factors Society는 1957년, IEA는 1959년이다. 두 학회의 연도를 바꾸었다."}], "source": "1-2 교안 p.13", "explanation": "세 기관·학회의 명칭과 설립 연대가 교안의 전문 학문 탄생기 기록과 일치한다.", "commonMistakes": ["연구실의 1945년과 Human Factors Society의 1957년을 서로 바꾸었다.", "연구실은 1945년, IEA는 1959년이다. 두 기관의 설립 연도를 바꾸었다.", "Human Factors Society는 1957년, IEA는 1959년이다. 두 학회의 연도를 바꾸었다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC013", "chapter": "개론·역사", "conceptIds": ["OX019"], "type": "single", "stem": "인간공학의 급성장기(Rapid Growth, 1960~1980)에 나타난 핵심 발전 흐름으로 가장 적절한 것은?", "options": [{"id": "o2", "text": "수작업의 동작을 분해해 표준 작업을 찾고, 직무에 적합한 작업자를 선발하는 연구가 시작됐다.", "correct": false, "explanation": "시간·동작 연구와 선발 중심 접근은 교안의 초기 시기와 연결된다."}, {"id": "o3", "text": "독립 연구실과 전문 학회의 설립으로 인간공학이 별도 전문 학문으로 제도화되기 시작했다.", "correct": false, "explanation": "전문 학문 탄생기의 흐름을 급성장기의 응용 확대와 혼동했다."}, {"id": "o4", "text": "사용자 인터페이스·정보설계·사용성 연구가 HCI를 중심으로 정착하는 시기로 구분됐다.", "correct": false, "explanation": "교안의 정보화 시대 설명이다. 1960~1980년 급성장기의 대표 구분과 다르다."}, {"id": "o1", "text": "군사·항공의 인간공학 응용이 자동차·소비재로 확대되고 인지인간공학이 발전했다.", "correct": true, "explanation": "교안의 급성장기는 응용 영역 확대와 인지인간공학의 발전을 핵심으로 한다."}], "source": "1-2 교안 p.13", "explanation": "교안의 급성장기는 응용 영역 확대와 인지인간공학의 발전을 핵심으로 한다.", "commonMistakes": ["시간·동작 연구와 선발 중심 접근은 교안의 초기 시기와 연결된다.", "전문 학문 탄생기의 흐름을 급성장기의 응용 확대와 혼동했다.", "교안의 정보화 시대 설명이다. 1960~1980년 급성장기의 대표 구분과 다르다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC014", "chapter": "개론·역사", "conceptIds": ["OX020", "OX024"], "type": "single", "stem": "1990년대 이후 정보화 시대(Information Age: 1990~2010, 2010~2020)와 최근 인간공학의 핵심 연구 주제를 바르게 연결한 것은?", "options": [{"id": "o3", "text": "1990~2010: HCI·UI·Usability / 2010~2020: 인간–AI 상호작용 / 최근: 스마트폰 UX", "correct": false, "explanation": "교안의 스마트폰 UX 시기와 최근 인간–AI 연구 주제를 뒤바꾸었다."}, {"id": "o2", "text": "1990~2010: 스마트폰 UX / 2010~2020: HCI·UI·Usability / 최근: 인간–AI 상호작용", "correct": false, "explanation": "첫 두 시기의 대표 주제를 뒤바꾸었다. 교안에서는 HCI·사용성에서 스마트폰 UX로 이어진다."}, {"id": "o1", "text": "1990~2010: HCI·UI·Usability / 2010~2020: 스마트폰 UX / 최근: 인간–AI 상호작용", "correct": true, "explanation": "교안이 제시한 각 시기의 대표 연구 주제 대응이다."}, {"id": "o4", "text": "1990~2010: 인간–AI 상호작용 / 2010~2020: 스마트폰 UX / 최근: HCI·UI·Usability", "correct": false, "explanation": "초기 정보화 시대와 최근 시기의 대표 주제를 뒤바꾸었다."}], "source": "1-2 교안 p.14 · 1-2 교안 p.14–17", "explanation": "교안이 제시한 각 시기의 대표 연구 주제 대응이다.", "commonMistakes": ["교안의 스마트폰 UX 시기와 최근 인간–AI 연구 주제를 뒤바꾸었다.", "첫 두 시기의 대표 주제를 뒤바꾸었다. 교안에서는 HCI·사용성에서 스마트폰 UX로 이어진다.", "초기 정보화 시대와 최근 시기의 대표 주제를 뒤바꾸었다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC015", "chapter": "개론·역사", "conceptIds": ["OX021", "OX022"], "type": "single", "stem": "손잡이 직경·근력을 측정하는 연구, 경고 신호의 기억·판단을 분석하는 연구, 제품 사용의 전반적 만족을 평가하는 연구의 분야를 순서대로 고르면?", "options": [{"id": "o4", "text": "Physical Ergonomics / UX / Cognitive Ergonomics", "correct": false, "explanation": "인지 과정 분석과 전반적 사용자 경험 평가의 구분이 바뀌었다."}, {"id": "o3", "text": "UX / Cognitive Ergonomics / Physical Ergonomics", "correct": false, "explanation": "손잡이 치수는 신체 영역이고 전반적 만족은 UX다."}, {"id": "o1", "text": "Physical Ergonomics / Cognitive Ergonomics / UX", "correct": true, "explanation": "신체 특성은 Physical, 지각·기억·추론·운동 반응의 정신 과정은 Cognitive, 전반적 사용자 만족은 UX로 구분한다."}, {"id": "o2", "text": "Cognitive Ergonomics / Physical Ergonomics / UX", "correct": false, "explanation": "손잡이 직경·근력은 Physical, 기억·판단은 Cognitive이므로 두 영역의 연결이 바뀌었다."}], "source": "1-2 교안 p.15", "explanation": [], "commonMistakes": []}, {"id": "MC016", "chapter": "HFE 연구방법론", "conceptIds": ["OX026", "OX053"], "type": "single", "stem": "인간 특성 조사부터 손잡이 제품 평가까지의 흐름으로 가장 적절한 것은?", "options": [{"id": "o3", "text": "인간 특성·설계변수 파악 → 완제품 만족도 평가 → 인체 자료 대체 → 설계 확정", "correct": false, "explanation": "완제품의 만족도만으로 설계에 필요한 치수·힘·파지 자료를 대체할 수 없다."}, {"id": "o2", "text": "인간 특성·설계변수 파악 → 설계안 확정 → 자료 수집·분석 → 기존 설계의 근거로 사용", "correct": false, "explanation": "자료 분석 전에 설계를 확정하고 자료를 정당화에만 사용하면 인간 특성을 설계에 반영하는 순서가 뒤집힌다."}, {"id": "o4", "text": "인간 특성·설계변수 파악 → 설계식 개발 → 제품 적용 → 설계식 자체로 사용성 판정", "correct": false, "explanation": "설계식과 적용이 있어도 실제 제품의 효과성·사용성을 평가하는 절차가 필요하다."}, {"id": "o1", "text": "인간 특성·설계변수 파악 → 자료 수집·분석 → 설계 반영 → 사용성 평가·개선", "correct": true, "explanation": "인간 특성의 자료를 설계에 적용하고 결과를 평가해 개선하는 연결이 중요하다."}], "source": "2장 교안 p.3–4 · 연구방법론 전사1 · 2장 교안 p.13 · 2주차 논문", "explanation": "인간 특성의 자료를 설계에 적용하고 결과를 평가해 개선하는 연결이 중요하다.", "commonMistakes": ["완제품의 만족도만으로 설계에 필요한 치수·힘·파지 자료를 대체할 수 없다.", "자료 분석 전에 설계를 확정하고 자료를 정당화에만 사용하면 인간 특성을 설계에 반영하는 순서가 뒤집힌다.", "설계식과 적용이 있어도 실제 제품의 효과성·사용성을 평가하는 절차가 필요하다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC017", "chapter": "HFE 연구방법론", "conceptIds": ["OX027", "OX030", "OX033"], "type": "single", "stem": "(가) 성인 손 치수의 분포 조사 (나) 화면 방향을 조작해 읽기시간 비교 (다) 완성된 청소기 3종의 사용성 평가. 연구 유형을 순서대로 고르면?", "options": [{"id": "o3", "text": "Descriptive / Evaluation / Experimental", "correct": false, "explanation": "(나)의 핵심은 변수 조작, (다)의 목적은 완성 제품 사용성 평가다."}, {"id": "o4", "text": "Evaluation / Experimental / Descriptive", "correct": false, "explanation": "(가)는 제품 평가가 아니며 (다)는 인간 속성 분포 조사와 다르다."}, {"id": "o1", "text": "Descriptive / Experimental / Evaluation", "correct": true, "explanation": "인간 속성 기술, 독립변수 조작의 효과 검증, 제품 효과성·사용성 평가를 구분한다."}, {"id": "o2", "text": "Experimental / Descriptive / Evaluation", "correct": false, "explanation": "손 치수 분포 기술은 Descriptive이며 화면 방향 조작은 Experimental이다."}], "source": "2장 교안 p.4–7 · 2장 교안 p.4, 8–9 · 2장 교안 p.4, 11–13", "explanation": [], "commonMistakes": []}, {"id": "MC018", "chapter": "HFE 연구방법론", "conceptIds": ["OX028"], "type": "single", "stem": "키 180 cm, 체중 81 kg인 성인의 BMI는?", "options": [{"id": "o3", "text": "\\(22.5\\,\\mathrm{kg}/\\mathrm{m}^2\\)", "correct": false, "explanation": "키의 제곱 대신 두 배를 써 \\(81/(2\\times1.8)=22.5\\)로 계산한 오답이다."}, {"id": "o1", "text": "\\(25\\,\\mathrm{kg}/\\mathrm{m}^2\\)", "correct": true, "explanation": "키를 1.8 m로 바꾸고 \\(81/1.8^2=25\\)로 계산한다."}, {"id": "o2", "text": "\\(45\\,\\mathrm{kg}/\\mathrm{m}^2\\)", "correct": false, "explanation": "키를 m로 바꿨지만 제곱을 빠뜨려 \\(81/1.8=45\\)로 계산한 오답이다."}, {"id": "o4", "text": "\\(0.0025\\,\\mathrm{kg}/\\mathrm{m}^2\\)", "correct": false, "explanation": "cm를 m로 변환하지 않고 \\(81/180^2\\)로 계산했다. 모든 보기에 같은 단위를 제시했으므로 단위 변환 과정으로 판별해야 한다."}], "source": "2장 교안 p.5", "explanation": "키를 1.8 m로 바꾸고 \\(81/1.8^2=25\\)로 계산한다.", "commonMistakes": ["키의 제곱 대신 두 배를 써 \\(81/(2\\times1.8)=22.5\\)로 계산한 오답이다.", "키를 m로 바꿨지만 제곱을 빠뜨려 \\(81/1.8=45\\)로 계산한 오답이다.", "cm를 m로 변환하지 않고 \\(81/180^2\\)로 계산했다. 모든 보기에 같은 단위를 제시했으므로 단위 변환 과정으로 판별해야 한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC019", "chapter": "HFE 연구방법론", "conceptIds": ["OX029"], "type": "single", "stem": "손 너비 자료에서 75백분위수가 90 mm이다. 이 경계값의 해석으로 가장 적절한 것은?", "options": [{"id": "o2", "text": "약 25%가 90 mm 이하이고, 이 값은 상위 약 75%를 가르는 경계다.", "correct": false, "explanation": "아래 누적 비율과 위쪽 비율을 뒤바꾸었다. 75백분위수의 아래 누적은 약 75%다."}, {"id": "o1", "text": "약 75%가 90 mm 이하이고, 이 값은 상위 약 25%를 가르는 경계다.", "correct": true, "explanation": "백분위수는 누적 비율의 경계다. 75백분위수는 아래 누적 약 75%와 위쪽 약 25%를 구분한다."}, {"id": "o4", "text": "손 너비 순서가 아니라 최솟값부터 최댓값까지 거리의 75%가 90 mm다.", "correct": false, "explanation": "백분위 위치는 자료의 누적 순서에 기초한다. 측정 범위 길이의 비율과 다르다."}, {"id": "o3", "text": "약 75%가 평균보다 90 mm 작고, 나머지가 평균보다 90 mm 큰 경계다.", "correct": false, "explanation": "백분위수를 평균으로부터의 편차나 거리로 해석했다. 90 mm는 해당 위치의 관측 단위 값이다."}], "source": "2장 교안 p.6 · 연구방법론 전사1", "explanation": "백분위수는 누적 비율의 경계다. 75백분위수는 아래 누적 약 75%와 위쪽 약 25%를 구분한다.", "commonMistakes": ["아래 누적 비율과 위쪽 비율을 뒤바꾸었다. 75백분위수의 아래 누적은 약 75%다.", "백분위 위치는 자료의 누적 순서에 기초한다. 측정 범위 길이의 비율과 다르다.", "백분위수를 평균으로부터의 편차나 거리로 해석했다. 90 mm는 해당 위치의 관측 단위 값이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC020", "chapter": "HFE 연구방법론", "conceptIds": ["OX031", "OX032", "OX052"], "type": "single", "stem": "스마트글래스 무게 위치를 바꾸어 코 하중을 측정했다. Front 0.34, Middle 0.22, Ear 0.20, Rear 0.16 N이며 오차막대는 SE다. 올바른 해석은?", "options": [{"id": "o3", "text": "IV는 무게 위치, DV는 코 하중이다. Rear 평균이 가장 낮고 SE는 개별 코 하중의 산포를 나타낸다.", "correct": false, "explanation": "개별값의 산포는 SD다. 제시된 오차막대 SE는 평균 추정의 불확실성이다."}, {"id": "o4", "text": "IV는 무게 위치, DV는 코 하중이다. Rear 평균이 가장 낮으므로 네 조건의 모든 쌍이 유의하게 다르다.", "correct": false, "explanation": "평균 순서나 SE 막대만으로 모든 쌍의 유의차를 확정할 수 없다. 비교 검정 결과가 필요하다."}, {"id": "o1", "text": "IV는 무게 위치, DV는 코 하중이다. Rear 평균이 가장 낮고 SE는 평균 추정의 불확실성을 나타낸다.", "correct": true, "explanation": "위치를 조작하고 코 하중을 측정했다. SE는 개별값의 산포인 SD와 구분한다."}, {"id": "o2", "text": "IV는 코 하중, DV는 무게 위치다. Rear 평균이 가장 낮고 SE는 평균 추정의 불확실성을 나타낸다.", "correct": false, "explanation": "평균과 SE의 해석은 맞지만 조작변수와 결과변수를 바꾸었다."}], "source": "2장 교안 p.10 · 2장 교안 p.10 · 원문과 검증", "visual": "<figure class=\"visual-box\"><figcaption>무게 위치 4조건과 코 하중 평균 (N) — 오차막대의 의미는 지문에 제시<\/figcaption><svg role=\"img\" aria-label=\"무게 위치 4조건과 코 하중 평균 (N) — 오차막대의 의미는 지문에 제시\" viewBox=\"0 0 600 180\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M50 20V145H575\" fill=\"none\" stroke=\"#777\"/><rect x=\"80\" y=\"42.999999999999986\" width=\"65\" height=\"102.00000000000001\" fill=\"#c4cfdb\"/><text x=\"112\" y=\"34.999999999999986\" text-anchor=\"middle\">0.34<\/text><text x=\"112\" y=\"170\" text-anchor=\"middle\">Front<\/text><rect x=\"205\" y=\"79.0\" width=\"65\" height=\"66.0\" fill=\"#c4cfdb\"/><text x=\"237\" y=\"71.0\" text-anchor=\"middle\">0.22<\/text><text x=\"237\" y=\"170\" text-anchor=\"middle\">Middle<\/text><rect x=\"330\" y=\"85.0\" width=\"65\" height=\"60.0\" fill=\"#c4cfdb\"/><text x=\"362\" y=\"77.0\" text-anchor=\"middle\">0.20<\/text><text x=\"362\" y=\"170\" text-anchor=\"middle\">Ear<\/text><rect x=\"455\" y=\"97.0\" width=\"65\" height=\"48.0\" fill=\"#c4cfdb\"/><text x=\"487\" y=\"89.0\" text-anchor=\"middle\">0.16<\/text><text x=\"487\" y=\"170\" text-anchor=\"middle\">Rear<\/text><\/svg><\/figure>", "explanation": "위치를 조작하고 코 하중을 측정했다. SE는 개별값의 산포인 SD와 구분한다.", "commonMistakes": ["개별값의 산포는 SD다. 제시된 오차막대 SE는 평균 추정의 불확실성이다.", "평균 순서나 SE 막대만으로 모든 쌍의 유의차를 확정할 수 없다. 비교 검정 결과가 필요하다.", "평균과 SE의 해석은 맞지만 조작변수와 결과변수를 바꾸었다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC021", "chapter": "HFE 연구방법론", "conceptIds": ["OX034"], "type": "single", "stem": "세 청소기의 브러시 장착을 평가한 결과 A의 사용성 점수가 가장 높았다. 아래 설계 차이로 A의 평가 우위를 설명할 때 가장 타당한 해석은?", "options": [{"id": "o4", "text": "질량·화살표·소리의 개별 효과는 세 모델의 종합 사용성 점수 차이를 각 요소에 균등 배분하여 추정한다.", "correct": false, "explanation": "여러 요소가 함께 달라져 개별 인과 효과를 균등 배분할 근거가 없다. 요소를 분리한 비교가 필요하다."}, {"id": "o3", "text": "질량 감소는 조작 부담을, 화살표는 브랜드의 개념 양립성을 높이고, 완료 소리는 체결 상태 확인을 돕는다.", "correct": false, "explanation": "화살표는 이 과업의 조작 방향을 안내한다. 브랜드 의미와 체결 방향의 정보를 혼동했다."}, {"id": "o1", "text": "질량 감소는 조작 부담을, 화살표는 체결 방향의 불확실성을 줄이고, 완료 소리는 체결 상태 확인을 돕는다.", "correct": true, "explanation": "세 특징을 신체 부담·방향 판단·결과 피드백과 연결했다. 표만으로 개별 효과 크기를 분리 추정한 것은 아니다."}, {"id": "o2", "text": "질량 감소는 조작 부담을, 화살표는 체결 방향의 불확실성을 줄이고, 완료 소리는 다음 동작의 시연을 돕는다.", "correct": false, "explanation": "완료 소리는 이미 일어난 체결 결과의 피드백이다. 정보를 되뇌어 유지하는 시연과 구분한다."}], "source": "2장 교안 p.11", "explanation": "세 특징을 신체 부담·방향 판단·결과 피드백과 연결했다. 표만으로 개별 효과 크기를 분리 추정한 것은 아니다.", "commonMistakes": ["여러 요소가 함께 달라져 개별 인과 효과를 균등 배분할 근거가 없다. 요소를 분리한 비교가 필요하다.", "화살표는 이 과업의 조작 방향을 안내한다. 브랜드 의미와 체결 방향의 정보를 혼동했다.", "완료 소리는 이미 일어난 체결 결과의 피드백이다. 정보를 되뇌어 유지하는 시연과 구분한다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>브러시 장착 조건 · 모델별 설계 비교<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>모델<\/th><th>연장관 질량<\/th><th>체결 방향 표시<\/th><th>체결 완료 소리<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>290 g<\/td><td>제공<\/td><td>제공<\/td><\/tr><tr><td>B<\/td><td>513 g<\/td><td>미제시<\/td><td>미제시<\/td><\/tr><tr><td>C<\/td><td>545 g<\/td><td>미제시<\/td><td>미제시<\/td><\/tr><\/tbody><\/table><\/div><p class=\"analysis-note\">미제시는 원자료에서 해당 기능이 별도로 설명되지 않았다는 뜻이다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC022", "chapter": "HFE 연구방법론", "conceptIds": ["OX035", "OX036"], "type": "single", "stem": "외생변수 통제와 반복 측정을 우선한 연구 A, 실제 사용 맥락과 일반화 가능성을 우선한 연구 B의 비교로 적절한 것은?", "options": [{"id": "o1", "text": "A는 Laboratory, B는 Field다. A는 통제에, B는 실제 사용 맥락 반영에 유리하다.", "correct": true, "explanation": "실험실의 통제·반복과 현장의 현실 충실도·일반화 가능성을 구분한다."}, {"id": "o4", "text": "A는 Laboratory, B는 Field다. A가 통제되므로 그 결과의 현장 일반화도 더 쉽다.", "correct": false, "explanation": "통제가 높다는 사실만으로 실제 환경으로의 일반화가 더 쉬워지는 것은 아니다."}, {"id": "o3", "text": "A는 Laboratory, B는 Field다. B가 실제 환경이므로 외생변수 통제도 A보다 쉽다.", "correct": false, "explanation": "현실 충실도와 외생변수 통제 용이성은 다르다. 현장에서는 통제·반복이 어려울 수 있다."}, {"id": "o2", "text": "A는 Field, B는 Laboratory다. A는 반복에, B는 실제 사용 맥락 반영에 유리하다.", "correct": false, "explanation": "연구 환경의 명칭을 바꾸었다. 통제·반복 중심의 A가 실험실이다."}], "source": "2장 교안 p.14", "explanation": "실험실의 통제·반복과 현장의 현실 충실도·일반화 가능성을 구분한다.", "commonMistakes": ["통제가 높다는 사실만으로 실제 환경으로의 일반화가 더 쉬워지는 것은 아니다.", "현실 충실도와 외생변수 통제 용이성은 다르다. 현장에서는 통제·반복이 어려울 수 있다.", "연구 환경의 명칭을 바꾸었다. 통제·반복 중심의 A가 실험실이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC023", "chapter": "HFE 연구방법론", "conceptIds": ["OX037"], "type": "single", "stem": "마우스 종류 3종을 연구자가 바꾸고 클릭 시간과 만족도를 기록했다. IV와 DV를 올바르게 구분한 것은?", "options": [{"id": "o2", "text": "IV: 클릭 시간 / DV: 마우스 종류·만족도", "correct": false, "explanation": "측정한 시간을 조작 변수로 잘못 배치했다."}, {"id": "o3", "text": "IV: 만족도 / DV: 마우스 종류·클릭 시간", "correct": false, "explanation": "만족도는 측정 결과이며 마우스 종류가 조작 요인이다."}, {"id": "o4", "text": "IV: 클릭 시간·만족도 / DV: 마우스 종류", "correct": false, "explanation": "독립·종속변수의 정의를 완전히 뒤집었다."}, {"id": "o1", "text": "IV: 마우스 종류 / DV: 클릭 시간·만족도", "correct": true, "explanation": "조작 요인이 IV이고 측정 결과가 DV다. 시간과 주관적 만족도 모두 결과 지표가 될 수 있다."}], "source": "2장 교안 p.15", "explanation": [], "commonMistakes": []}, {"id": "MC024", "chapter": "HFE 연구방법론", "conceptIds": ["OX038", "OX041"], "type": "single", "stem": "왼손잡이 10%, 오른손잡이 90%인 모집단을 연구한다. 조명은 일정하게 두고 손잡이 비율은 모집단에 맞추어 표집했다. 이를 설명하면?", "options": [{"id": "o4", "text": "조명 고정은 Control, 손잡이 비율 배정은 Stratification이며 다른 사용자 특성의 대표성도 확보된다.", "correct": false, "explanation": "손잡이 비율을 맞춰도 연령·숙련도 등 모든 특성이 대표된다고 할 수 없다."}, {"id": "o2", "text": "조명 고정은 Stratification, 손잡이 비율 배정은 Control이며 모집단 구성을 표본에 반영한다.", "correct": false, "explanation": "조명을 한 수준으로 고정하는 것은 통제이고 층별 비율 배정은 층화다. 두 명칭을 뒤바꾸었다."}, {"id": "o3", "text": "조명 고정은 Control, 손잡이 비율 배정은 무선할당이며 각 실험조건의 인과효과를 보장한다.", "correct": false, "explanation": "모집단 비율로 표집하는 것과 표본을 실험조건에 무선할당하는 것은 다르다. 층화만으로 인과효과가 보장되지 않는다."}, {"id": "o1", "text": "조명 고정은 Control, 손잡이 비율 배정은 Stratification이며 모집단 구성을 표본에 반영한다.", "correct": true, "explanation": "외생변수 고정과 층별 표본 배분은 서로 다른 절차다. 층별 구성 반영은 대표성 확보에 도움을 준다."}], "source": "2장 교안 p.15 · 연구방법론 전사1 · 2장 교안 p.17", "explanation": "외생변수 고정과 층별 표본 배분은 서로 다른 절차다. 층별 구성 반영은 대표성 확보에 도움을 준다.", "commonMistakes": ["손잡이 비율을 맞춰도 연령·숙련도 등 모든 특성이 대표된다고 할 수 없다.", "조명을 한 수준으로 고정하는 것은 통제이고 층별 비율 배정은 층화다. 두 명칭을 뒤바꾸었다.", "모집단 비율로 표집하는 것과 표본을 실험조건에 무선할당하는 것은 다르다. 층화만으로 인과효과가 보장되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC025", "chapter": "HFE 연구방법론", "conceptIds": ["OX039", "OX040"], "type": "single", "stem": "사용성을 시간·오류율, 근전도, 리커트 만족도 척도로 평가한다. 지표 구성 원칙을 올바르게 설명한 것은?", "options": [{"id": "o1", "text": "시간·오류율은 Performance, 근전도는 Physical, 만족도는 Subjective다. 목표 적합성·포괄성도 점검한다.", "correct": true, "explanation": "수행·신체·주관 측면을 구별하면서 연구 목표를 충분히 측정하는지 확인해야 한다."}, {"id": "o3", "text": "세 지표는 수치로 기록되므로 모두 Performance다. 단위가 다르더라도 측정 측면은 동일한 것으로 본다.", "correct": false, "explanation": "수치형 자료라는 형식이 측정 측면을 결정하지 않는다. 생리·주관 지표도 수치로 기록할 수 있다."}, {"id": "o4", "text": "세 지표는 각각 Performance·Physical·Subjective다. 세 측면을 포함하면 연구 목표 적합성도 충족한 것으로 본다.", "correct": false, "explanation": "여러 측면을 수집했다는 사실만으로 측정이 목표 구성개념에 적합하고 충분하다고 보장되지 않는다."}, {"id": "o2", "text": "시간·오류율은 Subjective, 근전도는 Physical, 만족도는 Performance다. 목표 적합성·포괄성도 점검한다.", "correct": false, "explanation": "수행 지표와 주관 지표를 뒤바꾸었다. 측정된 시간이 주관 지표가 되는 것은 아니다."}], "source": "2장 교안 p.16 · 연구방법론 전사2", "explanation": "수행·신체·주관 측면을 구별하면서 연구 목표를 충분히 측정하는지 확인해야 한다.", "commonMistakes": ["수치형 자료라는 형식이 측정 측면을 결정하지 않는다. 생리·주관 지표도 수치로 기록할 수 있다.", "여러 측면을 수집했다는 사실만으로 측정이 목표 구성개념에 적합하고 충분하다고 보장되지 않는다.", "수행 지표와 주관 지표를 뒤바꾸었다. 측정된 시간이 주관 지표가 되는 것은 아니다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC026", "chapter": "HFE 연구방법론", "conceptIds": ["OX042"], "type": "single", "stem": "\\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)에서 다른 조건을 고정하고 α를 0.05에서 0.01로 줄였다. 필요한 표본 수의 변화는?", "options": [{"id": "o1", "text": "더 작은 α에 대응하는 z가 커지므로, 같은 나머지 값에서 필요한 n은 증가한다.", "correct": true, "explanation": "양측 기준에서 α를 낮추면 임계 z가 커진다. 공식에서 n은 z의 제곱에 비례한다."}, {"id": "o2", "text": "더 작은 α에 대응하는 z가 작아지므로, 같은 나머지 값에서 필요한 n은 감소한다.", "correct": false, "explanation": "유의수준과 임계값의 방향을 바꾸었다. 더 엄격한 기준일수록 z가 커진다."}, {"id": "o4", "text": "α가 식에 직접 나타나지 않으므로, 다른 값을 고정하면 z와 필요한 n은 유지된다.", "correct": false, "explanation": "α는 z를 통해 식에 반영된다. 글자 α가 직접 없다는 이유로 영향을 없앨 수 없다."}, {"id": "o3", "text": "더 작은 α에 대응하는 z는 커지지만, z가 분모에 작용하므로 필요한 n은 감소한다.", "correct": false, "explanation": "제시된 식에서 z는 분자에 있고 n은 z의 제곱에 비례한다."}], "source": "2장 교안 p.18", "stemPlain": "\\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)에서 다른 조건을 고정하고 α를 0.05에서 0.01로 줄였다. 필요한 표본 수의 변화는?", "explanation": "양측 기준에서 α를 낮추면 임계 z가 커진다. 공식에서 n은 z의 제곱에 비례한다.", "commonMistakes": ["유의수준과 임계값의 방향을 바꾸었다. 더 엄격한 기준일수록 z가 커진다.", "α는 z를 통해 식에 반영된다. 글자 α가 직접 없다는 이유로 영향을 없앨 수 없다.", "제시된 식에서 z는 분자에 있고 n은 z의 제곱에 비례한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC027", "chapter": "HFE 연구방법론", "conceptIds": ["OX043"], "type": "single", "stem": "적정 표본 수 공식 \\(n=\\left(\\frac{zs}{k\\bar{x}}\\right)^2\\)에서 같은 평균 \\(\\bar{x}\\)와 \\(z\\)를 유지한 채 표준편차 \\(s\\)를 2배, 허용 상대오차 \\(k\\)를 절반으로 하면 필요한 표본 수 \\(n\\)은 몇 배가 되는가?", "options": [{"id": "o1", "text": "16배", "correct": true, "explanation": "n은 \\(\\frac{s^{2}}{k^{2}}\\)에 비례한다. 분자 2배와 분모 \\(\\frac{1}{2}\\)배로 괄호 전체가 4배, 제곱하면 16배다."}, {"id": "o4", "text": "1배", "correct": false, "explanation": "s 증가와 k 감소는 모두 필요한 n을 늘리는 방향이다."}, {"id": "o2", "text": "4배", "correct": false, "explanation": "s의 변화만 반영하거나 k의 제곱 효과를 빠뜨린 값이다."}, {"id": "o3", "text": "8배", "correct": false, "explanation": "공식 전체가 제곱된다는 점을 일관되게 적용하지 않은 값이다."}], "source": "2장 교안 p.18", "explanation": [], "commonMistakes": []}, {"id": "MC028", "chapter": "HFE 연구방법론", "conceptIds": ["OX044"], "type": "single", "stem": "파일럿 5명의 평균은 \\(\\bar{x}=80\\), 표준편차는 \\(s=10\\)이다. 이 문항은 \\(z=2\\), \\(k=0.1\\)을 사용한다. \\(n=(zs/(k\\bar{x}))^2\\)로 최소 총 인원을 정할 때, 파일럿도 최종 표본에 포함하면 추가 모집 인원은?", "options": [{"id": "o1", "text": "2명", "correct": true, "explanation": "\\(n=(20/8)^2=(5/2)^2=25/4=6.25\\)다. 최소 총 인원은 올림한 7명이며 \\(7-5=2\\)명을 더 모집한다."}, {"id": "o3", "text": "7명", "correct": false, "explanation": "7명은 올림한 총 필요 인원이다. 이미 포함된 파일럿 5명을 빼야 추가 모집 인원이 된다."}, {"id": "o2", "text": "1명", "correct": false, "explanation": "6.25명을 6명으로 내리면 필요한 최소 총 인원을 충족하지 못한다. 올림한 7명에서 파일럿 5명을 뺀다."}, {"id": "o4", "text": "12명", "correct": false, "explanation": "총 필요 인원 7명에 파일럿 5명을 다시 더한 값이다. 포함된 파일럿은 추가할 수에서 빼야 한다."}], "source": "2장 교안 p.19 · 손계산용 수치/표기 변형", "stemPlain": "파일럿 5명의 평균은 \\(\\bar{x}=80\\), 표준편차는 \\(s=10\\)이다. 이 문항은 \\(z=2\\), \\(k=0.1\\)을 사용한다. \\(n=(zs/(k\\bar{x}))^2\\)로 최소 총 인원을 정할 때, 파일럿도 최종 표본에 포함하면 추가 모집 인원은?", "explanation": "\\(n=(20/8)^2=(5/2)^2=25/4=6.25\\)다. 최소 총 인원은 올림한 7명이며 \\(7-5=2\\)명을 더 모집한다.", "commonMistakes": ["7명은 올림한 총 필요 인원이다. 이미 포함된 파일럿 5명을 빼야 추가 모집 인원이 된다.", "6.25명을 6명으로 내리면 필요한 최소 총 인원을 충족하지 못한다. 올림한 7명에서 파일럿 5명을 뺀다.", "총 필요 인원 7명에 파일럿 5명을 다시 더한 값이다. 포함된 파일럿은 추가할 수에서 빼야 한다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC029", "chapter": "HFE 연구방법론", "conceptIds": ["OX045"], "type": "single", "stem": "실제 작업을 관찰할 때 측정 장치가 작업을 방해하여 수행시간이 바뀌었다. 가장 직접적으로 위반한 실무 요건은?", "options": [{"id": "o4", "text": "Cost as little as possible", "correct": false, "explanation": "비용이 낮아도 측정이 행동을 방해하면 Unobtrusive 요건을 위반한다."}, {"id": "o1", "text": "Unobtrusive", "correct": true, "explanation": "측정이 대상의 자연스러운 작업을 방해하지 않아야 한다. 다른 요건은 Objective, Quantitative, Easy to collect, No special instrumentation, Low cost다."}, {"id": "o2", "text": "Quantitative", "correct": false, "explanation": "수치 측정 여부가 아니라 관찰·장치가 작업을 방해한 것이 핵심이다."}, {"id": "o3", "text": "Easy to collect", "correct": false, "explanation": "수집 편의와 측정으로 인한 행동 방해는 서로 다른 요건이다."}], "source": "2장 교안 p.20", "explanation": [], "commonMistakes": []}, {"id": "MC030", "chapter": "HFE 연구방법론", "conceptIds": ["OX046", "OX047"], "type": "single", "stem": "같은 조건에서 반복 측정한 값이 서로 매우 가깝지만 참값보다 일관되게 10만큼 높다. 측정의 상태는?", "options": [{"id": "o2", "text": "Reliability와 Accuracy가 모두 높다.", "correct": false, "explanation": "촘촘한 분포는 일관성의 증거이며 참값과의 거리는 별도로 보아야 한다."}, {"id": "o4", "text": "Reliability와 Accuracy가 모두 낮다.", "correct": false, "explanation": "참값에서 벗어난 것은 맞지만 반복 측정의 일관성은 높다."}, {"id": "o1", "text": "Reliability는 높고 Accuracy는 낮다.", "correct": true, "explanation": "반복 값의 일관성은 높으나 체계적 편향 때문에 참값에 가깝지 않다. 신뢰도만으로 정확도·타당도를 보장하지 않는다."}, {"id": "o3", "text": "Reliability는 낮고 Accuracy는 높다.", "correct": false, "explanation": "반복 값이 가깝다는 것은 높은 신뢰도이며 참값에서 벗어나 정확도는 낮다."}], "source": "2장 교안 p.20 · 2장 교안 p.21", "visual": "<figure class=\"visual-box\"><figcaption>반복 측정 분포와 참값 — 각 점은 동일 조건의 측정<\/figcaption><svg role=\"img\" aria-label=\"반복 측정 분포와 참값 — 각 점은 동일 조건의 측정\" viewBox=\"0 0 600 180\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M40 120H560\" stroke=\"#777\"/><path d=\"M160 35V130\" stroke=\"#333\" stroke-dasharray=\"5 5\"/><text x=\"160\" y=\"155\" text-anchor=\"middle\">참값<\/text><text x=\"405\" y=\"155\" text-anchor=\"middle\">참값 + 10<\/text><circle cx=\"394\" cy=\"105\" r=\"5\" fill=\"#5f738b\"/><circle cx=\"402\" cy=\"95\" r=\"5\" fill=\"#5f738b\"/><circle cx=\"410\" cy=\"105\" r=\"5\" fill=\"#5f738b\"/><circle cx=\"399\" cy=\"83\" r=\"5\" fill=\"#5f738b\"/><circle cx=\"411\" cy=\"88\" r=\"5\" fill=\"#5f738b\"/><circle cx=\"406\" cy=\"73\" r=\"5\" fill=\"#5f738b\"/><\/svg><\/figure>", "explanation": [], "commonMistakes": []}, {"id": "MC031", "chapter": "HFE 연구방법론", "conceptIds": ["OX048", "OX049"], "type": "single", "stem": "새 UI 집단은 전문가, 기존 UI 집단은 초보자로 구성한 뒤 수행시간 차이를 UI 효과라고 결론 내렸다. 가장 직접적인 문제는?", "options": [{"id": "o2", "text": "대표 표본이 아니라는 외적 타당도 문제이므로, 각 UI 집단의 크기만 늘리면 인과효과를 분리할 수 있다.", "correct": false, "explanation": "집단 크기를 늘려도 조건별 숙련도 혼동은 남는다. 외적 타당도와 내적 타당도를 구분한다."}, {"id": "o1", "text": "조건별 숙련도가 UI와 함께 달라져, 시간 차이를 UI의 인과효과로 분리하기 어렵다.", "correct": true, "explanation": "숙련도라는 혼동변수 때문에 내적 타당도가 낮아진다. 배정·통제가 필요하다."}, {"id": "o4", "text": "두 UI에서 같은 시간 단위를 사용했으므로, 집단 간 차이는 숙련도보다 UI에 귀속하는 것이 타당하다.", "correct": false, "explanation": "동일 단위는 필요한 측정 조건일 뿐 인과효과의 식별 근거가 아니다."}, {"id": "o3", "text": "완료시간의 반복 측정이 안정적이면, 구성타당도가 확보되어 숙련도 차이의 영향도 통제된다.", "correct": false, "explanation": "반복 일관성·구성타당도·교란 통제는 다르다. 신뢰도가 높아도 배정의 혼동은 해결되지 않는다."}], "source": "2장 교안 p.20", "explanation": "숙련도라는 혼동변수 때문에 내적 타당도가 낮아진다. 배정·통제가 필요하다.", "commonMistakes": ["집단 크기를 늘려도 조건별 숙련도 혼동은 남는다. 외적 타당도와 내적 타당도를 구분한다.", "동일 단위는 필요한 측정 조건일 뿐 인과효과의 식별 근거가 아니다.", "반복 일관성·구성타당도·교란 통제는 다르다. 신뢰도가 높아도 배정의 혼동은 해결되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC032", "chapter": "HFE 연구방법론", "conceptIds": ["OX050", "OX051"], "type": "single", "stem": "사용성을 속도로만 평가해 만족도를 빠뜨린 경우와, 사용성 점수에 브랜드 호감이 섞인 경우의 문제를 순서대로 고르면?", "options": [{"id": "o1", "text": "Deficiency / Contamination", "correct": true, "explanation": "구성개념의 일부를 빠뜨리면 결핍, 구성개념 밖 요소가 섞이면 오염이다. 둘 다 Construct validity와 관련된다."}, {"id": "o2", "text": "Contamination / Deficiency", "correct": false, "explanation": "측정에서 빠진 부분과 불필요하게 추가된 부분의 방향이 바뀌었다."}, {"id": "o3", "text": "Reliability / External validity", "correct": false, "explanation": "반복 안정성과 일반화의 문제가 아니라 구성개념을 얼마나 잘 포착하는지의 문제다."}, {"id": "o4", "text": "Internal validity / Reliability", "correct": false, "explanation": "집단 간 교란이나 반복 일관성보다 구성개념의 포함·제외 범위가 핵심이다."}], "source": "2장 교안 p.22", "explanation": [], "commonMistakes": []}, {"id": "MC033", "chapter": "정보량·중복도", "conceptIds": ["OX054", "OX056", "OX057", "OX077"], "type": "single", "stem": "인간 정보처리 모형을 가장 정확하게 설명한 것은?", "options": [{"id": "o2", "text": "감각저장→결정·반응선택→지각→실행이며, 기억·주의가 처리에 관여하고 결과는 입력에 피드백된다.", "correct": false, "explanation": "지각보다 반응선택이 먼저라고 순서를 바꾸었다. 지각된 정보를 바탕으로 선택한다."}, {"id": "o1", "text": "감각저장→지각→결정·반응선택→실행이며, 기억·주의가 처리에 관여하고 결과는 입력에 피드백된다.", "correct": true, "explanation": "처리 단계의 순서와 기억·주의·피드백의 연결을 모두 반영했다."}, {"id": "o4", "text": "감각저장→지각→결정·반응선택→실행이며, 실행 결과는 내부 처리와 별개여서 입력 경로에 연결되지 않는다.", "correct": false, "explanation": "행동 결과는 피드백으로 다시 입력에 영향을 준다. 모형의 순환 연결을 빠뜨렸다."}, {"id": "o3", "text": "감각저장→지각→결정·반응선택→실행이며, 장기기억은 운동 실행 단계에 한정해 연결된다.", "correct": false, "explanation": "장기기억의 지식은 지각·판단 등에도 관여한다. 운동 실행에만 한정되지 않는다."}], "source": "3장 교안 p.6", "explanation": "처리 단계의 순서와 기억·주의·피드백의 연결을 모두 반영했다.", "commonMistakes": ["지각보다 반응선택이 먼저라고 순서를 바꾸었다. 지각된 정보를 바탕으로 선택한다.", "행동 결과는 피드백으로 다시 입력에 영향을 준다. 모형의 순환 연결을 빠뜨렸다.", "장기기억의 지식은 지각·판단 등에도 관여한다. 운동 실행에만 한정되지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC034", "chapter": "정보량·중복도", "conceptIds": ["OX055"], "type": "single", "stem": "인간 정보처리 모형에서 별도의 되뇌기(시연, Rehearsal)를 하지 않을 때 작업기억(Working memory / Short-term memory)이 정보를 유지하는 대표 지속시간은?", "options": [{"id": "o1", "text": "약 20~30초", "correct": true, "explanation": "교안에서 시연 없는 작업기억 유지의 대표 시간으로 제시한 범위다."}, {"id": "o2", "text": "약 0.2~0.3초", "correct": false, "explanation": "초기 감각저장처럼 짧은 유지 시간과 작업기억을 혼동한 값이다."}, {"id": "o4", "text": "약 2~3초", "correct": false, "explanation": "교안의 20~30초보다 한 자릿수 짧게 본 오답이다."}, {"id": "o3", "text": "약 2~3분", "correct": false, "explanation": "시연 없는 대표 유지 시간을 분 단위로 늘린 오답이다."}], "source": "3장 교안 p.6", "explanation": "교안에서 시연 없는 작업기억 유지의 대표 시간으로 제시한 범위다.", "commonMistakes": ["초기 감각저장처럼 짧은 유지 시간과 작업기억을 혼동한 값이다.", "교안의 20~30초보다 한 자릿수 짧게 본 오답이다.", "시연 없는 대표 유지 시간을 분 단위로 늘린 오답이다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC035", "chapter": "정보량·중복도", "conceptIds": ["OX058", "OX076"], "type": "single", "stem": "정보이론을 인터페이스 설계에 적용하는 목적을 가장 잘 설명한 것은?", "options": [{"id": "o4", "text": "정보량과 전달량으로 과업을 정량화하여, 높은 전달정보량을 요구된 라벨의 높은 정답률과 같게 본다.", "correct": false, "explanation": "라벨을 일대일로 뒤집어도 전달량은 클 수 있다. 의미상 정답률과 전달량을 별도로 본다."}, {"id": "o1", "text": "대안과 발생확률로 과업의 불확실성을 정량화하여 정보처리 부담을 비교한다.", "correct": true, "explanation": "정보이론은 대안 수·확률을 이용해 불확실성과 전달량을 정량화한다."}, {"id": "o2", "text": "표시 글자 수로 과업의 불확실성을 정량화하여, 같은 길이 문구의 처리 부담을 같게 본다.", "correct": false, "explanation": "표면적인 글자 수와 대안의 확률적 불확실성을 혼동했다. 발생확률과 선택 맥락도 중요하다."}, {"id": "o3", "text": "대안 수로 과업의 불확실성을 정량화하여, 발생확률이 달라도 같은 N이면 평균 정보량을 같게 본다.", "correct": false, "explanation": "log₂N은 등확률의 최대 정보량이다. 비등확률에서는 확률 가중평균을 구한다."}], "source": "3장 교안 p.7", "explanation": "정보이론은 대안 수·확률을 이용해 불확실성과 전달량을 정량화한다.", "commonMistakes": ["라벨을 일대일로 뒤집어도 전달량은 클 수 있다. 의미상 정답률과 전달량을 별도로 본다.", "표면적인 글자 수와 대안의 확률적 불확실성을 혼동했다. 발생확률과 선택 맥락도 중요하다.", "log₂N은 등확률의 최대 정보량이다. 비등확률에서는 확률 가중평균을 구한다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC036", "chapter": "정보량·중복도", "conceptIds": ["OX059", "OX060", "OX061", "OX074"], "type": "single", "stem": "등확률 대안 수가 8개에서 16개로 늘었다. 정보량의 변화와 1 bit의 뜻을 올바르게 설명한 것은?", "options": [{"id": "o2", "text": "3→6 bits로 2배 증가하며, 1 bit는 등확률 두 대안의 선택 정보량이다.", "correct": false, "explanation": "대안 수의 배율을 로그 정보량에 그대로 적용했다."}, {"id": "o3", "text": "8→16 bits로 증가하며, 1 bit는 대안 하나를 뜻한다.", "correct": false, "explanation": "대안 수 N 자체와 정보량 \\(\\log_2 N\\)을 혼동했다."}, {"id": "o4", "text": "3→4 bits로 증가하며, 4 bits는 대안 8개에 대응한다.", "correct": false, "explanation": "변화량은 맞지만 4 bits에 대응하는 등확률 대안은 \\(2^{4} = 16\\)개다."}, {"id": "o1", "text": "3→4 bits로 1 bit 증가하며, 1 bit는 등확률 두 대안의 선택 정보량이다.", "correct": true, "explanation": "\\(H = \\log_2 N\\)이므로 \\(\\log_2 8 = 3\\), \\(\\log_2 16 = 4\\)다. 대안 수가 두 배면 정보량은 1 bit 증가한다."}], "source": "3장 교안 p.8 · 3장 교안 p.9 · 3장 교안 p.8–9", "explanation": [], "commonMistakes": []}, {"id": "MC037", "chapter": "정보량·중복도", "conceptIds": ["OX062", "OX063"], "type": "single", "stem": "두 사건의 확률은 \\(0.2,0.8\\)이다. 손계산용으로 \\(\\log_2 5\\approx2.3\\), \\(\\log_2 1.25\\approx0.3\\)을 사용한다. 주어진 근삿값으로 구한 평균 정보량은?", "options": [{"id": "o2", "text": "1.0 bit", "correct": false, "explanation": "비등확률인데 등확률의 최대 정보량 1 bit를 그대로 썼다. 각 사건의 자기정보량을 발생확률로 가중해야 한다."}, {"id": "o3", "text": "2.6 bits", "correct": false, "explanation": "주어진 두 로그 2.3과 0.3을 확률 가중 없이 단순 합산했다. 평균 정보량은 확률 가중평균이다."}, {"id": "o1", "text": "0.7 bit", "correct": true, "explanation": "\\(H=0.2\\times2.3+0.8\\times0.3=0.46+0.24=0.7\\) bit다. 이 문항이 제공한 로그 근삿값을 기준으로 한다."}, {"id": "o4", "text": "1.3 bits", "correct": false, "explanation": "두 로그의 산술평균 2.6/2를 구했다. 확률이 0.2와 0.8이므로 같은 가중치를 사용하면 안 된다."}], "source": "3장 교안 p.9 · 손계산용 수치/표기 변형", "stemPlain": "두 사건의 확률은 \\(0.2,0.8\\)이다. 손계산용으로 \\(\\log_2 5\\approx2.3\\), \\(\\log_2 1.25\\approx0.3\\)을 사용한다. 주어진 근삿값으로 구한 평균 정보량은?", "explanation": "\\(H=0.2\\times2.3+0.8\\times0.3=0.46+0.24=0.7\\) bit다. 이 문항이 제공한 로그 근삿값을 기준으로 한다.", "commonMistakes": ["비등확률인데 등확률의 최대 정보량 1 bit를 그대로 썼다. 각 사건의 자기정보량을 발생확률로 가중해야 한다.", "주어진 두 로그 2.3과 0.3을 확률 가중 없이 단순 합산했다. 평균 정보량은 확률 가중평균이다.", "두 로그의 산술평균 2.6/2를 구했다. 확률이 0.2와 0.8이므로 같은 가중치를 사용하면 안 된다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC038", "chapter": "정보량·중복도", "conceptIds": ["OX064", "OX065", "OX073"], "type": "single", "stem": "이항 사건에서 p가 0→0.5→1로 변한다. 평균 엔트로피와 중복도의 변화로 옳은 것은?", "options": [{"id": "o3", "text": "H는 0→0.5→1 bit이며 중복도는 선형 감소한다.", "correct": false, "explanation": "엔트로피는 확률 p 자체가 아니라 \\(-p\\,\\log_2 p - \\left(1 - p\\right)\\,\\log_2 \\left(1 - p\\right)\\)다."}, {"id": "o2", "text": "H는 1→0→1 bit이며 중복도는 0→100→0%다.", "correct": false, "explanation": "확정 사건과 등확률 사건의 불확실성을 반대로 해석했다."}, {"id": "o1", "text": "H는 0→1→0 bit이며 중복도는 100→0→100%다.", "correct": true, "explanation": "이항 엔트로피는 \\(p = 0.5\\)에서 최대인 역 U자형이다. 고정된 \\(H_{\\max} = 1\\)에서 H가 작아질수록 중복도는 커진다."}, {"id": "o4", "text": "H는 0→1→0 bit이며 중복도도 0→100→0%다.", "correct": false, "explanation": "엔트로피는 맞지만 중복도는 \\(1 - \\frac{H}{H_{\\max}}\\)이므로 반대 방향이다."}], "source": "3장 교안 p.10 · 3장 교안 p.10 · 정보처리 전사1 · 3장 교안 p.10–11", "visual": "<figure class=\"visual-box\"><figcaption>이항 사건의 세 확률 조건 — 세 패널은 같은 두 결과를 비교<\/figcaption><svg role=\"img\" aria-label=\"이항 사건의 세 확률 조건 — 세 패널은 같은 두 결과를 비교\" viewBox=\"0 0 600 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"15\" width=\"180\" height=\"140\" rx=\"6\" fill=\"#f7f7f5\"/><text x=\"110\" y=\"40\" text-anchor=\"middle\">(가) p = 0<\/text><rect x=\"55\" y=\"125\" width=\"35\" height=\"0\" fill=\"#8294aa\"/><rect x=\"125\" y=\"60\" width=\"35\" height=\"65\" fill=\"#bdc7d4\"/><text x=\"72\" y=\"145\" text-anchor=\"middle\">앞<\/text><text x=\"142\" y=\"145\" text-anchor=\"middle\">뒤<\/text><rect x=\"215\" y=\"15\" width=\"180\" height=\"140\" rx=\"6\" fill=\"#f7f7f5\"/><text x=\"305\" y=\"40\" text-anchor=\"middle\">(나) p = 0.5<\/text><rect x=\"250\" y=\"92.5\" width=\"35\" height=\"32.5\" fill=\"#8294aa\"/><rect x=\"320\" y=\"92.5\" width=\"35\" height=\"32.5\" fill=\"#bdc7d4\"/><text x=\"267\" y=\"145\" text-anchor=\"middle\">앞<\/text><text x=\"337\" y=\"145\" text-anchor=\"middle\">뒤<\/text><rect x=\"410\" y=\"15\" width=\"180\" height=\"140\" rx=\"6\" fill=\"#f7f7f5\"/><text x=\"500\" y=\"40\" text-anchor=\"middle\">(다) p = 1<\/text><rect x=\"445\" y=\"60\" width=\"35\" height=\"65\" fill=\"#8294aa\"/><rect x=\"515\" y=\"125\" width=\"35\" height=\"0\" fill=\"#bdc7d4\"/><text x=\"462\" y=\"145\" text-anchor=\"middle\">앞<\/text><text x=\"532\" y=\"145\" text-anchor=\"middle\">뒤<\/text><\/svg><\/figure>", "explanation": [], "commonMistakes": []}, {"id": "MC039", "chapter": "정보량·중복도", "conceptIds": ["OX066", "OX067"], "type": "single", "stem": "손계산 연습 자료에서 두 대안의 최대 정보량은 \\(H_{\\max}=1\\) bit이고, 대상 분포의 정보량은 \\(H=0.4\\) bit로 주어졌다. \\(R=(1-H/H_{\\max})\\times100\\)에 따른 중복도는?", "options": [{"id": "o2", "text": "40.0%", "correct": false, "explanation": "\\(H/H_{\\max}\\) 자체를 백분율로 썼다. 중복도는 최대 정보량에서 차지하지 않는 부분이므로 1에서 빼야 한다."}, {"id": "o4", "text": "150.0%", "correct": false, "explanation": "\\((H_{\\max}-H)/H\\)로 분모를 대상 정보량에 두었다. 중복도는 최대 정보량을 기준으로 나눈다."}, {"id": "o3", "text": "0.6%", "correct": false, "explanation": "중복도의 비율 0.6에 100을 곱하지 않았다. 백분율로 표현하면 60.0%다."}, {"id": "o1", "text": "60.0%", "correct": true, "explanation": "\\(R=(1-0.4/1)\\times100=0.6\\times100=60.0\\%\\)다. 제시된 정보량을 사용하며 확률에서 다시 로그를 계산하지 않는다."}], "source": "3장 교안 p.11 · 손계산용 수치/표기 변형", "stemPlain": "손계산 연습 자료에서 두 대안의 최대 정보량은 \\(H_{\\max}=1\\) bit이고, 대상 분포의 정보량은 \\(H=0.4\\) bit로 주어졌다. \\(R=(1-H/H_{\\max})\\times100\\)에 따른 중복도는?", "explanation": "\\(R=(1-0.4/1)\\times100=0.6\\times100=60.0\\%\\)다. 제시된 정보량을 사용하며 확률에서 다시 로그를 계산하지 않는다.", "commonMistakes": ["\\(H/H_{\\max}\\) 자체를 백분율로 썼다. 중복도는 최대 정보량에서 차지하지 않는 부분이므로 1에서 빼야 한다.", "\\((H_{\\max}-H)/H\\)로 분모를 대상 정보량에 두었다. 중복도는 최대 정보량을 기준으로 나눈다.", "중복도의 비율 0.6에 100을 곱하지 않았다. 백분율로 표현하면 60.0%다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC040", "chapter": "정보량·중복도", "conceptIds": ["OX068", "OX069"], "type": "single", "stem": "경고등 8종의 확률은 \\((7/20,7/20,1/20,1/20,1/20,1/20,1/20,1/20)\\)이다. 손계산용 제시값 \\(H=2.4\\) bits를 사용한다. 최대 정보량과 중복도의 조합은?", "options": [{"id": "o1", "text": "3 bits / 20.0%", "correct": true, "explanation": "\\(H_{\\max}=\\log_2 8=3\\), \\(R=(1-2.4/3)\\times100=(1-0.8)\\times100=20.0\\%\\)다. 주어진 H를 사용한다."}, {"id": "o3", "text": "3 bits / 80.0%", "correct": false, "explanation": "최대 정보량은 맞지만 H/Hmax=0.8을 그대로 백분율로 썼다. 1에서 빼는 단계가 필요하다."}, {"id": "o2", "text": "8 bits / 70.0%", "correct": false, "explanation": "최대 정보량을 대안 개수 8로 두었다. 8개 등확률 대안의 최대 정보량은 log₂8=3 bits다."}, {"id": "o4", "text": "2.4 bits / 0.0%", "correct": false, "explanation": "대상 분포의 정보량을 최대 정보량으로 썼다. 최대 정보량은 같은 8개 대안이 등확률인 경우를 기준으로 한다."}], "source": "3장 교안 p.12 · 3장 교안 p.13 · 손계산용 수치/표기 변형", "stemPlain": "경고등 8종의 확률은 \\((7/20,7/20,1/20,1/20,1/20,1/20,1/20,1/20)\\)이다. 손계산용 제시값 \\(H=2.4\\) bits를 사용한다. 최대 정보량과 중복도의 조합은?", "explanation": "\\(H_{\\max}=\\log_2 8=3\\), \\(R=(1-2.4/3)\\times100=(1-0.8)\\times100=20.0\\%\\)다. 주어진 H를 사용한다.", "commonMistakes": ["최대 정보량은 맞지만 H/Hmax=0.8을 그대로 백분율로 썼다. 1에서 빼는 단계가 필요하다.", "최대 정보량을 대안 개수 8로 두었다. 8개 등확률 대안의 최대 정보량은 log₂8=3 bits다.", "대상 분포의 정보량을 최대 정보량으로 썼다. 최대 정보량은 같은 8개 대안이 등확률인 경우를 기준으로 한다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC041", "chapter": "정보량·중복도", "conceptIds": ["OX070"], "type": "single", "stem": "경고 신호의 확률 분포를 고정한 채 자주 발생하는 신호의 크기만 키웠다. 정보량과 설계 효과를 가장 정확하게 해석한 것은?", "options": [{"id": "o4", "text": "확률 분포가 같아 Shannon H는 유지되므로, 탐지시간과 오류율도 변화하지 않는 것으로 예측한다.", "correct": false, "explanation": "엔트로피의 불변이 모든 수행 지표의 불변을 뜻하지 않는다. 현저성 효과를 별도로 측정한다."}, {"id": "o1", "text": "확률 분포가 같아 Shannon H는 유지되며, 현저성 변화는 탐지 수행에 영향을 줄 수 있다.", "correct": true, "explanation": "확률적 불확실성과 시각적 탐지·주의 배분의 효과를 구별해야 한다."}, {"id": "o3", "text": "신호의 표시 면적이 커져 정보가 더 많이 제시되므로, 같은 확률 분포에서도 Shannon H는 증가한다.", "correct": false, "explanation": "표시 크기는 제시된 사건 확률을 바꾸지 않는다. 면적 증가를 엔트로피 증가로 계산할 근거가 없다."}, {"id": "o2", "text": "신호가 눈에 잘 띄어 선택의 불확실성이 줄었으므로, 같은 확률 분포에서도 Shannon H는 감소한다.", "correct": false, "explanation": "주의·탐지의 개선을 사건 확률의 불확실성 감소와 혼동했다. 같은 분포의 H는 같다."}], "source": "3장 교안 p.13", "explanation": "확률적 불확실성과 시각적 탐지·주의 배분의 효과를 구별해야 한다.", "commonMistakes": ["엔트로피의 불변이 모든 수행 지표의 불변을 뜻하지 않는다. 현저성 효과를 별도로 측정한다.", "표시 크기는 제시된 사건 확률을 바꾸지 않는다. 면적 증가를 엔트로피 증가로 계산할 근거가 없다.", "주의·탐지의 개선을 사건 확률의 불확실성 감소와 혼동했다. 같은 분포의 H는 같다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC042", "chapter": "정보량·중복도", "conceptIds": ["OX071", "OX072"], "type": "single", "stem": "신호등 설계 비교에서 언제 바뀔지 모르는 기존 신호등(바뀜·안 바뀜 2대안 등확률 가정)을 잔여 시간을 표시해 변경 시점이 100% 확정되는 카운트다운 신호등으로 바꾸었다. 기존 정보량, 확정 후 정보량, 중복도(% Redundancy)는?", "options": [{"id": "o2", "text": "기존 1 bit, 확정 후 1 bit, 중복도 0%", "correct": false, "explanation": "카운트다운으로 시점이 확정된다는 문제 조건을 반영하지 않았다."}, {"id": "o4", "text": "기존 1 bit, 확정 후 0 bit, 중복도 0%", "correct": false, "explanation": "정보량 변화는 맞지만 \\(\\left(1 - \\frac{0}{1}\\right) \\times 100\\)은 100%다."}, {"id": "o3", "text": "기존 0 bit, 확정 후 1 bit, 중복도 100%", "correct": false, "explanation": "확정 이전과 이후의 불확실성을 반대로 두었다."}, {"id": "o1", "text": "기존 1 bit, 확정 후 0 bit, 중복도 100%", "correct": true, "explanation": "확정 사건의 자기정보량은 \\(\\log_2 \\left(\\frac{1}{1}\\right) = 0\\)이다. 변경 시점의 불확실성이 완전히 제거되었다는 모형 조건 아래의 결과다."}], "source": "3장 교안 p.14 · 3장 교안 p.10, 14", "explanation": [], "commonMistakes": []}, {"id": "MC043", "chapter": "정보량·중복도", "conceptIds": ["OX075"], "type": "single", "stem": "확률표에 빈도가 0인 칸이 있다. 엔트로피 계산 시 이 칸의 처리로 옳은 것은?", "options": [{"id": "o2", "text": "로그가 발산하는 점을 반영해 해당 항을 무한대로 두며, 나머지 항은 원래대로 계산한다.", "correct": false, "explanation": "log p만의 발산과 p를 곱한 항의 극한을 혼동했다. p log p의 극한은 0이다."}, {"id": "o4", "text": "로그 계산을 피하려 해당 확률만 1로 바꾸고, 나머지 사건의 확률은 원래대로 계산한다.", "correct": false, "explanation": "한 칸을 1로 바꾸면 제시된 분포와 확률 합이 달라진다. 필요한 것은 극한 처리다."}, {"id": "o3", "text": "그 사건은 발생하지 않았으므로 해당 항의 기여를 1 bit로 두고, 나머지는 원래대로 계산한다.", "correct": false, "explanation": "확률 0인 사건의 엔트로피 기여는 1 bit가 아니라 0이다. 등확률 두 대안의 정보량과 혼동했다."}, {"id": "o1", "text": "해당 항의 극한 기여를 0으로 두며, 나머지 확률은 제시된 분포대로 계산한다.", "correct": true, "explanation": "엔트로피에서 p log p의 p→0 극한은 0이다. 다른 사건의 확률을 임의로 바꾸지 않는다."}], "source": "3장 교안 p.18", "explanation": "엔트로피에서 p log p의 p→0 극한은 0이다. 다른 사건의 확률을 임의로 바꾸지 않는다.", "commonMistakes": ["log p만의 발산과 p를 곱한 항의 극한을 혼동했다. p log p의 극한은 0이다.", "한 칸을 1로 바꾸면 제시된 분포와 확률 합이 달라진다. 필요한 것은 극한 처리다.", "확률 0인 사건의 엔트로피 기여는 1 bit가 아니라 0이다. 등확률 두 대안의 정보량과 혼동했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC044", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX078"], "type": "single", "stem": "정보전달이론의 Input–Human channel–Output 모형에서 수행을 평가하는 관점은?", "options": [{"id": "o2", "text": "입력 X의 주변 엔트로피를 전달량으로 사용하므로, 반응 Y와의 대응은 별도로 보지 않는다.", "correct": false, "explanation": "입력의 불확실성이 모두 전달된다고 할 수 없다. 출력과의 결합 관계가 필요하다."}, {"id": "o4", "text": "요구된 라벨의 정답 비율을 전달량으로 사용하므로, 라벨 반전은 전달정보량도 0으로 만든다.", "correct": false, "explanation": "정답률 0%인 일대일 라벨 반전도 입력을 복원할 수 있어 전달량은 최대일 수 있다."}, {"id": "o1", "text": "입력 X와 출력 Y의 결합 확률에서 공통으로 전달된 정보량을 평가한다.", "correct": true, "explanation": "주변·결합 분포로 입력과 출력의 통계적 관계와 전달량을 정량화한다."}, {"id": "o3", "text": "출력 Y의 주변 엔트로피를 전달량으로 사용하므로, 반응 종류가 많으면 전달량도 크다고 본다.", "correct": false, "explanation": "출력에 잡음이 포함될 수 있다. 출력 엔트로피 자체와 입력에서 전달된 정보는 다르다."}], "source": "3장 교안 p.15", "explanation": "주변·결합 분포로 입력과 출력의 통계적 관계와 전달량을 정량화한다.", "commonMistakes": ["입력의 불확실성이 모두 전달된다고 할 수 없다. 출력과의 결합 관계가 필요하다.", "정답률 0%인 일대일 라벨 반전도 입력을 복원할 수 있어 전달량은 최대일 수 있다.", "출력에 잡음이 포함될 수 있다. 출력 엔트로피 자체와 입력에서 전달된 정보는 다르다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC045", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX079", "OX080", "OX081"], "type": "single", "stem": "\\(H\\left(X\\right) = 2\\), \\(H\\left(Y\\right) = 1.5\\), \\(H\\left(X, Y\\right) = 2\\) bits일 때 전달정보량, Equivocation, Noise의 순서로 옳은 것은?", "options": [{"id": "o2", "text": "1.5, 0, 0.5 bits", "correct": false, "explanation": "Equivocation은 입력 기준 손실, Noise는 출력 기준 불확실성이므로 두 값이 바뀌었다."}, {"id": "o1", "text": "1.5, 0.5, 0 bits", "correct": true, "explanation": "\\(I = 2 + 1.5 - 2 = 1.5\\), \\(H\\left(X\\mid Y\\right) = 2 - 1.5 = 0.5\\), \\(H\\left(Y\\mid X\\right) = 1.5 - 1.5 = 0\\)이다. 전달량은 클수록, 두 조건부 불확실성은 작을수록 좋다."}, {"id": "o3", "text": "3.5, 0.5, 0 bits", "correct": false, "explanation": "전달정보량에서 결합 엔트로피를 빼지 않았다."}, {"id": "o4", "text": "0.5, 1.5, 2 bits", "correct": false, "explanation": "입력·출력·결합 엔트로피를 이용한 정의식과 일치하지 않는다."}], "source": "3장 교안 p.15–16 · 3장 교안 p.16", "stemPlain": "\\(H\\left(X\\right) = 2\\), \\(H\\left(Y\\right) = 1.5\\), \\(H\\left(X, Y\\right) = 2\\) bits일 때 전달정보량, Equivocation, Noise의 순서로 옳은 것은?", "explanation": [], "commonMistakes": []}, {"id": "MC046", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX082", "OX083"], "type": "single", "stem": "16회 시행의 빈도표에서 \\(\\left(X, Y\\right) = \\left(1, 1\\right)\\),(2,1),(3,3),(4,4)가 각각 4회이고 나머지는 0이다. \\(H\\left(X\\right)\\), \\(H\\left(Y\\right)\\), \\(H\\left(X, Y\\right)\\)의 조합은?", "options": [{"id": "o2", "text": "2, 2, 4 bits", "correct": false, "explanation": "Y가 네 종류 등확률이 아니며 결합 엔트로피도 독립일 때의 합으로 계산할 수 없다."}, {"id": "o3", "text": "1.5, 2, 2 bits", "correct": false, "explanation": "입력과 출력의 주변분포를 서로 바꿨다."}, {"id": "o1", "text": "2, 1.5, 2 bits", "correct": true, "explanation": "X는 4종 등확률, Y는 \\(\\left(\\frac{1}{2}, 0, \\frac{1}{4}, \\frac{1}{4}\\right)\\), 결합 분포는 네 비영 칸이 각각 \\(\\frac{1}{4}\\)이다. 전달량 1.5, 모호도 0.5, 잡음 0으로 이어진다."}, {"id": "o4", "text": "2, 0, 2 bits", "correct": false, "explanation": "출력은 한 종류가 아니라 세 종류이므로 \\(H\\left(Y\\right)\\)는 0이 아니다."}], "source": "3장 교안 p.17–18 · 3장 교안 p.18", "visual": "<figure class=\"visual-box\"><figcaption>16회 시행 혼동행렬 — 행: 자극 X / 열: 반응 Y<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>X \\ Y<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>4<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>4<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>0<\/td><td>0<\/td><td>4<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "stemPlain": "16회 시행의 빈도표에서 \\(\\left(X, Y\\right) = \\left(1, 1\\right)\\),(2,1),(3,3),(4,4)가 각각 4회이고 나머지는 0이다. \\(H\\left(X\\right)\\), \\(H\\left(Y\\right)\\), \\(H\\left(X, Y\\right)\\)의 조합은?", "explanation": [], "commonMistakes": []}, {"id": "MC047", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX084"], "type": "single", "stem": "두 자극이 등확률인데 \\(X = 1\\)이면 \\(Y = 2\\), \\(X = 2\\)이면 \\(Y = 1\\)로 항상 반대로 답했다. 의미상 정답률과 전달정보량은?", "options": [{"id": "o4", "text": "정답률 50%, 전달정보량 0.5 bit", "correct": false, "explanation": "등확률과 우연 정답률을 실제 결정적 역매핑의 성과와 혼동했다."}, {"id": "o2", "text": "정답률 0%, 전달정보량 0 bit", "correct": false, "explanation": "오답이라는 이유만으로 통계적 의존성까지 사라지는 것은 아니다."}, {"id": "o3", "text": "정답률 100%, 전달정보량 1 bit", "correct": false, "explanation": "전달량은 최대지만 요구된 반응 라벨을 모두 반대로 골랐으므로 정답률은 0%다."}, {"id": "o1", "text": "정답률 0%, 전달정보량 1 bit", "correct": true, "explanation": "Y를 보면 X를 완전히 복원할 수 있는 일대일 대응이라 \\(I\\left(X; Y\\right) = H\\left(X\\right) = 1\\)이다. 전달량은 부호화 관계를 측정하므로 의미상 정답률과 구별해야 한다."}], "source": "3장 교안 p.19", "visual": "<figure class=\"visual-box\"><figcaption>요구된 라벨과 실제 반응 — 두 자극은 각 50%<\/figcaption><svg role=\"img\" aria-label=\"요구된 라벨과 실제 반응 — 두 자극은 각 50%\" viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"80\" y=\"30\">자극 X<\/text><text x=\"395\" y=\"30\">실제 반응 Y<\/text><circle cx=\"120\" cy=\"70\" r=\"23\" fill=\"#e9edf2\"/><circle cx=\"120\" cy=\"135\" r=\"23\" fill=\"#e9edf2\"/><circle cx=\"440\" cy=\"70\" r=\"23\" fill=\"#e9edf2\"/><circle cx=\"440\" cy=\"135\" r=\"23\" fill=\"#e9edf2\"/><text x=\"120\" y=\"76\" text-anchor=\"middle\">1<\/text><text x=\"120\" y=\"141\" text-anchor=\"middle\">2<\/text><text x=\"440\" y=\"76\" text-anchor=\"middle\">1<\/text><text x=\"440\" y=\"141\" text-anchor=\"middle\">2<\/text><path d=\"M150 70L410 135M150 135L410 70\" stroke=\"#7c8fa6\" stroke-width=\"2\"/><text x=\"270\" y=\"170\" text-anchor=\"middle\">요구: X와 같은 라벨을 선택<\/text><\/svg><\/figure>", "stemPlain": "두 자극이 등확률인데 \\(X = 1\\)이면 \\(Y = 2\\), \\(X = 2\\)이면 \\(Y = 1\\)로 항상 반대로 답했다. 의미상 정답률과 전달정보량은?", "explanation": [], "commonMistakes": []}, {"id": "MC048", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX085"], "type": "single", "stem": "입력 정보율을 늘려도 전달 정보율이 약 2.8 bits/s에서 포화되었다. 이 값에 대한 해석은?", "options": [{"id": "o3", "text": "해당 과업의 기억 항목 수이며, 유지 가능한 항목 개수를 시간 단위로 환산한 값이다.", "correct": false, "explanation": "항목 수와 정보율은 다른 측정량이다. 제시 단위는 bits/s다."}, {"id": "o1", "text": "해당 과업의 Channel capacity이며, 입력 정보율 증가에 대한 전달 정보율의 포화 수준이다.", "correct": true, "explanation": "bits/s로 측정된 과업 조건의 점근적 전달 정보율이다. 저장 항목 수와 구별한다."}, {"id": "o4", "text": "해당 과업의 반응 효율이며, 입력 정보율을 더 늘리면 같은 비율로 높아지는 전달 수준이다.", "correct": false, "explanation": "이미 포화된다는 관측과 맞지 않는다. 입력 증가가 전달률의 비례 증가를 보장하지 않는다."}, {"id": "o2", "text": "해당 과업의 순간 정보량이며, 한 사건이 가질 수 있는 자기정보량의 상한을 나타낸다.", "correct": false, "explanation": "시간당 전달률의 포화와 개별 사건의 자기정보량 상한은 다르다. 드문 사건은 큰 자기정보량을 가질 수 있다."}], "source": "3장 교안 p.20", "explanation": "bits/s로 측정된 과업 조건의 점근적 전달 정보율이다. 저장 항목 수와 구별한다.", "commonMistakes": ["항목 수와 정보율은 다른 측정량이다. 제시 단위는 bits/s다.", "이미 포화된다는 관측과 맞지 않는다. 입력 증가가 전달률의 비례 증가를 보장하지 않는다.", "시간당 전달률의 포화와 개별 사건의 자기정보량 상한은 다르다. 드문 사건은 큰 자기정보량을 가질 수 있다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC049", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX086", "OX087"], "type": "single", "stem": "G. A. Miller의 마법의 숫자(\\(7 \\pm 2\\))와 단일 차원 자극(순음·음량·크기·밝기 등)의 절대 식별 한계를 해석한 것으로 가장 적절한 것은?", "options": [{"id": "o4", "text": "\\(7\\pm2\\)는 초당 전달률의 범위이므로, 채널 용량 2.8 bits/s와 같은 단위로 비교한다.", "correct": false, "explanation": "항목·구별 수와 bits/s 정보율의 단위를 혼동했다."}, {"id": "o1", "text": "\\(7\\pm2\\)는 경험적 구별 수이며, 밝기·음량 등 자극 차원에 따라 식별 가능한 수가 다르다.", "correct": true, "explanation": "교안의 대표 경험칙이며 순음·밝기 등 차원별 예시를 구별해야 한다."}, {"id": "o2", "text": "\\(7\\pm2\\)는 차원별 차이를 평균낸 고정 구별 수이므로, 밝기와 음량의 한계를 같게 예측한다.", "correct": false, "explanation": "교안은 차원별 식별 수의 차이를 제시한다. 경험칙을 고정 상수로 적용하지 않는다."}, {"id": "o3", "text": "\\(7\\pm2\\)는 식별 정보량(bits)의 범위이므로, 각 차원에서 \\(2^5\\sim2^9\\)개를 구별한다.", "correct": false, "explanation": "식별 가능한 자극 수와 그 수의 로그인 정보량(bits)을 혼동했다. 교안의 7±2 경험칙을 5~9 bits로 바꾸어 거듭제곱하지 않는다."}], "source": "3장 교안 p.21", "explanation": "교안의 대표 경험칙이며 순음·밝기 등 차원별 예시를 구별해야 한다.", "commonMistakes": ["항목·구별 수와 bits/s 정보율의 단위를 혼동했다.", "교안은 차원별 식별 수의 차이를 제시한다. 경험칙을 고정 상수로 적용하지 않는다.", "식별 가능한 자극 수와 그 수의 로그인 정보량(bits)을 혼동했다. 교안의 7±2 경험칙을 5~9 bits로 바꾸어 거듭제곱하지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC050", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX088"], "type": "single", "stem": "숫자 목록 뒤에 역순 숫자 세기를 시켜 약 15초 후 회상률이 크게 떨어졌다. 조작의 핵심 목적은?", "options": [{"id": "o4", "text": "역순 세기가 장기기억의 인출을 돕기 때문에, 회상 저하를 초기 감각저장의 소실로 해석한다.", "correct": false, "explanation": "조작 목적과 평가 대상이 맞지 않는다. 주로 시연 방해 아래의 단기 기억 유지 양상을 보는 과제다."}, {"id": "o1", "text": "역순 세기가 Rehearsal을 방해하므로, 시연 없이 정보를 유지하는 양상을 살핀다.", "correct": true, "explanation": "반복 시연이 차단된 조건에서 시간이 지남에 따른 회상 변화를 확인한다."}, {"id": "o3", "text": "역순 세기가 입력 대안 수를 늘리므로, 자극 확률을 바꾼 효과로 회상 저하를 해석한다.", "correct": false, "explanation": "이 조작으로 원래 목록의 사건 확률을 변화시킨 것으로 볼 수 없다. 기억 유지 과업의 시연을 방해한다."}, {"id": "o2", "text": "역순 세기가 Chunking을 촉진하므로, 숫자 묶음이 클수록 회상률이 낮아지는 양상을 살핀다.", "correct": false, "explanation": "조작의 목적은 의미 묶음의 촉진이 아니라 시연 방해다. 두 기억 전략을 혼동했다."}], "source": "3장 교안 p.25", "explanation": "반복 시연이 차단된 조건에서 시간이 지남에 따른 회상 변화를 확인한다.", "commonMistakes": ["조작 목적과 평가 대상이 맞지 않는다. 주로 시연 방해 아래의 단기 기억 유지 양상을 보는 과제다.", "이 조작으로 원래 목록의 사건 확률을 변화시킨 것으로 볼 수 없다. 기억 유지 과업의 시연을 방해한다.", "조작의 목적은 의미 묶음의 촉진이 아니라 시연 방해다. 두 기억 전략을 혼동했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC051", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX089"], "type": "single", "stem": "밝기 표준을 기억한 뒤 한 화면을 평가하는 방식 대신 두 화면을 나란히 비교하게 했다. 적용한 전략은?", "options": [{"id": "o2", "text": "Absolute judgment", "correct": false, "explanation": "기억 속 기준과 하나의 자극을 비교하는 절대 판단과 다르다."}, {"id": "o4", "text": "Chunking", "correct": false, "explanation": "항목을 의미 묶음으로 조직하는 청킹과 두 자극의 직접 비교를 혼동했다."}, {"id": "o3", "text": "Rehearsal", "correct": false, "explanation": "정보를 반복해 기억을 유지하는 시연과 직접 비교 판단을 혼동했다."}, {"id": "o1", "text": "Relative judgment", "correct": true, "explanation": "두 자극을 직접 나란히 비교하는 상대 판단이다."}], "source": "3장 교안 p.26–28", "explanation": "두 자극을 직접 나란히 비교하는 상대 판단이다.", "commonMistakes": ["기억 속 기준과 하나의 자극을 비교하는 절대 판단과 다르다.", "항목을 의미 묶음으로 조직하는 청킹과 두 자극의 직접 비교를 혼동했다.", "정보를 반복해 기억을 유지하는 시연과 직접 비교 판단을 혼동했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC052", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX090"], "type": "single", "stem": "위치만으로 구별하던 경고를 위치와 색상의 조합으로 구별하게 했다. 핵심 설계 전략은?", "options": [{"id": "o4", "text": "여러 표시 중 경고가 발생할 시점을 미리 알려 시간적 불확실성을 줄이는 사전 경고다.", "correct": false, "explanation": "발생 시점에 관한 예고가 아니라 경고의 표현 차원을 바꾼 사례다."}, {"id": "o3", "text": "위치·색의 조합을 기존 지식에 연결했는지와 무관하게 청킹으로 분류한다.", "correct": false, "explanation": "청킹은 기존 지식과 연결한 의미 있는 묶음 구성이다. 단순한 차원 추가와 동일하지 않다."}, {"id": "o1", "text": "위치와 색을 함께 사용해 자극의 구별 차원을 늘리는 다차원 부호화다.", "correct": true, "explanation": "한 차원에 추가 차원을 결합하여 경고들을 구별하도록 한 전략이다."}, {"id": "o2", "text": "위치를 기억한 뒤 색과 대응시켜 단일 기준과 비교하는 절대 판단이다.", "correct": false, "explanation": "기억 속 기준을 이용하는 판단 방식과 표시의 구별 차원 증가를 혼동했다."}], "source": "3장 교안 p.26", "explanation": "한 차원에 추가 차원을 결합하여 경고들을 구별하도록 한 전략이다.", "commonMistakes": ["발생 시점에 관한 예고가 아니라 경고의 표현 차원을 바꾼 사례다.", "청킹은 기존 지식과 연결한 의미 있는 묶음 구성이다. 단순한 차원 추가와 동일하지 않다.", "기억 속 기준을 이용하는 판단 방식과 표시의 구별 차원 증가를 혼동했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC053", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX091"], "type": "single", "stem": "전화번호를 국가번호·통신망·개인번호의 의미 있는 묶음으로 기억한다. 이 전략의 핵심은?", "options": [{"id": "o4", "text": "Rehearsal: 의미 구조로 항목 수를 줄여 여러 숫자를 한 단위로 재구성한다.", "correct": false, "explanation": "설명은 청킹에 해당한다. 정보를 되뇌는 시연의 명칭을 잘못 붙였다."}, {"id": "o2", "text": "Chunking: 묶은 숫자를 되풀이해 시연 횟수를 늘리는 것을 핵심으로 한다.", "correct": false, "explanation": "청킹의 핵심은 의미 단위 구성이다. 반복 시연의 기능으로 정의를 바꾸었다."}, {"id": "o3", "text": "Relative judgment: 번호의 각 묶음을 기억 속 표준 번호와 단독 비교한다.", "correct": false, "explanation": "기억 속 표준과의 단독 비교는 절대 판단이다. 상대 판단과 청킹 모두에 맞지 않는다."}, {"id": "o1", "text": "Chunking: 항목을 의미 있는 단위로 묶어 기존 장기기억 지식과 연결한다.", "correct": true, "explanation": "국가번호 등의 의미 구조를 이용해 개별 숫자들을 묶은 사례다."}], "source": "3장 교안 p.29", "explanation": "국가번호 등의 의미 구조를 이용해 개별 숫자들을 묶은 사례다.", "commonMistakes": ["설명은 청킹에 해당한다. 정보를 되뇌는 시연의 명칭을 잘못 붙였다.", "청킹의 핵심은 의미 단위 구성이다. 반복 시연의 기능으로 정의를 바꾸었다.", "기억 속 표준과의 단독 비교는 절대 판단이다. 상대 판단과 청킹 모두에 맞지 않는다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC054", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX092", "OX093", "OX094"], "type": "single", "stem": "아래 Sternberg 과제 관계도에 대해 교안에서 제시한 설명과 탐색 종료 방식의 정의를 바르게 연결한 것은?", "options": [{"id": "o2", "text": "교안은 직렬 비교로 설명하며, YES를 exhaustive·NO를 self-terminating과 연결한다.", "correct": false, "explanation": "제시한 교안 설명에서 두 조건과 종료 방식의 대응을 뒤바꾸었다."}, {"id": "o4", "text": "교안은 직렬 비교로 설명하며, self-terminating을 찾은 후에도 끝까지 비교하는 방식으로 정의한다.", "correct": false, "explanation": "목표를 찾은 즉시 멈추는 방식이 self-terminating이다. 끝까지 비교하는 것은 exhaustive다."}, {"id": "o3", "text": "교안은 병렬 비교로 설명하며, YES를 self-terminating·NO를 exhaustive와 연결한다.", "correct": false, "explanation": "조건의 대응을 맞췄더라도 교안은 PSS에 따른 RT 증가를 직렬 비교로 설명한다."}, {"id": "o1", "text": "교안은 직렬 비교로 설명하며, YES를 self-terminating·NO를 exhaustive와 연결한다.", "correct": true, "explanation": "제시한 교안 도식의 설명이다. 찾으면 멈추는 방식과 끝까지 비교하는 방식을 구별하며 이를 모든 기억탐색의 보편 결론으로 확대하지 않는다."}], "source": "3장 교안 p.30–31 · 3장 교안 p.31", "explanation": "제시한 교안 도식의 설명이다. 찾으면 멈추는 방식과 끝까지 비교하는 방식을 구별하며 이를 모든 기억탐색의 보편 결론으로 확대하지 않는다.", "commonMistakes": ["제시한 교안 설명에서 두 조건과 종료 방식의 대응을 뒤바꾸었다.", "목표를 찾은 즉시 멈추는 방식이 self-terminating이다. 끝까지 비교하는 것은 exhaustive다.", "조건의 대응을 맞췄더라도 교안은 PSS에 따른 RT 증가를 직렬 비교로 설명한다."], "visual": "<figure class=\"visual-box analysis-material\"><figcaption>Sternberg 과제의 두 조건 · 교안 p.31 관계도 재구성<\/figcaption><svg viewBox=\"0 0 720 290\" role=\"img\" aria-label=\"PSS에 따른 YES와 NO 조건의 RT 관계도\"><line x1=\"85\" y1=\"235\" x2=\"610\" y2=\"235\" stroke=\"currentColor\"/><line x1=\"85\" y1=\"235\" x2=\"85\" y2=\"35\" stroke=\"currentColor\"/><text x=\"620\" y=\"241\">PSS<\/text><text x=\"30\" y=\"35\">RT<\/text><path d=\"M85 180 L505 75\" fill=\"none\" stroke=\"#37352f\" stroke-width=\"3\"/><path d=\"M85 225 L505 120\" fill=\"none\" stroke=\"#6b6b67\" stroke-width=\"3\"/><text x=\"520\" y=\"80\">NO<\/text><text x=\"520\" y=\"125\">YES<\/text><\/svg><p class=\"analysis-note\">교안의 두 조건 관계를 다시 그린 개념 도식이다. 실제 관측값이나 계수 추정용 수치 자료가 아니다.<\/p><\/figure>", "optionRevision": "2026-10-18-v1"}, {"id": "MC055", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX095", "OX096", "OX097"], "type": "single", "stem": "Donders \\(A = 200\\) ms, \\(C = 260\\) ms, \\(B = 350\\) ms다. 차감법의 단계 가정 아래 자극 식별과 반응 선택 시간은?", "options": [{"id": "o2", "text": "식별 90 ms / 선택 60 ms", "correct": false, "explanation": "\\(C - A\\)와 \\(B - C\\)의 인지 단계 의미가 바뀌었다."}, {"id": "o3", "text": "식별 150 ms / 선택 90 ms", "correct": false, "explanation": "\\(B - A = 150\\)은 식별과 선택의 합이므로 식별만의 시간이 아니다."}, {"id": "o4", "text": "식별 60 ms / 선택 150 ms", "correct": false, "explanation": "\\(B - A\\)는 두 추가 단계의 합이며 반응 선택만은 \\(B - C\\)다."}, {"id": "o1", "text": "식별 60 ms / 선택 90 ms", "correct": true, "explanation": "A는 1S–1R, C는 MS–1R, B는 MS–MR이다. 식별=\\(C - A = 60\\), 선택=\\(B - C = 90\\)으로 분리한다."}], "source": "3장 교안 p.32", "visual": "<figure class=\"visual-box\"><figcaption>Donders 과업의 실측 시간 — 인지 단계는 직접 판별<\/figcaption><div class=\"table-scroll\"><table><thead><tr><th>과업<\/th><th>제시 자극<\/th><th>가능 반응<\/th><th>RT(ms)<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>1종<\/td><td>1종<\/td><td>200<\/td><\/tr><tr><td>C<\/td><td>여러 종<\/td><td>특정 자극에만 1종<\/td><td>260<\/td><\/tr><tr><td>B<\/td><td>여러 종<\/td><td>각 자극마다 다른 반응<\/td><td>350<\/td><\/tr><\/tbody><\/table><\/div><\/figure>", "stemPlain": "Donders \\(A = 200\\) ms, \\(C = 260\\) ms, \\(B = 350\\) ms다. 차감법의 단계 가정 아래 자극 식별과 반응 선택 시간은?", "explanation": [], "commonMistakes": []}, {"id": "MC056", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX098", "OX099"], "type": "single", "stem": "Hick 모형 \\(\\mathrm{RT} = 200 + 150\\,H\\)(ms)에서 등확률 선택지가 4개다. 예측 RT와 기울기 역수의 처리율은? 처리율은 소수점 첫째 자리까지 나타낸다.", "options": [{"id": "o1", "text": "500 ms / 6.7 bits/s", "correct": true, "explanation": "\\(H=2\\), \\(RT=200+150\\times2=500\\) ms다. 처리율은 \\(1000/150=20/3\\approx6.7\\) bits/s다."}, {"id": "o2", "text": "800 ms / 6.7 bits/s", "correct": false, "explanation": "처리율은 맞지만 대안 수 4를 정보량 H에 직접 넣었다. 등확률 4개 대안의 H는 2 bits다."}, {"id": "o4", "text": "300 ms / 6.7 bits/s", "correct": false, "explanation": "기울기의 역수는 맞지만 RT 계산에서 절편 200 ms를 빠뜨렸다. 예측 RT는 절편을 포함한다."}, {"id": "o3", "text": "500 ms / 150.0 bits/s", "correct": false, "explanation": "예측 RT는 맞지만 시간/bit인 기울기를 bits/s 처리율로 그대로 썼다. 시간 단위를 바꾸고 역수를 취한다."}], "source": "3장 교안 p.34–35 · 3장 교안 p.36 · 손계산용 수치/표기 변형", "stemPlain": "Hick 모형 \\(\\mathrm{RT} = 200 + 150\\,H\\)(ms)에서 등확률 선택지가 4개다. 예측 RT와 기울기 역수의 처리율은? 처리율은 소수점 첫째 자리까지 나타낸다.", "explanation": "\\(H=2\\), \\(RT=200+150\\times2=500\\) ms다. 처리율은 \\(1000/150=20/3\\approx6.7\\) bits/s다.", "commonMistakes": ["처리율은 맞지만 대안 수 4를 정보량 H에 직접 넣었다. 등확률 4개 대안의 H는 2 bits다.", "기울기의 역수는 맞지만 RT 계산에서 절편 200 ms를 빠뜨렸다. 예측 RT는 절편을 포함한다.", "예측 RT는 맞지만 시간/bit인 기울기를 bits/s 처리율로 그대로 썼다. 시간 단위를 바꾸고 역수를 취한다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC057", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX100", "OX101"], "type": "single", "stem": "인간의 언어 처리 방식별 초당 정보 처리량(말하기 spoken language vs. 글 읽기 written language)과, 시각 단순반응시간(약 150~180 ms) 중 가장 긴 시간이 걸리는 생리적 단계를 올바르게 짝지은 것은?", "options": [{"id": "o1", "text": "읽기 약 50 bits/s > 말하기 약 10 bits/s / 중앙처리 약 90 ms", "correct": true, "explanation": "교안 예시에서 읽기가 더 높은 정보율을 보이며, 눈→뇌 10~30·중앙처리 90·뇌→근육 20·수축 30 ms 중 중앙처리가 가장 길다."}, {"id": "o2", "text": "말하기 약 50 bits/s > 읽기 약 10 bits/s / 중앙처리 약 90 ms", "correct": false, "explanation": "언어 정보율의 두 수치를 반대로 연결했다."}, {"id": "o3", "text": "읽기 약 50 bits/s > 말하기 약 10 bits/s / 근수축 약 90 ms", "correct": false, "explanation": "가장 긴 90 ms 단계는 중앙처리이며 근수축은 약 30 ms다."}, {"id": "o4", "text": "읽기 약 50 bits/s > 말하기 약 10 bits/s / 운동전달 약 90 ms", "correct": false, "explanation": "언어 정보율 비교는 맞지만 교안의 가장 긴 생리 단계는 중앙처리 약 90 ms다. 운동전달 예시는 약 20 ms다."}], "source": "3장 교안 p.36", "explanation": "교안 예시에서 읽기가 더 높은 정보율을 보이며, 눈→뇌 10~30·중앙처리 90·뇌→근육 20·수축 30 ms 중 중앙처리가 가장 길다.", "commonMistakes": ["언어 정보율의 두 수치를 반대로 연결했다.", "가장 긴 90 ms 단계는 중앙처리이며 근수축은 약 30 ms다.", "언어 정보율 비교는 맞지만 교안의 가장 긴 생리 단계는 중앙처리 약 90 ms다. 운동전달 예시는 약 20 ms다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC058", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX102"], "type": "single", "stem": "사전 경고 신호(Warning signal)가 주어지면 반응시간(RT)이 약 20% 단축된다고 가정할 때, 경고 없을 때 250 ms인 과업의 예측 RT와 기타 반응시간 단축·증가 요인의 방향을 바르게 묶은 것은?", "options": [{"id": "o2", "text": "50 ms이며 연습·좋은 식별성도 RT 단축 방향이다.", "correct": false, "explanation": "50은 줄어든 양이며 감소 후 RT는 200 ms다."}, {"id": "o1", "text": "200 ms이며 연습·좋은 식별성도 RT 단축 방향이다.", "correct": true, "explanation": "\\(250 \\times 0.8 = 200\\)이다. 연령 증가·낮은 식별성은 RT 증가, 연습·사전 경고는 단축 방향으로 설명된다."}, {"id": "o4", "text": "200 ms이며 연령 증가와 낮은 식별성은 RT 단축 방향이다.", "correct": false, "explanation": "계산은 맞지만 두 조건의 효과 방향이 반대다."}, {"id": "o3", "text": "300 ms이며 사전 경고는 시간 불확실성을 늘린다.", "correct": false, "explanation": "20% 감소를 증가로 적용했으며 사전 경고는 보통 시간적 기대를 돕는다."}], "source": "3장 교안 p.36", "explanation": [], "commonMistakes": []}, {"id": "MC059", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX103", "OX104", "OX105"], "type": "single", "stem": "Hick 모형의 절편 \\(a\\)와 관련하여 ① 자극 양식 세 가지(시각·촉각/진동·청각)의 빠른 순서, ② 반응 기관 세 가지(발·눈·손)의 빠른 순서, ③ 완전히 예상하지 못한 사건의 교안상 절편 예시를 바르게 묶은 것은?", "options": [{"id": "o1", "text": "자극: 촉각·진동→청각→시각 / 반응: 눈→손→발 / 완전 불시 사건 \\(a \\approx 750\\) ms", "correct": true, "explanation": "교안 p.37의 자극·반응 양식과 기대 요인에 대한 설명이다. 이 순서를 모든 자극 강도·과업의 보편적 순서로 확대하지 않는다."}, {"id": "o4", "text": "자극: 촉각·진동→청각→시각 / 반응: 눈→손→발 / 완전 불시 사건 \\(a\\approx150\\) ms", "correct": false, "explanation": "양식 순서는 맞지만 완전 불시 사건 예시는 약 750 ms다. 일반적인 단순반응 수준의 시간을 섞었다."}, {"id": "o3", "text": "자극: 촉각→청각→시각 / 반응: 발→손→눈 / 완전 불시 사건 \\(a \\approx 750\\) ms", "correct": false, "explanation": "반응 기관의 빠른 순서는 눈→손→발이다."}, {"id": "o2", "text": "자극: 시각→청각→촉각 / 반응: 눈→손→발 / 완전 불시 사건 \\(a \\approx 750\\) ms", "correct": false, "explanation": "교안의 자극 양식 순서를 반대로 배치했다."}], "source": "3장 교안 p.37", "explanation": "교안 p.37의 자극·반응 양식과 기대 요인에 대한 설명이다. 이 순서를 모든 자극 강도·과업의 보편적 순서로 확대하지 않는다.", "commonMistakes": ["양식 순서는 맞지만 완전 불시 사건 예시는 약 750 ms다. 일반적인 단순반응 수준의 시간을 섞었다.", "반응 기관의 빠른 순서는 눈→손→발이다.", "교안의 자극 양식 순서를 반대로 배치했다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC060", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX106", "OX107"], "type": "single", "stem": "선택지 수의 영향이 숙련자·고양립성 조건에서 더 작게 나타났다. Hick 모형에서 가장 직접적인 설명은?", "options": [{"id": "o1", "text": "기울기 b가 작아져 정보 1 bit 증가에 따른 추가 RT가 줄어든 것으로 해석한다.", "correct": true, "explanation": "선택지 정보량에 따른 증가분은 기울기 b로 나타난다. 숙련·양립성은 그 증가 부담을 줄일 수 있다."}, {"id": "o3", "text": "절편 a가 작아져 정보량 증가에 따른 조건 간 RT 차이도 함께 작아진 것으로 해석한다.", "correct": false, "explanation": "절편 변화는 선을 수직 이동한다. 다른 b 변화 없이 정보량에 따른 증가분을 줄이지 않는다."}, {"id": "o4", "text": "기울기 b는 유지되고 절편 a가 커져, 정보량에 따른 추가 RT가 줄어든 것으로 해석한다.", "correct": false, "explanation": "절편 증가는 기본 수준을 높이며, b가 같으면 정보량당 추가 시간은 그대로다."}, {"id": "o2", "text": "기울기 b가 커져 정보 1 bit 증가에 따른 추가 RT가 줄어든 것으로 해석한다.", "correct": false, "explanation": "추가 RT가 작아진 관측과 b 증가의 해석이 반대다."}], "source": "3장 교안 p.37 · 3장 교안 p.37 · 정보처리 전사3", "explanation": "선택지 정보량에 따른 증가분은 기울기 b로 나타난다. 숙련·양립성은 그 증가 부담을 줄일 수 있다.", "commonMistakes": ["절편 변화는 선을 수직 이동한다. 다른 b 변화 없이 정보량에 따른 증가분을 줄이지 않는다.", "절편 증가는 기본 수준을 높이며, b가 같으면 정보량당 추가 시간은 그대로다.", "추가 RT가 작아진 관측과 b 증가의 해석이 반대다."], "optionRevision": "2026-10-18-v1"}, {"id": "MC061", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX108", "OX109"], "type": "single", "stem": "Hick 모형 \\(\\mathrm{RT} = a + b\\,H\\) (\\(H = \\log_2 N\\))에서 같은 절편 \\(a\\)와 기울기 \\(b = 150\\) ms/bit일 때, 등확률 메뉴를 8개에서 2개로 줄이면 예측 선택시간(RT) 변화는?", "options": [{"id": "o4", "text": "300 ms 증가", "correct": false, "explanation": "선택지가 줄어든 방향을 반대로 적용했다."}, {"id": "o1", "text": "300 ms 단축", "correct": true, "explanation": "H가 3에서 1 bit로 줄어 \\(\\Delta\\mathrm{RT} = 150 \\times \\left(-2\\right) = -300\\) ms다. 메뉴 단순화의 선택 부담 감소를 설명하는 모형 적용이다."}, {"id": "o2", "text": "900 ms 단축", "correct": false, "explanation": "대안 개수 차이 6을 bit 차이로 오인해 150을 곱했다."}, {"id": "o3", "text": "150 ms 단축", "correct": false, "explanation": "8→2는 두 번의 반감이므로 정보량이 2 bits 줄어든다."}], "source": "3장 교안 p.34–36 · 3장 교안 p.39–41 · 정보처리 전사3", "stemPlain": "Hick 모형 \\(\\mathrm{RT} = a + b\\,H\\) (\\(H = \\log_2 N\\))에서 같은 절편 \\(a\\)와 기울기 \\(b = 150\\) ms/bit일 때, 등확률 메뉴를 8개에서 2개로 줄이면 예측 선택시간(RT) 변화는?", "explanation": [], "commonMistakes": []}, {"id": "MC062", "chapter": "정보전달·기억·Hick", "conceptIds": ["OX110", "OX111"], "type": "single", "stem": "X가 여러 값이어도 Y가 항상 한 값으로 고정된다. 성립하는 관계는?", "options": [{"id": "o1", "text": "\\(H\\left(Y\\right) = 0\\), \\(I\\left(X; Y\\right) = 0\\), \\(H\\left(X, Y\\right) = H\\left(X\\right)\\)", "correct": true, "explanation": "고정 출력은 입력을 구분하는 정보를 제공하지 않는다. 일반적으로 \\(H\\left(X, Y\\right) \\le H\\left(X\\right) + H\\left(Y\\right)\\)이고 독립일 때 등호다."}, {"id": "o2", "text": "\\(H\\left(Y\\right) = 0\\), \\(I\\left(X; Y\\right) = H\\left(X\\right)\\), \\(H\\left(X, Y\\right) = 0\\)", "correct": false, "explanation": "Y만으로 X를 구분할 수 없으므로 I는 0이고 결합 엔트로피는 \\(H\\left(X\\right)\\)다."}, {"id": "o3", "text": "\\(H\\left(Y\\right) = H\\left(X\\right)\\), \\(I\\left(X; Y\\right) = 0\\), \\(H\\left(X, Y\\right) > H\\left(X\\right) + H\\left(Y\\right)\\)", "correct": false, "explanation": "고정 출력의 엔트로피는 0이며 결합 엔트로피는 합보다 클 수 없다."}, {"id": "o4", "text": "\\(H\\left(Y\\right) = 1\\), \\(I\\left(X; Y\\right) = 1\\), \\(H\\left(X, Y\\right) = H\\left(X\\right) + 1\\)", "correct": false, "explanation": "항상 같은 출력은 두 등확률 대안이 아니므로 1 bit가 아니다."}], "source": "3장 교안 p.16–18 · 3장 교안 p.16", "explanation": [], "commonMistakes": []}, {"id": "MC063", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX112", "OX113", "OX141"], "type": "single", "stem": "메뉴에서 항목을 고르는 데 오래 걸리고, 고른 뒤 작은 표적까지 포인터를 옮기는 데도 오래 걸린다. 두 시간을 다루는 법칙을 순서대로 고르면?", "options": [{"id": "o3", "text": "Fitts / Fitts", "correct": false, "explanation": "첫 문제는 표적 거리·너비가 아니라 대안 중 선택의 정보량에 관한 것이다."}, {"id": "o2", "text": "Fitts / Hick", "correct": false, "explanation": "선택 단계와 운동 실행 단계의 법칙이 바뀌었다."}, {"id": "o1", "text": "Hick / Fitts", "correct": true, "explanation": "Hick은 대안의 정보량과 선택반응시간, Fitts는 거리·너비가 결정하는 난이도와 운동시간을 다룬다. Fitts는 탭핑·포인팅의 속도–정확성 교환을 설명한다."}, {"id": "o4", "text": "Hick / Hick", "correct": false, "explanation": "두 번째 문제의 작은·먼 표적을 향한 이동시간은 Fitts의 적용 대상이다."}], "source": "3장 교안 p.42–44 · 3장 교안 p.42, 44 · 3장 교안 p.34, 42", "explanation": [], "commonMistakes": []}, {"id": "MC064", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX114", "OX115"], "type": "single", "stem": "이동 거리 \\(A = D = 80\\), 표적 너비 \\(W = 20\\)일 때 Fitts의 1954년 원형 공식 \\(\\mathrm{ID} = \\log_2(2A/W)\\)와 ISO 표준(Shannon형) 공식 \\(\\mathrm{ID} = \\log_2(D/W + 1)\\)으로 구한 난이도 지수를 순서대로 고르면? 로그는 식 그대로 답하며 소수값으로 계산하지 않는다.", "options": [{"id": "o4", "text": "\\(\\log_2 8\\) / \\(\\log_2 1.25\\)", "correct": false, "explanation": "ISO형의 \\(\\frac{D}{W}\\)를 \\(\\frac{W}{D}\\)로 뒤집었다."}, {"id": "o3", "text": "\\(\\log_2 4\\) / \\(\\log_2 5\\)", "correct": false, "explanation": "원형 공식의 분자에 있는 2를 빠뜨렸다."}, {"id": "o1", "text": "\\(\\log_2 8\\) / \\(\\log_2 5\\)", "correct": true, "explanation": "원형은 \\(\\log_2 \\left(\\frac{2\\,A}{W}\\right) = \\log_2 8\\), ISO형은 \\(\\log_2 \\left(\\frac{D}{W} + 1\\right) = \\log_2 5\\)다. 같은 계수를 두 공식에 무조건 교환 적용하지 않아야 한다."}, {"id": "o2", "text": "\\(\\log_2 5\\) / \\(\\log_2 8\\)", "correct": false, "explanation": "원형과 ISO형의 공식을 서로 바꾸었다."}], "source": "3장 교안 p.43 · 3장 교안 p.46–47 · 손계산용 수치/표기 변형", "stemPlain": "이동 거리 \\(A = D = 80\\), 표적 너비 \\(W = 20\\)일 때 Fitts의 1954년 원형 공식 \\(\\mathrm{ID} = \\log_2(2A/W)\\)와 ISO 표준(Shannon형) 공식 \\(\\mathrm{ID} = \\log_2(D/W + 1)\\)으로 구한 난이도 지수를 순서대로 고르면? 로그는 식 그대로 답하며 소수값으로 계산하지 않는다.", "explanation": "원형은 \\(\\log_2 \\left(\\frac{2\\,A}{W}\\right) = \\log_2 8\\), ISO형은 \\(\\log_2 \\left(\\frac{D}{W} + 1\\right) = \\log_2 5\\)다. 같은 계수를 두 공식에 무조건 교환 적용하지 않아야 한다.", "commonMistakes": ["ISO형의 \\(\\frac{D}{W}\\)를 \\(\\frac{W}{D}\\)로 뒤집었다.", "원형 공식의 분자에 있는 2를 빠뜨렸다.", "원형과 ISO형의 공식을 서로 바꾸었다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC065", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX116", "OX117"], "type": "single", "stem": "ISO형 \\(MT=50+150\\log_2(D/W+1)\\) ms에서 (가) \\(D=80,W=20\\), (나) \\(D=100,W=10\\)이다. 두 길이는 같은 단위다. 손계산용 \\(\\log_2 5\\approx2.3\\), \\(\\log_2 11\\approx3.5\\)를 그대로 사용한 두 MT는?", "options": [{"id": "o2", "text": "345.0 ms / 525.0 ms", "correct": false, "explanation": "두 조건에서 모두 절편 50 ms를 빠뜨렸다. MT는 기울기와 ID의 곱에 절편을 더해 계산한다."}, {"id": "o3", "text": "575.0 ms / 395.0 ms", "correct": false, "explanation": "두 조건의 계산값을 반대로 연결했다. (나)의 거리/너비 비가 더 커서 예측 시간이 더 길다."}, {"id": "o1", "text": "395.0 ms / 575.0 ms", "correct": true, "explanation": "\\((가):50+150\\times2.3=395.0\\), \\((나):50+150\\times3.5=575.0\\) ms다. 실제 로그의 더 정밀한 값이 아니라 문제의 근삿값을 적용한다."}, {"id": "o4", "text": "650.0 ms / 1550.0 ms", "correct": false, "explanation": "거리/너비 비 4와 10을 로그 변환 없이 대입했다. ISO형은 비에 1을 더한 뒤 밑 2 로그를 취한다."}], "source": "3장 교안 p.47 · 손계산용 수치/표기 변형", "visual": "<figure class=\"visual-box\"><figcaption>같은 시작점에서 두 표적으로 이동 — 거리와 너비의 전체 비교<\/figcaption><svg role=\"img\" aria-label=\"같은 시작점에서 두 표적으로 이동 — 거리와 너비의 전체 비교\" viewBox=\"0 0 600 220\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"45\" cy=\"65\" r=\"6\" fill=\"#333\"/><circle cx=\"45\" cy=\"145\" r=\"6\" fill=\"#333\"/><path d=\"M55 65H365M55 145H445\" stroke=\"#7c8fa6\" stroke-width=\"2\"/><rect x=\"325\" y=\"40\" width=\"80\" height=\"50\" fill=\"#c4cfdb\"/><rect x=\"425\" y=\"120\" width=\"40\" height=\"50\" fill=\"#c4cfdb\"/><text x=\"65\" y=\"32\">(가) D=80, W=20<\/text><text x=\"65\" y=\"112\">(나) D=100, W=10<\/text><text x=\"65\" y=\"195\">공통: a=50 ms, b=150 ms/bit, ISO형<\/text><\/svg><\/figure>", "stemPlain": "ISO형 \\(MT=50+150\\log_2(D/W+1)\\) ms에서 (가) \\(D=80,W=20\\), (나) \\(D=100,W=10\\)이다. 두 길이는 같은 단위다. 손계산용 \\(\\log_2 5\\approx2.3\\), \\(\\log_2 11\\approx3.5\\)를 그대로 사용한 두 MT는?", "explanation": "\\((가):50+150\\times2.3=395.0\\), \\((나):50+150\\times3.5=575.0\\) ms다. 실제 로그의 더 정밀한 값이 아니라 문제의 근삿값을 적용한다.", "commonMistakes": ["두 조건에서 모두 절편 50 ms를 빠뜨렸다. MT는 기울기와 ID의 곱에 절편을 더해 계산한다.", "두 조건의 계산값을 반대로 연결했다. (나)의 거리/너비 비가 더 커서 예측 시간이 더 길다.", "거리/너비 비 4와 10을 로그 변환 없이 대입했다. ISO형은 비에 1을 더한 뒤 밑 2 로그를 취한다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC066", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX118", "OX139"], "type": "single", "stem": "ISO형 Fitts 모형 \\(\\mathrm{ID} = \\log_2\\left(\\frac{D}{W} + 1\\right)\\)에서 \\(D = 10\\) cm, \\(W = 20\\) mm이다. 단위를 통일한 뒤 \\(D\\)와 \\(W\\)를 모두 두 배로 바꾸면 \\(\\mathrm{ID}\\)는? 로그는 식 그대로 답하며 소수값으로 계산하지 않는다.", "options": [{"id": "o1", "text": "\\(\\log_2 6\\)에서 그대로 유지된다.", "correct": true, "explanation": "10 cm=100 mm라 \\(\\frac{D}{W} = 5\\), ISO형 \\(\\mathrm{ID} = \\log_2 6\\)이다. 두 길이를 같은 비율로 바꾸면 \\(\\frac{D}{W}\\)가 같아 같은 a,b에서 MT도 같다."}, {"id": "o4", "text": "\\(\\log_2 6\\)에서 정확히 1 bit 커진다.", "correct": false, "explanation": "너비가 고정되고 거리만 변한 경우와 동시 비례 확대를 혼동했다."}, {"id": "o3", "text": "\\(\\log_2 6\\)에서 두 배로 커진다.", "correct": false, "explanation": "거리와 너비가 함께 두 배가 되면 비율은 바뀌지 않는다."}, {"id": "o2", "text": "\\(\\log_2 1.5\\)에서 그대로 유지된다.", "correct": false, "explanation": "10과 20을 단위 변환 없이 나누어 잘못된 비율을 사용했다."}], "source": "3장 교안 p.46–47 · 손계산용 수치/표기 변형", "stemPlain": "ISO형 Fitts 모형 \\(\\mathrm{ID} = \\log_2\\left(\\frac{D}{W} + 1\\right)\\)에서 \\(D = 10\\) cm, \\(W = 20\\) mm이다. 단위를 통일한 뒤 \\(D\\)와 \\(W\\)를 모두 두 배로 바꾸면 \\(\\mathrm{ID}\\)는? 로그는 식 그대로 답하며 소수값으로 계산하지 않는다.", "explanation": "10 cm=100 mm라 \\(\\frac{D}{W} = 5\\), ISO형 \\(\\mathrm{ID} = \\log_2 6\\)이다. 두 길이를 같은 비율로 바꾸면 \\(\\frac{D}{W}\\)가 같아 같은 a,b에서 MT도 같다.", "commonMistakes": ["너비가 고정되고 거리만 변한 경우와 동시 비례 확대를 혼동했다.", "거리와 너비가 함께 두 배가 되면 비율은 바뀌지 않는다.", "10과 20을 단위 변환 없이 나누어 잘못된 비율을 사용했다."], "questionRevision": "hand-calc-2026-10-18"}, {"id": "MC067", "chapter": "Fitts·운동·양립성", "conceptIds": ["OX119", "OX120"], "type": "single", "stem": "신체 부위별 Fitts 법칙(\\(\\mathrm{MT} = a + b\\cdot\\mathrm{ID}\\))의 기울기 \\(b\\)가 팔뚝(forearm) 105, 손목(wrist) 43, 손가락(finger) 26 ms/bit이다. 동일한 절편 \\(a\\)와 양의 난이도 지수 \\(\\mathrm{ID}>0\\)를 가정할 때 올바른 해석은?", "options": [{"id": "o2", "text": "같은 양의 ID에서 추가 MT는 forearm이 가장 작고 finger가 가장 크다.", "correct": false, "explanation": "시간/bit 기울기를 처리속도로 읽어 방향을 뒤바꾸었다."}, {"id": "o4", "text": "같은 양의 ID에서 finger의 b가 작으므로 정보 1 bit당 필요한 시간이 더 길다.", "correct": false, "explanation": "작은 b는 1 bit당 더 짧은 추가 시간을 뜻한다. 역수 처리율과 혼동했다."}, {"id": "o1", "text": "같은 양의 ID에서 추가 MT는 finger가 가장 작고 forearm이 가장 크다.", "correct": true, "explanation": "b·ID의 추가 시간은 기울기에 비례한다. 같은 a와 양의 ID에서 26<43<105 순이다."}, {"id": "o3", "text": "같은 양의 ID에서 추가 MT는 같고, 부위 간 총 MT 차이는 절편으로 설명된다.", "correct": false, "explanation": "b가 서로 다르므로 b·ID도 다르다. 제시 조건은 절편도 같다."}], "source": "3장 교안 p.48", "visual": "<figure class=\"visual-box\"><figcaption>신체 부위별 기울기 — 동일 a와 ID 조건<\/figcaption><div class=\"table-scroll\"
