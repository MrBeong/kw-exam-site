<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>데이터마이닝 중간고사 · 다지선다</title>
  <script>
    window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root{--ink:#191919;--muted:#787774;--line:#e8e7e4;--soft:#f7f6f3;--green:#2f7d4a;--green-bg:#edf7f0;--red:#b42318;--red-bg:#fff1ef}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;color:var(--ink);background:#fff}
    button{font:inherit;color:inherit;cursor:pointer}.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}.app-tabs{display:flex;align-items:center;gap:2px;padding:3px;background:var(--soft);border-radius:7px;overflow-x:auto}.app-tab{color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:5px;white-space:nowrap}.app-tab:hover,.app-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .page{width:min(760px,calc(100% - 20px));height:calc(100dvh - 54px);margin:auto;padding:9px 0 10px;display:flex;flex-direction:column;overflow:hidden}.controls{flex:0 0 auto;margin-bottom:8px}.control-row{display:flex;align-items:center;gap:6px}.state-tabs{display:flex;flex:1;gap:3px;min-width:0}.state-tab,.chapter-toggle{border:0;background:transparent;border-radius:6px;padding:7px 9px;font-size:12px;font-weight:700;white-space:nowrap}.state-tab.active{background:#202020;color:#fff}.state-tab:not(.active):hover,.chapter-toggle:hover{background:var(--soft)}.chapter-toggle{border:1px solid var(--line);background:#fff}
    .chapter-popover{display:none;position:fixed;z-index:50;top:104px;left:50%;transform:translateX(-50%);width:min(740px,calc(100% - 20px));padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.14)}.chapter-popover.open{display:block}.chapter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.chapter-chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 5px;font-size:12px;font-weight:700}.chapter-chip.active{background:#202020;color:#fff;border-color:#202020}
    .quiz-card{flex:1;min-height:0;border:1px solid var(--line);border-radius:9px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.card-head{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line)}.badge{font-size:12px;font-weight:700;background:var(--soft);padding:4px 7px;border-radius:5px}.kind{font-size:12px;color:var(--muted)}.spacer{flex:1}.bookmark{border:0;background:transparent;font-size:22px;line-height:1;padding:2px 4px}.bookmark.on{color:#b87800}
    .prompt{flex:0 0 auto;padding:12px 14px 8px;font-size:17px;font-weight:800}.hint{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:500}.options{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px 10px}.option{width:100%;display:grid;grid-template-columns:30px 1fr;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;margin:0 0 7px;line-height:1.45}.option:hover{background:#fbfbfa}.option.selected{border-color:#222;box-shadow:inset 0 0 0 1px #222}.letter{width:26px;height:26px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:800}.option.selected .letter{background:#222;color:#fff}.option.correct{border-color:#8cc59d;background:var(--green-bg)}.option.wrong-selected{border-color:#e7a39c;background:var(--red-bg)}.option.missed{border-style:dashed;border-color:#70a982;background:#f6fbf7}.option.correct .letter,.option.missed .letter{background:var(--green);color:#fff}.option.wrong-selected .letter{background:var(--red);color:#fff}.option-text{font-size:14px;font-weight:650}.option-explain{grid-column:2;margin-top:4px;padding-top:6px;border-top:1px solid rgba(0,0,0,.08);font-size:12px;color:#555}.truth{font-weight:900;margin-right:4px}.truth.o{color:var(--green)}.truth.x{color:var(--red)}
    .result-bar{display:none;flex:0 0 auto;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;font-weight:750}.result-bar.show{display:block}.result-bar.good{color:var(--green);background:var(--green-bg)}.result-bar.bad{color:var(--red);background:var(--red-bg)}
    .actions{flex:0 0 auto;display:flex;gap:7px;padding:8px 12px;border-top:1px solid var(--line)}.action{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:750}.action.primary{flex:1;background:#202020;color:#fff;border-color:#202020}.action:disabled{opacity:.35;cursor:default}.retry{display:none}.retry.show{display:block}
    .card-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line)}.nav-btn{border:0;background:transparent;padding:7px 8px;border-radius:5px;font-size:13px}.nav-btn:hover{background:var(--soft)}.nav-btn:disabled{opacity:.3;cursor:default}.position{font-size:12px;color:var(--muted)}
    .loading{flex:1;display:grid;place-items:center;color:var(--muted);font-size:14px}.empty{display:none;flex:1;place-items:center;text-align:center;color:var(--muted);padding:24px}.empty.show{display:grid}.quiz-card.hidden{display:none}iframe{display:none}
    mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
    @media(max-width:520px){.top{height:48px;padding:0 7px}.app-tabs{gap:0}.app-tab{font-size:10px;padding:5px 6px}.page{width:calc(100% - 14px);height:calc(100dvh - 48px);padding:6px 0 7px}.controls{margin-bottom:6px}.state-tabs{gap:2px}.state-tab,.chapter-toggle{font-size:10px;padding:6px 7px}.chapter-popover{top:91px;width:calc(100% - 14px)}.chapter-grid{grid-template-columns:repeat(2,1fr)}.card-head{padding:7px 10px}.prompt{font-size:15px;padding:10px 11px 6px}.options{padding:3px 9px 6px}.option{grid-template-columns:27px 1fr;gap:6px;padding:7px 8px;margin-bottom:5px}.letter{width:24px;height:24px}.option-text{font-size:12px}.option-explain{font-size:11px}.actions{padding:6px 9px}.action{padding:8px 10px}.card-foot{padding:4px 6px}}
  </style>
</head>
<body>
  <header class="top">
    <nav class="app-tabs" aria-label="학습 탭">
      <a class="app-tab" href="../">개념 정리</a>
      <a class="app-tab" href="../ox/">O/X</a>
      <a class="app-tab active" href="./">다지선다</a>
      <a class="app-tab" href="../?view=problems">예상문제</a>
      <a class="app-tab" href="../?view=mistakes">오답 복습</a>
    </nav>
  </header>

  <main class="page">
    <section class="controls" aria-label="문항 필터">
      <div class="control-row">
        <div class="state-tabs" id="stateTabs">
          <button class="state-tab active" data-state="all" type="button">전체</button>
          <button class="state-tab" data-state="unanswered" type="button">미응답</button>
          <button class="state-tab" data-state="wrong" type="button">오답</button>
          <button class="state-tab" data-state="bookmarked" type="button">북마크</button>
        </div>
        <button class="chapter-toggle" id="chapterToggle" type="button">전체 단원 ▾</button>
      </div>
    </section>
    <div class="chapter-popover" id="chapterPopover"><div class="chapter-grid" id="chapterGrid"></div></div>

    <div class="loading" id="loading">개념 문항을 불러오는 중…</div>
    <article class="quiz-card hidden" id="quizCard">
      <div class="card-head">
        <span class="badge" id="chapterBadge"></span>
        <span class="kind" id="conceptCount"></span>
        <span class="spacer"></span>
        <button class="bookmark" id="bookmarkBtn" type="button" aria-label="북마크">☆</button>
      </div>
      <div class="prompt">다음 중 옳은 내용을 모두 고르시오.
        <span class="hint">정답이 하나 이상일 수 있습니다.</span>
      </div>
      <div class="options" id="options"></div>
      <div class="result-bar" id="resultBar"></div>
      <div class="actions">
        <button class="action retry" id="retryBtn" type="button">다시 풀기</button>
        <button class="action primary" id="submitBtn" type="button">선택 완료</button>
      </div>
      <div class="card-foot">
        <button class="nav-btn" id="prevBtn" type="button">← 이전</button>
        <span class="position" id="position"></span>
        <button class="nav-btn" id="nextBtn" type="button">다음 →</button>
      </div>
    </article>
    <div class="empty" id="empty">조건에 맞는 문항이 없습니다.</div>
  </main>

  <iframe id="conceptSource" src="../ox/?concept-source=1" title="개념 데이터"></iframe>

  <script>
  const KEY="dm-midterm-multiple-v1";
  const letters=["A","B","C","D"];
  let questions=[],filtered=[],cursor=0,stateFilter="all",chapterFilter="all",selected=new Set(),currentQuestionId=null;
  let saved={answers:{},bookmarks:{}};
  try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||"{}")} }catch(e){}
  saved.answers=saved.answers||{};saved.bookmarks=saved.bookmarks||{};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const save=()=>localStorage.setItem(KEY,JSON.stringify(saved));

  function buildQuestions(concepts){
    const byChapter=new Map();
    concepts.forEach(item=>{if(!byChapter.has(item.chapter))byChapter.set(item.chapter,[]);byChapter.get(item.chapter).push(item)});
    const output=[];let number=1;
    byChapter.forEach((items,chapter)=>{
      const groupCount=Math.ceil(items.length/4);
      const groups=Array.from({length:groupCount},()=>[]);
      const yes=items.filter(x=>x.answer),no=items.filter(x=>!x.answer),used=new Set();
      for(let i=0;i<groupCount;i++){
        if(no[i]){groups[i].push(no[i]);used.add(no[i].id)}
        if(yes[i]){groups[i].push(yes[i]);used.add(yes[i].id)}
      }
      const rest=items.filter(x=>!used.has(x.id));
      rest.forEach(item=>{
        const target=groups.map((g,i)=>({g,i})).filter(x=>x.g.length<4).sort((a,b)=>a.g.length-b.g.length||a.i-b.i)[0];
        target.g.push(item);
      });
      groups.forEach(options=>{
        options.sort((a,b)=>Number(a.id.slice(2))-Number(b.id.slice(2)));
        output.push({id:`MC${String(number++).padStart(3,"0")}`,chapter,options});
      });
    });
    return output;
  }

  function init(concepts){
    questions=buildQuestions(concepts);
    window.MULTIPLE_QUESTIONS=questions;
    const used=questions.flatMap(q=>q.options.map(x=>x.id));
    if(used.length!==concepts.length||new Set(used).size!==concepts.length)throw new Error("개념 매핑 검사에 실패했습니다.");
    if(questions.some(q=>!q.options.some(x=>x.answer)||!q.options.some(x=>!x.answer)))throw new Error("선지 구성 검사에 실패했습니다.");
    document.body.dataset.questionCount=String(questions.length);
    document.body.dataset.conceptCount=String(used.length);
    document.body.dataset.uniqueConceptCount=String(new Set(used).size);
    const chapters=[...new Set(questions.map(q=>q.chapter))];
    $("#chapterGrid").innerHTML=`<button class="chapter-chip active" data-chapter="all">전체</button>`+chapters.map(c=>`<button class="chapter-chip" data-chapter="${c}">${c}</button>`).join("");
    $("#loading").style.display="none";$("#quizCard").classList.remove("hidden");
    applyFilters();
  }

  function applyFilters(keepId){
    filtered=questions.filter(q=>{
      if(chapterFilter!=="all"&&q.chapter!==chapterFilter)return false;
      const answer=saved.answers[q.id];
      if(stateFilter==="unanswered"&&answer)return false;
      if(stateFilter==="wrong"&&(!answer||answer.correct))return false;
      if(stateFilter==="bookmarked"&&!saved.bookmarks[q.id])return false;
      return true;
    });
    const found=keepId?filtered.findIndex(q=>q.id===keepId):-1;
    cursor=found>=0?found:Math.min(cursor,Math.max(0,filtered.length-1));
    render();
  }

  function render(){
    const empty=!filtered.length;
    $("#quizCard").classList.toggle("hidden",empty);$("#empty").classList.toggle("show",empty);
    if(empty)return;
    const q=filtered[cursor],answer=saved.answers[q.id];
    if(q.id!==currentQuestionId||answer)selected=new Set(answer?.selected||[]);
    currentQuestionId=q.id;
    $("#chapterBadge").textContent=q.chapter;$("#conceptCount").textContent=`${q.options.length}개 개념 · ${q.id}`;
    $("#bookmarkBtn").classList.toggle("on",!!saved.bookmarks[q.id]);$("#bookmarkBtn").textContent=saved.bookmarks[q.id]?"★":"☆";
    $("#options").innerHTML=q.options.map((opt,i)=>{
      const picked=selected.has(opt.id);let cls=picked?" selected":"";
      if(answer){if(opt.answer)cls+=" "+(picked?"correct":"missed");else if(picked)cls+=" wrong-selected"}
      return `<button class="option${cls}" data-id="${opt.id}" type="button" aria-pressed="${picked}" ${answer?"disabled":""}>
        <span class="letter">${letters[i]}</span><span class="option-text">${opt.statement}</span>
        ${answer?`<span class="option-explain"><span class="truth ${opt.answer?"o":"x"}">${opt.answer?"O":"X"}</span>${opt.explanation}</span>`:""}
      </button>`;
    }).join("");
    const correctCount=q.options.filter(x=>x.answer).length;
    $("#resultBar").className="result-bar"+(answer?` show ${answer.correct?"good":"bad"}`:"");
    $("#resultBar").textContent=answer?(answer.correct?`정답입니다. ${correctCount}개를 모두 골랐습니다.`:`오답입니다. O/X 표시와 해설을 항목별로 확인하세요.`):"";
    $("#retryBtn").classList.toggle("show",!!answer);$("#submitBtn").textContent=answer?"다음 문제 →":"선택 완료";
    $("#submitBtn").disabled=!answer&&!selected.size;
    $("#position").textContent=`${cursor+1} / ${filtered.length} · 개념 ${q.options.length}`;
    $("#prevBtn").disabled=cursor===0;$("#nextBtn").disabled=cursor===filtered.length-1;
    typeset();
  }

  function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([$("#quizCard")]);MathJax.typesetPromise([$("#quizCard")]).catch(()=>{})}}
  function toggleOption(id){
    const q=filtered[cursor];if(saved.answers[q.id])return;
    selected.has(id)?selected.delete(id):selected.add(id);renderDraft();
  }
  function renderDraft(){
    $$(".option").forEach(btn=>{const on=selected.has(btn.dataset.id);btn.classList.toggle("selected",on);btn.setAttribute("aria-pressed",String(on))});
    $("#submitBtn").disabled=!selected.size;
  }
  function submit(){
    const q=filtered[cursor],prior=saved.answers[q.id];
    if(prior){move(1);return}
    if(!selected.size)return;
    const correctIds=q.options.filter(x=>x.answer).map(x=>x.id);
    const correct=correctIds.length===selected.size&&correctIds.every(id=>selected.has(id));
    saved.answers[q.id]={selected:[...selected],correct,at:Date.now()};save();render();
  }
  function retry(){const q=filtered[cursor];delete saved.answers[q.id];selected.clear();save();render()}
  function move(delta){
    if(delta>0&&cursor>=filtered.length-1)return;
    if(delta<0&&cursor<=0)return;
    cursor+=delta;render();
  }

  $("#options").addEventListener("click",e=>{const b=e.target.closest(".option");if(b)toggleOption(b.dataset.id)});
  $("#submitBtn").addEventListener("click",submit);$("#retryBtn").addEventListener("click",retry);
  $("#prevBtn").addEventListener("click",()=>move(-1));$("#nextBtn").addEventListener("click",()=>move(1));
  $("#bookmarkBtn").addEventListener("click",()=>{const q=filtered[cursor];saved.bookmarks[q.id]=!saved.bookmarks[q.id];save();render()});
  $("#stateTabs").addEventListener("click",e=>{const b=e.target.closest(".state-tab");if(!b)return;stateFilter=b.dataset.state;cursor=0;$$('.state-tab').forEach(x=>x.classList.toggle('active',x===b));applyFilters()});
  $("#chapterToggle").addEventListener("click",e=>{e.stopPropagation();$("#chapterPopover").classList.toggle("open")});
  $("#chapterPopover").addEventListener("click",e=>e.stopPropagation());document.addEventListener("click",()=>$("#chapterPopover").classList.remove("open"));
  $("#chapterGrid").addEventListener("click",e=>{const b=e.target.closest(".chapter-chip");if(!b)return;chapterFilter=b.dataset.chapter;cursor=0;$$('.chapter-chip').forEach(x=>x.classList.toggle('active',x===b));$("#chapterToggle").textContent=`${chapterFilter==='all'?'전체 단원':chapterFilter} ▾`;$("#chapterPopover").classList.remove("open");applyFilters()});
  document.addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4"&&!saved.answers[filtered[cursor]?.id]){const opt=filtered[cursor]?.options[Number(e.key)-1];if(opt)toggleOption(opt.id)}if(e.key==="Enter")submit();if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)});

  const source=$("#conceptSource");
  source.addEventListener("load",()=>{
    try{
      const concepts=source.contentWindow.OX_ITEMS;
      if(!Array.isArray(concepts)||!concepts.length)throw new Error();
      init(concepts.map(x=>({...x})));
    }catch(e){$("#loading").textContent="개념 문항을 불러오지 못했습니다. 페이지를 새로고침해 주세요."}
  });
  </script>
</body>
</html>
