    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;color:var(--ink);background:#fff}

<body>
  <header class="top">
    <nav class="app-tabs" aria-label="학습 탭">

  <main class="page">
    <section class="controls" aria-label="문항 필터">
      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="mixed" type="button">실전 혼합</button>
        <button class="mode-tab" data-mode="single" type="button">개념별</button>
        <button class="mode-tab" data-mode="multi" type="button">복수정답</button>
      </div>
      <div class="control-row">
        <div class="state-tabs" id="stateTabs">
          <button class="state-tab active" data-state="all" type="button">전체</button>
          <button class="state-tab" data-state="unanswered" type="button">미응답</button>
          <button class="state-tab" data-state="wrong" type="button">오답</button>
          <button class="state-tab" data-state="bookmarked" type="button">북마크</button>
        </div>
        <button class="chapter-toggle" id="chapterToggle" type="button">전체 단원 ▾</button>
        <button class="reset-all" id="retryAllBtn" type="button">전체 문제 다시</button>
      </div>
    </section>
    <div class="chapter-popover" id="chapterPopover"><div class="chapter-grid" id="chapterGrid"></div></div>

    <div class="loading" id="loading">개념 문항을 불러오는 중…</div>
    <article class="quiz-card hidden" id="quizCard">
      <div class="card-head">
        <span class="badge" id="chapterBadge"></span>
        <span class="kind" id="conceptCount"></span>
        <span class="spacer"></span>
        <button class="bookmark" id="bookmarkBtn" type="button" aria-label="북마크">☆</button>
      </div>
      <div class="prompt"><span id="promptText"></span>
        <span class="claim" id="claimText"></span>
        <span class="hint" id="hintText"></span>
      </div>
      <div class="options" id="options"></div>
      <div class="result-bar" id="resultBar"></div>
      <div class="actions">
        <button class="action retry" id="retryBtn" type="button">이 문제 다시 풀기</button>
        <button class="action primary" id="submitBtn" type="button">선택 완료</button>
      </div>
      <div class="card-foot">
        <button class="nav-btn" id="prevBtn" type="button">← 이전</button>
        <span class="position" id="position"></span>
        <button class="nav-btn" id="nextBtn" type="button">다음 →</button>
      </div>
    </article>
    <div class="empty" id="empty">조건에 맞는 문항이 없습니다.</div>
  </main>

  <iframe id="conceptSource" src="../ox/?concept-source=1" title="개념 데이터"></iframe>

  <script>
  const KEY="dm-midterm-multiple-v4";
  const letters=["A","B","C","D"];
  let concepts=[],singleBank=[],multiBank=[],caseBank=[],questions=[],filtered=[],cursor=0,stateFilter="all",chapterFilter="all",mode="mixed",selected=new Set(),currentQuestionId=null;
  let saved={answers:{},bookmarks:{}};
  try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||"{}")} }catch(e){}
  saved.answers=saved.answers||{};saved.bookmarks=saved.bookmarks||{};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const save=()=>localStorage.setItem(KEY,JSON.stringify(saved));
  const R=String.raw;
  const DIRECT_SINGLE_MAP={
    OX001:[
      R`데이터마이닝 프로젝트를 시작할 때 가장 먼저 정의해야 하는 출발점은?`,
      [R`해결할 구체적인 문제, 필요한 의사결정, 목표 출력(\(Y\)) 정의`,R`모델을 고르기 전에 무엇을 해결할지, 어떤 의사결정에 쓸지, 목표 출력이 무엇인지를 먼저 정의해야 한다.`],
      [R`사용할 딥러닝·머신러닝 알고리즘의 종류 선정`,R`알고리즘 선정은 문제와 목표 출력을 정의하고 데이터를 탐색한 뒤에 수행하는 단계다.`],
      [R`모델의 하이퍼파라미터 탐색 범위와 규제 강도 설정`,R`하이퍼파라미터 조정은 모델링 단계의 세부 절차로 문제 정의보다 앞설 수 없다.`],
      [R`최종 배포 서버의 하드웨어 사양과 대시보드 화면 디자인 확정`,R`인프라 및 배포 설계는 분석 목적과 모델 요구사항이 정해진 뒤에 구체화한다.`]
    ],
    OX002:[
      R`강의에서 제시한 데이터마이닝의 전체 문제 해결 흐름 순서로 올바른 것은?`,
      [R`문제 정의 → 수집 → 탐색·시각화 → 모델링 → 해석·요약·배포 → 현장 행동`,R`데이터마이닝은 문제 정의에서 출발해 탐색과 모델링을 거쳐 실제 의사결정·행동으로 이어진다.`],
      [R`모델링 → 수집 → 문제 정의 → 탐색·시각화 → 현장 행동 → 요약·배포`,R`문제 정의와 데이터 수집·탐색 없이 모델링부터 시작할 수 없다.`],
      [R`수집 → 모델링 → 문제 정의 → 현장 행동 → 탐색·시각화 → 요약·배포`,R`수집 전에 문제 정의가 선행되어야 하며, 모델링 전에 탐색·시각화가 필요하다.`],
      [R`탐색·시각화 → 현장 행동 → 수집 → 모델링 → 문제 정의 → 요약·배포`,R`현장 행동은 분석 결과를 해석·요약·배포한 뒤 연결되는 단계다.`]
    ],
    OX003:[
      R`학습에 사용하지 않은 새로운(unseen) 데이터에서도 모델이 예측·설명 성능을 안정적으로 유지하는 성질을 무엇이라 하는가?`,
      [R`일반화 (Generalization) — 훈련 표본 너머의 미관측 모집단 분포에서도 성능이 유지되는 성질`,R`일반화는 훈련 자료뿐 아니라 보지 못한 새로운 자료에서도 모델이 잘 작동하는 핵심 목표다.`],
      [R`과적합 (Overfitting) — 훈련 표본의 우연한 잡음까지 학습하여 훈련 오차만 낮아지는 현상`,R`과적합은 학습자료의 세부 잡음까지 과하게 맞춰 새 자료에서 성능이 떨어지는 현상이다.`],
      [R`외삽 (Extrapolation) — 관측된 설명변수 범위를 벗어난 영역으로 회귀식을 연장해 값을 추정하는 절차`,R`외삽은 관측 범위 밖의 값을 예측하는 것으로 일반화 성질 자체의 정의가 아니다.`],
      [R`정규화 (Normalization) — 변수들의 측정 스케일 범위를 일정한 구간으로 맞추는 전처리 변환`,R`정규화는 입력 변수의 스케일 조정 기법이며 미관측 데이터 성능 유지 성질은 일반화다.`]
    ],
    OX004:[
      R`모델이 학습자료의 잡음에 과도하게 맞춰지는 과적합(overfitting)을 억제하기 위해 손실함수나 모델 복잡도에 제약을 부여하는 기법은?`,
      [R`규제화 (Regularization) — 회귀계수 크기나 함수 복잡도에 패널티를 부여해 분산을 줄이는 기법`,R`규제화는 모델 복잡도에 제약을 주어 과적합을 줄이고 일반화 성능을 돕는 방법이다.`],
      [R`보간법 (Interpolation) — 관측된 데이터 구간 내부의 비어 있는 시점 값을 주변 점으로 메우는 기법`,R`보간은 관측 구간 내 빈 값을 추정하는 기법으로 과적합 억제 패널티 기법이 아니다.`],
      [R`중심화 (Centering) — 각 변수에서 표본평균을 빼서 평균이 0이 되도록 원점을 이동시키는 변환`,R`중심화는 평균을 0으로 맞출 뿐 모델의 자유도나 복잡도를 제약하지 않는다.`],
      [R`단위변환 (Unit Scaling) — 설명변수의 물리적 측정 단위를 상수배로 바꾸어 계수 스케일을 조정하는 작업`,R`선형 단위 변환을 해도 적합값과 모형 복잡도는 그대로여서 과적합이 억제되지 않는다.`]
    ],
    OX005:[
      R`기존 변수 중 일부를 그대로 고르는 방법과, 기존 변수로부터 새로운 좌표·표현을 만드는 방법을 순서대로 바르게 짝지은 것은?`,
      [R`변수 선택 (Feature Selection) — 변수 추출 (Feature Extraction)`,R`원변수를 그대로 남기면 변수 선택이고, 기존 변수들을 조합해 새 표현을 만들면 변수 추출이다.`],
      [R`변수 추출 (Feature Extraction) — 변수 선택 (Feature Selection)`,R`변수 선택과 변수 추출의 정의를 서로 반대로 연결했다.`],
      [R`표본 추출 (Sampling) — 데이터 적재 (Loading)`,R`표본 추출은 관측치(행)를 뽑는 절차이며 변수 표현 기법이 아니다.`],
      [R`결측 대치 (Imputation) — 데이터 증강 (Augmentation)`,R`결측치 처리와 데이터 증강은 변수 선택·추출의 구분과 다른 개념이다.`]
    ],
    OX006:[
      R`강의에서 목표 출력 \(Y\)가 연속적인 수치형일 때 대표적으로 연결하는 기본 회귀 모델은? (단, 범주형 \(Y\)에는 로지스틱 회귀를 대표 연결함)`,
      [R`선형회귀 (Linear Regression)`,R`강의에서는 출력 Y가 수치형이면 선형회귀, 범주형이면 로지스틱 회귀를 대표 기본 모델로 연결한다.`],

      [R`입력 데이터의 정확성·신뢰성(Veracity)이 낮아 편향이나 잡음이 심하면, 데이터 규모와 모델 복잡도를 키워도 분석 품질과 의사결정 가치(Value)가 보장되지 않는다.`,R`양이 많고 모델이 복잡해도 입력 품질이 나쁘면 좋은 결론을 얻을 수 없으므로 신뢰성과 가치를 함께 봐야 한다.`],

    ],
    OX018:[
      R`저장된 자료를 조건에 맞게 단순 검색·조회하는 작업과 구별되는 데이터마이닝(Data Mining)의 핵심 정의는?`,
      [R`데이터에서 유용한 패턴과 지식을 찾고, 문제 정의·탐색·모델링·해석·활용까지 연결하는 과정`,R`데이터마이닝은 단순 조회(query)가 아니라 유용한 패턴·지식을 발굴해 문제 해결과 의사결정에 연결하는 과정이다.`],
      [R`이미 알고 있는 고유번호로 특정 고객의 주소 레코드 하나를 그대로 출력하는 작업`,R`단순 검색·조회는 데이터베이스 기본 질의(query)이며 데이터마이닝이 아니다.`],
      [R`패턴 탐색 없이 원본 텍스트 파일의 글자 인코딩만 UTF-8로 변환하는 작업`,R`단순 파일 형식 변환은 전처리의 일부분일 뿐 데이터마이닝 전체 정의가 아니다.`],
      [R`데이터 분석 없이 서버의 디스크 파티션을 나누고 백업본을 복제하는 작업`,R`스토리지 관리는 시스템 운영 작업이며 지식 발견 과정인 데이터마이닝과 구분된다.`]

    OX019:[
      R`데이터마이닝에서 '데이터 속 패턴이나 지식을 찾는 과정 자체'에 초점을 두는 관점과 '수집부터 현장 활용까지의 전체 문제 해결 과정'을 함께 보는 관점을 순서대로 바르게 짝지은 것은?`,

      [R`광의의 관점 — 미시적(협의의) 관점`,R`미시적 관점과 광의의 관점의 설명을 서로 반대로 연결했다.`],

    OX020:[
      R`인공지능(AI), 머신러닝(ML), 딥러닝(DL) 세 용어의 개념적 위계와 특징을 가장 정확하게 비교한 것은?`,
      [R`AI는 지능적 판단·행동 시스템 전반의 상위 목표이고, ML은 데이터로부터 입출력 관계나 구조를 학습하는 방법론이다.`,R`교안은 세 용어를 동일시하지 않고 AI(넓은 목표·시스템) ⊃ ML(데이터 기반 학습) ⊃ DL(다층 신경망 기반 학습)로 구분한다.`],

      [R`AI, ML, DL은 적용 대상 데이터의 형식(텍스트, 표, 영상)에 따라서만 나뉘는 상호배타적 개념으로 서로 포함 관계가 성립하지 않는다.`,R`세 개념은 데이터 형식이 아니라 시스템 목표와 학습 방법론의 수준에 따른 포함 관계(AI ⊃ ML ⊃ DL)를 이룬다.`]
    ],
    OX021:[
      R`AI, Machine Learning(ML), Deep Learning(DL) 사이의 집합적 포함 관계와 데이터마이닝(DM)의 위치를 바르게 설명한 것은?`,
      [R`집합적으로 AI ⊃ ML ⊃ DL의 포함 관계를 이루며, 데이터마이닝은 ML·통계 기법을 활용해 데이터에서 유용한 패턴을 찾고 의사결정으로 연결하는 과정 전반에 걸쳐 있다.`,R`교안은 AI 안에 ML이 속하고, ML 안에 다층 신경망 기반의 DL이 속하는 포함 관계를 설명한다.`],

      [R`AI와 ML은 서로 교집합이 없는 독립된 학문 영역이며, DL은 비지도 군집화 문제에서만 정의되는 별도의 알고리즘이다.`,R`ML은 현대 AI의 핵심 부분집합이며 DL은 지도·비지도·강화학습 전반에 쓰인다.`],
      [R`데이터마이닝은 AI·ML과 관련이 없는 순수 데이터베이스 인덱싱 기법으로 예측 모델링이나 통계적 추론을 포함하지 않는다.`,R`데이터마이닝은 통계와 ML 모델링을 핵심 도구로 사용한다.`]
    ],
    OX022:[

      [R`KDD (Knowledge Discovery in Databases) 및 Knowledge Extraction (지식 추출)`,R`교안은 데이터베이스 내 지식 발견(KDD)과 지식 추출(knowledge extraction)을 데이터마이닝의 가까운 관련 용어로 소개한다.`],
      [R`OLTP (Online Transaction Processing) 및 단순 레코드 입출력 트랜잭션 처리`,R`OLTP는 은행 입출금처럼 실시간 단건 트랜잭션을 처리·기록하는 운영 시스템으로 지식 발견(KDD)과 구분된다.`],
      [R`RDBMS 정규화 (Database Normalization) 및 외래키 참조 무결성 제약 설계`,R`스키마 중복 제거를 위한 데이터베이스 설계 이론이며 패턴·지식 발견 용어가 아니다.`],
      [R`CRUD 질의 (Create, Read, Update, Delete) 및 단순 조건 필터링 조회`,R`저장된 값을 그대로 읽고 쓰는 기본 데이터베이스 연산은 데이터마이닝(지식 추출)이 아니다.`]
    ],
    OX023:[
      R`단순히 예측 모델을 만드는 데 그치지 않고, 분석·요약된 정보를 경영진과 실무자의 조직적 의사결정 지원 체계로 연결하는 맥락에서 소개된 관련 개념은?`,
      [R`Business Intelligence (BI) — 데이터 기반 리포팅·시각화·분석을 통한 비즈니스 의사결정 지원`,R`Business Intelligence는 데이터 분석·요약 결과를 조직의 의사결정과 직접 연결하는 맥락의 관련 개념이다.`],
      [R`Feature Engineering (특징 공학) — 모델 적합도를 높이기 위해 원변수를 변환·조합하는 전처리 기법`,R`특징 공학은 모델 입력 변수를 가공하는 기술적 단계이며 조직 의사결정 지원 체계 전반을 뜻하는 용어는 BI다.`],
      [R`Data Augmentation (데이터 증강) — 라벨 의미를 보존하면서 학습 표본을 인위적으로 변형·확장하는 기법`,R`데이터 증강은 부족한 학습 데이터를 보충해 일반화를 돕는 기법이다.`],
      [R`bootstrapping (부트스트래핑) — 관측 표본에서 복원추출을 반복하여 통계량의 표본분포를 추정하는 리샘플링 기법`,R`부트스트래핑은 통계적 불확실성 추정 기법이며 조직 의사결정 체계 용어가 아니다.`]

    OX024:[

      [R`정형 데이터 (Structured Data) — 고정된 행·열 스키마와 명확한 변수 타입을 갖춘 테이블 형태의 자료`,R`행(관측 단위)과 열(변수)처럼 미리 정한 구조로 표현되는 테이블 형태의 자료를 정형 데이터라고 한다.`],
      [R`비정형 데이터 (Unstructured Data) — 고정된 테이블 스키마 없이 수집되는 원본 이미지, 오디오, 자유 텍스트 자료`,R`비정형 데이터는 미리 정해진 행·열 표 구조가 없는 데이터다.`],

      [R`합성 증강 데이터 (Synthetic Augmented Data) — 소수 클래스 보충을 위해 기존 표본 사이를 보간하여 생성한 인공 자료`,R`생성 방식에 따른 구분이며 고정 행·열 스키마 자료의 기본 명칭은 정형 데이터다.`]

    OX025:[
      R`이미지, 텍스트, 음성 신호처럼 미리 정해진 행·열 표 구조가 없는 비정형 데이터를 다변량 통계 및 머신러닝 모델의 입력으로 활용하는 핵심 원리는?`,
      [R`도메인에 맞는 특징 추출(feature extraction)이나 임베딩 변환을 거쳐 각 관측 대상을 다차원 수치 벡터(행렬의 행)로 표현하여 분석한다.`,R`비정형 자료도 특징을 추출하거나 수치화하면 다변량 데이터 표현으로 변환해 분석할 수 있다.`],
      [R`고정된 열 스키마가 없으므로 수치 행렬로 변환하지 않고 원본 바이너리 파일의 생성 시각(단일 스칼라) 하나만으로 회귀모형을 적합한다.`,R`생성 시각 하나만 쓰면 비정형 데이터 내부의 시각적·의미적 정보를 전혀 반영하지 못하는 단변량 처리에 불과하다.`],
      [R`비정형 데이터는 변수 간 공분산을 정의할 수 없으므로 훈련·검증·테스트 분할 없이 전체 데이터를 시각화하는 기술통계에만 사용한다.`,R`수치 특징 행렬로 변환한 뒤에는 정형 데이터와 동일하게 데이터 분할과 일반화 평가를 수행한다.`],
      [R`모든 비정형 데이터는 전처리나 특징 추출 없이 원본 픽셀·문자열 순서를 무작위로 섞어야만 다변량 독립성 가정이 충족된다.`,R`픽셀이나 단어 순서를 무작위로 섞으면 공간적·문맥적 구조 정보가 파괴된다.`]

    OX026:[

      [R`멀티모달 데이터 분석 (Multimodal Data Analysis)`,R`서로 다른 모달리티(정형 표, 영상, 텍스트 등)의 데이터를 결합해 분석하는 것을 multimodal data analysis라고 한다.`],
      [R`단변량 기술통계 분석 (Univariate Analysis)`,R`단변량 분석은 단일 변수 하나만을 다루는 분석이다.`],

      R`우변 상수항 벡터가 영벡터인 동차 연립선형방정식 \(Ax = 0\) (\(A \in \mathbb{R}^{m \times n}\))의 해집합(영공간, null space)에 대한 설명으로 옳은 것은?`,
      [R`항상 영벡터 \을 자명해로 가지므로 해가 없는 경우는 발생하지 않으며, 자유변수가 존재하면 무수히 많은 비자명해)를 갖는다.`,R`항상 영벡터 해(자명해, x = 0)를 가지며, 자유변수가 있으면 무수히 많은 비영해도 갖는다.`],
      [R`계수행렬 \(A\)의 행렬식이 0(\(\det A = 0\))이면 동차방정식 \(Ax = 0\)은 모순 행이 발생하여 해가 하나도 존재하지 않게 된다.`,R`동차방정식은 우변이 모두 0이므로 기본 행 연산을 해도 \([0 \cdots 0 \mid c\ne 0]\) 모순 행이 절대 생기지 않으며, \(\det A = 0\)이면 무수히 많은 해를 갖는다.`],
      [R`미지수 개수 \(n\)이 방정식 개수 \(m\)보다 많더라도(\(n > m\)) 동차방정식 \(Ax = 0\)은 유일해 \(x = 0\) 하나만을 갖는다.`,R`\(n > m\)이면 선도원소(pivot) 개수가 최대 \(m\)개이므로 최소 \(n - m \ge 1\)개의 자유변수가 생겨 항상 무수히 많은 비자명해를 갖는다.`],
      [R`비자명해 \(x_1 \ne 0\)이 하나 존재하면 그 상수배 \(c x_1\) (\(c \ne 1\))은 더 이상 \(Ax = 0\)의 해가 될 수 없다.`,R`영공간은 부분공간이므로 \(Ax_1 = 0\)이면 임의의 스칼라 \(c\)에 대해 \(A(cx_1) = c(Ax_1) = 0\)이 되어 모두 해가 된다.`]
    ],
    OX078:[
      R`실수 계수를 갖는 일반 비동차 연립선형방정식 \(Ax = b\) (\(b \ne 0\))가 가질 수 있는 해의 개수(해집합의 크기)로 가능한 경우를 모두 나열한 것은?`,
      [R`해가 존재하지 않음(0개, 불능), 유일한 해가 존재함(1개), 무수히 많은 해가 존재함(무한개, 부정)의 세 가지 경우만 가능하다.`,R`선형 연립방정식의 해의 개수는 0개, 1개, 또는 무한히 많은 경우 중 하나다.`],
      [R`미지수의 개수 \(n\)에 따라 해가 정확히 2개인 경우, 정확히 3개인 경우, ..., 정확히 \(n\)개인 경우가 모두 가능하다.`,R`선형방정식은 두 개의 서로 다른 해 \(x_1 \ne x_2\)가 존재하면 그 선분 및 직선 위의 모든 점 \(tx_1 + (1-t)x_2\)가 해가 되어 즉시 무한히 많은 해를 갖는다.`],
      [R`우변 상수항 \(b\)가 영벡터가 아니면(\(b \ne 0\)) 자유변수가 존재하더라도 해는 최대 1개까지만 존재할 수 있다.`,R`\(b \ne 0\)이어도 모순 행이 없고 자유변수가 존재하면 무수히 많은 해를 갖는다.`],
      [R`방정식의 개수 \(m\)과 미지수의 개수 \(n\)이 일치하는 정방행렬(\(m = n\)) 체계에서는 항상 유일해(1개)만 존재한다.`,R`\(m = n\)인 정방행렬이어도 \(\det(A) = 0\)(특이행렬)이면 해가 없거나 무수히 많을 수 있다.`]
    ],
    OX079:[
      R`연립선형방정식 \(Ax = b\)에서 계수행렬 \(A\)의 행·열 크기(\(m \times n\))만 주어졌을 때 해의 존재성과 유일성을 판정할 수 있는지에 대한 설명으로 옳은 것은?`,
      [R`행렬의 크기)만으로는 해의 개수를 확정할 수 없으며, 첨가행렬 \를 소거하여 선도원소의 개수와 \ 형태의 모순 행 유무를 확인해야 한다.`,R`크기만으로는 결정할 수 없으며, 소거법을 통해 계수행렬과 첨가행렬의 피벗(rank)·모순 행 여부를 확인해야 한다.`],
      [R`방정식 개수와 미지수 개수가 같은 \(m = n\) 정방행렬이기만 하면 행렬 원소 값과 무관하게 역행렬 \(A^{-1}\)가 존재하여 유일해를 갖는다.`,R`\(m = n\)이어도 행들이 선형종속(\(\det A = 0\))이면 역행렬이 존재하지 않아 해가 없거나 무수히 많다.`],
      [R`방정식 개수가 미지수 개수보다 많은 과결정 체계(\(m > n\))에서는 어떤 상수항 벡터 \(b\)가 주어지더라도 해가 존재할 수 없다.`,R`\(m > n\)이어도 \(b\)가 \(A\)의 열공간 안에 속하면(중복 방정식이 일관되면) 유일해 또는 무한해를 가질 수 있다.`],
      [R`미지수 개수가 방정식 개수보다 많은 체계(\(m < n\))에서는 모순 행이 발생할 수 없으므로 항상 무수히 많은 해를 갖는다.`,R`\(m < n\)이어도 예컨대 \(x_1 + x_2 + x_3 = 1\)과 \(x_1 + x_2 + x_3 = 2\)처럼 평행한 모순 식이 포함되면 해가 없을 수 있다.`]
    ],
    OX080:[
      R`연립방정식을 풀 때 허용되는 3가지 '기본 행 연산(Elementary Row Operations)'으로 올바른 것은?`,
      [R`두 행 교환, 한 행에 0이 아닌 상수배, 한 행에 다른 행의 상수배 더하기`,R`기본 행 연산은 두 행 바꾸기, 0 아닌 상수 곱하기, 다른 행의 상수배 더하기의 세 가지다(0배는 정보를 없애므로 불가).`],
      [R`한 행에 0을 곱해 영행 만들기, 각 원소 제곱하기, 행과 열 바꾸기`,R`0을 곱하거나 제곱·전치하면 원래 방정식의 해집합이 깨진다.`],
      [R`두 열을 서로 곱하기, 우변 벡터만 삭제하기, 대각원소에 상수 더하기`,R`열 연산이나 상수 단독 덧셈은 기본 행 연산이 아니며 해집합을 바꾼다.`],
      [R`모든 행을 합쳐 하나의 식만 남기고 나머지 행 삭제하기`,R`독립적인 방정식들을 임의로 삭제하면 해집합이 커져 동치성이 깨진다.`]
    ],
    OX081:[
      R`첨가행렬에 기본 행 연산을 적용했을 때 원래 연립방정식의 해집합은 어떻게 되는가?`,
      [R`가역적인 동치 변환이므로 원래 연립방정식의 해집합이 완벽히 그대로 보존된다.`,R`기본 행 연산은 동치인 연립방정식으로 바꾸는 연산이므로 해집합을 변화시키지 않는다.`],
      [R`연산을 한 번 적용할 때마다 해의 개수가 절반으로 줄어든다.`,R`기본 행 연산은 해집합을 그대로 유지하므로 해의 개수가 변하지 않는다.`],
      [R`두 행을 교환하면 모든 미지수 해의 부호가 음(-)으로 바뀐다.`,R`방정식의 적힌 순서만 바뀔 뿐 미지수 해는 전혀 바뀌지 않는다.`],
      [R`유일해가 있던 방정식이 항상 해가 없는 불능 방정식으로 바뀐다.`,R`기본 행 연산으로는 모순이 새로 생기거나 사라지지 않는다.`]
    ],
    OX082:[
      R`선형대수에서 행렬이 행사다리꼴(REF, Row Echelon Form)이 되기 위한 구조적 조건으로 옳은 것은?`,
      [R`모든 성분이 0인 영행은 행렬의 맨 아래쪽에 모여 있고, 각 비영행의 선도원소는 바로 위 행의 선도원소보다 오른쪽 열에 위치하여 선도원소 아래쪽 성분이 모두 0인 구조`,R`영행은 맨 아래에 위치하고, 각 비영행의 선도원소(pivot)는 윗행 선도원소보다 오른쪽에 있어 피벗 아래가 모두 0인 계단형 구조다.`],
      [R`영행이 행렬의 맨 위쪽에 위치하고, 아래 행으로 내려갈수록 선도원소의 열 위치가 오른쪽에서 왼쪽으로 이동하는 역계단형 구조`,R`영행은 맨 아래에 와야 하며 아래 행의 선도원소는 위 행보다 오른쪽에 있어야 한다.`],
      [R`선도원소의 열 위치와 관계없이 주대각선 위쪽의 모든 성분이 0이고 주대각선 아래쪽 성분만 0이 아닌 하삼각행렬 구조`,R`REF는 상삼각(계단형) 방향의 구조로 선도원소 아래쪽 성분들이 0이어야 한다.`],
      [R`행렬의 모든 비영행에서 선도원소가 항상 제1열에 위치하여 제1열의 모든 성분이 1이 되도록 정렬된 구조`,R`각 행의 선도원소가 모두 같은 열(제1열)에 있으면 아래쪽 성분이 0이 아니므로 REF가 아니다.`]
    ],
    OX083:[
      R`표준 선형대수 정의와 교안 원문 검산 기준으로, 행사다리꼴(REF)과 기약행사다리꼴(RREF)에서 선도원소(pivot) 조건의 차이를 가장 정확하게 설명한 것은?`,
      [R`표준 정의에서 REF의 선도원소는 0이 아닌 임의의 실수이면 충분하고, 모든 선도원소가 1이면서 선도원소 열의 위·아래 나머지 성분이 모두 0이어야 하는 것은 RREF의 조건이다.`,R`REF의 선도원소는 0이 아닌 임의의 수이면 충분하고, 모든 선도원소가 반드시 1이고 피벗 열의 위·아래가 모두 0이어야 하는 것은 RREF의 조건이다.`],
      [R`표준 정의에서 일반 REF는 모든 선도원소가 1이고 피벗 위쪽까지 0이어야 하는 반면, RREF는 선도원소가 1일 필요가 없는 더 느슨한 형태다.`,R`REF보다 RREF(Reduced REF)가 더 강한 조건(선도원소=1 및 피벗 위쪽 성분=0)을 요구한다.`],
      [R`REF와 RREF는 정방행렬에서만 정의되며, 첨가행렬처럼 열의 개수가 행의 개수보다 많은 직사각 행렬에서는 정의되지 않는다.`,R`REF와 RREF는 임의의 \(m \times n\) 행렬에서 모두 정의되며 연립방정식 첨가행렬 소거의 핵심 도구다.`],
      [R`주어진 행렬 하나에 기본 행 연산을 적용하면 얻어지는 기약행사다리꼴(RREF)은 연산 순서에 따라 서로 다른 여러 행렬로 나타난다.`,R`일반 REF는 연산 경로에 따라 달라질 수 있으나, 기약행사다리꼴(RREF)은 각 행렬마다 유일하게 결정된다.`]
    ],
    OX084:[
      R`행 사다리꼴(REF)이면서 추가로 '각 비영행의 선도원소(pivot)가 1이고, 그 피벗이 속한 열의 나머지 원소가 모두 0'인 행렬 형태를 무엇이라 하는가?`,
      [R`기약 행 사다리꼴 (RREF, Reduced Row Echelon Form)`,R`REF 조건에 더해 모든 피벗이 1이고 피벗 열의 위·아래 원소가 모두 0인 형태가 RREF다.`],
      [R`일반 첨가행렬 (General Augmented Matrix)`,R`소거 전후를 불문하고 우변 벡터를 붙인 행렬을 뜻한다.`],
      [R`반대칭 정방행렬 (Skew-symmetric Matrix)`,R`전치했을 때 부호가 반대가 되는 정방행렬이다.`],
      [R`전치 공분산행렬 (Transpose Covariance Matrix)`,R`통계적 공분산을 담은 행렬로 소거 표준형 명칭이 아니다.`]
    ],
    OX085:[
      R`연립방정식을 행 사다리꼴(REF)로 만든 뒤 후진대입(back-substitution)으로 푸는 방법과, 기약 행 사다리꼴(RREF)까지 진행해 해를 구하는 방법을 순서대로 바르게 짝지은 것은?`,
      [R`REF + 후진대입: 가우스 소거법 — RREF까지 진행: 가우스–조던 소거법`,R`가우스 소거법은 REF까지 소거 후 후진대입하고, 가우스–조던 소거법은 피벗 위쪽까지 소거해 RREF를 만든다.`],
      [R`REF + 후진대입: 가우스–조던 소거법 — RREF까지 진행: 가우스 소거법`,R`가우스 소거법과 가우스–조던 소거법의 도착 형태를 반대로 연결했다.`],
      [R`REF + 후진대입: 고유값 분해 — RREF까지 진행: 최소제곱법`,R`고유값 분해와 최소제곱법은 소거법의 두 종류 구분이 아니다.`],
      [R`REF + 후진대입: 베이즈 정리 — RREF까지 진행: 최대우도추정`,R`확률·통계 추론 기법으로 선형방정식 소거법 구분이 아니다.`]
    ],
    OX086:[
      R`연립방정식의 첨가행렬 \([A \mid b]\)를 소거한 결과, 좌변 계수 부분은 모두 0이고 우변 상수항만 0이 아닌 행 \([0 \; 0 \; \cdots \; 0 \mid c]\) (\(c \ne 0\))이 나타났을 때의 올바른 판정은?`,

      [R`해당 행의 모든 미지수 계수가 0이므로 \(n\)개의 미지수가 모두 자유변수(free variable)로 풀려 무수히 많은 해를 갖는다.`,R`우변까지 0인 영행 \([0\cdots 0 \mid 0]\)일 때만 제약이 없는 식이며, 우변이 \(c \ne 0\)이면 모순 행이어서 해가 없다.`],

      [R`해당 모순 행에 스칼라 \(0\)을 곱해 영행 \([0 \; 0 \; \cdots \; 0 \mid 0]\)으로 바꾸면 원래 연립방정식의 유일해를 정상적으로 구할 수 있다.`,R`기본 행 연산에서는 한 행에 0을 곱할 수 없으며, 모순식을 지운다고 원래 방정식의 해가 생기는 것은 아니다.`]
    ],
    OX087:[

    OX098:[

    OX102:[

      [R`편차 제곱합 \(\sum(x_i - \bar x)^2\)이 음수가 되는 것을 방지하기 위해 분모에서 1을 빼서 부호를 양수로 바꾸기 때문이다.`,R`실수 편차의 제곱합은 항상 0 이상이며 분모 \(n-1\)은 부호가 아니라 기댓값 편향(자유도) 보정을 위한 것이다.`],
      [R`표본 크기 \(n\)이 1일 때 분모를 0으로 만들어 표본분산이 무한대로 발산하도록 유도하기 위한 수학적 관례이기 때문이다.`,R`\(n=1\)일 때 산포를 정의할 수 없다는 점과도 연결되지만, 본질적 이유는 자유도 \(n-1\)을 통한 불편성(\(E(s^2)=\sigma^2\)) 확보에 있다.`],

    OX103:[
      R`표본분산 \(s^2\)에 양의 제곱근을 취한 표본표준편차 \(s = \sqrt{s^2}\)를 산포 요약 지표로 함께 사용하는 주된 실용적 이유는?`,

    OX104:[

    OX106:[

    OX108:[

      ["교수님은 일부 알고리즘에 회귀 변형도 있으므로 이름만으로 목적을 단정하지 말라고 설명했다.","일부 알고리즘에는 회귀 변형도 있으므로 알고리즘 이름만으로 예측 목적을 단정할 수 없다."]

    result=result.replace(/^\s*(옳다|틀리다)[.·:]?\s*/u,"")
      .replace(/교수님은\s*/gu,"").replace(/교수자가\s*/gu,"")
      .replace(/\s*강조했다[.]?$/u,".").replace(/\s*설명했다[.]?$/u,".");
    return result.trim();
  }

        return {id:`S-${item.id}-D${i+1}`,text:finalText,correct:false,explanation:String(explanation).trim()};
      });
      const raw=[
        {id:`S-${item.id}-C`,text:String(correctPair[0]).trim(),correct:true,explanation:String(correctPair[1]).trim()},
        ...distractors
      ];
      const shift=(index*3)%4,options=raw.slice(shift).concat(raw.slice(0,shift));

    const byChapter=new Map();

    const output=[];let number=1;
    byChapter.forEach((items,chapter)=>{
      const groupCount=Math.ceil(items.length/4);

      const yes=items.filter(x=>x.answer),no=items.filter(x=>!x.answer),used=new Set();
      for(let i=0;i<groupCount;i++){
        if(no[i]){groups[i].push(no[i]);used.add(no[i].id)}

        ["한 도시의 시간별 기온 하나만 기록한 자료","온도 변수 1개만 측정한 단변량 시계열 자료다."],
        ["학생별 수학 점수 하나만 나열한 명단","변수가 1개뿐이므로 단변량 자료다."],
        ["와인 시료별 산도·당도·알코올 도수를 함께 측정한 자료","한 개체(와인)마다 여러 변수를 동시에 측정했으므로 다변량 자료다."],
        ["동전을 던져 앞면이 나온 총횟수 숫자 하나만 적은 기록","단일 스칼라 집계값으로 다변량 자료가 아니다."]
      ],2),
      make("02","개론 I","개념 구분","데이터마이닝·AI·ML·DL의 관계를 가장 잘 설명한 것은?",[
        ["네 용어는 범위와 역할이 완전히 똑같은 동의어다.","포함 관계와 초점이 서로 다르다."],
        ["DL은 다층 신경망을 쓰는 ML의 한 분야이며, 데이터마이닝은 문제 정의·해석·현장 활용까지 포괄한다.","AI ⊃ ML ⊃ DL의 포함 관계와 데이터마이닝의 전체 문제 해결 흐름을 정확히 설명한 선지다."],
        ["AI는 오직 딥러닝(DL)만을 뜻하며 선형회귀는 포함하지 않는다.","AI가 가장 넓은 개념이고 ML과 DL이 그 안에 포함된다."],
        ["데이터마이닝은 데이터베이스에서 단순 SQL 검색만 수행하는 작업이다.","단순 검색이 아니라 유용한 패턴·지식을 찾아 의사결정에 연결하는 과정이다."]
      ],1),
      make("03","기초통계","함정 해석",String.raw`두 확률변수의 피어슨 상관계수가 \(r=0\)일 때 반드시 참인 설명은?`,[
        ["두 변수는 통계적으로 완전히 독립이다.",String.raw`비선형 종속 관계(예: \(Y=X^2\))가 있어도 \(r=0\)일 수 있으므로 독립을 보장하지 않는다.`],
        ["두 변수 사이에 어떤 인과관계나 함수관계도 없다.","비선형 함수관계가 존재할 수 있다."],
        ["두 변수 사이에 선형적 상관관계가 없거나 매우 약하다.",String.raw`피어슨 상관계수 \(r=0\)은 선형 상관관계가 없다는 뜻이다.`],
        ["비선형 관계까지 포함해 모든 의존성이 0이다.","피어슨 상관계수는 선형 관계만 측정한다."]
      ],2),
      make("04","회귀 I","함정 선형성","다음 모형 중 미지 회귀계수(모수)에 대해 선형인 선형회귀모형은?",[
        [String.raw`\(\beta_0+\beta_1x+\beta_2x^2\)`,String.raw`설명변수에 \(x^2\)이 있어도 미지 계수 \(\beta_0,\beta_1,\beta_2\)에 대해 1차 선형결합이므로 선형회귀모형이다.`],
        [String.raw`\(\beta_0+e^{\beta_1x}\)`,String.raw`미지 계수 \(\beta_1\)이 지수함수 안에 들어가 있으므로 비선형회귀모형이다.`],
        [String.raw`\(\beta_0+\beta_1^2x\)`,String.raw`미지 계수 \(\beta_1\)이 제곱 형태이므로 계수에 대해 비선형이다.`],
        [String.raw`\(\beta_0+\sin(\beta_1x)\)`,String.raw`미지 계수 \(\beta_1\)이 삼각함수 안에 들어가 있어 비선형회귀모형이다.`]
      ],0),
      make("05","개론 II","사례형 · 학습분할","모델 A·B·C를 test set에서 30번 반복 비교해 점수가 가장 높은 모델을 최종 선택했다. 이때 발생하는 문제는?",[
        ["test set을 효율적으로 재활용하여 일반화 성능이 향상되었다.","테스트 세트를 모델 선택에 반복 사용하면 일반화 평가가 오염된다."],
        ["test set 결과에 맞춘 선택 편향(과적합)이 생겨 최종 일반화 성능이 낙관적으로 왜곡될 수 있다.","모델 비교·선택은 validation에서 수행하고 test는 마지막 최종 평가에 한 번만 써야 한다."],
        ["파라미터 추정이 불가능해져 학습 자체가 중단된다.","학습은 되지만 평가 지표의 신뢰성이 무너진다."],
        ["지도학습 문제가 비지도 군집화 문제로 바뀐다.","학습 유형이 바뀌는 것이 아니라 데이터 누수(leakage)가 발생한 것이다."]
      ],1),
      make("06","기초통계","용어 구분","확률(Probability)과 우도(Likelihood)에서 고정하는 대상과 변화시키는 대상을 바르게 연결한 것은?",[
        ["Probability: 관측 샘플 고정·모수 변화 / Likelihood: 모수 고정·샘플 변화","두 개념의 고정·변화 대상이 서로 반대로 뒤집혔다."],
        ["Probability: 모수 고정·가능한 샘플 변화 / Likelihood: 관측 샘플 고정·모수 변화",String.raw`확률은 모수 \(\theta\)를 고정하고 샘플 \(y\)를 변화시키며 보고, 우도는 관측된 \(y\)를 고정하고 \(\theta\)를 변화시키며 본다.`],
        ["두 개념 모두 모수와 샘플을 동시에 상수로 고정한다.","함수로서 변화시키는 변수가 서로 다르다."],
        ["Probability는 모수에 대한 적분이 1이 아니고, Likelihood는 모수에 대한 적분이 항상 1이다.","우도는 모수에 대한 확률분포가 아니므로 모수에 대한 적분이 1일 필요가 없다."]
      ],1),
      make("09","회귀 III","잔차진단","잔차–적합값 그림에서 적합값이 커질수록 잔차의 세로 퍼짐 폭도 깔때기 모양으로 넓어진다. 가장 먼저 의심할 가정 위반은?",[
        ["오차의 정규성 위반","정규성은 주로 Q–Q plot에서 분위수 이탈로 점검한다."],
        ["등분산성 위반 (이분산성)","적합값에 따라 잔차 분산(퍼짐)이 커지는 깔때기 모양은 등분산성 위반을 시사한다."],
        ["오차의 독립성 충족","가정 위반 신호이며 독립성 충족을 뜻하지 않는다."],
        ["설명변수 간 완전 다중공선성","다중공선성은 설명변수 간 관계로 VIF 등으로 진단한다."]
      ],1),
      make("10","회귀 III","다중공선성",String.raw`다중회귀에서 어떤 설명변수의 \(\mathrm{VIF}=18\)이고 계수 표준오차가 크게 나왔다. 가장 적절한 진단은?`,[
        ["반응변수 Y의 개수가 너무 많아서 생긴 문제다.","VIF는 설명변수들 사이의 선형 종속성 지표다."],
        ["설명변수 간 다중공선성이 높다는 신호이므로 계수 추정 불안정과 표준오차 확대를 검토한다.",String.raw`\(\mathrm{VIF}>10\)은 해당 설명변수가 나머지 설명변수들로 강하게 설명되어 표준오차가 팽창했음을 시사한다.`],
        ["잔차의 정규성이 완벽히 확보되었다는 증거다.","VIF는 정규성과 무관한 다중공선성 지표다."],
        ["오차항끼리의 시간적 자기상관만 위반된 상태다.","오차 독립성과 설명변수 간 다중공선성은 별개의 문제다."]
      ],1),
      make("11","회귀 II","결정계수",String.raw`같은 학습자료에서 설명변수를 추가했을 때 일반 결정계수 \(R^2\)와 수정 결정계수 \(R_{\text{adj}}^2\)의 변화는?`,[
        ["두 지표 모두 변수 추가 시 무조건 증가한다.",String.raw`수정 \(R^2\)는 자유도 벌점 때문에 불필요한 변수 추가 시 감소할 수 있다.`],
        [String.raw`일반 \(R^2\)는 감소하지 않고, 수정 \(R_{\text{adj}}^2\)는 변수 수 벌점 때문에 감소할 수 있다.`,String.raw`같은 학습자료에서 변수 추가 시 SSE는 커지지 않아 \(R^2\)는 비감소하지만, \(R_{\text{adj}}^2\)는 자유도 벌점으로 감소할 수 있다.`],
        [String.raw`일반 \(R^2\)는 항상 감소하고 수정 \(R_{\text{adj}}^2\)만 증가한다.`,"두 지표의 성질을 반대로 설명했다."],
        [String.raw`수정 \(R_{\text{adj}}^2\)는 변수 수와 무관하게 항상 1이 된다.`,"완벽한 적합이 아닌 한 1이 되지 않는다."]
      ],1),
      make("12","회귀 II","p-value 해석",String.raw`관측자료 회귀에서 기울기 검정의 유의확률이 \(p=0.001\)로 나왔다. 가장 적절한 해석은?`,[
        ["귀무가설이 참일 확률이 0.1%이고 대립가설이 참일 확률이 99.9%라는 뜻이다.","p-value는 가설 자체의 사후확률이 아니다."],
        ["귀무가설(기울기=0)이 참이라고 가정할 때 현재와 같거나 더 극단적인 통계량이 관측될 확률이 0.001이다.","p-value의 정확한 정의이며, 유의수준 0.05 등에서 귀무가설을 기각하는 근거가 된다."],
        ["설명변수가 반응변수의 직접적인 인과적 원인임이 증명되었다.","통계적 유의성만으로 관찰자료의 인과관계가 증명되지는 않는다."],
        ["새로운 테스트 데이터에서의 예측 오차가 0.1% 이하로 보장된다.","p-value는 미래 예측 오차 크기를 직접 뜻하지 않는다."]
      ],1),
      make("13","선형대수","계산형 · 행렬곱",String.raw`\(A=\begin{bmatrix}1&2\\3&4\end{bmatrix}\), \(B=\begin{bmatrix}2&0\\1&2\end{bmatrix}\)일 때 행렬곱 \(AB\)는?`,[
        [String.raw`\(\begin{bmatrix}4&4\\10&8\end{bmatrix}\)`,String.raw`행×열 내적으로 \(\begin{bmatrix}1\cdot2+2\cdot1 & 1\cdot0+2\cdot2\\3\cdot2+4\cdot1 & 3\cdot0+4\cdot2\end{bmatrix}=\begin{bmatrix}4&4\\10&8\end{bmatrix}\)이다.`],
        [String.raw`\(\begin{bmatrix}2&0\\3&8\end{bmatrix}\)`,`같은 위치 원소끼리만 단순 곱한 결과로 행렬곱이 아니다.`],
        [String.raw`\(\begin{bmatrix}4&10\\4&8\end{bmatrix}\)`,`결과 행렬이 전치된 형태로 행과 열 위치를 혼동했다.`],
        [String.raw`\(\begin{bmatrix}2&4\\7&8\end{bmatrix}\)`,String.raw`순서를 바꾼 \(BA\)에 해당하는 값으로 \(AB\)와 다르다.`]
      ],0),
      make("14","기초통계","계산형 · 베이즈",String.raw`유병률 \(P(D)=1\%\), 민감도 \(P(+\mid D)=90\%\), 특이도 \(P(-\mid D^c)=95\%\)인 검사에서 양성 판정자가 실제 질병일 사후확률 \(P(D\mid +)\) 식은?`,[
        [String.raw`\(0.90\)`,`민감도(우도)만 본 것으로 사전확률(유병률)과 위양성을 무시했다.`],
        [String.raw`\(0.01\)`,`검사 결과를 반영하지 않은 사전확률(유병률) 그대로의 값이다.`],
        [String.raw`\(\dfrac{0.90\times 0.01}{0.90\times 0.01 + 0.05\times 0.99}\)`,String.raw`베이즈 정리에 따라 분모에 진양성(\(0.90\times0.01\))과 위양성(\((1-0.95)\times0.99\))을 모두 더해 계산한다.`],
        [String.raw`\(\dfrac{0.95\times 0.99}{0.90\times 0.01}\)`,`특이도와 민감도의 위치를 잘못 대입한 식이다.`]
      ],2),
      make("15","회귀 I","계산형 · OLS",String.raw`세 관측점 \((x,y)=(0,1),(1,3),(2,5)\)에 대한 절편 포함 단순선형회귀 OLS 추정식은?`,[
        [String.raw`\(\hat y = 1 + 2x\)`,String.raw`\(\bar x=1,\;\bar y=3,\;S_{xy}=4,\;S_{xx}=2\)이므로 \(\hat\beta_1=4/2=2,\;\hat\beta_0=3-2(1)=1\)이다.`],
        [String.raw`\(\hat y = 2 + x\)`,`절편과 기울기 값을 서로 바꾸어 대입한 식이다.`],
        [String.raw`\(\hat y = 1 + 3x\)`,`기울기가 3이면 x=2일 때 7이 되어 관측점 (2,5)와 맞지 않는다.`],
        [String.raw`\(\hat y = 3 + 2x\)`,String.raw`절편 자리에 \(\hat\beta_0\) 대신 \(\bar y=3\)을 그대로 넣은 식이다.`]
      ],0),
      make("16","회귀 II","계산형 · 결정계수",String.raw`절편 포함 OLS 회귀에서 \(\mathrm{SST}=200,\;\mathrm{SSE}=50\)일 때 \((\mathrm{SSR},\; R^2)\)의 값은?`,[
        [String.raw`\((150,\; 0.75)\)`,String.raw`\(\mathrm{SSR}=\mathrm{SST}-\mathrm{SSE}=150\)이고, \(R^2=1-50/200=150/200=0.75\)이다.`],
        [String.raw`\((250,\; 0.25)\)`,`SST에 SSE를 더했고 미설명 비율(0.25)을 결정계수로 착각했다.`],
        [String.raw`\((150,\; 0.25)\)`,String.raw`\(\mathrm{SSR}=150\)은 맞지만 \(R^2\)에 \(\mathrm{SSE}/\mathrm{SST}=0.25\)를 넣었다.`],
        [String.raw`\((50,\; 0.75)\)`,`SSR과 SSE의 값을 혼동했다.`]
      ],0),
      make("17","회귀 II","계산형 · 신뢰구간",String.raw`\(\hat\beta_1=3.9324,\; SE(\hat\beta_1)=0.4155,\; t^*=2.011\)일 때 기울기 \(\beta_1\)의 95% 신뢰구간은?`,[
        [String.raw`\([3.0968,\; 4.7680]\)`,String.raw`\(3.9324 \pm 2.011\times 0.4155 = 3.9324 \pm 0.8356 = [3.0968,\; 4.7680]\)이다.`],
        [String.raw`\([3.5169,\; 4.3479]\)`,String.raw`임계값 \(t^*=2.011\)을 곱하지 않고 \(\hat\beta_1 \pm SE\)만 계산한 구간이다.`],
        [String.raw`\([-3.0968,\; 4.7680]\)`,`하한의 부호를 잘못 계산했다.`],
        [String.raw`\([0.4155,\; 3.9324]\)`,`표준오차와 점추정치를 그대로 양 끝점으로 적은 잘못된 구간이다.`]
      ],0),
      make("18","회귀 II","계산형 · ANOVA",String.raw`다중회귀에서 \(\mathrm{SSR}=120,\;\mathrm{SSE}=80,\; n=22,\; p=2\)일 때 전체 유의성 검정 \(F\) 통계량은?`,[
        [String.raw`\(14.25\)`,String.raw`\(\mathrm{MSR}=120/2=60,\;\mathrm{MSE}=80/(22-2-1)=80/19\)이므로 \(F=60/(80/19)=14.25\)이다.`],
        [String.raw`\(1.50\)`,`자유도로 나누지 않고 단순히 120/80을 계산한 값이다.`],
        [String.raw`\(28.50\)`,`분자 자유도 p=2로 나누는 과정을 누락한 값이다.`],
        [String.raw`\(4.21\)`,String.raw`\(\mathrm{MSE}=80/19\approx 4.21\) 자체를 \(F\) 값으로 착각한 선지다.`]
      ],0),
      make("19","회귀 III","계산형 · VIF",String.raw`설명변수 \(X_j\)를 나머지 설명변수들로 회귀한 보조회귀 결정계수가 \(R_j^2=0.9\)일 때 \((\mathrm{Tolerance}_j,\;\mathrm{VIF}_j)\)는?`,[
        [String.raw`\((0.1,\; 10)\)`,String.raw`\(\mathrm{Tolerance}_j=1-0.9=0.1\)이고, \(\mathrm{VIF}_j=1/0.1=10\)이다.`],
        [String.raw`\((0.9,\; 1.11)\)`,String.raw`\(R_j^2=0.9\)를 Tolerance로 그대로 착각해 계산한 값이다.`],
        [String.raw`\((0.1,\; 0.1)\)`,`VIF는 Tolerance의 역수이므로 10이 되어야 한다.`],
        [String.raw`\((10,\; 0.1)\)`,`Tolerance와 VIF의 순서를 반대로 적은 선지다.`]
      ],0),
      make("20","회귀 III","진단 · 가정",String.raw`잔차–적합값 그림이 뚜렷한 \(U\)자 곡선 모양이면서 동시에 적합값이 커질수록 잔차 퍼짐 폭도 증가한다. 함께 의심할 가정 위반의 조합은?`,[
        ["정규성 · 다중공선성","곡선 패턴은 선형성, 퍼짐 확장은 등분산성 위반 신호다."],
        ["선형성 · 등분산성","U자 곡선은 조건부 평균의 비선형성(선형성 위반), 퍼짐 증가(깔때기꼴)는 이분산성(등분산성 위반)을 시사한다."],
        ["오차 독립성 · 정규성","자기상관이나 분위수 이탈이 아니라 곡률과 퍼짐 변화에 대한 설명이다."],
        ["다중공선성 · 표본 대표성","잔차–적합값 그림의 곡선 및 깔때기 패턴은 선형성과 등분산성 진단 대상이다."]
      ],1)
    ];
  }

  function mixedQuestions(single,multi,cases){
    const out=[];let mi=0,ci=0;
    single.forEach((q,i)=>{out.push(q);if((i+1)%4===0&&mi<multi.length)out.push(multi[mi++]);if((i+1)%6===0&&ci<cases.length)out.push(cases[ci++])});
    return out.concat(multi.slice(mi),cases.slice(ci));
  }
  function chooseBank(){questions=mode==="single"?singleBank:mode==="multi"?multiBank:mixedQuestions(singleBank,multiBank,caseBank);document.body.dataset.questionCount=String(questions.length)}
  function mathify(text){return String(text||"").replace(/\(r=0\)/g,String.raw`\(r=0\)`).replace(/\(VIF=18\)/g,String.raw`\(\mathrm{VIF}=18\)`).replace(/\(R\^2\)/g,String.raw`\(R^2\)`).replace(/\(p=0\.001\)/g,String.raw`\(p=0.001\)`) }
  function init(rawConcepts){
    concepts=rawConcepts;singleBank=buildSingleQuestions(concepts);multiBank=buildMultiQuestions(concepts);caseBank=buildCaseQuestions();
    [...singleBank,...multiBank,...caseBank].forEach(q=>{q.stem=mathify(q.stem);q.claim=mathify(q.claim);q.options.forEach(o=>{o.text=mathify(o.text);o.explanation=mathify(o.explanation)})});
    chooseBank();
    const singleUsed=singleBank.flatMap(q=>q.concepts),multiUsed=multiBank.flatMap(q=>q.concepts);
    if(singleUsed.length!==concepts.length||new Set(singleUsed).size!==concepts.length)throw new Error("개념별 매핑 검사 실패");
    if(multiUsed.length!==concepts.length||new Set(multiUsed).size!==concepts.length)throw new Error("복수정답 매핑 검사 실패");
    if(multiBank.some(q=>!q.options.some(x=>x.correct)||!q.options.some(x=>!x.correct)))throw new Error("복수정답 선지 구성 실패");
    const singleInvalid=singleBank.filter(q=>q.options.length!==4||q.options.filter(x=>x.correct).length!==1||new Set(q.options.map(x=>x.text)).size!==4);
    const authorityPattern=/교수님|교수자가|오답\s*처리/u,judgmentPattern=/^(옳다|틀리다)\s*[—–-]/u;
    const authorityCount=singleBank.reduce((n,q)=>n+(authorityPattern.test(q.stem)||authorityPattern.test(q.claim)?1:0)+q.options.filter(x=>authorityPattern.test(x.text)).length,0);
    const judgmentCount=singleBank.reduce((n,q)=>n+q.options.filter(x=>judgmentPattern.test(x.text)).length,0);
    const allQuestionText=[...singleBank,...multiBank,...caseBank].flatMap(q=>[q.stem,q.claim,q.kind,...q.options.flatMap(x=>[x.text,x.explanation])]);
    const fullAuthorityCount=allQuestionText.filter(x=>authorityPattern.test(x||"")).length;
    const fullJudgmentCount=allQuestionText.filter(x=>judgmentPattern.test(x||"")).length;
    const highOverlapCount=singleBank.reduce((n,q)=>{const correct=q.options.find(x=>x.correct)?.text||"";return n+q.options.filter(x=>!x.correct&&overlapScore(correct,x.text)>=3).length},0);
    const wrongChoices=singleBank.flatMap(q=>q.options.filter(x=>!x.correct));
    const wrongTextCounts=new Map();wrongChoices.forEach(x=>wrongTextCounts.set(x.text,(wrongTextCounts.get(x.text)||0)+1));
    const repeatedDistractorCount=[...wrongTextCounts.values()].filter(count=>count>1).reduce((sum,count)=>sum+count-1,0);
    const genericExplanationCount=wrongChoices.filter(x=>/다른 개념에 대한 설명|직접 연결되지 않는다|문제의 조건이나 교안의 구분과 맞지 않는다/u.test(x.explanation)).length;
    const spoilerClaimCount=singleBank.filter(q=>Boolean(q.claim)).length;
    if(singleInvalid.length||authorityCount||judgmentCount||fullAuthorityCount||fullJudgmentCount||repeatedDistractorCount||genericExplanationCount||spoilerClaimCount)throw new Error("문항 형식 검사 실패");
    document.body.dataset.singleQuestionCount=String(singleBank.length);
    document.body.dataset.multiQuestionCount=String(multiBank.length);
    document.body.dataset.caseQuestionCount=String(caseBank.length);
    document.body.dataset.mixedQuestionCount=String(singleBank.length+multiBank.length+caseBank.length);
    document.body.dataset.conceptCount=String(concepts.length);
    document.body.dataset.uniqueConceptCount=String(new Set(singleUsed).size);
    document.body.dataset.singleInvalidCount=String(singleInvalid.length);
    document.body.dataset.authorityPhraseCount=String(authorityCount);
    document.body.dataset.judgmentPrefixCount=String(judgmentCount);
    document.body.dataset.fullAuthorityPhraseCount=String(fullAuthorityCount);
    document.body.dataset.fullJudgmentPrefixCount=String(fullJudgmentCount);
    document.body.dataset.highOverlapDistractorCount=String(highOverlapCount);
    document.body.dataset.distractorCount=String(wrongChoices.length);
    document.body.dataset.uniqueDistractorCount=String(wrongTextCounts.size);
    document.body.dataset.repeatedDistractorCount=String(repeatedDistractorCount);
    document.body.dataset.genericExplanationCount=String(genericExplanationCount);
    document.body.dataset.spoilerClaimCount=String(spoilerClaimCount);
    const chapters=[...new Set(concepts.map(q=>q.chapter))];
    $("#chapterGrid").innerHTML=`<button class="chapter-chip active" data-chapter="all">전체</button>`+chapters.map(c=>`<button class="chapter-chip" data-chapter="${c}">${c}</button>`).join("");
    $("#loading").style.display="none";$("#quizCard").classList.remove("hidden");
    applyFilters();
  }

  function applyFilters(keepId){
    filtered=questions.filter(q=>{
      if(chapterFilter!=="all"&&q.chapter!==chapterFilter)return false;
      const answer=saved.answers[q.id];
      if(stateFilter==="unanswered"&&answer)return false;
      if(stateFilter==="wrong"&&(!answer||answer.correct))return false;
      if(stateFilter==="bookmarked"&&!saved.bookmarks[q.id])return false;
      return true;
    });
    const found=keepId?filtered.findIndex(q=>q.id===keepId):-1;
    cursor=found>=0?found:Math.min(cursor,Math.max(0,filtered.length-1));
    render();
  }

  function render(){
    const empty=!filtered.length;
    $("#quizCard").classList.toggle("hidden",empty);$("#empty").classList.toggle("show",empty);
    if(empty)return;
    const q=filtered[cursor],answer=saved.answers[q.id];
    if(q.id!==currentQuestionId||answer)selected=new Set(answer?.selected||[]);
    currentQuestionId=q.id;
    $("#chapterBadge").textContent=q.chapter;$("#conceptCount").textContent=`${q.type==="single"?"단일정답":"복수정답"} · ${cleanKind(q.kind)}`;
    $("#promptText").innerHTML=q.stem;$("#claimText").innerHTML=q.claim;$("#claimText").style.display=q.claim?"block":"none";
    const answerHint=q.type==="single"?"가장 적절한 선지 하나를 고르세요.":"정답이 하나 이상일 수 있습니다.";
    $("#hintText").textContent=`${answerHint} · 숫자키 1–4 선택 · Enter 제출`;
    $("#bookmarkBtn").classList.toggle("on",!!saved.bookmarks[q.id]);$("#bookmarkBtn").textContent=saved.bookmarks[q.id]?"★":"☆";
    $("#options").innerHTML=q.options.map((opt,i)=>{
      const picked=selected.has(opt.id);let cls=picked?" selected":"";
      if(answer){if(opt.correct)cls+=" "+(picked?"correct":"missed");else if(picked)cls+=" wrong-selected"}
      return `<button class="option${cls}" data-id="${opt.id}" type="button" aria-pressed="${picked}" aria-keyshortcuts="${i+1}" title="단축키 ${i+1}" ${answer?"disabled":""}>
        <span class="letter">${letters[i]}</span><span class="option-text">${opt.text}</span>
        ${answer?`<span class="option-explain"><span class="truth ${opt.correct?"o":"x"}">${opt.correct?"✓":"×"}</span>${opt.explanation}</span>`:""}
      </button>`;
    }).join("");
    const correctCount=q.options.filter(x=>x.correct).length;
    $("#resultBar").className="result-bar"+(answer?` show ${answer.correct?"good":"bad"}`:"");
    $("#resultBar").textContent=answer?(answer.correct?(q.type==="single"?"정답입니다. 선지별 개념 해설을 확인하세요.":`정답입니다. ${correctCount}개를 모두 골랐습니다.`):(q.type==="single"?"오답입니다. 정답 선지와 오답 이유를 확인하세요.":"오답입니다. 선지별 해설을 확인하세요.")):"";
    $("#retryBtn").classList.toggle("show",!!answer);$("#submitBtn").textContent=answer?"다음 문제 →":"선택 완료";
    $("#submitBtn").disabled=!answer&&!selected.size;
    $("#position").textContent=`${cursor+1} / ${filtered.length} · ${q.type==="single"?"단일":"복수"}`;
    $("#prevBtn").disabled=cursor===0;$("#nextBtn").disabled=cursor===filtered.length-1;
    typeset();
  }

  function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([$("#quizCard")]);MathJax.typesetPromise([$("#quizCard")]).catch(()=>{})}}
  function toggleOption(id){
    const q=filtered[cursor];if(saved.answers[q.id])return;
    if(q.type==="single"){selected.clear();selected.add(id)}else{selected.has(id)?selected.delete(id):selected.add(id)}renderDraft();
  }
  function renderDraft(){
    $$(".option").forEach(btn=>{const on=selected.has(btn.dataset.id);btn.classList.toggle("selected",on);btn.setAttribute("aria-pressed",String(on))});
    $("#submitBtn").disabled=!selected.size;
  }
  function submit(){
    const q=filtered[cursor],prior=saved.answers[q.id];
    if(prior){move(1);return}
    if(!selected.size)return;
    const correctIds=q.options.filter(x=>x.correct).map(x=>x.id);
    const correct=correctIds.length===selected.size&&correctIds.every(id=>selected.has(id));
    saved.answers[q.id]={selected:[...selected],correct,at:Date.now()};save();
    if(correct&&cursor<filtered.length-1){cursor+=1;currentQuestionId=null;render();return}
    render();
  }
  function retry(){const q=filtered[cursor];delete saved.answers[q.id];selected.clear();save();render()}
  function retryAll(){
    if(!Object.keys(saved.answers).length)return;
    if(!window.confirm("저장된 모든 다지선다 답안을 지우고 처음부터 다시 풀까요?"))return;
    saved.answers={};selected.clear();cursor=0;currentQuestionId=null;stateFilter="all";
    $$(".state-tab").forEach(x=>x.classList.toggle("active",x.dataset.state==="all"));
    save();applyFilters();
  }
  function move(delta){
    if(delta>0&&cursor>=filtered.length-1)return;
    if(delta<0&&cursor<=0)return;
    cursor+=delta;render();
  }

  $("#options").addEventListener("click",e=>{const b=e.target.closest(".option");if(b)toggleOption(b.dataset.id)});
  $("#submitBtn").addEventListener("click",submit);$("#retryBtn").addEventListener("click",retry);$("#retryAllBtn").addEventListener("click",retryAll);
  $("#prevBtn").addEventListener("click",()=>move(-1));$("#nextBtn").addEventListener("click",()=>move(1));
  $("#bookmarkBtn").addEventListener("click",()=>{const q=filtered[cursor];saved.bookmarks[q.id]=!saved.bookmarks[q.id];save();render()});
  $("#modeTabs").addEventListener("click",e=>{const b=e.target.closest(".mode-tab");if(!b)return;mode=b.dataset.mode;cursor=0;currentQuestionId=null;$$('.mode-tab').forEach(x=>x.classList.toggle('active',x===b));chooseBank();applyFilters()});
  $("#stateTabs").addEventListener("click",e=>{const b=e.target.closest(".state-tab");if(!b)return;stateFilter=b.dataset.state;cursor=0;$$('.state-tab').forEach(x=>x.classList.toggle('active',x===b));applyFilters()});
  $("#chapterToggle").addEventListener("click",e=>{e.stopPropagation();$("#chapterPopover").classList.toggle("open")});
  $("#chapterPopover").addEventListener("click",e=>e.stopPropagation());document.addEventListener("click",()=>$("#chapterPopover").classList.remove("open"));
  $("#chapterGrid").addEventListener("click",e=>{const b=e.target.closest(".chapter-chip");if(!b)return;chapterFilter=b.dataset.chapter;cursor=0;$$('.chapter-chip').forEach(x=>x.classList.toggle('active',x===b));$("#chapterToggle").textContent=`${chapterFilter==='all'?'전체 단원':chapterFilter} ▾`;$("#chapterPopover").classList.remove("open");applyFilters()});
  document.addEventListener("keydown",e=>{
    if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement?.tagName)||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.repeat)return;
    if(e.key>="1"&&e.key<="4"&&!saved.answers[filtered[cursor]?.id]){
      const opt=filtered[cursor]?.options[Number(e.key)-1];
      if(opt){e.preventDefault();toggleOption(opt.id)}
      return;
    }
    if(e.key==="Enter"){e.preventDefault();submit();return}
    if(e.key==="ArrowLeft"){e.preventDefault();move(-1);return}
    if(e.key==="ArrowRight"){e.preventDefault();move(1)}
  });

  const source=$("#conceptSource");
  source.addEventListener("load",()=>{
    try{
      const concepts=source.contentWindow.OX_ITEMS;
      if(!Array.isArray(concepts)||!concepts.length)throw new Error();
      init(concepts.map(x=>({...x})));
    }catch(e){$("#loading").textContent="개념 문항을 불러오지 못했습니다. 페이지를 새로고침해 주세요."}
  });
  </script>
</body>
</html>
