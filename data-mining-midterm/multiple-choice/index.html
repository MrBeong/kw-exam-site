  <iframe id="conceptSource" src="../ox/?concept-source=1" title="개념 데이터"></iframe>

  <script>
  const KEY="dm-midterm-multiple-v3";
  const letters=["A","B","C","D"];
  let concepts=[],singleBank=[],multiBank=[],caseBank=[],questions=[],filtered=[],cursor=0,stateFilter="all",chapterFilter="all",mode="mixed",selected=new Set(),currentQuestionId=null;
  let saved={answers:{},bookmarks:{}};
  try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||"{}")} }catch(e){}
  saved.answers=saved.answers||{};saved.bookmarks=saved.bookmarks||{};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const save=()=>localStorage.setItem(KEY,JSON.stringify(saved));

  function legacySingleStem(item,index){
    const trueStems=[
      "다음 주장에 대한 판단과 근거의 조합으로 가장 적절한 것은?",
      "학생이 다음 내용을 답안에 적었다. 채점 결과와 근거로 알맞은 것은?",
      "다음 개념 설명을 가장 정확하게 해석한 내용은?",
      "다음 설명의 타당성을 정확히 이해한 판단·근거 조합은?"
    ];
    const falseStems=[
      "다음 설명의 오류를 가장 정확히 지적한 것은?",
      "다음 답안을 바로잡기 위한 판단과 근거로 가장 적절한 것은?",
      "다음 문장이 틀린 이유로 가장 적절한 것은?",
      "다음 내용에 대한 판단과 근거의 조합으로 가장 적절한 것은?"
    ];
    return (item.answer?trueStems:falseStems)[index%4];
  }
  function legacyBuildSingleQuestions(all){
    return all.map((item,index)=>{
      const label=item.answer?"옳다":"틀리다",opposite=item.answer?"틀리다":"옳다";
      const wrongReason=item.answer?"이 설명은 교안의 정의와 반대되며 해당 개념을 이 문제에 적용할 수 없다.":"이 설명은 조건이나 예외를 따질 피료가 없으며 문장을 그대로 받아들여야 한다.";
      const raw=[
        {id:`S-${item.id}-C`,text:`${label} — ${item.explanation}`,correct:true,explanation:`${label}. ${item.explanation}`},
        {id:`S-${item.id}-J`,text:`${opposite} — ${item.explanation}`,correct:false,explanation:"근거는 맞지만 판단이 반대이다."},
        {id:`S-${item.id}-R1`,text:`${label} — ${wrongReason}`,correct:false,explanation:"판단은 맞지만 근거와 반대되며, 정확한 근거는 다르다."},
        {id:`S-${item.id}-R2`,text:`${opposite} — ${wrongReason}`,correct:false,explanation:"판단과 근거가 모두 문제의 주장에 맞지 않는다."}
      ];
      const shift=(index*3)%4,options=raw.slice(shift).concat(raw.slice(0,shift));
      return {id:`S-${item.id}`,chapter:item.chapter,type:"single",kind:item.kind,stem:legacySingleStem(item,index),claim:item.statement,concepts:[item.id],options};
    });
  }
  function coreText(text){
    const replacements=new Map([
      ["교수님은 모델보다 구체적인 문제, 필요한 의사결정, 목표 출력을 먼저 정하라고 강조했다.","사용할 모델을 고르기 전에 구체적인 문제, 필요한 의사결정, 목표 출력을 먼저 정의해야 한다."],
      ["교수님은 일부 알고리즘에 회귀 변형도 있으므로 이름만으로 목적을 단정하지 말라고 설명했다.","일부 알고리즘에는 회귀 변형도 있으므로 알고리즘 이름만으로 예측 목적을 단정할 수 없다."]
    ]);
    let result=replacements.get(text)||text;
    result=result.replace(/^\s*(옳다|틀리다)[.·:]?\s*/u,"")
      .replace(/교수님은\s*/gu,"").replace(/교수자가\s*/gu,"")
      .replace(/\s*강조했다[.]?$/u,".").replace(/\s*설명했다[.]?$/u,".");
    return result.trim();
  }
  function cleanKind(kind){return kind==="교수 강조"?"핵심 개념":kind}
  function terms(text){return new Set(text.replace(/\\\([^)]*\\\)|\\\[[^\]]*\\\]/g," ").toLowerCase().split(/[^0-9a-zA-Z가-힣βθ²]+/u).filter(x=>x.length>1))}
  function overlapScore(a,b){let score=0;const aTerms=terms(a),bTerms=terms(b);aTerms.forEach(x=>{if(bTerms.has(x))score++});return score}
  function distractorTexts(item,all){
    const target=`${item.statement} ${coreText(item.explanation)}`;
    const ranked=all.filter(x=>x.id!==item.id).map(x=>({
      text:coreText(x.explanation),sameChapter:x.chapter===item.chapter?1:0,sameKind:x.kind===item.kind?1:0,
      score:overlapScore(target,`${x.statement} ${x.explanation}`),id:Number(String(x.id).replace(/\D/g,""))||0
    })).filter(x=>x.text&&x.text!==coreText(item.explanation))
      .sort((a,b)=>b.sameChapter-a.sameChapter||b.score-a.score||b.sameKind-a.sameKind||a.id-b.id);
    const ordered=ranked;
    const unique=[];const seen=new Set([coreText(item.explanation)]);
    for(const candidate of ordered){if(seen.has(candidate.text))continue;seen.add(candidate.text);unique.push(candidate.text);if(unique.length===3)break}
    return unique;
  }
  function singleStem(item,index){
    const trueStems=["다음 문장의 핵심 의미로 가장 적절한 것은?","다음 설명과 직접 연결되는 근거는?","다음 개념을 가장 정확히 해석한 것은?","다음 문장을 구체적으로 설명한 내용은?"];
    const falseStems=["다음 문장이 틀린 이유로 가장 적절한 것은?","다음 문장의 오류를 바로잡은 설명은?","다음 설명에서 잘못 이해한 부분은?","다음 문장을 수정한 내용으로 가장 적절한 것은?"];
    return (item.answer?trueStems:falseStems)[index%4];
  }
  function buildSingleQuestions(all){
    return all.map((item,index)=>{
      const correctText=coreText(item.explanation),distractors=distractorTexts(item,all);
      if(distractors.length!==3)throw new Error(`선지 생성 실패: ${item.id}`);
      const raw=[
        {id:`S-${item.id}-C`,text:correctText,correct:true,explanation:`핵심 근거: ${correctText}`},
        ...distractors.map((text,i)=>({id:`S-${item.id}-D${i+1}`,text,correct:false,explanation:"이 선택지는 다른 개념에 대한 설명으로, 제시된 문장의 핵심 근거와 직접 연결되지 않는다."}))
      ];
      const shift=(index*3)%4,options=raw.slice(shift).concat(raw.slice(0,shift));
      return {id:`S-${item.id}`,chapter:item.chapter,type:"single",kind:cleanKind(item.kind),stem:singleStem(item,index),claim:item.statement,concepts:[item.id],options};
    });
  }
  function buildMultiQuestions(all){
    const byChapter=new Map();
    all.forEach(item=>{if(!byChapter.has(item.chapter))byChapter.set(item.chapter,[]);byChapter.get(item.chapter).push(item)});
    const output=[];let number=1;
    byChapter.forEach((items,chapter)=>{
      const groupCount=Math.ceil(items.length/4);
      const groups=Array.from({length:groupCount},()=>[]);
      const yes=items.filter(x=>x.answer),no=items.filter(x=>!x.answer),used=new Set();
      for(let i=0;i<groupCount;i++){
        if(no[i]){groups[i].push(no[i]);used.add(no[i].id)}
        if(yes[i]){groups[i].push(yes[i]);used.add(yes[i].id)}
      }
      const rest=items.filter(x=>!used.has(x.id));
      rest.forEach(item=>{
        const target=groups.map((g,i)=>({g,i})).filter(x=>x.g.length<4).sort((a,b)=>a.g.length-b.g.length||a.i-b.i)[0];
        target.g.push(item);
      });
      groups.forEach(options=>{
        options.sort((a,b)=>Number(a.id.slice(2))-Number(b.id.slice(2)));
        output.push({id:`M-MC${String(number++).padStart(3,"0")}`,chapter,type:"multi",kind:"전 범위 비교",stem:"다음 중 옳은 내용을 모두 고르시오.",claim:"",concepts:options.map(x=>x.id),options:options.map(x=>({id:`M-${x.id}`,text:x.statement,correct:x.answer,explanation:coreText(x.explanation)}))});
      });
    });
    return output;
  }

  function buildCaseQuestions(){
    const make=(id,chapter,kind,stem,choices,correct,explanation)=>({id:`C-${id}`,chapter,type:"single",kind,stem,claim:"",concepts:[],options:choices.map((text,i)=>({id:`C-${id}-${i}`,text,correct:i===correct,explanation:i===correct?explanation:"이 선지는 문제의 조건이나 교안의 구분과 맞지 않는다."}))});
    return [
      make("01","개론 I","자료 판별","다음 중 다변량 자료라고 보기 어려운 것은?",["사람별 키·몸무게","와인별 산도·당도","시간별 온도 하나만 측정","이미지별 여러 특징 추출"],2,"한 개체에 변수 하나만 측정한 자료는 다변량이 아니다."),
      make("02","개론 I","개념 구분","데이터마이닝·AI·ML·DL의 관계를 가장 잘 설명한 것은?",["모두 완전히 같은 용어다.","DL은 ML의 하나이며, 데이터마이닝은 문제 정의·해석·활용까지 포함한다.","AI는 항상 DL만 사용한다.","데이터마이닝은 SQL 검색만을 뜻한다."],1,"DL은 다층 신경망을 사용하는 ML의 한 분류이다."),

      make("14","기초통계","계산형 · 베이즈",String.raw`유병률 \(1\%\), 민감도 \(90\%\), 특이도 \(95\%\)인 검사에서 양성자가 실제 질병일 확률에 가장 가까운 값은?`,[String.raw`\(0.90\)`,String.raw`\(0.01\)`,String.raw`\(\dfrac{0.90\cdot0.01}{0.90\cdot0.01+0.05\cdot0.99}\)`,String.raw`\(\dfrac{0.95\cdot0.99}{0.90\cdot0.01}\)`],2,String.raw`사후확률은 우도만이 아니라 사전확률과 위양성 확률까지 포함해야 한다.`),

      make("16","회귀 II","계산형 · 결정계수",String.raw`\(SST=200\), \(SSE=50\)인 절편 포함 OLS에서 \((SSR,R^2)\)의 값은?`,[String.raw`\((150,0.75)\)`,String.raw`\((250,0.25)\)`,String.raw`\((150,0.25)\)`,String.raw`\((50,0.75)\)`],0,String.raw`\(SSR=SST-SSE=150\), \(R^2=1-SSE/SST=0.75\)이다.`),

    ];

  function mixedQuestions(single,multi,cases){
    const out=[];let mi=0,ci=0;
    single.forEach((q,i)=>{out.push(q);if((i+1)%4===0&&mi<multi.length)out.push(multi[mi++]);if((i+1)%6===0&&ci<cases.length)out.push(cases[ci++])});
    return out.concat(multi.slice(mi),cases.slice(ci));
  }
  function chooseBank(){questions=mode==="single"?singleBank:mode==="multi"?multiBank:mixedQuestions(singleBank,multiBank,caseBank);document.body.dataset.questionCount=String(questions.length)}
  function mathify(text){return String(text||"").replace(/\(r=0\)/g,String.raw`\(r=0\)`).replace(/\(VIF=18\)/g,String.raw`\(\mathrm{VIF}=18\)`).replace(/\(R\^2\)/g,String.raw`\(R^2\)`).replace(/\(p=0\.001\)/g,String.raw`\(p=0.001\)`) }
  function init(rawConcepts){
    concepts=rawConcepts;singleBank=buildSingleQuestions(concepts);multiBank=buildMultiQuestions(concepts);caseBank=buildCaseQuestions();
    [...singleBank,...multiBank,...caseBank].forEach(q=>{q.stem=mathify(q.stem);q.claim=mathify(q.claim);q.options.forEach(o=>{o.text=mathify(o.text);o.explanation=mathify(o.explanation)})});
    chooseBank();
    const singleUsed=singleBank.flatMap(q=>q.concepts),multiUsed=multiBank.flatMap(q=>q.concepts);
    if(singleUsed.length!==concepts.length||new Set(singleUsed).size!==concepts.length)throw new Error("개념별 매핑 검사 실패");
    if(multiUsed.length!==concepts.length||new Set(multiUsed).size!==concepts.length)throw new Error("복수정답 매핑 검사 실패");
    if(multiBank.some(q=>!q.options.some(x=>x.correct)||!q.options.some(x=>!x.correct)))throw new Error("복수정답 선지 구성 실패");
    const singleInvalid=singleBank.filter(q=>q.options.length!==4||q.options.filter(x=>x.correct).length!==1||new Set(q.options.map(x=>x.text)).size!==4);
    const authorityPattern=/교수님|교수자가|오답\s*처리/u,judgmentPattern=/^(옳다|틀리다)\s*[—–-]/u;
    const authorityCount=singleBank.reduce((n,q)=>n+(authorityPattern.test(q.stem)||authorityPattern.test(q.claim)?1:0)+q.options.filter(x=>authorityPattern.test(x.text)).length,0);
    const judgmentCount=singleBank.reduce((n,q)=>n+q.options.filter(x=>judgmentPattern.test(x.text)).length,0);
    const allQuestionText=[...singleBank,...multiBank,...caseBank].flatMap(q=>[q.stem,q.claim,q.kind,...q.options.flatMap(x=>[x.text,x.explanation])]);
    const fullAuthorityCount=allQuestionText.filter(x=>authorityPattern.test(x||"")).length;
    const fullJudgmentCount=allQuestionText.filter(x=>judgmentPattern.test(x||"")).length;
    const highOverlapCount=singleBank.reduce((n,q)=>{const correct=q.options.find(x=>x.correct)?.text||"";return n+q.options.filter(x=>!x.correct&&overlapScore(correct,x.text)>=3).length},0);
    if(singleInvalid.length||authorityCount||judgmentCount||fullAuthorityCount||fullJudgmentCount)throw new Error("문항 형식 검사 실패");
    document.body.dataset.singleQuestionCount=String(singleBank.length);
    document.body.dataset.multiQuestionCount=String(multiBank.length);
    document.body.dataset.caseQuestionCount=String(caseBank.length);
    document.body.dataset.mixedQuestionCount=String(singleBank.length+multiBank.length+caseBank.length);
    document.body.dataset.conceptCount=String(concepts.length);
    document.body.dataset.uniqueConceptCount=String(new Set(singleUsed).size);
    document.body.dataset.singleInvalidCount=String(singleInvalid.length);
    document.body.dataset.authorityPhraseCount=String(authorityCount);
    document.body.dataset.judgmentPrefixCount=String(judgmentCount);
    document.body.dataset.fullAuthorityPhraseCount=String(fullAuthorityCount);
    document.body.dataset.fullJudgmentPrefixCount=String(fullJudgmentCount);
    document.body.dataset.highOverlapDistractorCount=String(highOverlapCount);
    const chapters=[...new Set(concepts.map(q=>q.chapter))];
    $("#chapterGrid").innerHTML=`<button class="chapter-chip active" data-chapter="all">전체</button>`+chapters.map(c=>`<button class="chapter-chip" data-chapter="${c}">${c}</button>`).join("");
    $("#loading").style.display="none";$("#quizCard").classList.remove("hidden");
    applyFilters();
  }

  function applyFilters(keepId){
    filtered=questions.filter(q=>{
      if(chapterFilter!=="all"&&q.chapter!==chapterFilter)return false;
      const answer=saved.answers[q.id];
      if(stateFilter==="unanswered"&&answer)return false;
      if(stateFilter==="wrong"&&(!answer||answer.correct))return false;
      if(stateFilter==="bookmarked"&&!saved.bookmarks[q.id])return false;
      return true;
    });
    const found=keepId?filtered.findIndex(q=>q.id===keepId):-1;
    cursor=found>=0?found:Math.min(cursor,Math.max(0,filtered.length-1));
    render();
  }

  function render(){
    const empty=!filtered.length;
    $("#quizCard").classList.toggle("hidden",empty);$("#empty").classList.toggle("show",empty);
    if(empty)return;
    const q=filtered[cursor],answer=saved.answers[q.id];
    if(q.id!==currentQuestionId||answer)selected=new Set(answer?.selected||[]);
    currentQuestionId=q.id;
    $("#chapterBadge").textContent=q.chapter;$("#conceptCount").textContent=`${q.type==="single"?"단일정답":"복수정답"} · ${cleanKind(q.kind)}`;
    $("#promptText").innerHTML=q.stem;$("#claimText").innerHTML=q.claim;$("#claimText").style.display=q.claim?"block":"none";
    const answerHint=q.id.startsWith("C-")?"가장 적절한 선지 하나를 고르세요.":q.type==="single"?"가장 적절한 선지 하나를 고르세요.":"정답이 하나 이상일 수 있습니다.";
    $("#hintText").textContent=`${answerHint} · 숫자키 1–4 선택 · Enter 제출`;
    $("#bookmarkBtn").classList.toggle("on",!!saved.bookmarks[q.id]);$("#bookmarkBtn").textContent=saved.bookmarks[q.id]?"★":"☆";
    $("#options").innerHTML=q.options.map((opt,i)=>{
      const picked=selected.has(opt.id);let cls=picked?" selected":"";
      if(answer){if(opt.correct)cls+=" "+(picked?"correct":"missed");else if(picked)cls+=" wrong-selected"}
      return `<button class="option${cls}" data-id="${opt.id}" type="button" aria-pressed="${picked}" aria-keyshortcuts="${i+1}" title="단축키 ${i+1}" ${answer?"disabled":""}>
        <span class="letter">${letters[i]}</span><span class="option-text">${opt.text}</span>
        ${answer?`<span class="option-explain"><span class="truth ${opt.correct?"o":"x"}">${opt.correct?"✓":"×"}</span>${opt.explanation}</span>`:""}
      </button>`;
    }).join("");
    const correctCount=q.options.filter(x=>x.correct).length;
    $("#resultBar").className="result-bar"+(answer?` show ${answer.correct?"good":"bad"}`:"");
    const conventional=q.id.startsWith("C-");
    $("#resultBar").textContent=answer?(answer.correct?(conventional?"정답입니다. 사례와 개념의 연결을 확인하세요.":q.type==="single"?"정답입니다. 핵심 근거를 확인하세요.":`정답입니다. ${correctCount}개를 모두 골랐습니다.`):(conventional?"오답입니다. 사례를 어떤 개념과 연결해 보세요.":q.type==="single"?"오답입니다. 정답 선지의 핵심 근거를 확인하세요.":"오답입니다. 선지별 해설을 확인하세요.")):"";
    $("#retryBtn").classList.toggle("show",!!answer);$("#submitBtn").textContent=answer?"다음 문제 →":"선택 완료";
    $("#submitBtn").disabled=!answer&&!selected.size;
    $("#position").textContent=`${cursor+1} / ${filtered.length} · ${q.type==="single"?"단일":"복수"}`;
    $("#prevBtn").disabled=cursor===0;$("#nextBtn").disabled=cursor===filtered.length-1;
    typeset();
  }

  function typeset(){if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([$("#quizCard")]);MathJax.typesetPromise([$("#quizCard")]).catch(()=>{})}}
  function toggleOption(id){
    const q=filtered[cursor];if(saved.answers[q.id])return;
    if(q.type==="single"){selected.clear();selected.add(id)}else{selected.has(id)?selected.delete(id):selected.add(id)}renderDraft();
  }
  function renderDraft(){
    $$(".option").forEach(btn=>{const on=selected.has(btn.dataset.id);btn.classList.toggle("selected",on);btn.setAttribute("aria-pressed",String(on))});
    $("#submitBtn").disabled=!selected.size;
  }
  function submit(){
    const q=filtered[cursor],prior=saved.answers[q.id];
    if(prior){move(1);return}
    if(!selected.size)return;
    const correctIds=q.options.filter(x=>x.correct).map(x=>x.id);
    const correct=correctIds.length===selected.size&&correctIds.every(id=>selected.has(id));
    saved.answers[q.id]={selected:[...selected],correct,at:Date.now()};save();
    if(correct&&cursor<filtered.length-1){cursor+=1;currentQuestionId=null;render();return}
    render();
  }
  function retry(){const q=filtered[cursor];delete saved.answers[q.id];selected.clear();save();render()}
  function retryAll(){
    if(!Object.keys(saved.answers).length)return;
    if(!window.confirm("저장된 모든 다지선다 답안을 지우고 처음부터 다시 풀까요?"))return;
    saved.answers={};selected.clear();cursor=0;currentQuestionId=null;stateFilter="all";
    $$(".state-tab").forEach(x=>x.classList.toggle("active",x.dataset.state==="all"));
    save();applyFilters();
  }
  function move(delta){
    if(delta>0&&cursor>=filtered.length-1)return;
    if(delta<0&&cursor<=0)return;
    cursor+=delta;render();
  }

  $("#options").addEventListener("click",e=>{const b=e.target.closest(".option");if(b)toggleOption(b.dataset.id)});
  $("#submitBtn").addEventListener("click",submit);$("#retryBtn").addEventListener("click",retry);$("#retryAllBtn").addEventListener("click",retryAll);
  $("#prevBtn").addEventListener("click",()=>move(-1));$("#nextBtn").addEventListener("click",()=>move(1));
  $("#bookmarkBtn").addEventListener("click",()=>{const q=filtered[cursor];saved.bookmarks[q.id]=!saved.bookmarks[q.id];save();render()});
  $("#modeTabs").addEventListener("click",e=>{const b=e.target.closest(".mode-tab");if(!b)return;mode=b.dataset.mode;cursor=0;currentQuestionId=null;$$('.mode-tab').forEach(x=>x.classList.toggle('active',x===b));chooseBank();applyFilters()});
  $("#stateTabs").addEventListener("click",e=>{const b=e.target.closest(".state-tab");if(!b)return;stateFilter=b.dataset.state;cursor=0;$$('.state-tab').forEach(x=>x.classList.toggle('active',x===b));applyFilters()});
  $("#chapterToggle").addEventListener("click",e=>{e.stopPropagation();$("#chapterPopover").classList.toggle("open")});
  $("#chapterPopover").addEventListener("click",e=>e.stopPropagation());document.addEventListener("click",()=>$("#chapterPopover").classList.remove("open"));
  $("#chapterGrid").addEventListener("click",e=>{const b=e.target.closest(".chapter-chip");if(!b)return;chapterFilter=b.dataset.chapter;cursor=0;$$('.chapter-chip').forEach(x=>x.classList.toggle('active',x===b));$("#chapterToggle").textContent=`${chapterFilter==='all'?'전체 단원':chapterFilter} ▾`;$("#chapterPopover").classList.remove("open");applyFilters()});
  document.addEventListener("keydown",e=>{
    if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement?.tagName)||e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||e.repeat)return;
    if(e.key>="1"&&e.key<="4"&&!saved.answers[filtered[cursor]?.id]){
      const opt=filtered[cursor]?.options[Number(e.key)-1];
      if(opt){e.preventDefault();toggleOption(opt.id)}
      return;
    }
    if(e.key==="Enter"){e.preventDefault();submit();return}
    if(e.key==="ArrowLeft"){e.preventDefault();move(-1);return}
    if(e.key==="ArrowRight"){e.preventDefault();move(1)}
  });

  const source=$("#conceptSource");
  source.addEventListener("load",()=>{
    try{
      const concepts=source.contentWindow.OX_ITEMS;
      if(!Array.isArray(concepts)||!concepts.length)throw new Error();
      init(concepts.map(x=>({...x})));
    }catch(e){$("#loading").textContent="개념 문항을 불러오지 못했습니다. 페이지를 새로고침해 주세요."}
  });
  </script>
</body>
</html>
