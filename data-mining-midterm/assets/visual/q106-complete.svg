<svg xmlns="http://www.w3.org/2000/svg" width="800" height="465" viewBox="0 0 800 465" role="img" aria-labelledby="title desc"><title id="title">연립선형방정식의 세 가지 직선 배치</title><desc id="desc">선형대수 p.32 및 행 연산·역행렬 내용을 문제 조건에 맞춰 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="465" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">연립선형방정식의 세 가지 직선 배치</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><text x="38" y="88" font-size="23" font-weight="700">(가)</text><text x="38" y="120" font-size="21" >x₁ + x₂ = 5</text><text x="38" y="150" font-size="21" >x₁ − x₂ = −1</text><line x1="58" y1="325" x2="248" y2="325" stroke="#272727" stroke-width="2" /><line x1="58" y1="325" x2="58" y2="183" stroke="#272727" stroke-width="2" /><text x="244" y="355" font-size="20" text-anchor="end">x₁</text><text x="50" y="171" font-size="20" >x₂</text><line x1="58" y1="195" x2="188" y2="325" stroke="#272727" stroke-width="2" /><line x1="58" y1="299" x2="167.2" y2="189.8" stroke="#8c5f27" stroke-width="2" /><circle cx="110" cy="247" r="5" fill="#252525"/><text x="295" y="88" font-size="23" font-weight="700">(나)</text><text x="295" y="120" font-size="21" >x₁ − x₂ = 0</text><text x="295" y="150" font-size="21" >x₁ − x₂ = 0</text><line x1="315" y1="325" x2="505" y2="325" stroke="#272727" stroke-width="2" /><line x1="315" y1="325" x2="315" y2="183" stroke="#272727" stroke-width="2" /><text x="501" y="355" font-size="20" text-anchor="end">x₁</text><text x="307" y="171" font-size="20" >x₂</text><line x1="315" y1="325" x2="445" y2="195" stroke="#555"  stroke-width="5"/><line x1="315" y1="325" x2="445" y2="195" stroke="#b38447" stroke-width="2" stroke-dasharray="8 6"/><text x="552" y="88" font-size="23" font-weight="700">(다)</text><text x="552" y="120" font-size="21" >x₁ − x₂ = 1</text><text x="552" y="150" font-size="21" >x₁ − x₂ = −1</text><line x1="572" y1="325" x2="762" y2="325" stroke="#272727" stroke-width="2" /><line x1="572" y1="325" x2="572" y2="183" stroke="#272727" stroke-width="2" /><text x="758" y="355" font-size="20" text-anchor="end">x₁</text><text x="564" y="171" font-size="20" >x₂</text><line x1="598" y1="325" x2="702" y2="221" stroke="#272727" stroke-width="2" /><line x1="572" y1="299" x2="676" y2="195" stroke="#8c5f27" stroke-width="2" /><text x="35" y="399" font-size="22" >첨가행렬 [A | b] → 행 연산 → 소거 결과</text><text x="35" y="435" font-size="22" >검토할 행의 예: [0  0 | 5]       정방행렬: A = [a b; c d]</text></g></svg>