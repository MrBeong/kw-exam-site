<svg xmlns="http://www.w3.org/2000/svg" width="800" height="485" viewBox="0 0 800 485" role="img" aria-labelledby="title desc"><title id="title">연구팀이 실제로 수행한 전처리와 분할 순서</title><desc id="desc">1.3 p.14의 학습·테스트 분리 개념을 문제의 실제 수행 절차로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="485" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">연구팀이 실제로 수행한 전처리와 분할 순서</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><rect x="190" y="72" width="420" height="66" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="400" y="113" font-size="22" text-anchor="middle" font-weight="700">전체 데이터 1,000명</text><line x1="400" y1="138" x2="400" y2="171" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><rect x="125" y="175" width="550" height="88" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="400" y="207" font-size="22" text-anchor="middle" font-weight="700">전체 1,000명에서 통계량 산출</text><text x="400" y="236" font-size="19" text-anchor="middle">평균 · 표준편차 · 중앙값</text><line x1="400" y1="263" x2="400" y2="289" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><rect x="125" y="294" width="550" height="64" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="400" y="334" font-size="22" text-anchor="middle" font-weight="700">산출한 통계량으로 표준화 · 결측 대체</text><line x1="400" y1="358" x2="400" y2="381" stroke="#272727" stroke-width="2" /><line x1="180" y1="381" x2="620" y2="381" stroke="#272727" stroke-width="2" /><line x1="180" y1="381" x2="180" y2="405" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><line x1="620" y1="381" x2="620" y2="405" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><rect x="36" y="410" width="288" height="51" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="180" y="443.5" font-size="22" text-anchor="middle" font-weight="700">학습 세트 800명</text><rect x="476" y="410" width="288" height="51" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="620" y="443.5" font-size="22" text-anchor="middle" font-weight="700">테스트 세트 200명</text></g></svg>