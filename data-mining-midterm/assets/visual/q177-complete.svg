<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510" role="img" aria-labelledby="title desc"><title id="title">실수 대칭행렬에 의한 두 벡터의 선형변환</title><desc id="desc">선형대수 p.54·56·58–59의 고유벡터 구조를 문제 행렬과 정확한 곱셈 결과로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="510" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">실수 대칭행렬에 의한 두 벡터의 선형변환</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><text x="35" y="91" font-size="24" >A = [5  2;  2  2]     T(v) = Av     λ₁ &gt; λ₂</text><text x="65" y="135" font-size="23" font-weight="700">(가) 변환 전</text><line x1="100" y1="310" x2="335" y2="310" stroke="#272727" stroke-width="2" /><line x1="100" y1="310" x2="100" y2="180" stroke="#272727" stroke-width="2" /><text x="331" y="340" font-size="20" text-anchor="end">x₁</text><text x="92" y="168" font-size="20" >x₂</text><line x1="100" y1="310" x2="230" y2="245" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><line x1="100" y1="310" x2="165" y2="440" stroke="#8e693c" stroke-width="2" marker-end="url(#arrow)" /><text x="220" y="230" font-size="22" >v₁=(2,1)ᵀ</text><text x="177" y="455" font-size="21" >v₂=(1,−2)ᵀ</text><text x="450" y="135" font-size="23" font-weight="700">(나) 변환 후</text><line x1="485" y1="310" x2="730" y2="310" stroke="#272727" stroke-width="2" /><line x1="485" y1="310" x2="485" y2="180" stroke="#272727" stroke-width="2" /><text x="726" y="340" font-size="20" text-anchor="end">x₁</text><text x="477" y="168" font-size="20" >x₂</text><line x1="485" y1="310" x2="713" y2="196" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><line x1="485" y1="310" x2="504" y2="348" stroke="#8e693c" stroke-width="2" marker-end="url(#arrow)" /><text x="703" y="181" font-size="22" >Av₁</text><text x="516" y="363" font-size="21" >Av₂</text><text x="400" y="478" font-size="21" text-anchor="middle">두 패널의 축척은 다름 · 화살표의 방향과 Av = λv 관계를 이용</text></g></svg>