<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435" role="img" aria-labelledby="title desc"><title id="title">양의 직선 배열과 대칭적인 포물선 배열</title><desc id="desc">회귀 III p.8의 선형·비선형 산점도 비교를 문제의 정확한 데이터로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="435" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">양의 직선 배열과 대칭적인 포물선 배열</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><text x="40" y="92" font-size="23" font-weight="700">(가) 편차 데이터</text><line x1="205" y1="125" x2="205" y2="325" stroke="#aaa" stroke-width="2" /><line x1="75" y1="224" x2="335" y2="224" stroke="#aaa" stroke-width="2" /><text x="215" y="124" font-size="20" >yᵢ − ȳ</text><text x="333" y="250" font-size="20" text-anchor="end">xᵢ − x̄</text><circle cx="101" cy="320" r="5" fill="#252525"/><text x="101" y="352" font-size="18" text-anchor="middle">(-2, -4)</text><circle cx="153" cy="272" r="5" fill="#252525"/><text x="153" y="352" font-size="18" text-anchor="middle">(-1, -2)</text><circle cx="257" cy="176" r="5" fill="#252525"/><text x="257" y="352" font-size="18" text-anchor="middle">(1, 2)</text><circle cx="309" cy="128" r="5" fill="#252525"/><text x="309" y="352" font-size="18" text-anchor="middle">(2, 4)</text><text x="445" y="92" font-size="23" font-weight="700">(나) Y = X² · X는 0에 대칭</text><line x1="480" y1="325" x2="750" y2="325" stroke="#272727" stroke-width="2" /><line x1="480" y1="325" x2="480" y2="125" stroke="#272727" stroke-width="2" /><text x="746" y="355" font-size="20" text-anchor="end">X</text><text x="472" y="113" font-size="20" >Y</text><circle cx="511" cy="157" r="4.5" fill="#252525"/><circle cx="537" cy="230.5" r="4.5" fill="#252525"/><circle cx="563" cy="283" r="4.5" fill="#252525"/><circle cx="589" cy="314.5" r="4.5" fill="#252525"/><circle cx="615" cy="325" r="4.5" fill="#252525"/><circle cx="641" cy="314.5" r="4.5" fill="#252525"/><circle cx="667" cy="283" r="4.5" fill="#252525"/><circle cx="693" cy="230.5" r="4.5" fill="#252525"/><circle cx="719" cy="157" r="4.5" fill="#252525"/><line x1="615" y1="325" x2="615" y2="128" stroke="#aaa" stroke-width="2" stroke-dasharray="5 5"/><text x="615" y="353" font-size="20" text-anchor="middle">0</text><text x="400" y="402" font-size="20" text-anchor="middle">(가) 각 점 아래: (x 편차, y 편차)    |    (나) 대칭인 포물선 표본</text></g></svg>