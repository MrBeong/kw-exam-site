<svg xmlns="http://www.w3.org/2000/svg" width="800" height="465" viewBox="0 0 800 465" role="img" aria-labelledby="title desc"><title id="title">회귀 출력표: 계수 · 표준오차 · t · R² · F</title><desc id="desc">회귀 II p.36의 출력 수치를 그대로 옮겨 표로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="465" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">회귀 출력표: 계수 · 표준오차 · t · R² · F</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><text x="30" y="91" font-size="23" font-weight="700">cars · n = 50 · dist ~ speed</text><line x1="26" y1="113" x2="774" y2="113" stroke="#ddd" stroke-width="2" /><text x="28" y="145" font-size="20" font-weight="700">변수</text><text x="228" y="145" font-size="20" font-weight="700">Estimate</text><text x="385" y="145" font-size="20" font-weight="700">Std. Error</text><text x="532" y="145" font-size="20" font-weight="700">t value</text><text x="650" y="145" font-size="20" font-weight="700">Pr(&gt;|t|)</text><line x1="26" y1="168" x2="774" y2="168" stroke="#ddd" stroke-width="2" /><text x="28" y="200" font-size="22" >(Intercept)</text><text x="228" y="200" font-size="22" >−17.5791</text><text x="385" y="200" font-size="22" >6.7584</text><text x="532" y="200" font-size="22" >−2.601</text><text x="650" y="200" font-size="22" >0.0123</text><line x1="26" y1="223" x2="774" y2="223" stroke="#ddd" stroke-width="2" /><text x="28" y="255" font-size="22" >speed</text><text x="228" y="255" font-size="22" >3.9324</text><text x="385" y="255" font-size="22" >0.4155</text><text x="532" y="255" font-size="22" >9.464</text><text x="650" y="255" font-size="22" >1.49e−12</text><text x="30" y="310" font-size="21" >Residual standard error: 15.38 on 48 degrees of freedom</text><text x="30" y="354" font-size="23" >Multiple R-squared: 0.6511</text><text x="30" y="390" font-size="23" >Adjusted R-squared: 0.6438</text><text x="30" y="432" font-size="21" >F-statistic: 89.57 on 1 and 48 DF; p-value: 1.49e−12</text></g></svg>