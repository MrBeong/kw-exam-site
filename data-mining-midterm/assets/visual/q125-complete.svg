<svg xmlns="http://www.w3.org/2000/svg" width="800" height="365" viewBox="0 0 800 365" role="img" aria-labelledby="title desc"><title id="title">상자수염그림: Q₁ = 20, Q₂ = 28, Q₃ = 40</title><desc id="desc">기초통계 p.12의 상자수염그림을 문제의 사분위수와 수치로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="365" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">상자수염그림: Q₁ = 20, Q₂ = 28, Q₃ = 40</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><line x1="55" y1="235" x2="745" y2="235" stroke="#272727" stroke-width="2" /><line x1="55" y1="235" x2="55" y2="235" stroke="#272727" stroke-width="2" /><text x="741" y="265" font-size="20" text-anchor="end"></text><text x="47" y="223" font-size="20" ></text><line x1="94" y1="229" x2="94" y2="241" stroke="#272727" stroke-width="2" /><text x="94" y="269" font-size="20" text-anchor="middle">-20</text><line x1="224" y1="229" x2="224" y2="241" stroke="#272727" stroke-width="2" /><text x="224" y="269" font-size="20" text-anchor="middle">0</text><line x1="354" y1="229" x2="354" y2="241" stroke="#272727" stroke-width="2" /><text x="354" y="269" font-size="20" text-anchor="middle">20</text><line x1="484" y1="229" x2="484" y2="241" stroke="#272727" stroke-width="2" /><text x="484" y="269" font-size="20" text-anchor="middle">40</text><line x1="614" y1="229" x2="614" y2="241" stroke="#272727" stroke-width="2" /><text x="614" y="269" font-size="20" text-anchor="middle">60</text><line x1="744" y1="229" x2="744" y2="241" stroke="#272727" stroke-width="2" /><text x="744" y="269" font-size="20" text-anchor="middle">80</text><line x1="224" y1="159" x2="614" y2="159" stroke="#272727" stroke-width="2" /><line x1="224" y1="130" x2="224" y2="188" stroke="#272727" stroke-width="2" /><line x1="614" y1="130" x2="614" y2="188" stroke="#272727" stroke-width="2" /><rect x="354" y="116" width="130" height="86" fill="#ededeb" stroke="#222" stroke-width="2"/><line x1="406" y1="116" x2="406" y2="202" stroke="#272727" stroke-width="2" /><text x="346" y="96" font-size="22" text-anchor="end">Q₁=20</text><text x="406" y="224" font-size="21" text-anchor="middle">Q₂=28</text><text x="492" y="96" font-size="22" >Q₃=40</text><circle cx="126.5" cy="159" r="6" fill="#9c452e"/><circle cx="711.5" cy="159" r="6" fill="#9c452e"/><circle cx="744" cy="159" r="6" fill="#9c452e"/><text x="745" y="295" font-size="20" text-anchor="end">공정 측정값</text><text x="400" y="340" font-size="22" text-anchor="middle">이상치 후보의 경계를 1.5 × IQR 규칙으로 판단</text></g></svg>