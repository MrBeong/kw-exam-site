<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">가정환경 · 만족 지연 · 이후 성취도의 관계</title><desc id="desc">1.2 p.8의 집단 환경 차이를 인과·상관 구조로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="360" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">가정환경 · 만족 지연 · 이후 성취도의 관계</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><rect x="250" y="74" width="300" height="78" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="400" y="106" font-size="22" text-anchor="middle" font-weight="700">Z : 사회·경제적 배경</text><text x="400" y="135" font-size="19" text-anchor="middle">가정환경의 안정성 등</text><rect x="40" y="220" width="285" height="78" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="182.5" y="252" font-size="22" text-anchor="middle" font-weight="700">X : 만족 지연 시간</text><text x="182.5" y="281" font-size="19" text-anchor="middle">15분을 참음 / 참지 못함</text><rect x="475" y="220" width="285" height="78" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="617.5" y="252" font-size="22" text-anchor="middle" font-weight="700">Y : 이후 성취도</text><text x="617.5" y="281" font-size="19" text-anchor="middle">성인기 학업 성취 등</text><line x1="285" y1="152" x2="200" y2="214" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><line x1="515" y1="152" x2="615" y2="214" stroke="#272727" stroke-width="2" marker-end="url(#arrow)" /><line x1="330" y1="259" x2="469" y2="259" stroke="#555" stroke-width="2" stroke-dasharray="7 6"/><text x="400" y="246" font-size="18" text-anchor="middle">양(+)의 상관</text><text x="400" y="336" font-size="21" text-anchor="middle">실선: 제3의 변수의 영향 가능성   |   점선: 관찰된 상관관계</text></g></svg>