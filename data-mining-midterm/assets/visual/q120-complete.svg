<svg xmlns="http://www.w3.org/2000/svg" width="800" height="445" viewBox="0 0 800 445" role="img" aria-labelledby="title desc"><title id="title">네 가지 학습 상황: 입력과 학습 과정 비교</title><desc id="desc">1.3 p.21의 학습 유형 구조를 보기의 네 사례에 맞춰 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="445" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">네 가지 학습 상황: 입력과 학습 과정 비교</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><rect x="24" y="80" width="360" height="125" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="204" y="112" font-size="22" text-anchor="middle" font-weight="700">(가) 라벨이 있는 자료</text><text x="204" y="141" font-size="19" text-anchor="middle">주택 특성 X + 실제 가격 Y → 학습</text><rect x="416" y="80" width="360" height="125" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="596" y="112" font-size="22" text-anchor="middle" font-weight="700">(나) 라벨이 없는 자료</text><text x="596" y="141" font-size="19" text-anchor="middle">구매 내역 X → 비슷한 고객 묶기</text><rect x="24" y="239" width="360" height="125" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="204" y="271" font-size="22" text-anchor="middle" font-weight="700">(다) 두 종류의 자료를 함께 사용</text><text x="204" y="300" font-size="19" text-anchor="middle">라벨 200장 + 미라벨 50,000장</text><rect x="416" y="239" width="360" height="125" rx="10" fill="#f7f7f5" stroke="#a4a4a0"/><text x="596" y="271" font-size="22" text-anchor="middle" font-weight="700">(라) 행동과 보상의 반복</text><text x="596" y="300" font-size="19" text-anchor="middle">로봇 → 행동 → 환경 → 보상</text><text x="400" y="412" font-size="22" text-anchor="middle">각 상황을 지도 · 비지도 · 준지도 · 강화학습과 연결</text></g></svg>