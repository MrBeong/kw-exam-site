<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img" aria-labelledby="title desc"><title id="title">총편차 · 설명된 편차 · 잔차의 수직 분해</title><desc id="desc">회귀 II p.31의 점·평균선·회귀선을 문제의 (가)(나)(다) 표기로 재구성. 문제 조건과 표기를 반영해 직접 재구성한 도식.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#272727" stroke-width="1.5"/></marker></defs><rect width="800" height="490" fill="white"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#222"><text x="24" y="36" font-size="25" font-weight="700">총편차 · 설명된 편차 · 잔차의 수직 분해</text><line x1="24" y1="52" x2="776" y2="52" stroke="#ddd" stroke-width="2" /><line x1="85" y1="340" x2="665" y2="340" stroke="#272727" stroke-width="2" /><line x1="85" y1="340" x2="85" y2="120" stroke="#272727" stroke-width="2" /><text x="661" y="370" font-size="20" text-anchor="end">X</text><text x="77" y="108" font-size="20" >Y</text><line x1="85" y1="330" x2="655" y2="330" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/><line x1="140" y1="380" x2="600" y2="130" stroke="#8e693c"  stroke-width="3"/><line x1="370" y1="120" x2="370" y2="330" stroke="#aaa" stroke-width="2" stroke-dasharray="5 5"/><circle cx="370" cy="120" r="7" fill="#252525"/><circle cx="370" cy="255" r="7" fill="#8e693c"/><circle cx="370" cy="330" r="7" fill="#999"/><text x="390" y="124" font-size="22" >yᵢ : 관측값</text><text x="390" y="253" font-size="22" >ŷᵢ : 적합값</text><text x="390" y="336" font-size="22" >ȳ : 표본평균</text><line x1="290" y1="120" x2="290" y2="330" stroke="#272727" stroke-width="2" /><line x1="280" y1="120" x2="300" y2="120" stroke="#272727" stroke-width="2" /><line x1="280" y1="330" x2="300" y2="330" stroke="#272727" stroke-width="2" /><text x="273" y="215" font-size="22" text-anchor="end">(가)</text><line x1="720" y1="120" x2="720" y2="255" stroke="#272727" stroke-width="2" /><line x1="710" y1="120" x2="730" y2="120" stroke="#272727" stroke-width="2" /><line x1="710" y1="255" x2="730" y2="255" stroke="#272727" stroke-width="2" /><text x="739" y="192" font-size="22" >(다)</text><line x1="720" y1="255" x2="720" y2="330" stroke="#272727" stroke-width="2" /><line x1="710" y1="330" x2="730" y2="330" stroke="#272727" stroke-width="2" /><text x="739" y="298" font-size="22" >(나)</text><text x="400" y="411" font-size="24" text-anchor="middle">(가) yᵢ − ȳ     (나) ŷᵢ − ȳ     (다) yᵢ − ŷᵢ</text><text x="400" y="457" font-size="22" text-anchor="middle">각 수직 편차를 제곱해 모든 관측치에 대해 합산</text></g></svg>